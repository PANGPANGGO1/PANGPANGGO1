经。","functions":"化瘀止血，理气止痛。","functions_full":"降香辛温，善化瘀止血，用于瘀血性出血证、跌打损伤所致之体内外出血。又能理气止痛，用于气滞血瘀之胸胁疼痛。","dosage":"9~15g，煎服，宜后下。外用适量，研末调敷。","notes":"阴虚火旺及血热出血者忌用。","indications":"主治瘀血性出血、跌打损伤出血；血瘀气滞之胸胁疼痛。","combinations":"配三七、花蕊石化瘀止血；配丹参、赤芍活血止痛。","differentiation":"降香与乳香均能活血止痛，降香兼化瘀止血宜于瘀血出血，乳香兼消肿生肌宜于疮疡。"},{"name":"泽兰","category":"活血化瘀药","level":"2","page":"","properties":"苦、辛，微温。归肝、脾经。","functions":"活血调经，祛瘀消痈，利水消肿。","functions_full":"泽兰苦辛微温，善活血调经，为妇科调经要药。用于血瘀经闭、痛经、产后瘀滞腹痛。又能祛瘀消痈，用于跌打损伤、痈肿疮毒。兼能利水消肿，用于产后水肿、小便不利。","dosage":"6~12g，煎服。外用适量，鲜品捣敷。","notes":"孕妇忌用。","indications":"主治血瘀经闭、痛经；跌打损伤、痈肿疮毒；水肿小便不利。","combinations":"配当归、益母草活血调经；配茯苓、猪苓利水消肿。","differentiation":"泽兰与益母草均为活血调经利水药，泽兰偏于活血消痈，益母草活血利水力均较强。"},{"name":"王不留行","category":"活血化瘀药","level":"3","page":"","properties":"苦，平。归肝、胃经。","functions":"活血通经，下乳消肿，利尿通淋。","functions_full":"王不留行苦平，善活血通经下乳，为下乳要药。用于血瘀经闭、痛经及产后乳汁不通。又能利尿通淋，用于热淋、血淋。走而不守，善通利血脉。","dosage":"5~10g，煎服。","notes":"孕妇忌用。","indications":"主治经闭痛经、乳汁不通；热淋、血淋。","combinations":"配穿山甲增强通经下乳之力；配瞿麦、滑石利尿通淋。","differentiation":"王不留行与穿山甲均为通经下乳要药，王不留行兼利尿通淋，穿山甲兼消癥排脓。"},{"name":"月季花","category":"活血化瘀药","level":"3","page":"","properties":"甘，温。归肝经。","functions":"活血调经，疏肝解郁。","functions_full":"月季花甘温芳香，善活血调经，用于月经不调、痛经、经闭。又能疏肝解郁，用于肝气郁结之胸胁胀痛。为妇科活血调经之轻剂。","dosage":"3~6g，煎服。","notes":"孕妇慎用。","indications":"主治月经不调、痛经、经闭；肝郁胸胁胀痛。","combinations":"配当归、香附活血调经；配玫瑰花、佛手疏肝解郁。","differentiation":"月季花与玫瑰花均为花类调经解郁药，月季花偏于活血调经，玫瑰花偏于理气解郁。"},{"name":"凌霄花","category":"活血化瘀药","level":"3","page":"","properties":"甘、酸，寒。归肝、心包经。","functions":"活血通经，凉血祛风。","functions_full":"凌霄花甘酸寒，善活血通经，用于血瘀经闭、癥瘕积聚。又能凉血祛风止痒，用于血热生风之皮肤瘙痒、风疹。","dosage":"5~9g，煎服。外用适量。","notes":"孕妇忌用。气血虚弱者慎用。","indications":"主治血瘀经闭、癥瘕；皮肤瘙痒、风疹。","combinations":"配当归、川芎活血通经；配白鲜皮、地肤子凉血祛风止痒。","differentiation":"凌霄花与月季花均为花类活血调经药，凌霄花性寒兼凉血祛风，月季花性温兼疏肝解郁。"},{"name":"马钱子","category":"活血化瘀药","level":"2","page":"","properties":"苦，温，有大毒。归肝、脾经。","functions":"通络止痛，散结消肿。","functions_full":"马钱子有大毒而通络散结力极强，善通络止痛，为风湿顽痹、麻木瘫痪之要药。用于风湿顽痹、麻木不仁、半身不遂。又能散结消肿止痛，用于跌打损伤、痈肿疮毒。","dosage":"0.3~0.6g，炮制后入丸散服。不可过量，不可久服。","notes":"有大毒，严格炮制和剂量控制。孕妇禁用。体虚者忌用。","indications":"主治风湿顽痹、麻木瘫痪、半身不遂；跌打损伤、瘀滞肿痛；痈肿疮毒。","combinations":"配乳香、没药活血止痛消肿；配全蝎、地龙通络止痛。","differentiation":"马钱子与雷公藤均为有大毒的治顽痹药，马钱子偏于通络止痛，雷公藤偏于免疫抑制。"},{"name":"自然铜","category":"活血化瘀药","level":"3","page":"","properties":"辛，平。归肝经。","functions":"散瘀止痛，续筋接骨。","functions_full":"自然铜辛散，善散瘀止痛、续筋接骨，为伤科接骨之要药。用于跌打损伤、骨折筋伤之瘀滞肿痛。","dosage":"3~9g，煎服。多入丸散服。","notes":"孕妇忌用。","indications":"主治跌打损伤、骨折筋伤、瘀滞肿痛。","combinations":"配土鳖虫、乳香活血接骨；配当归、续断活血续筋。","differentiation":"自然铜与土鳖虫均为接骨疗伤要药，自然铜为矿物药长于续筋接骨，土鳖虫为虫类药长于破血逐瘀。"},{"name":"苏木","category":"活血化瘀药","level":"3","page":"","properties":"甘、咸，平。归心、肝、脾经。","functions":"活血祛瘀，消肿止痛。","functions_full":"苏木甘咸平，善活血祛瘀消肿止痛，为伤科常用药。用于跌打损伤、骨折筋伤之瘀滞肿痛。又能活血通经，用于血瘀经闭、痛经、产后瘀滞腹痛。","dosage":"3~9g，煎服。外用适量，研末敷。","notes":"孕妇忌用。","indications":"主治跌打损伤、骨折肿痛；血瘀经闭、痛经。","combinations":"配乳香、没药活血消肿止痛；配红花、桃仁活血祛瘀。","differentiation":"苏木与红花均能活血通经，苏木兼消肿止痛为伤科常用，红花活血祛瘀力强为妇科调经常用。"},{"name":"骨碎补","category":"活血化瘀药","level":"2","page":"","properties":"苦，温。归肝、肾经。","functions":"活血续伤，补肾强骨。","functions_full":"骨碎补苦温，善活血续伤补肾强骨，为伤科要药兼补肾之品。用于跌打损伤、骨折筋伤之瘀滞肿痛。又能补肾强骨，用于肾虚腰痛、耳鸣耳聋、牙齿松动。外用可治斑秃。","dosage":"3~9g，煎服。外用适量，浸酒擦或研末调敷。","notes":"阴虚内热者慎用。","indications":"主治跌打损伤、骨折；肾虚腰痛、耳鸣、牙痛齿松；斑秃（外用）。","combinations":"配续断、自然铜活血接骨；配杜仲、牛膝补肾强骨。","differentiation":"骨碎补与续断均为活血续伤兼补肾之品，骨碎补偏于活血接骨，续断偏于补肝肾强筋骨。"},{"name":"血竭","category":"活血化瘀药","level":"3","page":"","properties":"甘、咸，平。归心、肝经。","functions":"活血定痛，化瘀止血，敛疮生肌。","functions_full":"血竭甘咸平，善活血定痛、化瘀止血，为伤科要药。用于跌打损伤、瘀滞疼痛。又能化瘀止血，用于外伤出血。外用敛疮生肌，用于疮疡久溃不敛。","dosage":"1~2g，研末吞服。外用适量，研末撒或入膏药。","notes":"孕妇忌用。经期慎用。","indications":"主治跌打损伤、瘀滞肿痛；外伤出血；疮疡久溃不敛（外用）。","combinations":"配乳香、没药活血止痛（七厘散）；配儿茶外用敛疮生肌。","differentiation":"血竭与乳香均为活血止痛良药，血竭兼止血生肌为伤科专用药，乳香兼行气消肿为内外科兼用。"},{"name":"儿茶","category":"活血化瘀药","level":"3","page":"","properties":"苦、涩，微寒。归肺、心经。","functions":"活血止痛，止血生肌，收湿敛疮，清肺化痰。","functions_full":"儿茶苦涩微寒，善活血止痛、止血生肌，外用为敛疮要药。用于跌打损伤、外伤出血、疮疡不敛。又能收湿敛疮，用于湿疹、口疮。尚可清肺化痰，用于肺热咳嗽。","dosage":"1~3g，包煎。多入丸散服。外用适量，研末撒。","notes":"寒湿证者慎用。","indications":"主治跌打损伤、外伤出血；疮疡不敛、湿疹、口疮；肺热咳嗽。","combinations":"配血竭、乳香活血生肌止痛；配青黛、冰片外用敛疮。","differentiation":"儿茶与血竭均为伤科常用的活血生肌敛疮药，儿茶兼清肺化痰收湿，血竭以活血定痛见长。"},{"name":"刘寄奴","category":"活血化瘀药","level":"3","page":"","properties":"苦，温。归心、肝、脾经。","functions":"散瘀止痛，破血通经，消食化积。","functions_full":"刘寄奴苦温，善散瘀止痛，用于跌打损伤、瘀滞肿痛。又能破血通经，用于血瘀经闭、产后瘀滞腹痛。尚能消食化积，用于食积不化之脘腹胀痛。","dosage":"3~9g，煎服。外用适量，鲜品捣敷。","notes":"孕妇忌用。","indications":"主治跌打损伤、瘀滞肿痛；血瘀经闭、产后腹痛；食积腹痛。","combinations":"配骨碎补、延胡索活血止痛；配山楂、麦芽消食化积。","differentiation":"刘寄奴与骨碎补均为伤科活血药，刘寄奴兼消食化积，骨碎补兼补肾强骨。"},{"name":"虻虫","category":"活血化瘀药","level":"3","page":"","properties":"苦，微寒，有小毒。归肝经。","functions":"破血逐瘀，消癥散结。","functions_full":"虻虫苦寒有小毒，破血逐瘀力峻猛，用于血瘀经闭、癥瘕积聚。与水蛭相须为用增强破血之力。","dosage":"1~1.5g，研末吞服。或入丸散。","notes":"孕妇及体虚无瘀者忌用。","indications":"主治血瘀经闭、癥瘕积聚。","combinations":"配水蛭、大黄破血逐瘀消癥（抵当汤）；配桃仁、三棱增强破血之力。","differentiation":"虻虫与水蛭均为破血逐瘀峻药，虻虫飞行善攻上部瘀血，水蛭潜行善攻下部瘀血。"},{"name":"斑蝥","category":"活血化瘀药","level":"3","page":"","properties":"辛，热，有大毒。归肝、胃、肾经。","functions":"破血逐瘀，散结消癥，攻毒蚀疮。","functions_full":"斑蝥有大毒而破血攻毒力极强，善破血逐瘀散结消癥，用于癥瘕积聚（肝癌、食管癌等恶性肿瘤的辅助治疗）。外用攻毒蚀疮，用于顽癣、瘰疬、恶疮。","dosage":"0.03~0.06g，炒炙后入丸散。外用适量，研末或浸酒涂。","notes":"有大毒，严格炮制和剂量控制。孕妇禁用。心肾功能不全者忌用。外用亦须注意神经毒性。","indications":"主治癥瘕积聚（恶性肿瘤辅助）；外用治顽癣、瘰疬。","combinations":"配桃仁、红花活血消癥（需严格掌握剂量）；外用单味研末调敷。","differentiation":"斑蝥与水蛭均为破血药，斑蝥有大毒兼攻毒蚀疮可用于肿瘤，水蛭毒性较小以逐瘀消癥为主要用途。"},{"name":"穿山甲","category":"活血化瘀药","level":"2","page":"","properties":"咸，微寒。归肝、胃经。","functions":"活血消癥，通经下乳，消肿排脓，搜风通络。","functions_full":"穿山甲咸寒走窜，善活血消癥，用于癥瘕积聚、血瘀经闭。又能通经下乳，为下乳要药，用于乳汁不通。尚可消肿排脓，用于痈肿疮毒。兼能搜风通络，用于风湿痹痛。","dosage":"3~9g，煎服。研末吞服1~1.5g。","notes":"孕妇忌用。痈肿已溃者不宜用。为保护动物，临床多用替代品。","indications":"主治癥瘕积聚、血瘀经闭；乳汁不通；痈肿疮毒（初起或脓成不溃）；风湿痹痛。","combinations":"配王不留行通经下乳；配皂角刺、黄芪消肿排脓。","differentiation":"穿山甲与王不留行均为下乳要药常相须为用，穿山甲活血消癥搜风力强，王不留行兼利尿通淋。"},{"name":"白附子","category":"化痰止咳平喘药","level":"2","page":"","properties":"辛，温，有毒。归胃、肝经。","functions":"燥湿化痰，祛风止痉，解毒散结。","functions_full":"白附子辛温有毒，善燥湿化痰、祛风止痉，用于风痰壅盛之中风口眼歪斜、惊风癫痫、破伤风。又能解毒散结，用于瘰疬痰核、毒蛇咬伤。为治风痰之要药。","dosage":"3~6g，煎服。炮制后用。外用适量，鲜品捣敷。","notes":"有毒，孕妇忌用。生品不宜内服。","indications":"主治风痰壅盛之中风口眼歪斜、惊风、破伤风；瘰疬痰核；毒蛇咬伤。","combinations":"配天南星、半夏祛风化痰（牵正散加减）；配全蝎、僵蚕祛风止痉。","differentiation":"白附子与天南星均为祛风痰要药，白附子偏于上行治头面风痰（口眼歪斜），天南星偏于祛经络风痰。"},{"name":"皂荚","category":"化痰止咳平喘药","level":"3","page":"","properties":"辛、咸，温，有小毒。归肺、大肠经。","functions":"祛痰开窍，散结消肿。","functions_full":"皂荚辛咸温有小毒，善祛顽痰、通窍开闭，为治顽痰壅盛之要药。用于顽痰阻肺之咳喘痰多、胸闷。又能开窍通闭，用于中风痰厥之牙关紧闭。外用散结消肿，用于痈肿疮毒。","dosage":"1~1.5g，研末吞服。外用适量，研末吹鼻或调敷。","notes":"有小毒，用量不宜过大。孕妇、体虚及有出血倾向者忌用。","indications":"主治顽痰咳喘、胸闷痰多；中风痰厥、癫痫痰盛；外用治痈肿。","combinations":"配半夏、天南星祛痰；配细辛、冰片吹鼻取嚏开窍。","differentiation":"皂荚与天南星均为祛痰要药，皂荚祛顽痰开窍力峻猛，天南星祛风痰止痉力优。"},{"name":"旋覆花","category":"化痰止咳平喘药","level":"2","page":"","properties":"苦、辛、咸，微温。归肺、脾、胃、大肠经。","functions":"降气化痰，降逆止呕。","functions_full":"旋覆花苦降辛散、咸能软坚，善降气化痰、降逆止呕，为治痰饮壅肺和胃气上逆之要药。用于痰饮壅肺之咳嗽痰多、胸闷喘咳及痰饮蓄结之胸膈痞满。又能降胃气止呕噫，用于胃气上逆之噫气、呕吐。","dosage":"3~9g，煎服。布包入煎。","notes":"阴虚燥咳者不宜。体虚便溏者慎用。","indications":"主治痰饮壅肺之咳嗽痰多、胸闷喘促；胃气上逆之噫气、呕吐。","combinations":"配半夏、生姜化痰降逆止呕（旋覆代赭汤）；配桔梗、桑白皮降气化痰止咳。","differentiation":"旋覆花与半夏均能化痰降逆，旋覆花以降气为主善治噫气呕吐，半夏以燥湿化痰为主善治湿痰咳嗽。"},{"name":"白前","category":"化痰止咳平喘药","level":"3","page":"","properties":"辛、苦，微温。归肺经。","functions":"降气化痰止咳。","functions_full":"白前辛苦微温，善降气化痰止咳，性微温而不燥烈，为治肺气壅实咳嗽之常用药。用于肺气壅实之咳嗽痰多、胸闷喘促。无论寒热均可配伍使用。","dosage":"3~9g，煎服。","notes":"阴虚劳嗽者不宜。","indications":"主治肺气壅实之咳嗽痰多、胸闷喘急。","combinations":"配前胡、桔梗化痰止咳；配紫菀、半夏降气化痰。","differentiation":"白前与前胡均能降气化痰止咳，白前性微温偏于降气化痰，前胡性微寒兼疏散风热。"},{"name":"猫爪草","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘、辛，温。归肝、肺经。","functions":"化痰散结，解毒消肿。","functions_full":"猫爪草甘辛温，善化痰散结、解毒消肿，为治瘰疬痰核之良药。用于瘰疬结核、痰核。又能解毒，用于咽喉肿痛。现代亦用于肺结核、淋巴结结核。","dosage":"15~30g，煎服。外用适量，研末调敷。","notes":"无明显禁忌。","indications":"主治瘰疬（淋巴结结核）、痰核；咽喉肿痛。","combinations":"配夏枯草、牡蛎化痰软坚散结；配玄参、浙贝母解毒散结。","differentiation":"猫爪草与夏枯草均能散结治瘰疬，猫爪草以化痰散结为主，夏枯草以清肝散结为主。"},{"name":"竹茹","category":"化痰止咳平喘药","level":"2","page":"","properties":"甘，微寒。归肺、胃、心、胆经。","functions":"清热化痰，除烦止呕。","functions_full":"竹茹甘微寒，善清热化痰，用于肺热咳嗽、痰黄黏稠。又能除烦止呕，用于胃热呕逆及痰热内扰之心烦不眠。为清热化痰止呕之良药。","dosage":"4.5~9g，煎服。生用清热化痰，姜汁炙用止呕。","notes":"寒痰咳嗽及胃寒呕吐者不宜。","indications":"主治肺热咳嗽、痰黄黏稠；胃热呕吐、呃逆；痰热扰心之心烦失眠。","combinations":"配黄芩、瓜蒌清热化痰；配陈皮、半夏和胃止呕（温胆汤）。","differentiation":"竹茹与竹沥均源于竹，竹茹为茎秆的中间层善于和胃止呕，竹沥为火炙流出的液汁善于化痰开窍。"},{"name":"竹沥","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘，寒。归心、肺、肝经。","functions":"清热豁痰，定惊开窍。","functions_full":"竹沥甘寒滑利，善清热豁痰、定惊开窍，为治痰热蒙窍之要药。用于痰热咳喘、痰稠难咳。又能定惊利窍，用于中风痰迷、惊痫癫狂之痰热闭阻。","dosage":"30~50ml，冲服。","notes":"寒痰及便溏者慎用。","indications":"主治肺热痰壅之咳喘胸闷；中风痰迷、惊痫癫狂。","combinations":"配生姜汁冲服增强祛痰之力；配天竺黄、胆南星清热化痰定惊。","differentiation":"竹沥与竹茹均为清热化痰药，竹沥为液汁清热滑痰力强善治痰热蒙窍，竹茹为固体制品善于和胃止呕。"},{"name":"天竺黄","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘，寒。归心、肝经。","functions":"清热化痰，清心定惊。","functions_full":"天竺黄甘寒，善清热化痰、清心定惊，为治痰热惊痫之要药。用于痰热壅盛之惊风抽搐、中风痰壅。又能清心定惊，用于热病神昏、小儿惊痫。","dosage":"3~9g，煎服。研末吞服0.6~1g。","notes":"寒痰者不宜。","indications":"主治痰热惊风抽搐、中风痰壅；热病神昏谵语。","combinations":"配胆南星、牛黄清热化痰定惊；配僵蚕、全蝎息风止痉。","differentiation":"天竺黄与竹沥均为清热化痰定惊药，天竺黄为固体宜入煎剂善清心定惊，竹沥为液体清热滑痰力强。"},{"name":"前胡","category":"化痰止咳平喘药","level":"2","page":"","properties":"苦、辛，微寒。归肺经。","functions":"降气化痰，疏散风热。","functions_full":"前胡苦降辛散微寒清热，善降气化痰、疏散风热，为治肺气上逆咳嗽之常用药。用于痰热咳嗽、胸闷喘促。又能疏散风热，用于风热表证之咳嗽痰多。","dosage":"3~9g，煎服。","notes":"阴虚咳嗽及寒痰咳嗽者慎用。","indications":"主治痰热咳嗽、胸闷喘促；风热表证之咳嗽。","combinations":"配白前、杏仁降气化痰止咳；配桑叶、薄荷疏散风热。","differentiation":"前胡与白前均能降气化痰止咳常相须为用，前胡性微寒兼疏散风热，白前性微温兼降气平喘。"},{"name":"桔梗","category":"化痰止咳平喘药","level":"2","page":"","properties":"苦、辛，平。归肺经。","functions":"宣肺祛痰，利咽排脓。","functions_full":"桔梗苦辛平，善开宣肺气、祛痰排脓，为肺经气分之要药。能宣通肺气、祛痰止咳，用于咳嗽痰多、胸闷不畅，无论寒热皆可应用。又能利咽开音、排脓消痈，用于咽喉肿痛、音哑及肺痈吐脓。载药上行，常作舟楫之剂。","dosage":"3~9g，煎服。","notes":"阴虚久咳及咳血者不宜。用量过大易致恶心。","indications":"主治咳嗽痰多、胸闷不畅；咽喉肿痛、音哑；肺痈吐脓。","combinations":"配杏仁、半夏宣肺化痰止咳；配甘草清热利咽（桔梗汤）；配鱼腥草、薏苡仁排脓消痈。","differentiation":"桔梗与杏仁均能止咳，桔梗升浮宣肺祛痰为主，杏仁降气止咳平喘为主，一升一降常相配伍。"},{"name":"胖大海","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘，寒。归肺、大肠经。","functions":"清热润肺，利咽开音，润肠通便。","functions_full":"胖大海甘寒质润，善清热润肺、利咽开音，为治咽喉肿痛、声音嘶哑之常用药。用于肺热咽喉肿痛、声音嘶哑、干咳无痰。又能润肠通便，用于热结便秘兼头痛目赤者。","dosage":"2~3枚，沸水泡服或煎服。","notes":"脾胃虚寒便溏者不宜。风寒咳嗽者忌用。","indications":"主治肺热咽喉肿痛、声音嘶哑、干咳；热结便秘。","combinations":"配蝉蜕、木蝴蝶清热利咽开音；配蜂蜜润肺利咽通便。","differentiation":"胖大海与木蝴蝶均为利咽开音常用药，胖大海兼润肠通便，木蝴蝶兼疏肝和胃。"},{"name":"黄药子","category":"化痰止咳平喘药","level":"3","page":"","properties":"苦，平，有小毒。归肺、肝经。","functions":"化痰散结消瘿，清热解毒。","functions_full":"黄药子苦平有小毒，善化痰散结消瘿，为治瘿瘤（甲状腺肿）之要药。用于瘿瘤、瘰疬。又能清热解毒，用于疮疡肿毒、咽喉肿痛。兼能凉血止血，用于血热出血。","dosage":"5~9g，煎服。研末服1~2g。","notes":"有毒，不宜大量久服。肝功能不良者慎用。","indications":"主治瘿瘤（甲状腺肿）；疮疡肿毒、咽喉肿痛；血热出血。","combinations":"配海藻、昆布软坚散结消瘿；配栀子、黄芩清热解毒。","differentiation":"黄药子与海藻均为治瘿瘤药，黄药子散结消瘿力较强但有小毒，海藻药食两用性较安全。"},{"name":"海蛤壳","category":"化痰止咳平喘药","level":"3","page":"","properties":"苦、咸，寒。归肺、肾、胃经。","functions":"清热化痰，软坚散结，制酸止痛。","functions_full":"海蛤壳苦咸寒，善清热化痰、软坚散结，用于痰热咳嗽、胸胁疼痛及瘿瘤、瘰疬。又能制酸止痛，用于胃痛泛酸。外用可收湿敛疮。","dosage":"6~15g，煎服。宜先煎。制酸煅用。","notes":"脾胃虚寒者慎用。","indications":"主治痰热咳嗽；瘿瘤、瘰疬；胃痛泛酸（煅用）。","combinations":"配海藻、昆布软坚散结；配瓜蒌、贝母清热化痰。","differentiation":"海蛤壳与海浮石均为海洋来源的清热化痰软坚药，海蛤壳兼制酸止痛，海浮石兼利尿通淋。"},{"name":"海浮石","category":"化痰止咳平喘药","level":"3","page":"","properties":"咸，寒。归肺、肾经。","functions":"清肺化痰，软坚散结，利尿通淋。","functions_full":"海浮石咸寒，善清肺化痰，用于痰热咳嗽、痰稠难咳。又能软坚散结，用于瘿瘤、瘰疬。尚可利尿通淋，用于热淋涩痛。","dosage":"9~15g，煎服。","notes":"虚寒咳嗽者不宜。","indications":"主治痰热咳嗽、痰稠难咳；瘿瘤、瘰疬；热淋涩痛。","combinations":"配海蛤壳、瓜蒌清热化痰；配海藻、昆布软坚散结。","differentiation":"海浮石与海蛤壳功效相近，海浮石兼利尿通淋，海蛤壳兼制酸止痛。"},{"name":"瓦楞子","category":"化痰止咳平喘药","level":"3","page":"","properties":"咸，平。归肺、胃、肝经。","functions":"消痰软坚，化瘀散结，制酸止痛。","functions_full":"瓦楞子咸平，善消痰软坚、化瘀散结，用于瘿瘤、瘰疬及癥瘕痞块。又能制酸止痛，用于胃痛泛酸。","dosage":"9~15g，煎服。宜先煎。消痰软坚生用，制酸煅用。","notes":"无瘀滞者慎用。","indications":"主治瘿瘤、瘰疬；癥瘕痞块；胃痛泛酸（煅用）。","combinations":"配海藻、昆布消痰软坚；配三棱、莪术化瘀散结。","differentiation":"瓦楞子与海蛤壳均能消痰软坚制酸，瓦楞子兼化瘀散结，海蛤壳兼清热化痰。"},{"name":"礞石","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘、咸，平。归肺、肝经。","functions":"坠痰下气，平肝镇惊。","functions_full":"礞石质重沉降，善坠痰下气、平肝镇惊，为治顽痰老痰之峻药。用于顽痰壅塞之咳喘胸闷、惊痫癫狂。","dosage":"6~9g，煎服。多入丸散服。","notes":"非痰热实证者忌用。孕妇慎用。","indications":"主治顽痰老痰壅塞之咳喘胸闷；惊痫癫狂。","combinations":"配沉香、大黄坠痰下气（礞石滚痰丸）；配黄芩、半夏清热化痰。","differentiation":"礞石与皂荚均为祛顽痰峻药，礞石质重坠降治老痰胶结，皂荚辛散走窜治痰壅闭窍。"},{"name":"紫苏子","category":"化痰止咳平喘药","level":"2","page":"","properties":"辛，温。归肺、大肠经。","functions":"降气化痰，止咳平喘，润肠通便。","functions_full":"紫苏子辛温降泄，善降气化痰、止咳平喘，为治痰壅气逆咳喘之常用药。用于痰壅气逆之咳嗽气喘、胸闷痰多。又能润肠通便，用于肠燥便秘。","dosage":"3~9g，煎服。","notes":"脾虚便溏者慎用。","indications":"主治痰壅气逆之咳喘痰多；肠燥便秘。","combinations":"配白芥子、莱菔子降气化痰（三子养亲汤）；配火麻仁、杏仁润肠通便。","differentiation":"紫苏子与苦杏仁均能止咳平喘润肠，紫苏子偏于降气化痰宜于痰壅气逆，苦杏仁偏于宣降肺气宜于多种咳喘。"},{"name":"马兜铃","category":"化痰止咳平喘药","level":"3","page":"","properties":"苦、微辛，寒。归肺、大肠经。","functions":"清肺化痰，止咳平喘，清肠消痔。","functions_full":"马兜铃苦寒清降，善清肺化痰止咳平喘，用于肺热咳嗽、痰壅喘促。又能清肠消痔，用于痔疮肿痛、出血。","dosage":"3~9g，煎服。外用适量，煎汤熏洗。","notes":"含马兜铃酸，有肾毒性。不宜大量久服。儿童及老年人慎用。","indications":"主治肺热咳嗽、痰壅喘促；痔疮肿痛出血。","combinations":"配黄芩、桑白皮清肺化痰；配槐花、地榆清肠消痔。","differentiation":"马兜铃与枇杷叶均能清肺止咳，马兜铃兼清肠消痔但含肾毒性成分宜慎用，枇杷叶兼降逆止呕较安全。"},{"name":"枇杷叶","category":"化痰止咳平喘药","level":"2","page":"","properties":"苦，微寒。归肺、胃经。","functions":"清肺止咳，降逆止呕。","functions_full":"枇杷叶苦寒清降，善清肺止咳，用于肺热咳嗽、痰黄黏稠。又能降逆止呕，用于胃热呕逆、烦热口渴。为清肺和胃之良药。","dosage":"5~10g，煎服。止咳蜜炙用，止呕生用。","notes":"寒咳及胃寒呕吐者不宜。","indications":"主治肺热咳嗽、痰黄黏稠；胃热呕逆、烦热口渴。","combinations":"配桑叶、麦冬清肺润燥止咳；配竹茹、芦根清热止呕。","differentiation":"枇杷叶与桑白皮均能清肺止咳，枇杷叶兼降逆止呕，桑白皮兼利水消肿。"},{"name":"桑白皮","category":"化痰止咳平喘药","level":"2","page":"","properties":"甘，寒。归肺经。","functions":"泻肺平喘，利水消肿。","functions_full":"桑白皮甘寒，善泻肺平喘，用于肺热咳喘、痰多。又能利水消肿，用于水肿胀满、小便不利之实证。尤宜于水饮停肺之喘满肿胀。","dosage":"6~12g，煎服。利水生用，平喘蜜炙用。","notes":"肺虚无火及寒咳者不宜。","indications":"主治肺热咳喘、痰多；水肿胀满小便不利。","combinations":"配地骨皮、甘草泻肺清热（泻白散）；配茯苓皮、大腹皮利水消肿（五皮饮）。","differentiation":"桑白皮与葶苈子均能泻肺平喘利水，桑白皮甘寒偏于清肺热，葶苈子苦寒偏于泻痰水。"},{"name":"葶苈子","category":"化痰止咳平喘药","level":"2","page":"","properties":"苦、辛，大寒。归肺、膀胱经。","functions":"泻肺平喘，利水消肿。","functions_full":"葶苈子苦辛大寒，泻肺利水力峻，善泻肺平喘，用于痰涎壅肺之咳喘痰多、不得平卧。又能利水消肿，用于胸腹积水、水肿胀满、小便不利。","dosage":"3~9g，煎服。布包入煎。","notes":"肺虚喘咳及脾虚水肿者忌用。","indications":"主治痰涎壅肺之喘咳不得卧（如肺源性心脏病）；胸腹积水、水肿实证。","combinations":"配大枣泻肺逐水（葶苈大枣泻肺汤）；配大黄、防己攻逐水饮（己椒苈黄丸）。","differentiation":"葶苈子与桑白皮均能泻肺平喘利水，葶苈子力峻宜于水饮重证，桑白皮力缓宜于肺热咳喘。"},{"name":"白果","category":"化痰止咳平喘药","level":"3","page":"","properties":"甘、苦、涩，平，有小毒。归肺、肾经。","functions":"敛肺定喘，收涩止带，缩尿。","functions_full":"白果甘苦涩平有小毒，善敛肺定喘，用于哮喘痰嗽之久咳虚喘。又能收涩止带缩尿，用于湿热带下、白浊及小便频数。","dosage":"4.5~9g，煎服。生食有毒，炒熟可减弱毒性。","notes":"有小毒，不宜多服。生食毒性更大。","indications":"主治哮喘痰嗽之久咳虚喘；带下白浊；小便频数、遗尿。","combinations":"配麻黄、杏仁止咳平喘（定喘汤）；配黄柏、车前子清热利湿止带。","differentiation":"白果与苦杏仁均能止咳平喘，白果以敛肺定喘为主宜于久咳虚喘，苦杏仁以宣降肺气为主宜于多种咳喘实证。"},{"name":"矮地茶","category":"化痰止咳平喘药","level":"3","page":"","properties":"苦、平。归肺、肝经。","functions":"止咳平喘，清热利湿，活血化瘀。","functions_full":"矮地茶苦平，善止咳平喘，为治慢性咳喘之草药。用于咳嗽气喘、痰多。又能清热利湿，用于湿热黄疸、水肿。兼能活血化瘀，用于血瘀经闭、跌打损伤。","dosage":"15~30g，煎服。","notes":"无明显禁忌。","indications":"主治慢性咳喘痰多；湿热黄疸；血瘀经闭、跌打损伤。","combinations":"配鱼腥草、桔梗止咳化痰；配茵陈、金钱草利湿退黄。","differentiation":"矮地茶与平地木为同物异名，为民间常用的止咳平喘草药，兼具活血利湿之功。"},{"name":"洋金花","category":"化痰止咳平喘药","level":"3","page":"","properties":"辛，温，有毒。归肺、肝经。","functions":"平喘止咳，解痉止痛，麻醉定惊。","functions_full":"洋金花辛温有毒，善平喘止咳，为治哮喘之猛药。用于哮喘咳嗽之喘促不宁。又能麻醉止痛定惊，用于风湿痹痛、跌打伤痛之剧烈疼痛及癫痫惊风。为中药麻醉之主要用药。","dosage":"0.3~0.6g，研末吞服或作卷烟吸入。外用适量。","notes":"有毒，严格掌握剂量。孕妇、青光眼及心动过速者禁用。","indications":"主治哮喘咳嗽喘促；顽固性疼痛；中药麻醉。","combinations":"单用切丝卷烟吸入治哮喘；配川乌、草乌麻醉止痛。","differentiation":"洋金花与矮地茶均能止咳平喘，洋金花有毒麻醉力强为治顽喘之猛药，矮地茶无毒平和宜于慢性咳喘。"},{"name":"朱砂","category":"安神药","level":"2","page":"","properties":"甘，微寒，有毒。归心经。","functions":"清心镇惊，安神定志，明目解毒。","functions_full":"朱砂甘寒质重有毒，善清心镇惊安神，为镇心安神之要药。用于心火亢盛之心烦失眠、惊悸癫狂。又能明目解毒，用于目赤肿痛、口舌生疮。外用解毒防腐，用于疮疡肿毒。","dosage":"0.1~0.5g，入丸散服，不入煎剂。外用适量。","notes":"有毒，不可过量久服。忌用火煅（析出水银）。肝肾功能不全者慎用。","indications":"主治心火亢盛之心神不安、失眠多梦、惊悸癫狂；目赤肿痛、口疮；疮疡（外用）。","combinations":"配黄连、磁石清心重镇安神（朱砂安神丸）；配冰片、硼砂外用解毒消肿。","differentiation":"朱砂与磁石均为重镇安神药，朱砂以清心安神为主，磁石以平肝潜阳安神为主。"},{"name":"磁石","category":"安神药","level":"3","page":"","properties":"咸，寒。归肝、心、肾经。","functions":"镇惊安神，平肝潜阳，聪耳明目，纳气平喘。","functions_full":"磁石咸寒质重，善镇惊安神，用于肾虚肝旺之心神不宁、惊悸失眠。又能平肝潜阳，用于肝阳上亢之头痛眩晕。尚可聪耳明目，用于肝肾不足之耳鸣耳聋、视物昏花。兼能纳气平喘，用于肾不纳气之虚喘。","dosage":"9~30g，煎服。宜先煎。入丸散1~3g。","notes":"脾胃虚弱者慎用。","indications":"主治心神不宁、失眠惊悸；肝阳上亢之头痛眩晕；耳鸣耳聋、视物不明；肾虚气喘。","combinations":"配朱砂镇惊安神（磁朱丸）；配石决明、牡蛎平肝潜阳。","differentiation":"磁石与朱砂均为重镇安神药，磁石兼平肝潜阳纳气益肾，朱砂兼清心安神解毒。"},{"name":"琥珀","category":"安神药","level":"3","page":"","properties":"甘，平。归心、肝、膀胱经。","functions":"镇惊安神，活血散瘀，利尿通淋。","functions_full":"琥珀甘平，善镇惊安神，用于心神不宁、惊悸失眠、惊风癫痫。又能活血散瘀，用于血瘀经闭、癥瘕积聚。尚可利尿通淋，用于血淋、石淋。","dosage":"1.5~3g，研末吞服，不入煎剂。外用适量。","notes":"阴虚内热者慎用。","indications":"主治心神不宁、惊悸失眠、惊风癫痫；血瘀经闭、癥瘕；血淋、石淋。","combinations":"配朱砂、远志安神定志；配三七、蒲黄活血止血通淋。","differentiation":"琥珀与朱砂均为镇心安神药，琥珀兼活血利尿，朱砂兼清心解毒。"},{"name":"柏子仁","category":"安神药","level":"2","page":"","properties":"甘，平。归心、肾、大肠经。","functions":"养心安神，润肠通便。","functions_full":"柏子仁甘平质润，善养心安神，用于心阴虚及心血亏虚之心悸失眠、健忘。又能润肠通便，用于肠燥便秘。为滋养安神之良药。","dosage":"3~9g，煎服。","notes":"便溏及痰多者慎用。","indications":"主治阴虚血亏之心悸失眠、健忘；肠燥便秘。","combinations":"配酸枣仁、远志养心安神；配郁李仁、松子仁润肠通便（五仁丸）。","differentiation":"柏子仁与酸枣仁均为养心安神要药常相须为用，柏子仁兼润肠通便，酸枣仁兼益肝敛汗。"},{"name":"灵芝","category":"安神药","level":"3","page":"","properties":"甘，平。归心、肺、肝、肾经。","functions":"补气安神，止咳平喘。","functions_full":"灵芝甘平，善补气安神，用于气血不足之心神不宁、失眠多梦、心悸健忘。又能止咳平喘，用于虚劳咳喘。为补虚安神之上品。","dosage":"6~12g，煎服。研末吞服1.5~3g。","notes":"实证者慎用。","indications":"主治气血不足之心悸失眠、健忘；虚劳咳喘。","combinations":"配酸枣仁、龙眼肉养心安神；配党参、五味子益气敛肺。","differentiation":"灵芝与酸枣仁均为养心安神药，灵芝补益范围更广兼补肺肾，酸枣仁以养肝安神为主。"},{"name":"首乌藤","category":"安神药","level":"3","page":"","properties":"甘，平。归心、肝经。","functions":"养心安神，祛风通络。","functions_full":"首乌藤为夜交藤的正名，甘平，善养心安神，用于虚烦失眠、多梦。又能祛风通络，用于风湿痹痛、皮肤瘙痒。","dosage":"9~15g，煎服。外用适量，煎汤洗浴。","notes":"无明显禁忌。","indications":"主治虚烦失眠、多梦；风湿痹痛；皮肤瘙痒。","combinations":"配酸枣仁、合欢皮养心安神；配鸡血藤、络石藤祛风通络。","differentiation":"首乌藤与合欢皮均为养心安神药，首乌藤养心血安神为主兼祛风，合欢皮解郁安神为主兼活血。"},{"name":"珍珠母","category":"平肝息风药","level":"3","page":"","properties":"咸，寒。归肝、心经。","functions":"平肝潜阳，安神定惊，明目退翳。","functions_full":"珍珠母咸寒质重，善平肝潜阳，用于肝阳上亢之头痛眩晕、烦躁易怒。又能安神定惊，用于心神不安、惊悸失眠。尚能明目退翳，用于目赤肿痛、翳障。外用可燥湿敛疮。","dosage":"10~25g，煎服。宜先煎。外用适量。","notes":"脾胃虚寒者慎用。","indications":"主治肝阳上亢之头痛眩晕；心神不安、失眠；目赤翳障。","combinations":"配石决明、牡蛎平肝潜阳；配菊花、决明子清肝明目。","differentiation":"珍珠母与石决明均为贝壳类平肝潜阳药，珍珠母安神定惊力优，石决明清肝明目为胜。"},{"name":"紫贝齿","category":"平肝息风药","level":"3","page":"","properties":"咸，平。归肝经。","functions":"平肝潜阳，镇惊安神，清肝明目。","functions_full":"紫贝齿咸平，善平肝潜阳，用于肝阳上亢之头痛眩晕。又能镇惊安神，用于惊悸失眠、小儿惊风。尚可清肝明目，用于目赤肿痛。","dosage":"10~15g，煎服。宜先煎。","notes":"脾胃虚弱者慎用。","indications":"主治肝阳上亢之头痛眩晕；惊悸失眠；目赤肿痛。","combinations":"配石决明、牡蛎平肝潜阳；配珍珠母、磁石镇惊安神。","differentiation":"紫贝齿与珍珠母均为海洋贝壳类安神潜阳药，紫贝齿以镇惊安神为主，珍珠母以平肝潜阳明目为主。"},{"name":"代赭石","category":"平肝息风药","level":"2","page":"","properties":"苦，寒。归肝、心经。","functions":"平肝潜阳，重镇降逆，凉血止血。","functions_full":"代赭石苦寒质重沉降，善平肝潜阳，用于肝阳上亢之头痛眩晕、目胀耳鸣。又能重镇降逆，为治胃气上逆呕噫及肺气上逆喘息之要药。尚可凉血止血，用于血热之吐血、衄血、崩漏。","dosage":"9~30g，煎服。宜先煎。平肝生用，止血煅用。","notes":"孕妇慎用。不宜久服。","indications":"主治肝阳上亢之头痛眩晕；胃气上逆之呕吐、噫气、呃逆；气逆喘息；血热出血。","combinations":"配旋覆花、半夏降逆止呕（旋覆代赭汤）；配牛膝、龙骨平肝潜阳。","differentiation":"代赭石与旋覆花常相须为用治胃气上逆，代赭石重镇降逆平肝力强，旋覆花降气化痰为胜。"},{"name":"刺蒺藜","category":"平肝息风药","level":"3","page":"","properties":"辛、苦，微温，有小毒。归肝经。","functions":"平肝解郁，活血祛风，明目。","functions_full":"刺蒺藜辛苦微温，善平肝解郁，用于肝阳上亢之头痛眩晕。又能活血祛风，用于风疹瘙痒。尚可明目，用于目赤翳障。兼能疏肝解郁，用于肝气郁结之胸胁胀痛。","dosage":"6~9g，煎服。","notes":"气血虚弱者及孕妇慎用。","indications":"主治肝阳上亢之头痛眩晕；风疹瘙痒；目赤翳障；肝郁胁痛。","combinations":"配菊花、钩藤平肝明目；配白鲜皮、地肤子祛风止痒。","differentiation":"刺蒺藜与白蒺藜为同物异名，以平肝祛风为主，与潼蒺藜（沙苑子）补肝肾固精不同。"},{"name":"罗布麻叶","category":"平肝息风药","level":"3","page":"","properties":"甘、苦，凉。归肝经。","functions":"平肝安神，清热利水。","functions_full":"罗布麻叶甘苦凉，善平肝安神，用于肝阳上亢之头痛眩晕、心悸失眠。又能清热利水，用于水肿、小便不利。现代常用于高血压病的治疗。","dosage":"6~12g，煎服。或开水泡服。","notes":"脾胃虚寒者不宜长期服用。","indications":"主治肝阳上亢之头痛眩晕（高血压病）；水肿小便不利。","combinations":"配钩藤、菊花平肝降压；配车前子、茯苓利水消肿。","differentiation":"罗布麻叶与钩藤均为降压平肝药，罗布麻叶兼利水安神，钩藤兼息风止痉。"},{"name":"羚羊角","category":"平肝息风药","level":"2","page":"","properties":"咸，寒。归肝、心经。","functions":"平肝息风，清肝明目，清热解毒。","functions_full":"羚羊角咸寒清热，善平肝息风，为治肝风内动、惊痫抽搐之要药。用于肝阳化风之头痛眩晕及热极生风之惊风抽搐。又能清肝明目，用于肝火上炎之目赤肿痛。尚能清热解毒，用于温热病之高热神昏。","dosage":"1~3g，煎服。宜单煎2小时以上。磨汁或研粉服0.3~0.6g。","notes":"脾虚慢惊者忌用。","indications":"主治肝风内动之惊痫抽搐、高热痉厥；肝阳上亢之头痛眩晕；肝火上炎之目赤肿痛；温病高热神昏。","combinations":"配钩藤、菊花清热平肝息风（羚角钩藤汤）；配石决明、夏枯草清肝明目。","differentiation":"羚羊角与牛黄均为清热息风定惊要药，羚羊角偏清肝息风治肝风抽搐，牛黄偏清心开窍治热入心包。"},{"name":"牛黄","category":"平肝息风药","level":"2","page":"","properties":"甘，凉。归心、肝经。","functions":"清热解毒，化痰开窍，凉肝息风。","functions_full":"牛黄甘凉清润，善清热解毒，为治热毒疮疡、咽喉肿痛之良药。又能化痰开窍，用于热入心包之神昏谵语、中风痰迷。尚可凉肝息风定惊，用于热盛惊风抽搐。为急救之要药。","dosage":"0.15~0.35g，入丸散服。外用适量，研末调敷。","notes":"脾胃虚寒者慎用。孕妇慎用。","indications":"主治热入心包之神昏谵语；热盛惊风抽搐；咽喉肿痛、口舌生疮；痈肿疮毒。","combinations":"配麝香、冰片清热解毒开窍（安宫牛黄丸）；配朱砂、黄连清心安神。","differentiation":"牛黄与羚羊角均为清热定惊要药，牛黄清心开窍化痰力胜，羚羊角清热息风凉肝力胜。"},{"name":"珍珠","category":"平肝息风药","level":"3","page":"","properties":"甘、咸，寒。归心、肝经。","functions":"镇心安神，息风定惊，明目退翳，解毒生肌。","functions_full":"珍珠甘咸寒，善镇心安神、息风定惊，用于心神不安、惊悸失眠及惊风抽搐。又能明目退翳，用于目赤翳障。外用解毒生肌，用于疮疡溃烂久不收口。","dosage":"0.1~0.3g，入丸散服。外用适量，研末撒或点眼。","notes":"脾胃虚寒者慎用。","indications":"主治心神不安、惊悸失眠；惊风癫痫；目赤翳障；疮疡不敛（外用）。","combinations":"配牛黄、琥珀镇惊安神；配冰片外用解毒生肌。","differentiation":"珍珠与珍珠母均源于珍珠，珍珠为珍珠贝体内之颗粒安神定惊力更强，珍珠母为贝壳平肝潜阳为主。"},{"name":"僵蚕","category":"平肝息风药","level":"2","page":"","properties":"咸、辛，平。归肝、肺、胃经。","functions":"息风止痉，祛风止痛，化痰散结。","functions_full":"僵蚕咸辛平，善息风止痉、祛风止痛，用于惊风抽搐、破伤风及风热头痛、咽喉肿痛。又能化痰散结，用于瘰疬痰核、风疹瘙痒。为治风痰之常用药。","dosage":"5~9g，煎服。研末吞服1~1.5g。","notes":"血虚无风者不宜。","indications":"主治惊风抽搐、破伤风；风热头痛、咽喉肿痛；瘰疬痰核；风疹瘙痒。","combinations":"配全蝎、蜈蚣增强息风止痉之力；配蝉蜕、桑叶疏散风热。","differentiation":"僵蚕与全蝎均为息风止痉药，僵蚕兼能祛风止痛化痰散结，全蝎息风通络止痛力更强。"},{"name":"苏合香","category":"开窍药","level":"3","page":"","properties":"辛，温。归心、脾经。","functions":"开窍醒神，辟秽止痛。","functions_full":"苏合香辛温芳香，善开窍醒神，为寒闭神昏之要药。用于中风痰厥、气厥之寒闭神昏。又能辟秽止痛，用于寒凝气滞之心腹冷痛、胸闷。","dosage":"0.3~1g，入丸散服，不入煎剂。外用适量，溶乙醇涂擦。","notes":"热闭神昏者忌用。","indications":"主治寒闭神昏（中风痰厥、气厥）；寒凝气滞之心腹冷痛。","combinations":"配麝香、冰片开窍醒神（苏合香丸）；配檀香、沉香理气止痛。","differentiation":"苏合香与麝香均为开窍药，苏合香性温开寒闭为主，麝香性温开窍力最强寒热闭皆可用。"},{"name":"西洋参","category":"补虚药","level":"2","page":"","properties":"甘、微苦，凉。归心、肺、肾经。","functions":"补气养阴，清热生津。","functions_full":"西洋参甘凉清补，善补气养阴、清热生津，为气阴双补之良药。用于气阴两虚之短气乏力、口干咽燥。又能清火生津，用于阴虚火旺之咳喘痰血及热病气阴两伤之烦渴。补而不燥，清而不寒。","dosage":"3~6g，另煎兑服。","notes":"中阳虚衰及寒湿中阻者忌用。不宜与藜芦同用（十八反）。","indications":"主治气阴两虚之短气乏力、口干咽燥；阴虚火旺之咳喘痰血；热病气阴两伤之烦渴。","combinations":"配麦冬、五味子益气养阴生津；配生地黄、知母清热养阴。","differentiation":"西洋参与人参均能补气，西洋参性凉补气养阴宜于气阴两虚，人参性温大补元气宜于气虚重证。"},{"name":"太子参","category":"补虚药","level":"3","page":"","properties":"甘、微苦，平。归脾、肺经。","functions":"补气生津，健脾益肺。","functions_full":"太子参甘平清润，善补气生津健脾益肺，为清补之品。用于脾虚食少、倦怠乏力。又能益肺生津，用于肺虚燥咳、口干咽燥。药力平和，为小儿及不宜峻补者之理想补气药。","dosage":"9~30g，煎服。","notes":"邪实而正气不虚者不宜。","indications":"主治脾虚食少、倦怠乏力；肺虚燥咳、气阴不足；小儿虚汗。","combinations":"配黄芪、白术健脾益气；配麦冬、沙参益肺生津。","differentiation":"太子参与西洋参均为清补之品，太子参补气力弱而平和宜于儿童及轻证，西洋参补气养阴力强兼清热。"},{"name":"白扁豆","category":"补虚药","level":"3","page":"","properties":"甘，微温。归脾、胃经。","functions":"健脾化湿，和中消暑。","functions_full":"白扁豆甘微温，善健脾化湿，为药食两用之品。用于脾虚湿盛之食少便溏、妇女带下。又能和中消暑，用于暑湿吐泻。","dosage":"9~15g，煎服。健脾炒用，消暑生用。","notes":"不宜多食，以免壅气。","indications":"主治脾虚有湿之食少便溏、带下；暑湿吐泻。","combinations":"配白术、茯苓健脾化湿止泻（参苓白术散）；配藿香、厚朴化湿和中。","differentiation":"白扁豆与白术均为健脾化湿药，白扁豆药食两用药力平和兼消暑，白术健脾燥湿力强为健脾主药。"},{"name":"大枣","category":"补虚药","level":"2","page":"","properties":"甘，温。归脾、胃、心经。","functions":"补中益气，养血安神，缓和药性。","functions_full":"大枣甘温，善补中益气养血安神，为药食两用之滋补佳品。用于脾虚食少、乏力便溏。又能养血安神，用于血虚萎黄及妇人脏躁（更年期综合征）。与峻烈药同用可缓和药性、保护胃气。","dosage":"6~15g，煎服。","notes":"湿盛脘腹胀满者不宜。","indications":"主治脾虚食少乏力；血虚萎黄、妇人脏躁；缓和峻烈药之药性。","combinations":"配甘草、小麦养心安神（甘麦大枣汤）；配生姜调和营卫。","differentiation":"大枣与甘草均能补中益气调和药性，大枣兼养血安神，甘草兼清热解毒祛痰止咳。"},{"name":"刺五加","category":"补虚药","level":"3","page":"","properties":"辛、微苦，温。归脾、肺、心、肾经。","functions":"益气健脾，补肾安神。","functions_full":"刺五加辛微苦温，善益气健脾、补肾安神，为补虚强壮之品。用于脾肺气虚之体虚乏力、食欲不振。又能补肾，用于肾虚腰膝酸软。尚可安神，用于心脾两虚之失眠健忘。现代研究表明有抗疲劳、增强免疫力之效。","dosage":"9~27g，煎服。亦可浸酒服。","notes":"阴虚火旺者慎用。","indications":"主治脾肺气虚之乏力、食少；肾虚腰膝酸软；心脾两虚之失眠。","combinations":"配黄芪、党参益气健脾；配酸枣仁、远志养心安神。","differentiation":"刺五加与人参均为五加科补气药，刺五加性较温和补而不燥兼安神，人参大补元气力峻。"},{"name":"绞股蓝","category":"补虚药","level":"3","page":"","properties":"苦、甘，寒。归脾、肺经。","functions":"益气健脾，化痰止咳，清热解毒。","functions_full":"绞股蓝苦甘寒，善益气健脾，用于脾虚气弱之体倦乏力。又能化痰止咳清热，用于肺虚咳喘、热痰咳嗽。现代研究有降脂、降糖、抗衰老之效。","dosage":"6~12g，煎服。亦可用作茶饮。","notes":"脾胃虚寒者慎用。","indications":"主治脾虚乏力；肺虚咳喘、热痰咳嗽；高脂血症、糖尿病（辅助）。","combinations":"配黄芪、白术益气健脾；配鱼腥草、川贝母化痰止咳。","differentiation":"绞股蓝与刺五加均为现代研究有抗疲劳作用之品，绞股蓝性寒兼清热化痰，刺五加性温兼补肾安神。"},{"name":"红景天","category":"补虚药","level":"3","page":"","properties":"甘，平。归肺、心经。","functions":"益气活血，通脉平喘。","functions_full":"红景天甘平，善益气活血、通脉平喘，为高原补益强壮之品。用于气虚体弱、倦怠乏力及高原反应。又能活血通脉，用于胸痹心痛。尚可平喘，用于虚喘。","dosage":"3~6g，煎服。亦可泡服。","notes":"无明显禁忌。","indications":"主治气虚体弱、高原反应；胸痹心痛；虚喘。","combinations":"配人参、麦冬益气养阴；配丹参、三七活血通脉。","differentiation":"红景天为近年来流行的补气活血抗缺氧药，与人参相比兼活血抗缺氧之特色。"},{"name":"沙棘","category":"补虚药","level":"3","page":"","properties":"酸、涩，温。归脾、胃、肺、心经。","functions":"健脾消食，止咳化痰，活血散瘀。","functions_full":"沙棘酸涩温，善健脾消食，用于脾虚食少、食积不化。又能止咳化痰，用于咳嗽痰多。尚可活血散瘀，用于瘀血经闭、跌打损伤。富含维生素，为药食两用之品。","dosage":"3~9g，煎服。","notes":"胃酸过多者慎用。","indications":"主治脾虚食积；咳嗽痰多；瘀血经闭。","combinations":"配山楂、麦芽健脾消食；配川贝母、杏仁止咳化痰。","differentiation":"沙棘与山楂均为药食两用的消食活血药，沙棘兼止咳化痰富含维生素，山楂兼活血散瘀降脂。"},{"name":"饴糖","category":"补虚药","level":"3","page":"","properties":"甘，温。归脾、胃、肺经。","functions":"补中益气，缓急止痛，润肺止咳。","functions_full":"饴糖甘温质润，善补中益气、缓急止痛，用于脾胃虚寒之脘腹疼痛、食少乏力。又能润肺止咳，用于肺燥干咳。为甘缓补虚之品。","dosage":"30~60g，烊化冲服。","notes":"湿热内盛及痰热咳嗽者不宜。","indications":"主治脾胃虚寒之脘腹疼痛；肺燥咳嗽。","combinations":"配桂枝、白芍温中补虚缓急止痛（小建中汤）；配杏仁、百部润肺止咳。","differentiation":"饴糖与蜂蜜均为甘润补虚药食两用之品，饴糖偏于温中缓急止痛，蜂蜜偏于润肺滑肠通便。"},{"name":"蜂蜜","category":"补虚药","level":"3","page":"","properties":"甘，平。归肺、脾、大肠经。","functions":"补中润燥，止痛解毒，润肺止咳，滑肠通便。","functions_full":"蜂蜜甘平质润，善补中润燥，为药食两用之佳品。能补中益气，用于脾胃虚弱。又能润肺止咳，用于肺燥干咳。尚可滑肠通便，用于肠燥便秘。兼能解毒，用于解乌头类毒及调和诸药。","dosage":"15~30g，冲服。外用适量。","notes":"湿盛中满及便溏者不宜。","indications":"主治脾胃虚弱；肺燥干咳；肠燥便秘；解毒及炮制辅料。","combinations":"配百部、款冬花润肺止咳；配黑芝麻、火麻仁润肠通便。","differentiation":"蜂蜜与饴糖均为甘润补虚之品，蜂蜜兼润肺滑肠解毒应用更广，饴糖偏于温中缓急止痛。"},{"name":"紫河车","category":"补虚药","level":"2","page":"","properties":"甘、咸，温。归肺、肝、肾经。","functions":"补肾益精，益气养血。","functions_full":"紫河车为人之胎盘，甘咸温补，善补肾益精、益气养血，为血肉有情之品而大补精血。用于肾气不足之精少不育、阳痿遗精及虚劳赢瘦。又能益气养血，用于气血两虚之面黄肌瘦、产后乳少。兼能补肺纳气，用于肺肾两虚之喘咳。","dosage":"1.5~3g，研末吞服。或入丸散。","notes":"阴虚火旺者不宜单独使用。注意来源安全性。","indications":"主治肾虚精少不育、阳痿；气血两虚之赢瘦、乳少；肺肾两虚之喘咳。","combinations":"配人参、黄芪益气养血；配鹿茸、巴戟天补肾壮阳。","differentiation":"紫河车与鹿茸均为血肉有情之补精血良药，紫河车偏益气养血，鹿茸偏补肾壮阳。"},{"name":"淫羊藿","category":"补虚药","level":"2","page":"","properties":"辛、甘，温。归肝、肾经。","functions":"补肾壮阳，强筋健骨，祛风除湿。","functions_full":"淫羊藿辛甘温，善补肾壮阳，为治肾阳虚阳痿之要药。用于肾阳虚衰之阳痿遗精、宫冷不孕。又能强筋健骨、祛风除湿，用于风湿痹痛、筋骨痿软。兼能止咳平喘，用于肾虚咳喘。","dosage":"6~10g，煎服。亦可浸酒服。","notes":"阴虚火旺者忌用。","indications":"主治肾阳虚阳痿、遗精、宫寒不孕；风湿痹痛、筋骨痿软；肾虚咳喘。","combinations":"配巴戟天、肉苁蓉温肾壮阳；配威灵仙、独活祛风除湿。","differentiation":"淫羊藿与巴戟天均为补肾阳强筋骨药，淫羊藿壮阳力较强兼祛风湿，巴戟天药性较柔润。"},{"name":"仙茅","category":"补虚药","level":"3","page":"","properties":"辛，热，有小毒。归肾、肝经。","functions":"温肾壮阳，强筋健骨，祛寒除湿。","functions_full":"仙茅辛热有小毒，善温肾壮阳，用于肾阳不足之阳痿遗精、小便频数。又能强筋健骨、祛寒除湿，用于寒湿痹痛、腰膝冷痛。","dosage":"3~9g，煎服。","notes":"阴虚火旺者忌用。有小毒，不宜久服。","indications":"主治肾阳虚之阳痿遗精、尿频；寒湿痹痛、腰膝冷痛。","combinations":"配淫羊藿、巴戟天温肾壮阳强骨（二仙汤）；配独活、威灵仙祛寒湿。","differentiation":"仙茅与淫羊藿均能补肾壮阳祛寒湿，仙茅性热有小毒不宜久服，淫羊藿性温较安全。"},{"name":"胡芦巴","category":"补虚药","level":"3","page":"","properties":"苦，温。归肾经。","functions":"温肾助阳，祛寒止痛。","functions_full":"胡芦巴苦温，善温肾助阳、祛寒止痛，为治寒疝之常用药。用于肾阳不足之阳痿、遗精。又能祛寒止痛，用于寒凝下焦之疝气疼痛、寒湿脚气。","dosage":"4.5~9g，煎服。","notes":"阴虚火旺者忌用。","indications":"主治肾阳虚之阳痿、遗精；寒疝疼痛、寒湿脚气。","combinations":"配吴茱萸、小茴香温肾散寒止痛；配巴戟天、附子温肾壮阳。","differentiation":"胡芦巴与小茴香均能温肾散寒治寒疝，胡芦巴兼温肾助阳，小茴香兼理气和胃。"},{"name":"肉苁蓉","category":"补虚药","level":"2","page":"","properties":"甘、咸，温。归肾、大肠经。","functions":"补肾阳，益精血，润肠通便。","functions_full":"肉苁蓉甘咸温润，善补肾阳益精血，为补肾阳之柔润品。用于肾阳不足、精血亏虚之阳痿、遗精、腰膝酸冷。又能润肠通便，用于肠燥便秘，尤宜于老年肾虚便秘。","dosage":"6~9g，煎服。","notes":"阴虚火旺及便溏者不宜。","indications":"主治肾阳虚精血亏之阳痿、遗精、不孕；老年肾虚肠燥便秘。","combinations":"配巴戟天、杜仲补肾壮腰；配当归、火麻仁润肠通便。","differentiation":"肉苁蓉与锁阳均为补肾润肠之品，肉苁蓉补肾阳益精血兼润肠，锁阳偏于补肾阳固精。"},{"name":"锁阳","category":"补虚药","level":"3","page":"","properties":"甘，温。归肝、肾、大肠经。","functions":"补肾阳，益精血，润肠通便。","functions_full":"锁阳甘温，善补肾阳益精血，用于肾阳不足之阳痿、遗精、腰膝酸软。又能润肠通便，用于肠燥便秘。功似肉苁蓉而力稍逊。","dosage":"5~9g，煎服。","notes":"阴虚火旺及便溏者不宜。","indications":"主治肾阳不足之阳痿、遗精、腰膝酸软；肠燥便秘。","combinations":"配肉苁蓉、巴戟天补肾益精；配火麻仁、蜂蜜润肠通便。","differentiation":"锁阳与肉苁蓉功效相近，锁阳偏于固精，肉苁蓉偏于益精血。"},{"name":"益智仁","category":"补虚药","level":"3","page":"","properties":"辛，温。归脾、肾经。","functions":"暖肾固精缩尿，温脾止泻摄唾。","functions_full":"益智仁辛温，善暖肾固精缩尿，用于肾虚遗精、遗尿、小便频数。又能温脾止泻摄唾，用于脾寒泄泻、口多涎唾。为脾肾双补之品。","dosage":"3~9g，煎服。","notes":"阴虚火旺及湿热者忌用。","indications":"主治肾虚遗精、遗尿、尿频；脾寒泄泻、口多涎唾。","combinations":"配乌药、山药温肾缩尿（缩泉丸）；配党参、白术温脾止泻。","differentiation":"益智仁与补骨脂均能温脾肾固精，益智仁兼温脾摄唾，补骨脂兼纳气平喘。"},{"name":"沙苑子","category":"补虚药","level":"3","page":"","properties":"甘，温。归肝、肾经。","functions":"补肾固精，养肝明目。","functions_full":"沙苑子甘温，善补肾固精，用于肾虚遗精、滑精、遗尿、带下。又能养肝明目，用于肝肾不足之目暗昏花、视力减退。","dosage":"9~15g，煎服。","notes":"阴虚火旺及湿热者慎用。","indications":"主治肾虚遗精、滑精、尿频；肝肾不足之目暗不明。","combinations":"配菟丝子、枸杞子补肾明目；配龙骨、牡蛎固精止遗。","differentiation":"沙苑子（潼蒺藜）与刺蒺藜（白蒺藜）名称相近而功效不同：沙苑子补肾固精，刺蒺藜平肝祛风。"},{"name":"蛤蚧","category":"补虚药","level":"2","page":"","properties":"咸，平。归肺、肾经。","functions":"补肺益肾，纳气定喘，助阳益精。","functions_full":"蛤蚧咸平，善补肺益肾、纳气定喘，为治虚喘之要药。用于肺肾两虚之虚喘久咳。又能助阳益精，用于肾阳不足之阳痿遗精。","dosage":"3~6g，煎服。研末吞服1~2g。","notes":"风寒及实热喘咳者忌用。","indications":"主治肺肾两虚之虚喘久咳；肾阳不足之阳痿遗精。","combinations":"配人参、贝母补肺纳气定喘（人参蛤蚧散）；配冬虫夏草、胡桃肉补肾纳气。","differentiation":"蛤蚧与冬虫夏草均为补肺肾平喘药，蛤蚧偏于纳气定喘兼助阳，冬虫夏草偏于补益肺肾兼止血。"},{"name":"核桃仁","category":"补虚药","level":"3","page":"","properties":"甘，温。归肾、肺、大肠经。","functions":"补肾温肺，润肠通便。","functions_full":"核桃仁甘温，善补肾温肺，用于肾虚腰痛、阳痿遗精及肺肾两虚之虚寒咳喘。又能润肠通便，用于肠燥便秘。为药食两用之品。","dosage":"6~9g，煎服。或嚼食。","notes":"阴虚火旺及痰热咳嗽者忌用。","indications":"主治肾虚腰痛、阳痿遗精；肺肾两虚之虚寒咳喘；肠燥便秘。","combinations":"配杜仲、补骨脂补肾强腰（青娥丸）；配火麻仁、黑芝麻润肠通便。","differentiation":"核桃仁与补骨脂均为补肾药，核桃仁兼温肺润肠药食两用，补骨脂兼温脾止泻。"},{"name":"冬虫夏草","category":"补虚药","level":"2","page":"","properties":"甘，平。归肺、肾经。","functions":"补肾益肺，止血化痰。","functions_full":"冬虫夏草甘平，善补肾益肺、止血化痰，为平补肺肾之良药。用于肺肾两虚之咳喘、痰血及阳痿遗精、腰膝酸软。又能补虚扶弱，用于病后体虚、自汗畏寒。为名贵滋补药材。","dosage":"3~9g，煎服。研末吞服1~2g。","notes":"有表邪者不宜。","indications":"主治肺肾两虚之久咳虚喘、痰血；肾虚阳痿、遗精；病后体虚。","combinations":"配人参、蛤蚧补肺肾纳气；配沙参、麦冬养阴润肺。","differentiation":"冬虫夏草与蛤蚧均为补肺肾要药，冬虫夏草平补兼止血化痰，蛤蚧偏于纳气定喘兼助阳。"},{"name":"韭菜子","category":"补虚药","level":"3","page":"","properties":"辛、甘，温。归肝、肾经。","functions":"温补肝肾，壮阳固精。","functions_full":"韭菜子辛甘温，善温补肝肾、壮阳固精，为治阳痿遗精之常用药。用于肾阳虚之阳痿遗精、遗尿尿频、白带过多。","dosage":"3~9g，煎服。","notes":"阴虚火旺者忌用。","indications":"主治肾阳虚之阳痿遗精、遗尿、白带过多。","combinations":"配补骨脂、益智仁补肾固精；配菟丝子、沙苑子温肾固摄。","differentiation":"韭菜子与菟丝子均为补肾固精药，韭菜子偏于温肾壮阳，菟丝子偏于补肾益阴平补阴阳。"},{"name":"阳起石","category":"补虚药","level":"3","page":"","properties":"咸，温。归肾经。","functions":"温肾壮阳。","functions_full":"阳起石咸温，善温肾壮阳，为治肾阳虚阳痿之专药。用于肾阳不足之阳痿、宫寒不孕、腰膝冷痛。为矿物类壮阳药。","dosage":"3~6g，煎服。入丸散服。","notes":"阴虚火旺者忌用。不宜久服。","indications":"主治肾阳虚之阳痿、宫寒不孕、腰膝冷痛。","combinations":"配鹿茸、淫羊藿增强壮阳之力；配巴戟天、肉苁蓉温肾益精。","differentiation":"阳起石与紫石英均为矿物类温肾药，阳起石专于壮阳，紫石英兼温肺定惊。"},{"name":"紫石英","category":"补虚药","level":"3","page":"","properties":"甘，温。归心、肺、肾经。","functions":"温肾暖宫，镇心安神，温肺平喘。","functions_full":"紫石英甘温，善温肾暖宫，用于肾阳不足之宫寒不孕。又能镇心安神，用于心悸怔忡、失眠多梦。尚可温肺平喘，用于肺寒咳喘。","dosage":"9~15g，煎服。宜先煎。","notes":"阴虚火旺者忌用。","indications":"主治宫寒不孕；心悸失眠；肺寒咳喘。","combinations":"配阳起石、鹿茸温肾暖宫；配酸枣仁、远志镇心安神。","differentiation":"紫石英与阳起石均为矿物类温肾药，紫石英兼镇心安神温肺，阳起石专于壮阳。"},{"name":"海狗肾","category":"补虚药","level":"3","page":"","properties":"咸，热。归肾经。","functions":"温肾壮阳，益精补髓。","functions_full":"海狗肾咸热，善温肾壮阳益精补髓，为血肉有情之壮阳品。用于肾阳虚衰之阳痿遗精、精冷不育。","dosage":"3~9g，煎服。研末吞服1~2g。","notes":"阴虚火旺者忌用。","indications":"主治肾阳虚衰之阳痿、精冷不育。","combinations":"配鹿茸、淫羊藿增强壮阳之力；配紫河车、枸杞子益精补髓。","differentiation":"海狗肾与鹿茸均为血肉有情壮阳药，海狗肾专于壮阳，鹿茸壮阳兼益精血强筋骨。"},{"name":"海马","category":"补虚药","level":"3","page":"","properties":"甘，温。归肝、肾经。","functions":"温肾壮阳，散结消肿。","functions_full":"海马甘温，善温肾壮阳，用于肾阳虚之阳痿遗精。又能散结消肿，用于癥瘕积聚、跌打损伤。现代也用于催产、难产。","dosage":"3~9g，煎服。研末吞服1~1.5g。外用适量，研末调敷。","notes":"孕妇及阴虚火旺者忌用。","indications":"主治肾阳虚之阳痿遗精；癥瘕积聚、跌打损伤。","combinations":"配鹿茸、淫羊藿温肾壮阳；配三棱、莪术散结消肿。","differentiation":"海马与海狗肾均为海洋来源的壮阳药，海马兼散结消肿催产，海狗肾专于温肾壮阳。"},{"name":"哈蟆油","category":"补虚药","level":"3","page":"","properties":"甘、咸，平。归肺、肾经。","functions":"补肾益精，养阴润肺。","functions_full":"哈蟆油甘咸平，善补肾益精、养阴润肺，为滋补强壮之品。用于病后体虚、产后虚弱及肺肾阴虚之虚劳咳嗽。","dosage":"5~15g，煎服或炖服。","notes":"外感初起及食少便溏者慎用。","indications":"主治病后体虚、产后虚弱；肺肾阴虚之虚劳咳嗽。","combinations":"配燕窝、银耳润肺养阴；配枸杞、山药补肾益精。","differentiation":"哈蟆油与燕窝均为滋补强壮润肺之品，哈蟆油为林蛙输卵管偏补肾益精，燕窝偏润肺养阴。"},{"name":"龙眼肉","category":"补虚药","level":"2","page":"","properties":"甘，温。归心、脾经。","functions":"补心脾，益气血，安神。","functions_full":"龙眼肉甘温质润，善补心脾、益气血、安神，为滋补佳品。用于心脾两虚、气血不足之心悸失眠、健忘、面色萎黄。与酸枣仁等配伍，增强养心安神之效。","dosage":"9~15g，煎服。大剂量可至30g。","notes":"湿阻中满及有痰火者不宜。","indications":"主治心脾两虚、气血不足之心悸、失眠、健忘；病后及产后气血亏虚。","combinations":"配酸枣仁、当归补心血安神（归脾汤）；配黄芪、党参益气养血。","differentiation":"龙眼肉与当归均为补血药，龙眼肉以补心血安神为主，当归以补肝血调经为主。"},{"name":"北沙参","category":"补虚药","level":"2","page":"","properties":"甘、微苦，微寒。归肺、胃经。","functions":"养阴清肺，益胃生津。","functions_full":"北沙参甘微苦微寒，善养阴清肺，用于肺热阴虚之燥咳、干咳少痰。又能益胃生津，用于胃阴虚之口干咽燥、食欲不振。","dosage":"4.5~9g，煎服。","notes":"风寒咳嗽及肺胃虚寒者不宜。","indications":"主治肺热阴虚之燥咳、干咳少痰；胃阴虚之口干咽燥、食少。","combinations":"配麦冬、玉竹润肺养阴；配生地黄、石斛益胃生津。","differentiation":"北沙参与南沙参均能养阴清肺，北沙参滋阴力强宜于肺胃阴虚，南沙参兼化痰宜于肺燥痰黏。"},{"name":"南沙参","category":"补虚药","level":"3","page":"","properties":"甘，微寒。归肺、胃经。","functions":"养阴清肺，益胃生津，祛痰。","functions_full":"南沙参甘微寒，善养阴清肺、益胃生津，用于肺阴虚之燥咳及胃阴虚之口干。与北沙参相似，但兼能祛痰，用于肺燥痰黏难咳。","dosage":"9~15g，煎服。","notes":"风寒咳嗽者不宜。","indications":"主治肺阴虚之燥咳痰黏；胃阴虚之口干食少。","combinations":"配北沙参、麦冬增强养阴之力；配川贝母、杏仁化痰止咳。","differentiation":"南沙参与北沙参功效相似，南沙参兼祛痰，北沙参滋阴力更强。"},{"name":"百合","category":"补虚药","level":"2","page":"","properties":"甘，寒。归心、肺经。","functions":"养阴润肺，清心安神。","functions_full":"百合甘寒滋润，善养阴润肺，用于阴虚燥咳、劳嗽痰血。又能清心安神，用于虚烦惊悸、失眠多梦。为润肺安神之佳品。","dosage":"6~12g，煎服。清心生用，润肺蜜炙用。","notes":"风寒咳嗽及中寒便溏者不宜。","indications":"主治肺燥干咳、劳嗽痰血；虚烦惊悸、失眠多梦。","combinations":"配川贝母、麦冬润肺止咳；配酸枣仁、远志清心安神（百合地黄汤加减）。","differentiation":"百合与麦冬均能润肺清心安神，百合以清心安神为主，麦冬以养阴生津为主。"},{"name":"天冬","category":"补虚药","level":"2","page":"","properties":"甘、苦，寒。归肺、肾经。","functions":"养阴润燥，清肺生津。","functions_full":"天冬甘苦寒，善养阴润燥、清肺生津，为肺肾阴虚之要药。用于阴虚肺燥之干咳少痰、痰中带血。又能滋肾阴，用于肾阴虚之潮热盗汗、消渴。","dosage":"6~12g，煎服。","notes":"脾胃虚寒便溏者不宜。","indications":"主治肺阴虚之燥咳痰血；肾阴虚之潮热盗汗、消渴；津枯便秘。","combinations":"配麦冬、生地黄滋阴清热；配沙参、知母清肺生津。","differentiation":"天冬与麦冬均为养阴药常相须为用，天冬偏滋肾阴清肺，麦冬偏养胃阴清心。"},{"name":"黄精","category":"补虚药","level":"2","page":"","properties":"甘，平。归脾、肺、肾经。","functions":"补气养阴，健脾润肺，益肾。","functions_full":"黄精甘平，善补气养阴，为平补三焦之品。能补脾益气，用于脾胃虚弱之食少倦怠。又能润肺养阴，用于肺虚燥咳。尚可益肾填精，用于肾虚精亏之腰膝酸软、须发早白。","dosage":"9~15g，煎服。","notes":"中寒便溏及痰湿壅盛者不宜。","indications":"主治脾胃虚弱；肺虚燥咳；肾虚精亏之腰膝酸软。","combinations":"配党参、山药补脾益气；配枸杞子、熟地黄补肾填精。","differentiation":"黄精与玉竹均为百合科补阴药，黄精兼补气健脾益肾，玉竹偏于养阴润燥不腻。"},{"name":"墨旱莲","category":"补虚药","level":"3","page":"","properties":"甘、酸，寒。归肾、肝经。","functions":"滋补肝肾，凉血止血。","functions_full":"墨旱莲甘酸寒，善滋补肝肾，用于肝肾阴虚之头晕目眩、须发早白、腰膝酸软。又能凉血止血，用于阴虚血热之各种出血。","dosage":"6~12g，煎服。外用适量，鲜品捣敷止血。","notes":"脾胃虚寒便溏者不宜。","indications":"主治肝肾阴虚之头晕目眩、须发早白；阴虚血热之出血。","combinations":"配女贞子滋补肝肾（二至丸）；配生地黄、侧柏叶凉血止血。","differentiation":"墨旱莲与女贞子常相须为用（二至丸），墨旱莲兼凉血止血，女贞子兼清虚热明目。"},{"name":"女贞子","category":"补虚药","level":"2","page":"","properties":"甘、苦，凉。归肝、肾经。","functions":"滋补肝肾，乌发明目。","functions_full":"女贞子甘苦凉，善滋补肝肾，用于肝肾阴虚之头晕目眩、须发早白、视力减退。又能清虚热，用于阴虚发热。","dosage":"6~12g，煎服。","notes":"脾胃虚寒便溏者不宜。","indications":"主治肝肾阴虚之头晕目眩、须发早白、目暗不明；阴虚发热。","combinations":"配墨旱莲益肾乌发（二至丸）；配枸杞子、菊花养肝明目。","differentiation":"女贞子与枸杞子均为补肝肾明目药，女贞子兼清虚热乌须发，枸杞子平补阴阳兼润肺。"},{"name":"桑椹","category":"补虚药","level":"3","page":"","properties":"甘、酸，寒。归心、肝、肾经。","functions":"滋阴补血，生津润燥。","functions_full":"桑椹甘酸寒，善滋阴补血，用于阴血亏虚之头晕耳鸣、须发早白、失眠多梦。又能生津润燥，用于津伤口渴及消渴。尚可润肠通便，用于肠燥便秘。","dosage":"9~15g，煎服。","notes":"脾虚便溏者不宜。","indications":"主治阴血亏虚之眩晕、失眠、须发早白；津伤口渴、消渴；肠燥便秘。","combinations":"配何首乌、熟地黄补血乌发；配麦冬、石斛生津润燥。","differentiation":"桑椹与何首乌均能补血乌发，桑椹兼生津润燥，何首乌补益力更强（制用）。"},{"name":"黑芝麻","category":"补虚药","level":"3","page":"","properties":"甘，平。归肝、肾、大肠经。","functions":"补肝肾，益精血，润肠燥。","functions_full":"黑芝麻甘平，善补肝肾、益精血，用于肝肾不足之头晕眼花、须发早白。又能润肠燥，用于肠燥便秘。为药食两用之滋补品。","dosage":"9~15g，煎服。或炒熟嚼食。","notes":"便溏者不宜。","indications":"主治肝肾不足之头晕眼花、须发早白；肠燥便秘。","combinations":"配桑叶、黑豆补肝肾乌须发（桑麻丸）；配火麻仁、柏子仁润肠通便。","differentiation":"黑芝麻与桑椹均为补肝肾润肠之品，黑芝麻偏补精血乌发，桑椹偏滋阴补血生津。"},{"name":"麻黄根","category":"收涩药","level":"3","page":"","properties":"甘、涩，平。归心、肺经。","functions":"固表止汗。","functions_full":"麻黄根甘涩平，善固表止汗，为止汗专药。用于自汗、盗汗等一切虚汗证。内服或外用均可。","dosage":"3~9g，煎服。外用适量，研末扑粉。","notes":"有表邪者忌用。","indications":"主治自汗、盗汗、产后虚汗。","combinations":"配黄芪、白术固表止汗；配五味子、浮小麦敛汗。","differentiation":"麻黄根与浮小麦均为止汗专药，麻黄根收敛止汗力较强，浮小麦兼益气除热宜于虚热盗汗。"},{"name":"浮小麦","category":"收涩药","level":"3","page":"","properties":"甘，凉。归心经。","functions":"固表止汗，益气除热。","functions_full":"浮小麦甘凉，善固表止汗，为治虚汗之常用药。用于自汗、盗汗。又能益气除热，用于骨蒸劳热。","dosage":"15~30g，煎服。","notes":"实热证汗出者不宜。","indications":"主治自汗、盗汗；骨蒸劳热。","combinations":"配麻黄根、黄芪益气固表止汗；配地骨皮、鳖甲清热除蒸。","differentiation":"浮小麦与麻黄根均为止汗药，浮小麦兼益气除热，麻黄根纯收敛止汗。"},{"name":"糯稻根","category":"收涩药","level":"3","page":"","properties":"甘，平。归心、肝经。","functions":"固表止汗，益胃生津，退虚热。","functions_full":"糯稻根甘平，善固表止汗，用于自汗、盗汗。又能益胃生津、退虚热，用于阴虚发热、口渴咽干。","dosage":"15~30g，煎服。","notes":"无明显禁忌。","indications":"主治自汗、盗汗；阴虚发热、口渴。","combinations":"配浮小麦、麻黄根增强止汗之力；配沙参、麦冬益胃生津。","differentiation":"糯稻根与浮小麦均能止汗退虚热，糯稻根兼益胃生津，浮小麦主入心经除烦热。"},{"name":"五倍子","category":"收涩药","level":"3","page":"","properties":"酸、涩，寒。归肺、大肠、肾经。","functions":"敛肺降火，涩肠止泻，固精止遗，收敛止血，收湿敛疮。","functions_full":"五倍子酸涩寒，收敛力强而应用广泛。能敛肺降火，用于肺虚久咳及肺热咳嗽。又能涩肠止泻，用于久泻久痢。尚可固精止遗，用于遗精滑精。兼能收敛止血，用于崩漏、便血。外用收湿敛疮，用于湿疹、疮疡。","dosage":"3~6g，煎服。入丸散1~1.5g。外用适量，研末撒或调敷。","notes":"外感咳嗽及湿热泻痢初起者忌用。","indications":"主治肺虚久咳、肺热咳嗽；久泻久痢；遗精滑精；各种出血；湿疹疮疡（外用）。","combinations":"配五味子、罂粟壳敛肺止咳；配诃子、肉豆蔻涩肠止泻。","differentiation":"五倍子与五味子均能敛肺涩精止泻，五倍子兼收湿敛疮止血，五味子兼益气生津宁心。"},{"name":"罂粟壳","category":"收涩药","level":"3","page":"","properties":"酸、涩，平，有毒。归肺、大肠、肾经。","functions":"敛肺止咳，涩肠止泻，止痛。","functions_full":"罂粟壳酸涩有毒，收敛力极强。善敛肺止咳，用于肺虚久咳不止。又能涩肠止泻，用于久泻久痢。尚可止痛，用于胃痛、腹痛等疼痛。为强力收敛止痛之品，有成瘾性。","dosage":"3~6g，煎服。","notes":"有毒，不宜过量久服。外感咳嗽及泻痢初起者忌用。有成瘾性，严格管理使用。","indications":"主治肺虚久咳不止；久泻久痢；多种疼痛。","combinations":"配乌梅、诃子涩肠止泻；配百部、款冬花敛肺止咳。","differentiation":"罂粟壳为强力收敛止痛药，作用峻烈而有成瘾性，临床须严格控制使用。"},{"name":"诃子","category":"收涩药","level":"3","page":"","properties":"苦、酸、涩，平。归肺、大肠经。","functions":"涩肠止泻，敛肺止咳，利咽开音。","functions_full":"诃子苦酸涩平，善涩肠止泻，用于久泻久痢。又能敛肺止咳利咽，用于肺虚久咳及久咳失音。","dosage":"3~9g，煎服。涩肠煨用，利咽生用。","notes":"外感咳嗽及泻痢初起者忌用。","indications":"主治久泻久痢；肺虚久咳、失音。","combinations":"配肉豆蔻、乌梅涩肠止泻；配桔梗、甘草利咽开音。","differentiation":"诃子与乌梅均为酸收涩肠药，诃子兼利咽开音，乌梅兼生津安蛔。"},{"name":"石榴皮","category":"收涩药","level":"3","page":"","properties":"酸、涩，温。归大肠经。","functions":"涩肠止泻，杀虫。","functions_full":"石榴皮酸涩温，善涩肠止泻，用于久泻久痢、便血脱肛。又能杀虫，用于蛔虫、绦虫病。外用可收涩止痒。","dosage":"3~9g，煎服。止血炒炭用。","notes":"泻痢初起者忌用。","indications":"主治久泻久痢、脱肛；蛔虫、绦虫病。","combinations":"配诃子、肉豆蔻涩肠止泻；配槟榔驱虫。","differentiation":"石榴皮与五倍子均能涩肠止泻，石榴皮兼杀虫，五倍子兼敛肺止血收湿敛疮。"},{"name":"肉豆蔻","category":"收涩药","level":"3","page":"","properties":"辛，温。归脾、胃、大肠经。","functions":"涩肠止泻，温中行气。","functions_full":"肉豆蔻辛温芳香，善涩肠止泻、温中行气，为治虚寒泻痢之要药。用于脾肾虚寒之久泻久痢。又能温中行气止痛，用于胃寒气滞之脘腹胀痛、食少呕吐。","dosage":"3~9g，煎服。入丸散1.5~3g。煨熟去油用。","notes":"湿热泻痢者忌用。","indications":"主治脾肾虚寒之久泻久痢；胃寒气滞之脘腹胀痛、食少呕吐。","combinations":"配补骨脂、吴茱萸温肾暖脾止泻（四神丸）；配木香、砂仁温中行气。","differentiation":"肉豆蔻与补骨脂常相须为用治五更泻，肉豆蔻偏温中行气涩肠，补骨脂偏温肾助阳止泻。"},{"name":"赤石脂","category":"收涩药","level":"3","page":"","properties":"甘、酸、涩，温。归胃、大肠经。","functions":"涩肠止泻，收敛止血，敛疮生肌。","functions_full":"赤石脂甘酸涩温，善涩肠止泻，用于久泻久痢、便血脱肛。又能收敛止血，用于崩漏、带下。外用敛疮生肌，用于疮疡久溃不敛。","dosage":"9~12g，煎服。外用适量，研末撒或调敷。","notes":"湿热积滞者忌用。不宜与肉桂同用（十九畏）。","indications":"主治久泻久痢、便血脱肛；崩漏带下；疮疡不敛（外用）。","combinations":"配禹余粮涩肠固脱（赤石脂禹余粮汤）；配龙骨外用敛疮生肌。","differentiation":"赤石脂与禹余粮均为矿物类涩肠药常相须为用，赤石脂兼止血生肌，禹余粮兼止带。"},{"name":"禹余粮","category":"收涩药","level":"3","page":"","properties":"甘、涩，平。归胃、大肠经。","functions":"涩肠止泻，收敛止血，止带。","functions_full":"禹余粮甘涩平，善涩肠止泻，用于久泻久痢。又能收敛止血止带，用于崩漏、带下。","dosage":"9~15g，煎服。","notes":"实证及孕妇慎用。","indications":"主治久泻久痢；崩漏、带下。","combinations":"配赤石脂涩肠止泻固脱；配海螵蛸、白及收敛止血。","differentiation":"禹余粮与赤石脂功效相近常相须为用，禹余粮偏于止带，赤石脂偏于生肌。"},{"name":"覆盆子","category":"收涩药","level":"2","page":"","properties":"甘、酸，微温。归肝、肾经。","functions":"补肾固精，缩尿明目。","functions_full":"覆盆子甘酸温，善补肾固精缩尿，用于肾虚不固之遗精滑精、遗尿尿频。又能养肝明目，用于肝肾不足之目暗昏花。","dosage":"6~12g，煎服。","notes":"肾虚有火及小便短涩者不宜。","indications":"主治肾虚遗精、滑精、遗尿、尿频；肝肾不足之目暗不明。","combinations":"配桑螵蛸、益智仁固精缩尿；配枸杞子、菟丝子养肝明目（五子衍宗丸）。","differentiation":"覆盆子与金樱子均为补肾固精缩尿药，覆盆子兼明目，金樱子兼涩肠止泻。"},{"name":"桑螵蛸","category":"收涩药","level":"2","page":"","properties":"甘、咸，平。归肝、肾经。","functions":"固精缩尿，补肾助阳。","functions_full":"桑螵蛸为螳螂卵鞘，甘咸平，善固精缩尿，为治遗精滑精、遗尿尿频之要药。用于肾虚不固之遗精、遗尿、小便频数。又能补肾助阳，用于肾虚阳痿。","dosage":"5~9g，煎服。","notes":"阴虚火旺及膀胱有热者忌用。","indications":"主治肾虚之遗精滑精、遗尿尿频；肾虚阳痿。","combinations":"配益智仁、乌药固精缩尿；配龙骨、牡蛎增强固涩之力。","differentiation":"桑螵蛸与海螵蛸名称相近但功效不同：桑螵蛸固精缩尿补肾为主，海螵蛸收敛止血止带制酸为主。"},{"name":"海螵蛸","category":"收涩药","level":"2","page":"","properties":"咸、涩，微温。归脾、肾经。","functions":"收敛止血，涩精止带，制酸止痛，收湿敛疮。","functions_full":"海螵蛸为乌贼骨，咸涩微温，善收敛止血，用于崩漏、吐血、外伤出血。又能涩精止带，用于遗精滑精、带下。尚可制酸止痛，为治胃痛泛酸之良药。外用收湿敛疮。","dosage":"5~9g，煎服。外用适量，研末撒或调敷。","notes":"阴虚多热者慎用。","indications":"主治崩漏、肺胃出血；遗精、带下；胃痛泛酸；湿疹及疮疡不敛（外用）。","combinations":"配白及、三七收敛止血；配浙贝母制酸止痛（乌贝散）。","differentiation":"海螵蛸与桑螵蛸功效不同：海螵蛸偏于收敛止血制酸止带，桑螵蛸偏于固精缩尿补肾。"},{"name":"金樱子","category":"收涩药","level":"3","page":"","properties":"酸、甘、涩，平。归肾、膀胱、大肠经。","functions":"固精缩尿，涩肠止泻。","functions_full":"金樱子酸涩平，善固精缩尿，用于肾虚之遗精滑精、遗尿尿频。又能涩肠止泻，用于久泻久痢。","dosage":"6~12g，煎服。","notes":"有实火及邪热者忌用。","indications":"主治肾虚遗精滑精、遗尿尿频；久泻久痢。","combinations":"配芡实益肾固精（水陆二仙丹）；配覆盆子固精缩尿。","differentiation":"金樱子与覆盆子均为固精缩尿药，金樱子兼涩肠止泻，覆盆子兼养肝明目。"},{"name":"莲子","category":"收涩药","level":"3","page":"","properties":"甘、涩，平。归脾、肾、心经。","functions":"补脾止泻，益肾固精，养心安神。","functions_full":"莲子甘涩平，能补能涩，善补脾止泻，用于脾虚久泻。又能益肾固精，用于肾虚遗精滑精。尚可养心安神，用于心肾不交之心悸失眠。药食两用。","dosage":"6~15g，煎服。","notes":"中满痞胀及大便燥结者不宜。","indications":"主治脾虚久泻；肾虚遗精滑精；心肾不交之心悸失眠。","combinations":"配山药、白术补脾止泻；配酸枣仁、远志养心安神。","differentiation":"莲子与芡实均为药食两用补涩之品，莲子偏养心补脾，芡实偏益肾祛湿。"},{"name":"芡实","category":"收涩药","level":"3","page":"","properties":"甘、涩，平。归脾、肾经。","functions":"益肾固精，补脾止泻，除湿止带。","functions_full":"芡实甘涩平，善益肾固精，用于肾虚遗精滑精。又能补脾止泻、除湿止带，用于脾虚久泻及湿热带下、白浊。药食两用。","dosage":"9~15g，煎服。","notes":"食滞不化者慎用。","indications":"主治肾虚遗精滑精；脾虚久泻；带下、白浊。","combinations":"配金樱子益肾固精（水陆二仙丹）；配山药、白术补脾止泻。","differentiation":"芡实与莲子功效相似，芡实除湿止带力优宜于白带白浊，莲子养心安神力优宜于心悸失眠。"},{"name":"刺猬皮","category":"收涩药","level":"3","page":"","properties":"苦，平。归胃、大肠、肾经。","functions":"固精缩尿，收敛止血，化瘀止痛。","functions_full":"刺猬皮苦平，善固精缩尿，用于遗精遗尿。又能收敛止血，用于痔疮出血、便血。尚可化瘀止痛，用于胃痛、反胃呕吐。","dosage":"3~9g，煎服。外用适量，研末撒或调敷。","notes":"不宜多服。","indications":"主治遗精遗尿；痔血、便血；胃痛、反胃。","combinations":"配益智仁、桑螵蛸固精缩尿；配槐花、地榆凉血止血。","differentiation":"刺猬皮为动物类收涩药，兼具化瘀止痛之功为特色。"},{"name":"椿皮","category":"收涩药","level":"3","page":"","properties":"苦、涩，寒。归大肠、肝经。","functions":"清热燥湿，涩肠止泻，止带止血。","functions_full":"椿皮苦涩寒，善清热燥湿、涩肠止泻，用于湿热泻痢及久泻久痢。又能止带止血，用于湿热带下、崩漏。兼能杀虫，用于蛔虫病。","dosage":"6~9g，煎服。外用适量，煎汤洗。","notes":"脾胃虚寒者慎用。","indications":"主治湿热泻痢、久泻久痢；湿热带下、崩漏；蛔虫病。","combinations":"配黄柏、白芍清热燥湿止痢；配海螵蛸止带。","differentiation":"椿皮与秦皮均为苦寒涩肠止痢药，椿皮兼止带杀虫，秦皮兼清肝明目。"},{"name":"鸡冠花","category":"收涩药","level":"3","page":"","properties":"甘、涩，凉。归肝、大肠经。","functions":"收敛止血，止带止痢。","functions_full":"鸡冠花甘涩凉，善收敛止血止带，用于崩漏、便血、痔血及赤白带下。又能止痢，用于久痢不止。","dosage":"6~12g，煎服。","notes":"无明显禁忌。","indications":"主治崩漏、便血、痔血；赤白带下；久痢。","combinations":"配海螵蛸、白术止带；配地榆、槐花凉血止血。","differentiation":"鸡冠花与椿皮均能止带，鸡冠花以收敛止血止带为主，椿皮以清热燥湿止带为主。"},{"name":"常山","category":"涌吐药","level":"3","page":"","properties":"苦、辛，寒，有毒。归肺、心、肝经。","functions":"涌吐痰涎，截疟。","functions_full":"常山苦辛寒有毒，善涌吐痰涎，用于痰饮停聚胸膈之证。又能截疟，为治疟疾之要药。生用涌吐力强，酒制可减毒。","dosage":"4.5~9g，煎服。涌吐可生用，截疟宜酒制。","notes":"有毒，用量不宜过大。体虚及孕妇慎用。","indications":"主治痰饮停聚胸膈（催吐）；疟疾。","combinations":"配草果、槟榔截疟（截疟七宝饮）；配瓜蒂涌吐痰涎。","differentiation":"常山与甜瓜蒂均为涌吐药，常山兼截疟为特色，甜瓜蒂涌吐力较强。"},{"name":"甜瓜蒂","category":"涌吐药","level":"3","page":"","properties":"苦，寒，有毒。归胃经。","functions":"涌吐痰食，祛湿退黄。","functions_full":"甜瓜蒂苦寒有毒，善涌吐痰涎宿食，用于痰涎壅盛、食积胃脘。又可外用吹鼻祛湿退黄，用于湿热黄疸。","dosage":"0.6~1.5g，研末吞服（催吐）。外用适量，吹鼻。","notes":"有毒，体虚及孕妇忌用。吐后需调养脾胃。","indications":"主治痰涎壅盛、食积不化（催吐）；湿热黄疸（外用吹鼻）。","combinations":"配赤小豆涌吐痰食（瓜蒂散）；外用研末吹鼻退黄。","differentiation":"甜瓜蒂与常山均为涌吐药，甜瓜蒂涌吐力强兼外用退黄，常山兼截疟。"},{"name":"胆矾","category":"涌吐药","level":"3","page":"","properties":"酸、辛，寒，有毒。归肝、胆经。","functions":"涌吐风痰，解毒收湿，蚀疮去腐。","functions_full":"胆矾酸辛寒有毒，善涌吐风痰，用于风痰壅塞之喉痹、癫痫。外用能解毒收湿、蚀疮去腐，用于口疮、牙疳及疮疡。","dosage":"0.3~0.6g，化水服（催吐）。外用适量，研末撒或调敷。","notes":"有毒，体虚者忌用。不宜多服。","indications":"主治风痰壅塞（催吐）；外用治口疮、牙疳、疮疡。","combinations":"配僵蚕、白矾祛风痰；外用配冰片、硼砂解毒收湿。","differentiation":"胆矾为含水硫酸铜，兼具涌吐和解毒收湿的双重作用。"},{"name":"藜芦","category":"涌吐药","level":"3","page":"","properties":"辛、苦，寒，有毒。归肺、胃、肝经。","functions":"涌吐风痰，杀虫。","functions_full":"藜芦辛苦寒有毒，善涌吐风痰，用于风痰壅盛之中风、癫痫、喉痹。又可外用杀虫止痒，用于疥癣、虱蚤。","dosage":"0.3~0.9g，入丸散服。外用适量，研末调敷。","notes":"有毒，体虚及孕妇忌用。不宜与人参、沙参、丹参、玄参、细辛、芍药同用（十八反）。","indications":"主治风痰壅盛之中风、癫痫（催吐）；外用治疥癣。","combinations":"配瓜蒂、防风涌吐风痰；外用配苦参杀虫止痒。","differentiation":"藜芦涌吐之力峻猛且属十八反药物，临床使用需格外谨慎。"},{"name":"雄黄","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛，温，有毒。归肝、大肠经。","functions":"解毒杀虫，燥湿祛痰，截疟。","functions_full":"雄黄辛温有毒，善解毒杀虫，为解毒疗疮要药。用于痈肿疔疮、毒蛇咬伤。又能燥湿祛痰，用于虫积腹痛、惊痫。尚可截疟。","dosage":"0.05~0.1g，入丸散服。外用适量，研末撒或调敷。","notes":"有毒，内服宜慎。不可火煅（氧化生成砒霜）。孕妇忌用。","indications":"主治痈肿疔疮、蛇虫咬伤；虫积腹痛；疟疾。","combinations":"配白矾、冰片解毒消肿；配朱砂、牛黄清热定惊。","differentiation":"雄黄与硫黄均为含硫矿物类攻毒杀虫药，雄黄以解毒杀虫为主，硫黄以补火助阳杀虫为主。"},{"name":"硫黄","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"酸，温，有毒。归肾、大肠经。","functions":"杀虫止痒，补火助阳通便。","functions_full":"硫黄酸温有毒，外用善杀虫止痒，为治疥疮之要药。用于疥癣、湿疹瘙痒。内服能补火助阳通便，用于肾虚阳痿、虚寒便秘。","dosage":"1.5~3g，入丸散服。外用适量，研末涂敷。","notes":"有毒，孕妇忌用。不宜与朴硝同用（十九畏）。","indications":"主治疥疮、顽癣（外用）；肾虚阳痿、虚寒便秘（内服）。","combinations":"外用配轻粉、大风子治疥疮；内服配半夏、生姜通阳。","differentiation":"硫黄与雄黄均为攻毒杀虫止痒药，硫黄兼补火助阳通便内服力优，雄黄兼燥湿祛痰截疟。"},{"name":"白矾","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"酸、涩，寒。归肺、脾、肝、大肠经。","functions":"解毒杀虫，燥湿止痒，止血止泻，清热消痰。","functions_full":"白矾酸涩寒，外用善解毒杀虫、燥湿止痒，用于湿疹、疥癣。内服能止血止泻，用于便血、崩漏及久泻。又能清热消痰，用于风痰壅盛之癫痫。","dosage":"0.6~1.5g，入丸散服。外用适量，研末撒或化水洗。","notes":"体虚胃弱者不宜内服。","indications":"主治湿疹、疥癣（外用）；出血、久泻（内服）；风痰癫痫。","combinations":"配雄黄外用解毒杀虫；配郁金、半夏化痰开窍。","differentiation":"白矾与胆矾名称相近而不同：白矾为硫酸铝钾收涩解毒为主，胆矾为硫酸铜涌吐为主。"},{"name":"蛇床子","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛、苦，温，有小毒。归肾经。","functions":"杀虫止痒，燥湿祛风，温肾壮阳。","functions_full":"蛇床子辛苦温有小毒，外用善杀虫止痒燥湿，为皮肤科及妇科常用药。用于湿疹、疥癣、阴痒带下。内服能温肾壮阳，用于肾虚阳痿、宫寒不孕。","dosage":"3~9g，煎服。外用适量，煎汤熏洗或研末调敷。","notes":"阴虚火旺者忌内服。","indications":"主治湿疹、疥癣、阴痒带下（外用为主）；肾虚阳痿、宫寒不孕（内服）。","combinations":"配苦参、白矾外用杀虫止痒（蛇床子散）；配菟丝子、五味子温肾壮阳。","differentiation":"蛇床子与地肤子均为皮肤科止痒药，蛇床子兼温肾壮阳宜于寒湿证，地肤子兼清热利湿宜于湿热证。"},{"name":"土荆皮","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛，温，有毒。归肺、脾经。","functions":"杀虫止痒，祛风除湿。","functions_full":"土荆皮辛温有毒，善杀虫止痒，为治癣要药。外用治体癣、手足癣、头癣等多种癣病。又能祛风除湿。","dosage":"外用适量，浸酒或研末调敷。一般不作内服。","notes":"有毒，仅供外用。","indications":"主治各种癣病（体癣、手足癣、头癣）。","combinations":"配斑蝥、樟脑浸酒外擦治顽癣；单用浸酒外涂。","differentiation":"土荆皮为治疗多种皮肤癣菌感染的专药，杀虫止痒力强。"},{"name":"蜂房","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"甘，平，有小毒。归胃经。","functions":"攻毒杀虫，祛风止痛。","functions_full":"蜂房甘平有小毒，善攻毒杀虫，用于痈疽疮毒、瘰疬。又能祛风止痛，用于风湿痹痛、牙痛。现代亦用于肿瘤。","dosage":"3~5g，煎服。外用适量，研末调敷或煎汤洗。","notes":"气血虚弱者慎用。","indications":"主治痈疽疮毒、瘰疬；风湿痹痛、牙痛。","combinations":"配全蝎、僵蚕祛风止痛；配蒲公英、连翘攻毒消痈。","differentiation":"蜂房与露蜂房为同一药材，以攻毒祛风止痛为特点，现代有抗肿瘤研究。"},{"name":"樟脑","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛，热，有毒。归心经。","functions":"除湿杀虫，开窍辟秽，温散止痛。","functions_full":"樟脑辛热有毒，外用善除湿杀虫止痒，用于疥癣、湿疮。又能开窍辟秽，用于神昏、中恶。尚可温散止痛，用于跌打伤痛、牙痛。","dosage":"0.1~0.2g，入丸散服。外用适量，研末撒或调敷。","notes":"有毒，内服慎用。孕妇忌用。","indications":"主治疥癣、湿疮瘙痒（外用）；中恶神昏（内服微量）；跌打疼痛。","combinations":"配硫黄、枯矾外用杀虫止痒；配冰片、麝香开窍醒神。","differentiation":"樟脑与冰片均为芳香挥发性药物，樟脑偏于杀虫止痒温散，冰片偏于清热止痛开窍。"},{"name":"蟾酥","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛，温，有毒。归心经。","functions":"解毒消肿，止痛开窍。","functions_full":"蟾酥辛温有毒，善解毒消肿止痛，为治痈疽疔毒之要药。用于痈疽疔疮、咽喉肿痛。又能开窍醒神，用于中暑神昏、吐泻腹痛。为急救要药。","dosage":"0.015~0.03g，入丸散服。外用适量，研末调敷。","notes":"有毒，严格掌握剂量。孕妇忌用。外用不可入目。","indications":"主治痈疽疔疮、咽喉肿痛；中暑神昏吐泻。","combinations":"配牛黄、冰片清热解毒开窍（六神丸）；配麝香增强开窍之力。","differentiation":"蟾酥与麝香均为急救开窍药，蟾酥兼解毒消肿止痛，麝香开窍力更强兼活血通经。"},{"name":"大蒜","category":"攻毒杀虫止痒药","level":"3","page":"","properties":"辛，温。归脾、胃、肺经。","functions":"解毒杀虫，消肿止痢。","functions_full":"大蒜辛温，善解毒杀虫，为药食两用之品。用于痈肿疮毒、疥癣（外用）。又能消肿止痢，用于痢疾、泄泻。兼能温中行滞，用于脘腹冷痛。现代研究有抗菌、降脂作用。","dosage":"5~10g，生食或捣汁饮。外用适量，捣敷或切片擦。","notes":"阴虚火旺及目疾者不宜。","indications":"主治痈肿疮毒（外用）；痢疾、泄泻；脘腹冷痛、食积。","combinations":"单用即可起效；配黄连增强解毒止痢之力。","differentiation":"大蒜与葱白均为药食两用之辛温解毒药，大蒜解毒杀虫力强，葱白发汗解表为主。"},{"name":"红粉","category":"拔毒化腐生肌药","level":"3","page":"","properties":"辛，热，有大毒。","functions":"拔毒提脓，去腐生肌。","functions_full":"红粉为水银炼制而成的红色氧化汞，有大毒，善拔毒去腐生肌，为外科疮疡常用外用药。用于痈疽溃后脓出不畅、腐肉不去、新肉不生。","dosage":"外用微量，研极细末单用或配其他药。不作内服。","notes":"有大毒，仅供外用，不可内服。孕妇及汞过敏者忌用。外用亦不宜大面积使用。","indications":"主治痈疽溃后脓出不畅、腐肉不去。","combinations":"配轻粉、冰片外用拔毒生肌；配煅石膏制为九一丹减毒。","differentiation":"红粉与轻粉均为含汞外用药，红粉拔毒去腐力强，轻粉攻毒杀虫力优。"},{"name":"轻粉","category":"拔毒化腐生肌药","level":"3","page":"","properties":"辛，寒，有毒。归肺、大肠经。","functions":"攻毒杀虫，逐水消肿。","functions_full":"轻粉辛寒有毒，外用善攻毒杀虫止痒，用于疥癣、梅毒、疮疡。内服能逐水消肿，用于水肿胀满、二便不利。","dosage":"内服0.1~0.2g，入丸散服。外用适量，研末调敷。","notes":"有毒，内服慎用。孕妇忌用。不宜久服。","indications":"主治疥癣、梅毒、疮疡（外用）；水肿实证（内服）。","combinations":"配大黄、牵牛子逐水消肿（舟车丸）；配雄黄、硫黄外用杀虫。","differentiation":"轻粉与红粉均为含汞外用药，轻粉兼内服逐水，红粉仅供外用拔毒。"},{"name":"砒石","category":"拔毒化腐生肌药","level":"3","page":"","properties":"辛、酸，大热，有大毒。归肺、肝经。","functions":"蚀疮去腐，劫痰平喘，截疟。","functions_full":"砒石有大毒而作用峻烈，外用善蚀疮去腐，用于恶疮、瘰疬、牙疳。内服微量能劫痰平喘截疟，用于寒痰咳喘及疟疾。为毒性极强之品。","dosage":"内服0.002~0.004g，入丸散。外用微量。","notes":"有剧毒，严格掌握剂量。孕妇忌用。肝肾功能不全者忌用。皮肤破损处不宜外用。","indications":"主治恶疮、瘰疬（外用微量）；寒痰哮喘、疟疾（内服极微量）。","combinations":"配明矾、雄黄外用蚀疮；配淡豆豉制丸治寒痰哮喘（紫金丹）。","differentiation":"砒石为含砷剧毒矿物，蚀疮作用最强但毒性最大，治疗量与中毒量极为接近。"},{"name":"铅丹","category":"拔毒化腐生肌药","level":"3","page":"","properties":"辛、咸，寒，有毒。归心、肝经。","functions":"拔毒生肌，杀虫止痒，坠痰镇惊。","functions_full":"铅丹辛咸寒有毒，外用善拔毒生肌，为外科疮疡常用药。用于疮疡溃烂、黄水湿疮。又能杀虫止痒，用于疥癣。内服可坠痰镇惊，用于惊痫癫狂。","dosage":"外用适量，研末撒或调敷。内服0.3~0.6g。","notes":"有毒，内服慎用。不宜久服。","indications":"主治疮疡溃烂（外用）；惊痫癫狂（内服慎用）。","combinations":"配樟脑、冰片外用解毒生肌；外用熬制膏药。","differentiation":"铅丹为含铅矿物，为传统膏药的重要原料，因含铅毒性现代使用日趋减少。"},{"name":"炉甘石","category":"拔毒化腐生肌药","level":"3","page":"","properties":"甘，平。归肝、胃经。","functions":"解毒明目退翳，收湿止痒敛疮。","functions_full":"炉甘石甘平无毒，善解毒明目退翳，为眼科外用要药。用于目赤肿痛、翳膜遮睛、烂弦风眼。又能收湿止痒敛疮，用于湿疹、疮疡不敛。","dosage":"外用适量，水飞点眼或研末调敷。不作内服。","notes":"宜炮制后使用。","indications":"主治目赤肿痛、翳障（点眼）；湿疹、疮疡（外用）。","combinations":"配硼砂、冰片点眼明目退翳；配黄柏、枯矾外用收湿敛疮。","differentiation":"炉甘石为眼科外用药中较为安全的矿物药，以明目退翳收湿为特长。"},{"name":"硼砂","category":"拔毒化腐生肌药","level":"3","page":"","properties":"甘、咸，凉。归肺、胃经。","functions":"清热解毒，清肺化痰，消肿防腐。","functions_full":"硼砂甘咸凉，外用善清热解毒、消肿防腐，为口喉科常用药。用于咽喉肿痛、口舌生疮、目赤肿痛。内服能清肺化痰，用于痰热咳嗽。","dosage":"外用适量，研末撒或化水含漱。内服1~3g，入丸散。","notes":"内服宜慎。","indications":"主治咽喉肿痛（如冰硼散）、口舌生疮、目赤肿痛；痰热咳嗽。","combinations":"配冰片、玄明粉清热解毒消肿（冰硼散）；配瓜蒌、贝母清肺化痰。","differentiation":"硼砂与炉甘石均为眼科喉科外用良药，硼砂偏清热解毒消肿利咽，炉甘石偏明目退翳收湿。"}]

<script type="application/json" id="theoryDataEl">
{"四气五味":{"page":"49-51","content":"<h3>一、四气（四性）</h3>\n<p><b>定义：</b>指药物的寒、热、温、凉四种药性，反映药物对人体阴阳盛衰、寒热变化的作用倾向。</p>\n<ul>\n<li><b>温热药</b>：能消除或减轻寒证，如附子、干姜、肉桂</li>\n<li><b>寒凉药</b>：能消除或减轻热证，如石膏、黄芩、黄连</li>\n<li><b>平性药</b>：寒热偏性不明显，如茯苓、甘草</li>\n</ul>\n<p><b>记忆口诀：</b>疗寒以热药，疗热以寒药</p>\n\n<h3>二、五味</h3>\n<p><b>定义：</b>指药物的辛、甘、酸、苦、咸五种滋味，反映药物的不同功效特点。</p>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#f0f0f0;\"><th>五味</th><th>作用</th><th>代表药</th></tr>\n<tr><td><b>辛</b></td><td>发散、行气、活血、开窍、化湿</td><td>麻黄、桂枝、生姜</td></tr>\n<tr><td><b>甘</b></td><td>补益、和中、缓急、调和药性</td><td>甘草、大枣、蜂蜜</td></tr>\n<tr><td><b>酸（涩）</b></td><td>收敛、固涩</td><td>五味子、乌梅、山茱萸</td></tr>\n<tr><td><b>苦</b></td><td>泄（清泄/降泄/通泄）、燥湿、坚阴</td><td>黄连、黄芩、大黄</td></tr>\n<tr><td><b>咸</b></td><td>软坚散结、泻下</td><td>海藻、昆布、芒硝</td></tr>\n<tr><td><b>淡</b></td><td>渗湿、利尿</td><td>茯苓、薏苡仁、猪苓</td></tr>\n</table>\n\n<h3>三、气味配伍关系</h3>\n<ul>\n<li><b>同味不同性</b>：如辛温（麻黄发散风寒）vs 辛凉（薄荷发散风热）</li>\n<li><b>同性不同味</b>：如温性药中，甘温（黄芪补气）vs 辛温（干姜温中）</li>\n</ul>"},"升降浮沉":{"page":"50-51","content":"<h3>一、定义</h3>\n<p>升降浮沉是指药物在人体内作用的趋势方向，反映药物对机体气机升降出入运动的影响。</p>\n<ul>\n<li><b>升浮</b>：上行、向外，如升阳、发汗、宣透</li>\n<li><b>沉降</b>：下行、向内，如泻下、利尿、收敛</li>\n</ul>\n\n<h3>二、疾病趋势与药物选择</h3>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#f0f0f0;\"><th>病势</th><th>药物趋势</th><th>代表药</th></tr>\n<tr><td>呕吐、咳喘（向上）</td><td>沉降（止咳平喘、降逆）</td><td>半夏、杏仁、旋覆花</td></tr>\n<tr><td>泻痢、脱肛（向下）</td><td>升浮（升阳举陷）</td><td>黄芪、柴胡、升麻</td></tr>\n<tr><td>虚汗、疹出不畅（向外）</td><td>升浮（解表透疹）</td><td>桂枝、薄荷、蝉蜕</td></tr>\n<tr><td>表证不解（向内）</td><td>升浮（发散表邪）</td><td>麻黄、苏叶</td></tr>\n</table>\n\n<h3>三、影响升降浮沉的因素</h3>\n<ul>\n<li><b>药性</b>：温热药多升浮，寒凉药多沉降</li>\n<li><b>味</b>：辛甘淡多升浮，酸苦咸多沉降</li>\n<li><b>质地</b>：花叶多升浮，种子矿石多沉降（但有例外，如旋覆花降气）</li>\n<li><b>炮制</b>：酒制升提，盐制下行</li>\n<li><b>配伍</b>：与升浮药同用则升，与沉降药同用则降</li>\n</ul>"},"药物七情":{"page":"55-56","content":"<h3>一、定义</h3>\n<p>《神农本草经》提出\"药有阴阳配合，子母兄弟，根茎花实，草石骨肉。有单行者，有相须者，有相使者，有相畏者，有相恶者，有相反者，有相杀者。\"此即<b>药物七情</b>。</p>\n\n<h3>二、七情详解</h3>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#f0f0f0;\"><th>七情</th><th>定义</th><th>举例</th><th>考试要点</th></tr>\n<tr><td><b>单行</b></td><td>单味药独自发挥作用，不须其他药辅助</td><td>独参汤（人参）</td><td>黄芩治清肺热</td></tr>\n<tr style=\"background:#e8f5e9;\"><td><b>相须</b></td><td>功效类似的药物配伍，明显增强原有疗效（并列关系）</td><td>石膏+知母（清热）、麻黄+桂枝（发汗）、乳香+没药</td><td>⭐ 增效，1+1>2</td></tr>\n<tr style=\"background:#e8f5e9;\"><td><b>相使</b></td><td>一药为主，余药为辅，提高主药疗效（主次关系）</td><td>黄芪（主，补气）+茯苓（辅，利水）→ 黄芪提高茯苓利水功效</td><td>⭐ 辅药助主药</td></tr>\n<tr style=\"background:#fff3e0;\"><td><b>相畏</b></td><td>一种药物的毒性/副作用被另一种药物减轻或消除</td><td>生半夏畏生姜（生姜降低生半夏毒性）</td><td>⭐ A畏B = B能解A毒</td></tr>\n<tr style=\"background:#fff3e0;\"><td><b>相杀</b></td><td>一种药物能减轻或消除另一种药的毒性或副作用</td><td>生姜杀生半夏（生姜消除生半夏毒副）</td><td>⭐ A杀B = A能解B毒</td></tr>\n<tr style=\"background:#ffebee;\"><td><b>相恶</b></td><td>两药合用，相互牵制使原有功效降低甚至丧失</td><td>干姜（温中）+黄芩（清热）→ 二者功效相互对抗降低</td><td>⚠️ 减效，避免配伍</td></tr>\n<tr style=\"background:#ffebee;\"><td><b>相反</b></td><td>两药合用后，能产生毒性反应或副作用</td><td>甘草反甘遂、乌头反半夏（十八反内容）</td><td>⚠️ 产生毒性，绝对禁忌</td></tr>\n</table>\n\n<h3>三、考试重点</h3>\n<ul>\n<li><b>相须 vs 相使</b>：相须是并列关系（1+1>2），相使是主次关系（辅助主）</li>\n<li><b>相畏 vs 相杀</b>：同一配伍关系的两种表述（A畏B = B杀A）</li>\n<li><b>相恶 vs 相反</b>：相恶是功效降低，相反是产生毒性</li>\n</ul>"},"十八反十九畏":{"page":"56-58","content":"<h3>一、十八反</h3>\n<p><b>歌谣：</b></p>\n<pre style=\"background:#fff8e1;padding:10px;border-radius:6px;font-size:14px;\">\n本草名言十八反，半蒌贝蔹及攻乌。\n藻戟芫遂俱战草，诸参辛芍叛藜芦。\n</pre>\n\n<h4>详解：</h4>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#ffebee;\"><th>反药组</th><th>具体内容</th><th>含义</th></tr>\n<tr><td><b>乌头反</b></td><td>半夏、瓜蒌（蒌）、贝母、白蔹、白及</td><td>乌头类（附子、川乌、草乌）不宜与以上药同用</td></tr>\n<tr><td><b>甘草反</b></td><td>海藻、大戟、芫花、甘遂</td><td>甘草不宜与以上药同用</td></tr>\n<tr><td><b>藜芦反</b></td><td>诸参（人参、丹参、玄参、沙参、苦参）、细辛、芍药（白芍、赤芍）</td><td>藜芦不宜与以上药同用</td></tr>\n</table>\n\n<h3>二、十九畏</h3>\n<p><b>歌谣：</b></p>\n<pre style=\"background:#fff8e1;padding:10px;border-radius:6px;font-size:14px;\">\n硫黄原是火中精，朴硝一见便相争。\n水银莫与砒霜见，狼毒最怕密陀僧。\n巴豆性烈最为上，偏与牵牛不顺情。\n丁香莫与郁金见，牙硝难合京三棱。\n川乌草乌不顺犀，人参最怕五灵脂。\n官桂善能调冷气，若逢石脂便相欺。\n</pre>\n\n<h4>详解：</h4>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;\">\n<tr style=\"background:#fff3e0;\"><th>硫黄</th><td>畏朴硝（芒硝）</td></tr>\n<tr><th>水银</th><td>畏砒霜</td></tr>\n<tr><th>狼毒</th><td>畏密陀僧</td></tr>\n<tr><th>巴豆</th><td>畏牵牛子</td></tr>\n<tr><th>丁香</th><td>畏郁金</td></tr>\n<tr><th>牙硝（芒硝）</th><td>畏三棱</td></tr>\n<tr><th>川乌、草乌</th><td>畏犀角</td></tr>\n<tr><th>人参</th><td>畏五灵脂</td></tr>\n<tr><th>官桂（肉桂）</th><td>畏赤石脂</td></tr>\n</table>\n<p style=\"color:#d32f2f;\"><b>注意：</b>\"十九畏\"与\"七情\"中的\"相畏\"概念不同，十九畏是配伍禁忌，相畏是毒性被减轻。</p>"},"妊娠禁忌":{"page":"58","content":"<h3>一、原理</h3>\n<p>某些药物具有损胎元、损母体、损产程的作用，妊娠期需禁用或慎用。</p>\n\n<h3>二、分类</h3>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#ffebee;\"><th style=\"width:100px;\">禁用</th><td>毒性较强或药性猛烈的药物，使用后可能导致流产或损害母子</td></tr>\n<tr style=\"background:#fff3e0;\"><th>慎用</th><td>通经祛瘀、行气破滞、辛热滑利的药物，需权衡利弊使用</td></tr>\n</table>\n\n<h3>三、常见妊娠禁忌药</h3>\n<ul>\n<li><b>禁用</b>：水银、砒霜、雄黄、轻粉、斑蝥、蟾酥、麝香、三棱、莪术、水蛭、虻虫、蜈蚣、雄黄、巴豆、牵牛子、大戟、芫花、甘遂、商陆、麝香、凌霄花</li>\n<li><b>慎用</b>：桃仁、红花、牛膝、川芎、丹皮、大黄、枳实、附子、肉桂、干姜、冬葵子</li>\n</ul>"},"忌口":{"page":"58","content":"<h3>服药饮食禁忌（忌口）</h3>\n<ol>\n<li><b>疾病对饮食的禁忌</b>：如水肿忌食盐，黄疸忌油腻，温热病忌辛辣，寒证忌生冷</li>\n<li><b>药物对饮食的禁忌</b>：如服人参忌萝卜（消减补气作用），服地黄、何首乌忌葱蒜（影响药效）</li>\n<li><b>一般忌口</b>：服药期间忌食生冷、黏腻、腥臭等不易消化和有特殊刺激的食物</li>\n</ol>"},"特殊煎煮":{"page":"各论药材页","content":"<h3>一、先煎</h3>\n<p><b>目的：</b>增加溶解度，降低毒性，充分发挥药效</p>\n<ul>\n<li><b>矿物、贝壳类</b>：石膏、石决明、牡蛎、龙骨、龙齿、磁石、代赭石 → 打碎先煎15-30分钟</li>\n<li><b>毒性药</b>：附子、川乌、草乌 → 先煎30-60分钟（破坏乌头碱，降低毒性）</li>\n</ul>\n\n<h3>二、后下</h3>\n<p><b>目的：</b>防止有效成分挥发散失</p>\n<ul>\n<li><b>气味芳香药</b>：薄荷、荆芥、紫苏叶、砂仁、白豆蔻、沉香 → 煎好前5-10分钟入煎</li>\n<li><b>久煎破坏有效成分</b>：大黄（泻下作用）、钩藤（降压）→ 后下</li>\n</ul>\n\n<h3>三、包煎</h3>\n<p><b>目的：</b>防止绒毛脱落混悬、细粉糊锅、刺激咽喉</p>\n<ul>\n<li><b>绒毛脱落刺激咽喉</b>：旋覆花</li>\n<li><b>细粉类易糊锅</b>：车前子、葶苈子</li>\n<li><b>含淀粉黏液多</b>：菟丝子（有些版本要求）</li>\n</ul>\n\n<h3>四、烊化（熔化）</h3>\n<p><b>目的：</b>胶类药黏性大，直接煎煮易粘锅或粘附他药</p>\n<ul>\n<li><b>胶类</b>：阿胶、鹿角胶、龟甲胶、鳖甲胶 → 加适量开水或黄酒加热熔化，兑入煎好的药液中</li>\n</ul>\n\n<h3>五、另煎（另炖）</h3>\n<p><b>目的：</b>贵重药另煎，防止有效成分被他药吸收</p>\n<ul>\n<li><b>贵重药</b>：人参、西洋参、鹿茸 → 切片另炖2-3小时，兑入药液</li>\n</ul>\n\n<h3>六、冲服</h3>\n<p><b>目的：</b>贵重药或有效成分难溶</p>\n<ul>\n<li><b>贵重散剂</b>：三七粉、琥珀粉、麝香、牛黄、羚羊角粉 → 研细粉，用药液或温水冲服</li>\n<li><b>某些液体药</b>：竹沥、姜汁 → 冲入药液</li>\n</ul>\n\n<h3>考试记忆口诀</h3>\n<pre style=\"background:#e8f5e9;padding:10px;border-radius:6px;\">\n先煎：矿贝毒药先下锅\n后下：香药久煎要后下\n包煎：绒毛细粉包着煎\n烊化：胶类熔化再兑入\n另煎：贵重药材单独炖\n冲服：细粉直接温水送\n</pre>"},"炮制目的":{"page":"总论","content":"<h3>中药炮制的目的</h3>\n<p>中药炮制是指按照中医理论和治疗需要，对中药材进行加工处理的过程。</p>\n\n<h3>一、炮制的主要目的</h3>\n<ol>\n<li><b>降低或消除毒副作用</b>\n  <br>如：附子炮制（煮、炒）降低乌头碱毒性；半夏姜制降低刺激性</li>\n<li><b>增强药效</b>\n  <br>如：蜜炙麻黄增强平喘作用；酒炙川芎增强活血作用</li>\n<li><b>改变药性</b>\n  <br>如：生地黄（寒凉凉血）→ 熟地黄（温补肝肾）；生姜（散寒）→ 干姜（温中）→ 炮姜（温经止血）</li>\n<li><b>便于贮藏和制剂</b>\n  <br>如：干燥降低水分防霉变；切片便于煎煮</li>\n<li><b>清除杂质和非药用部位</b>\n  <br>如：去根、去须、去壳、去核</li>\n<li><b>矫臭矫味</b>\n  <br>如：酒炙紫河车（胎盘）减腥臭；麸炒僵蚕</li>\n</ol>\n\n<h3>二、常用炮制方法</h3>\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;\">\n<tr style=\"background:#f0f0f0;\"><th>方法</th><th>操作</th><th>目的</th><th>举例</th></tr>\n<tr><td>炒</td><td>清炒或加辅料炒</td><td>增效、减毒</td><td>炒白术（健脾）、焦山楂（消食）</td></tr>\n<tr><td>炙</td><td>用液体辅料拌炒</td><td>改变药性、增效</td><td>蜜炙（润肺）、酒炙（活血）、姜炙（止呕）</td></tr>\n<tr><td>煅</td><td>高温加热</td><td>改变性质</td><td>煅石膏（收敛）、煅牡蛎（制酸）</td></tr>\n<tr><td>蒸</td><td>蒸汽加热</td><td>改变药性</td><td>熟地黄（凉血→补血）</td></tr>\n<tr><td>煮</td><td>水煮</td><td>减毒</td><td>煮附子、煮半夏</td></tr>\n</table>"},"有毒无毒":{"page":"总论","content":"<h3>一、中药毒性概念</h3>\n<p>《神农本草经》将药物分为上、中、下三品：</p>\n<ul>\n<li><b>上品</b>：无毒，多服久服不伤人，补虚养命 → 人参、甘草、大枣、阿胶</li>\n<li><b>中品</b>：有毒无毒兼有，斟酌其宜，养性治病 → 干姜、附子、麻黄</li>\n<li><b>下品</b>：多毒，不可久服，除寒热邪气、破积聚 → 巴豆、甘遂、大戟、芫花</li>\n</ul>\n\n<h3>二、现代认识</h3>\n<ul>\n<li>任何药物都有一定偏性，\"毒\"即偏性</li>\n<li>有毒中药指治疗剂量与中毒剂量接近，使用不当易引起中毒反应</li>\n<li>无毒中药指治疗剂量安全范围大，正常使用不易中毒</li>\n</ul>\n\n<h3>三、常见有毒中药</h3>\n<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;width:100%;margin:10px 0;font-size:13px;\">\n<tr style=\"background:#ffebee;\"><th>大毒</th><td>川乌、草乌、附子、巴豆、砒霜、水银、斑蝥</td></tr>\n<tr style=\"background:#fff3e0;\"><th>有毒</th><td>附子（过量）、细辛（过量）、苦杏仁（过量）、半夏（生）、天南星（生）、全蝎、蜈蚣</td></tr>\n<tr style=\"background:#fffde7;\"><th>小毒</th><td>吴茱萸、苦楝皮、鸦胆子、地枫皮</td></tr>\n</table>\n\n<h3>四、使用注意</h3>\n<ul>\n<li>严格掌握剂量，不可过量</li>\n<li>注意炮制方法（如附子先煎减毒）</li>\n<li>注意配伍（利用相畏相杀减毒）</li>\n<li>注意证候禁忌（体虚、孕妇慎用有毒药）</li>\n</ul>"},"归经":{"page":"总论","content":"<h3>归经</h3>\n<p><b>定义：</b>指药物对机体某部分（脏腑、经络）的选择性作用，反映药物作用的定位。</p>\n<ul>\n<li>如：麻黄归肺经（发汗解表作用主要在肺经）</li>\n<li>如：柴胡归肝经（疏肝解郁作用主要在肝经）</li>\n<li>如：黄连归心、胃、大肠经（清热燥湿作用在这三经）</li>\n</ul>\n<p><b>与五味的关系：</b></p>\n<ul>\n<li>酸入肝、苦入心、甘入脾、辛入肺、咸入肾（五味入五脏理论）</li>\n</ul>"}}
</script>
<script>
(function(){
  "use strict";
  var HERBS_DATA = JSON.parse(document.getElementById("herbsDataEl").textContent);
  var THEORY_DATA = JSON.parse(document.getElementById("theoryDataEl").textContent);
  var currentTab = "herbs";

  function init(){
    renderHerbs(HERBS_DATA);
    renderTheory();
    bindEvents();
  }

  function bindEvents(){
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        switchTab(this.getAttribute("data-tab"), this);
      });
    });
    document.getElementById("searchInput").addEventListener("input", filterHerbs);
    document.getElementById("modalClose").addEventListener("click", function(e){
      e.stopPropagation();
      closeModal();
    });
    document.getElementById("modal").addEventListener("click", function(e){
      if(e.target === this) closeModal();
    });
    document.getElementById("herbsGrid").addEventListener("click", function(e){
      var card = e.target.closest(".herb-card");
      if(card){
        var name = card.getAttribute("data-herb-name");
        if(name) showDetail(name);
      }
    });
  }

  function switchTab(tab, btn){
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("page-herbs").style.display = tab === "herbs" ? "block" : "none";
    document.getElementById("page-theory").style.display = tab === "theory" ? "block" : "none";
  }

  function filterHerbs(){
    var q = (document.getElementById("searchInput").value || "").trim();
    var results = HERBS_DATA.filter(function(h){
      if(!q) return true;
      var n = h.name || "";
      var f = h.functions || "";
      var ff = h.functions_full || "";
      return n.indexOf(q) !== -1 || f.indexOf(q) !== -1 || ff.indexOf(q) !== -1;
    });
    renderHerbs(results);
  }

  function renderHerbs(list){
    var grid = document.getElementById("herbsGrid");
    if(list.length === 0){
      grid.innerHTML = '<div class="empty-msg">未找到匹配的药材</div>';
      return;
    }
    grid.innerHTML = "";
    list.forEach(function(h){
      var card = document.createElement("div");
      card.className = "herb-card level-" + h.level;
      card.setAttribute("data-herb-name", h.name);

      var lvName = h.level === 1 ? "一级（重点掌握）" : h.level === 2 ? "二级（掌握）" : "三级（了解）";
      var keyBadge = h.isKey ? '<span class="key-badge">⭐ 重点</span>' : "";
      var catLabel = (h.category || "") + (h.subCategory ? " / " + h.subCategory : "");
      var lvStyle = h.level === 1 ? "background:#fef2f2;color:#ef4444;border:1px solid #fecaca;" : h.level === 2 ? "background:#fff7ed;color:#f97316;border:1px solid #fed7aa;" : "background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe;";

      card.innerHTML = '<div class="level-bar"></div>'
        + '<div class="card-header">'
        + '<span class="card-name">' + esc(h.name) + '</span>'
        + keyBadge
        + '<span style="font-size:11px;padding:1px 6px;border-radius:8px;font-weight:600;' + lvStyle + '">' + lvName + '</span>'
        + '</div>'
        + '<div class="card-meta">' + esc(catLabel) + '　第' + (h.page || "?") + '页</div>'
        + '<div class="card-functions">' + (h.functions || "暂无功效摘要") + '</div>';

      grid.appendChild(card);
    });
  }

  function showDetail(name){
    var h = null;
    for(var i = 0; i < HERBS_DATA.length; i++){
      if(HERBS_DATA[i].name === name){ h = HERBS_DATA[i]; break; }
    }
    if(!h) return;

    var lvName = h.level === 1 ? "一级（重点掌握）" : h.level === 2 ? "二级（掌握）" : "三级（了解）";
    var keyBadge = h.isKey ? '<span style="background:#ef4444;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:8px;">⭐ 重点</span>' : "";

    var html = '<div style="font-size:22px;font-weight:700;color:#333;">' + esc(h.name) + keyBadge + '</div>';
    html += '<div style="font-size:13px;color:#888;margin-bottom:12px;">' + lvName + '　' + esc(h.category || "") + (h.subCategory ? ' / ' + esc(h.subCategory) : "") + '　第' + (h.page || "?") + '页</div>';
    if(h.properties) html += '<div class="detail-section"><div class="detail-label">性味归经</div><div class="detail-value">' + esc(h.properties) + '</div></div>';
    if(h.functions) html += '<div class="detail-section"><div class="detail-label">功效（摘要）</div><div class="detail-value">' + esc(h.functions) + '</div></div>';
    if(h.functions_full) html += '<div class="detail-section"><div class="detail-label">功效（详解）</div><div class="detail-value">' + esc(h.functions_full) + '</div></div>';
    if(h.dosage) html += '<div class="detail-section"><div class="detail-label">用法用量</div><div class="detail-value">' + esc(h.dosage) + '</div></div>';
    if(h.notes) html += '<div class="detail-section"><div class="detail-label">使用注意</div><div class="detail-value">' + esc(h.notes) + '</div></div>';
    if(h.indications) html += '<div class="detail-section"><div class="detail-label">主治病证</div><div class="detail-value">' + esc(h.indications) + '</div></div>';
    if(h.combinations) html += '<div class="detail-section"><div class="detail-label">常用配伍</div><div class="detail-value">' + esc(h.combinations) + '</div></div>';
    if(h.differentiation) html += '<div class="detail-section"><div class="detail-label">鉴别用药</div><div class="detail-value">' + esc(h.differentiation) + '</div></div>';

    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
  }

  function closeModal(){
    document.getElementById("modal").style.display = "none";
  }

  function renderTheory(){
    var keys = Object.keys(THEORY_DATA);
    var html = "";
    keys.forEach(function(key, idx){
      var item = THEORY_DATA[key];
      html += '<div class="theory-section">';
      html += '<h3>' + (idx+1) + '. ' + esc(key) + ' <span style="font-size:12px;color:#999;font-weight:400;">（第' + esc(item.page) + '页）</span></h3>';
      html += '<div class="content">' + item.content + '</div>';
      html += '</div>';
    });
    document.getElementById("theoryContent").innerHTML = html;
  }

  function esc(s){
    if(!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
