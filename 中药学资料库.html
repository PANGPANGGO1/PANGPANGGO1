"page":628,"properties":"辛，温。归肺、胃经。","functions":"温肺化痰、利气散结、通络止痛","functions_full":"白芥子豁痰利气，阴疽流注及咳逆\n１温肺化痰——寒痰壅肺、咳喘胸闷（三子养亲汤）；悬饮咳唾、胸胁引痛\n２利气散结——痰湿阻滞经络之阴疽流注；瘰疬痰核\n３通络止痛——痰阻经络之关节麻木疼痛","dosage":"煎服，3-6g。","notes":"外敷有发泡作用。肺虚久咳及阴虚火旺者忌用","indications":"①寒痰壅肺之咳喘痰多、胸闷，常配紫苏子、莱菔子（三子养亲汤）；②痰阻经络之肢体麻木、关节肿痛，为祛皮里膜外之痰之要药，常配没药、木香；③阴疽流注，常配麻黄、鹿角胶（阳和汤）。","combinations":"白芥子配苏子、莱菔子：降气化痰（三子养亲汤）；白芥子配麻黄：温经通络散结。","differentiation":"白芥子vs紫苏子：均化痰降气。白芥子辛温走窜，善祛皮里膜外之痰；苏子偏降气定喘、润肠。"},{"name":"川贝母","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"化痰止咳平喘药","subCategory":"清热化痰药","page":633,"properties":"苦、甘，微寒。归肺、心经。","functions":"清热化痰、润肺止咳、散结消肿","functions_full":"川贝润肺化热痰，虚劳燥咳及瘰疬\n１清热化痰——热痰咳嗽（配知母，二母散）\n２润肺止咳——阴虚燥咳、劳嗽久咳（配沙参、麦冬等）\n３散结消肿——瘰疬、乳痈、肺痈","dosage":"煎服，3-10g。研末服，1-2g/次。","notes":"反乌头（十八反）。寒痰、湿痰不宜用","indications":"①肺热燥咳之干咳少痰，或痰中带血，善润肺止咳，常配沙参、麦冬；②阴虚劳嗽之久咳不愈，常配知母、百合；③瘰疬、乳痈、肺痈。","combinations":"川贝母配知母：清肺润燥化痰；川贝母配沙参：润肺止咳。","differentiation":"川贝母vs浙贝母：均清热化痰止咳。川贝母偏润肺止咳，治燥咳虚咳；浙贝母偏清热散结，治痰热咳嗽及瘰疬。"},{"name":"浙贝母","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"清热化痰药","page":637,"properties":"苦，寒。归肺、心经。","functions":"清热化痰、开郁散结","functions_full":"浙贝苦寒清肺热，化痰散结消瘰疬\n１清热化痰——风热咳嗽或痰热咳嗽（配桑叶、牛蒡子等）\n２开郁散结——瘰疬、瘿瘤（消瘰丸）；痈疡肿毒、肺痈、乳痈","dosage":"煎服，3-10g。","notes":"反乌头（十八反）。寒痰、湿痰不宜用","indications":"①风热咳嗽或痰热咳嗽之痰黄黏稠，常配桑叶、黄芩；②瘰疬瘿瘤、疮疡肿毒，清热散结力强，常配玄参、牡蛎（消瘰丸）；③肺痈之咳吐脓痰，常配鱼腥草。","combinations":"浙贝母配玄参：清热散结消瘰（消瘰丸）；浙贝母配鱼腥草：清肺排脓。","differentiation":"浙贝母vs川贝母：见川贝母鉴别。浙贝母散结力强；川贝母润肺力优。"},{"name":"瓜蒌","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"化痰止咳平喘药","subCategory":"清热化痰药","page":641,"properties":"：甘、微苦、寒。归肺、胃、大肠经。","functions":"清热化痰、利气宽胸、散结消痈、润肠通便","functions_full":"：瓜蒌清肺化热痰，宽胸散结通大便 \n1.清热化痰——热痰、燥痰。\n2.利气宽胸——胸痹，结胸。\n3.散结消痈——肺痈，乳痈，肠痈等。\n4.润肠通便——用于肠燥便秘。","dosage":"：煎服，全瓜蒌10—15克。 瓜蒌皮5—10克，瓜蒌仁10—15克，打碎入煎。","notes":"：反乌头 竹茹 类 别 植物 原植物 禾本科植物青杆竹、大头典竹、淡竹 药 材 茎的中间层 性味归经：甘、微寒。归肺、胃经。 功效应用： 1.清热化痰，开郁除烦——用于热痰咳嗽，心烦不眠。 热痰咳嗽（常与瓜蒌同用） 热痰内扰之心烦不眠（温胆汤） 2.清胃止呕——胃热呕吐， 为治热性呕吐之要药。 用法用量：煎服，5—10克。 竹茹长于清热化痰，姜竹茹长于止呕。 前胡 类 别 植物 原植物 伞形科植物","indications":"①痰热咳嗽之黄痰黏稠难咯，清热化痰，常配贝母、黄芩；②胸痹心痛，宽胸散结，常配薤白、半夏（瓜蒌薤白半夏汤）；③肠燥便秘，瓜蒌仁润肠通便。","combinations":"瓜蒌配薤白：通阳散结宽胸（瓜蒌薤白半夏汤）；瓜蒌配贝母：清热化痰散结。","differentiation":"瓜蒌vs薤白：见薤白鉴别。瓜蒌甘寒，清热化痰宽胸兼润肠。"},{"name":"昆布","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"清热化痰药","page":645,"properties":"咸，寒。归肝、胃、肾经。","functions":"消痰软坚、利水消肿","functions_full":"昆布消痰又软坚，瘿瘤瘰疬及水肿\n１消痰软坚——瘿瘤、瘰疬，为治瘿瘤要药（配海藻）\n２利水消肿——水肿、脚气浮肿","dosage":"煎服，6-12g。","notes":"脾胃虚寒者忌用。反甘草","indications":"①瘿瘤瘰疬，为治瘿瘤之要药，常配海藻、贝母；②水肿脚气，常配茯苓、大腹皮。","combinations":"昆布配海藻：软坚散结消瘿；昆布配浙贝母：清热化痰散结。","differentiation":"昆布vs海藻：功效相近，均软坚散结消瘿。昆布力较强，二者常相须为用。"},{"name":"海藻","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"清热化痰药","page":648,"properties":"苦、咸，寒。归肝、胃、肾经。","functions":"消痰软坚、利水消肿","functions_full":"海藻消痰散瘿瘤，利水消肿脚气瘳\n１消痰软坚——瘿瘤、瘰疬，为治瘿瘤要药（海藻玉壶汤）\n２利水消肿——水肿、脚气浮肿、小便不利","dosage":"煎服，6-12g。","notes":"反甘草（十八反）。脾胃虚寒者忌用","indications":"①瘿瘤瘰疬，常配昆布、浙贝母；②水肿脚气，常配茯苓、泽泻。","combinations":"海藻配昆布：软坚散结消瘿。","differentiation":"海藻vs昆布：见昆布鉴别。"},{"name":"苦杏仁","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"化痰止咳平喘药","subCategory":"止咳平喘药","page":653,"properties":"苦，微温。有小毒。归肺、大肠经。","functions":"止咳平喘、润肠通便","functions_full":"苦杏仁降气止咳，润肠通便平喘喝\n１止咳平喘——咳嗽气喘，为治咳喘之要药。风寒咳喘（三拗汤）；风热咳喘（桑菊饮）；肺热咳喘（麻杏石甘汤）；燥热咳喘（桑杏汤）\n２润肠通便——肠燥便秘","dosage":"煎服，3-10g，打碎入煎。宜后下。","notes":"有小毒，用量不宜过大。阴虚咳嗽及便溏者忌用","indications":"①咳嗽气喘，为治咳喘之要药，随证配伍可用于多种咳喘，常配麻黄（风寒）或桑叶（风热）；②肠燥便秘，润肠通便，常配火麻仁。","combinations":"苦杏仁配麻黄：宣降肺气、止咳平喘；苦杏仁配火麻仁：润肠通便。","differentiation":"苦杏仁vs紫苏子：均止咳平喘、润肠通便。苦杏仁偏宣降肺气；紫苏子偏降气化痰。"},{"name":"百部","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"止咳平喘药","page":657,"properties":"甘、苦，微温。归肺经。","functions":"润肺止咳、杀虫灭虱","functions_full":"百部润肺止咳嗽，灭虱杀虫治头癣\n１润肺止咳——新久咳嗽、百日咳、肺痨咳嗽，为止咳良药。外感咳嗽（止嗽散）；阴虚劳嗽（配沙参、麦冬等）\n２杀虫灭虱——头虱、体虱、蛲虫病、阴痒","dosage":"煎服，5-10g。外用适量。","notes":"脾虚便溏者慎用","indications":"①各种咳嗽，无论新久寒热皆可，尤善治虚劳久咳，常配紫菀、款冬花；②百日咳痉挛性咳嗽，单用或配贝母；③头虱、阴虱、蛲虫病，外用杀虫灭虱。","combinations":"百部配紫菀、款冬花：润肺止咳，治久咳；百部配沙参：润肺止咳，治阴虚劳嗽。","differentiation":"百部vs紫菀：均润肺止咳。百部杀虫灭虱为其独有；紫菀祛痰力优。"},{"name":"紫菀","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"止咳平喘药","page":660,"properties":"辛、苦，温。归肺经。","functions":"润肺下气、化痰止咳","functions_full":"紫菀润肺又化痰，无论新久咳皆安\n１润肺下气——咳嗽气逆，咯痰不爽\n２化痰止咳——无论新久寒热虚实咳嗽皆可用。外感咳嗽（配荆芥、桔梗）；肺虚久咳（配川贝母、阿胶）","dosage":"煎服，5-10g。外感暴咳生用，久咳蜜炙。","notes":"实热咳嗽不宜单用","indications":"①咳嗽有痰，无论外感内伤、寒热虚实皆可，尤善治肺虚久咳，常配款冬花、百部。","combinations":"紫菀配款冬花：润肺化痰止咳，治各种咳嗽；紫菀配百部：润肺止咳。","differentiation":"紫菀vs款冬花：均润肺止咳化痰。紫菀偏于化痰止咳；款冬花偏于润肺止咳。常相须为用。"},{"name":"款冬花","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"止咳平喘药","page":663,"properties":"辛、微苦，温。归肺经。","functions":"润肺下气、止咳化痰","functions_full":"款冬花润肺下气，咳嗽气喘无论新\n１润肺下气——咳嗽气喘，无论新久寒热虚实皆宜\n２止咳化痰——为温肺止咳良药，温而不燥。暴咳配紫菀、杏仁；久咳劳嗽配川贝母、百合","dosage":"煎服，5-10g。生用或蜜炙。","notes":"肺热盛者慎用","indications":"①各种咳嗽，尤善治寒性咳喘，常配紫菀；②肺痈之咳吐脓痰，常配桔梗、薏苡仁。","combinations":"款冬花配紫菀：润肺止咳化痰；款冬花配麻黄：宣肺散寒止咳。","differentiation":"款冬花vs紫菀：见紫菀鉴别。"},{"name":"龙骨","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"安神药","subCategory":"重镇安神药","page":671,"properties":"甘、涩、平。归心、肝、肾经","functions":"镇惊安神、平肝潜阳、收敛固涩","functions_full":"龙骨镇惊安心神，固涩平肝治眩晕 \n１镇惊安神——重镇安神要药，用治各种神志失常\n心神不宁，心悸失眠（珍珠母丸）\n惊痫抽搐，癫狂发作\n２平肝潜阳——肝阳上亢之眩晕\n正虚滑脱诸证\n３收敛固涩\n湿疮痒疹、疮疡溃后不愈","dosage":"煎服，15-30克，先煎。用适量 龙齿——古代多种大型哺乳动物的牙齿化石 龙骨与龙齿的功效比较","notes":"","indications":"①心神不安之心悸失眠、惊痫癫狂，重镇安神，常配牡蛎、酸枣仁；②肝阳上亢之头晕目眩，常配牡蛎、白芍、代赭石；③自汗盗汗、遗精带下、崩漏，煅用收敛固涩；④疮疡久溃不敛、湿疮，煅后外用收湿敛疮。","combinations":"龙骨配牡蛎：镇惊安神、平肝潜阳、收敛固涩；龙骨配酸枣仁：养心镇惊安神。","differentiation":"龙骨vs牡蛎：见牡蛎鉴别。龙骨安神固涩力强，牡蛎软坚散结力优。"},{"name":"酸枣仁","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"安神药","subCategory":"养心安神药","page":677,"properties":"甘、酸、平。归肝、胆、心经","functions":"养心安神、敛汗","functions_full":"酸枣仁养心益肝，疗血虚不眠多汗 \n１养心安神——心悸失眠\n心肝血虚（配当归、何首乌）\n肝虚有热（酸枣仁汤）\n心脾两虚（归脾汤）\n心肾不足，阴虚阳亢（天王补心丹）\n２敛汗——体虚自汗、盗汗","dosage":"煎服，10-15克 研末，1.5-3克","notes":"","indications":"①心肝血虚之心悸失眠，为养心安神之要药，常配知母、茯苓（酸枣仁汤）；②体虚自汗盗汗，收敛止汗，常配五味子、黄芪。","combinations":"酸枣仁配知母：养心安神、清热除烦（酸枣仁汤）；酸枣仁配五味子：养心安神、收敛止汗。","differentiation":"酸枣仁vs柏子仁：均养心安神。酸枣仁敛汗力强，治虚烦不眠；柏子仁润肠通便，治心阴虚之惊悸失眠。"},{"name":"远志","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"安神药","subCategory":"养心安神药","page":681,"properties":"苦、辛、温。归心、肾、肺经","functions":"宁心安神、心肾不交（安神定志丸）、祛痰开窍、消痈散结","functions_full":"远志宁心又祛痰，健忘癫痫及咳痰 \n１宁心安神——惊悸、失眠、健忘\n心肾不交（安神定志丸）——为交通心肾之佳品\n心血不足（归脾汤）\n２祛痰开窍\n癫痫昏扑，痰迷心窍（定痫丸）\n咳嗽痰多\n３消痈散结——痈疽、疮毒、乳痈等\n可治一切痈疽，不问寒热虚实","dosage":"煎服，5-10克； 外用适量","notes":"阴虚阳亢慎用；痰热慎用；脾胃虚弱慎用 合欢皮（附：合欢花） 类 别 植物 原植物 豆科植物合欢 药 材 树皮","indications":"①心肾不交之心悸失眠、健忘，安神益智，常配人参、石菖蒲（开心散）；②痰阻心窍之癫痫昏仆，常配半夏、石菖蒲；③咳嗽痰多，祛痰止咳。","combinations":"远志配石菖蒲：交通心肾、开窍安神；远志配酸枣仁：养心安神。","differentiation":"远志vs酸枣仁：均安神。远志偏交通心肾、祛痰开窍；酸枣仁偏养心肝之血。"},{"name":"合欢皮","level":3,"levelName":"三级（了解）","levelColor":"#3b82f6","category":"安神药","subCategory":"养心安神药","page":685,"properties":"甘、平。归心、肝、肺经","functions":"安神解郁、活血消肿","functions_full":"１安神解郁——情志不遂，烦躁不眠\n跌打损伤，骨折肿痛\n２活血消肿\n内外痈疽，疖肿疮毒","dosage":"煎服，6-12克 合欢皮与合欢花的功效比较","notes":"","indications":"①情志不遂之忧郁不乐、虚烦不眠，解郁安神，常配酸枣仁、首乌藤；②跌打损伤、骨折瘀肿，活血消肿止痛，常配乳香、没药。","combinations":"合欢皮配酸枣仁：解郁宁心安神；合欢皮配乳香、没药：活血消肿止痛。","differentiation":"合欢皮vs酸枣仁：均安神。合欢皮偏解郁安神，宜于情志不畅；酸枣仁偏养心肝之血。"},{"name":"石决明","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"平肝息风药","subCategory":"平抑肝阳药","page":691,"properties":"咸，寒。归肝经。","functions":"平肝潜阳、清肝明目","functions_full":"石决明清镇平肝，治目疾阳亢晕眩 \n １、平肝潜阳——肝阳上亢，头晕目眩。为凉肝、镇肝之要药。\n  ２、清肝明目——目赤，翳障，视物昏花。","dosage":"煎服，15～30g。应打碎先煎。 平肝、清肝宜生用，外用点眼宜煅用、水飞。","notes":"","indications":"①肝阳上亢之头晕目眩，平肝潜阳力强，常配牡蛎、白芍；②肝火上炎之目赤肿痛、翳膜遮睛，为清肝明目之要药，常配菊花、决明子；③阴虚阳亢之风眩。","combinations":"石决明配牡蛎：平肝潜阳；石决明配菊花：清肝明目。","differentiation":"石决明vs牡蛎：均平肝潜阳。石决明为介贝壳类药物，清肝明目力优；牡蛎兼软坚散结、收敛固涩。"},{"name":"牡蛎","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"平肝息风药","subCategory":"平抑肝阳药","page":695,"properties":"咸、涩，微寒。归肝、肾经。","functions":"平肝潜阳、软坚散结、收敛固涩、制酸止痛","functions_full":"牡蛎镇肝治晕眩，收敛固涩又软坚  \n1、平肝潜阳——用于肝阳上亢，头晕目眩。\n    2、软坚散结——用于痰核，瘰疬，癥瘕积聚等证。\n    3、收敛固涩——用于滑脱诸证。与煅龙骨相须为用。\n    4、制酸止痛——胃痛泛酸（配乌贼骨、浙贝母）","dosage":"煎服，10～30g。宜打碎先煎。 除收敛固涩煅用外，余皆生用。","notes":"","indications":"①肝阳上亢之眩晕头痛，常配龙骨、白芍；②心神不宁之心悸失眠，常配龙骨、远志；③痰核瘰疬、瘿瘤，软坚散结，常配浙贝母、玄参（消瘰丸）；④自汗盗汗、遗精带下，收敛固涩，煅用。","combinations":"牡蛎配龙骨：镇惊安神、平肝潜阳、收敛固涩；牡蛎配浙贝母：化痰软坚散结。","differentiation":"牡蛎vs龙骨：均重镇安神、平肝潜阳、收敛固涩。牡蛎兼软坚散结；龙骨煅后收湿敛疮生肌。"},{"name":"钩藤","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"平肝息风药","subCategory":"息风止痉药","page":701,"properties":"甘，微寒。归肝、心包经。","functions":"息风止痉、清热平肝","functions_full":"钩藤清热息肝风，平肝治晕亦有功 \n１、息风止痉——用于肝风内动，惊痫抽搐。多用于小儿。\n２、清热平肝——肝火上攻或肝阳上亢之头痛、眩晕。\n此外，本品与蝉蜕、薄荷同用，可治疗小儿夜啼，有凉肝止惊之效。","dosage":"煎服，10～15g。 其有效成分钩藤碱加热后易破坏，故不宜久煎，一般不超过20分钟。 天麻 类 别 植物 原 植 物 兰科植物天麻 药 材 块茎","notes":"","indications":"①肝阳上亢之头痛眩晕，常配天麻、石决明；②热盛动风之小儿惊痫、高热抽搐，息风止痉力强，常配羚羊角、蝉蜕；③高血压病之头痛头胀。","combinations":"钩藤配天麻：平肝息风；钩藤配羚羊角：清热息风止痉；钩藤配菊花：清热平肝。","differentiation":"钩藤vs天麻：均平肝息风。钩藤偏清热息风，善治热极生风；天麻偏平肝潜阳，善治肝风内动之眩晕。"},{"name":"天麻","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"平肝息风药","subCategory":"息风止痉药","page":705,"properties":"甘，平。归肝经。","functions":"息风止痉、平抑肝阳、祛风通络","functions_full":"天麻息风诸痉宜，善治眩晕头痛痹。\n1、息风止痉——用于肝风内动，惊痫抽搐。不论寒热虚实\n    2、平抑肝阳——用于眩晕，头痛。为止眩晕之良药。\n    3、祛风通络——用于肢麻痉挛抽搐，风湿痹痛。","dosage":"煎服，3～10g。研末冲服，每次1～1.5g。","notes":"","indications":"①肝风内动之惊痫抽搐，息风止痉，常配钩藤、全蝎；②肝阳上亢之头痛眩晕，为'治眩晕之要药'，常配钩藤、石决明；③风寒湿痹之肢体麻木、手足不遂，常配川芎、牛膝。","combinations":"天麻配钩藤：平肝息风；天麻配川芎：祛风止痛，治偏正头痛；天麻配半夏：化痰息风止眩。","differentiation":"天麻vs钩藤：见钩藤鉴别。天麻性平和，内风可平、外风可祛，兼通络。"},{"name":"地龙","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"平肝息风药","subCategory":"息风止痉药","page":709,"properties":"咸，寒。归肝、脾、膀胱经。","functions":"清热息风、通络、平喘、利尿","functions_full":"地龙息风治热痉，平喘利尿经络通 \n1、清热息风——用于高热惊痫，癫狂。\n    2、通络\n           气虚血滞，半身不遂（补阳还五汤）。\n           痹证。尤热痹。亦用治风寒湿痹。\n    3、平喘——用于肺热哮喘。\n    4、利尿——用于热结膀胱，小便不利或尿闭不通。","dosage":"煎服，5～15g。鲜品10～20g。研末吞服，每次1～2g","notes":"","indications":"①热病之高热狂躁、惊痫抽搐，清热息风，常配钩藤、全蝎；②风寒湿痹之关节拘挛肿痛、半身不遂，通络止痛，常配川芎、当归；③肺热哮喘之咳嗽气喘、喉中哮鸣，清热平喘，常配麻黄、杏仁；④热结膀胱之小便不通。","combinations":"地龙配黄芪：益气活血、通络疗痹（补阳还五汤）；地龙配麻黄：清热宣肺平喘。","differentiation":"地龙vs全蝎：均息风通络。地龙性寒，清热力强，兼平喘利尿；全蝎性平，息风止痉力胜。"},{"name":"全蝎","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"平肝息风药","subCategory":"息风止痉药","page":713,"properties":"辛，平。有毒。归肝经。","functions":"息风止痉、攻毒散结、通络止痛","functions_full":"全蝎蜈蚣治抽痉，散结通络又止痛 \n       1、息风止痉——用于痉挛抽搐。\n2、攻毒散结——用于疮疡肿毒，瘰疬结核。\n       3、通络止痛\n           风湿顽痹（伍川乌、白花蛇、没药等）。\n    顽固性偏正头痛（配蜈蚣、白僵蚕、白附子、川芎等）","dosage":"煎服，2～5g； 研末吞服，每次0.6～1g。 外用适量。","notes":"本品有毒，用量不宜过大。孕妇慎用。","indications":"①肝风内动之惊痫抽搐、角弓反张、口眼歪斜，息风止痉力强，常配蜈蚣、钩藤；②风寒湿痹之筋脉拘挛、关节疼痛，常配威灵仙；③顽固性偏正头痛，常配天麻、川芎；④瘰疬结核、疮疡肿毒。","combinations":"全蝎配蜈蚣：增强息风止痉、通络止痛之力；全蝎配天麻：息风止痉。","differentiation":"全蝎vs蜈蚣：均息风止痉、通络止痛、攻毒散结。全蝎性平，毒性较小；蜈蚣性温，毒性较大，走窜力更强。常相须为用。"},{"name":"蜈蚣","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"平肝息风药","subCategory":"息风止痉药","page":716,"properties":"辛，温。有毒。归肝经。","functions":"息风止痉、攻毒散结、通络止痛","functions_full":"蜈蚣全蝎息风痉，攻毒散结通络痛\n１息风止痉——痉挛抽搐，常与全蝎相须为用（止痉散）。急慢惊风、破伤风、中风面瘫\n２攻毒散结——疮疡肿毒、瘰疬结核、毒蛇咬伤\n３通络止痛——顽固性头痛、风湿顽痹","dosage":"煎服，1-3g。研末吞服，0.6-1g/次。","notes":"有毒，用量不宜过大。孕妇忌用","indications":"①急慢惊风、破伤风之抽搐痉挛，息风止痉力强，常配全蝎、钩藤；②风湿痹痛之筋脉拘挛疼痛，通络止痛；③顽固性头痛，常配全蝎、川芎；④疮疡肿毒、瘰疬痰核。","combinations":"蜈蚣配全蝎：增强息风通络之力；蜈蚣配川芎：活血祛风止痛。","differentiation":"蜈蚣vs全蝎：见全蝎鉴别。蜈蚣通络止痛力强，辛温走窜更猛。"},{"name":"麝香","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"开窍药","subCategory":"","page":723,"properties":"辛，温。归心、脾经。","functions":"开窍醒神、活血通经、止痛、催产","functions_full":"开窍醒神靠麝香，活血通经止痛良 \n１、开窍醒神——用于闭证神昏。\n       ２、活血通经\n                  血瘀经闭，癥瘕，\n                  心腹暴痛\n                  跌打损伤\n                  风寒湿痹等证。\n       3、止痛——用于疮疡肿毒，咽喉肿痛。\n       4、催产——用于难产，死胎，胞衣不下。","dosage":"入丸散，每次0.06～0.1g。外用适量。不宜入煎剂。 冰片 类 别 植物 原 植 物 龙脑香科植物龙脑香的树脂或树干（梅片）， 或为菊科植物艾纳香 (艾片)， 或为松节油、樟脑等原料 (机制冰片) 药 材 化学合成品","notes":"","indications":"①热病神昏、中风昏厥，为醒神回苏之要药，常配冰片、牛黄（安宫牛黄丸）；②经闭、癥瘕、死胎不下，活血通经力峻，常配桃仁、红花；③跌打损伤、心腹暴痛；④疮疡肿毒。","combinations":"麝香配冰片：开窍醒神（安宫牛黄丸）；麝香配桃仁：活血通经、消肿止痛。","differentiation":"麝香vs冰片：均开窍醒神。麝香辛温走窜，开窍力最强；冰片辛苦微寒，偏清热止痛。麝香兼活血通经催产。"},{"name":"冰片","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"开窍药","subCategory":"","page":727,"properties":"辛、苦，微寒。归心、脾、肺经。","functions":"开窍醒神、清热止痛","functions_full":"１、开窍醒神——用于闭证神昏。 \n    ２、清热止痛\n          目赤肿痛，喉痹口疮。\n          疮疡肿痛，溃后不敛。\n      冠心病心绞痛及齿痛","dosage":"入丸散，每次0.03～0.1g。外用适量。不宜入煎剂。","notes":"","indications":"①热病神昏痉厥，常配麝香；②目赤肿痛、喉痹口疮，清热止痛，常配硼砂、朱砂（冰硼散）；③疮疡肿痛、烧烫伤，常配血竭。","combinations":"冰片配麝香：开窍醒神；冰片配硼砂：清热解毒、消肿止痛（冰硼散）。","differentiation":"冰片vs麝香：见麝香鉴别。冰片清热止痛力强。"},{"name":"石菖蒲","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"开窍药","subCategory":"","page":731,"properties":"辛、苦，温。归心、胃经。","functions":"开窍宁神、化湿和胃","functions_full":"菖蒲开窍化湿浊，痰湿闭窍中焦阻\n \n１、开窍宁神——用于痰湿蒙蔽清窍之神志昏迷。\n        ２、化湿和胃——用于湿阻中焦，脘腹胀闷，痞塞疼痛。\n            近年用由石菖蒲提取的α-细辛醚，治疗癫痫和癫痫持续状态\n有效。","dosage":"煎服，5～10g。鲜品加倍。外用适量。 石菖蒲与远志的功效比较","notes":"1、 虚弱证一般病程较长，补虚药宜作蜜丸、煎膏 （膏滋）、片剂、口服液、颗粒剂或酒剂等，以便 保存和服用。 2、 忌“误补益疾”或“闭门留蔻”。 3、 对虚极病人宜渐补而不宜骤补。","indications":"①湿浊蒙蔽清窍之神志昏迷、癫痫，芳香开窍，常配郁金、竹沥；②健忘、耳鸣、不寐，常配远志、人参（开心散）；③湿阻中焦之脘痞腹胀。","combinations":"石菖蒲配郁金：豁痰开窍清心；石菖蒲配远志：交通心肾、开窍安神。","differentiation":"石菖蒲vs远志：均开窍安神。石菖蒲偏芳香化湿开窍；远志偏交通心肾。"},{"name":"人参","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补气药","page":739,"properties":"甘、微苦，微温。归心、肺、脾经","functions":"大补元气、补脾益肺、生津止渴、安神增智","functions_full":"气虚欲脱须人参，补气生津心神安 \n１、大补元气——元气虚脱证。 \n   2. 补脾益肺——脾肺气虚。 \n   3. 生津止渴——津伤口渴、消渴。 \n    津伤口渴（配石膏、知母） \n    内热消渴（配养阴清热药） \n   4. 安神增智——气血不足引起的心神不安、失眠健忘（配养心安神药）\n 还可用治血虚、阳痿及正虚邪盛等证，均取本品气旺生血、气旺阳自\n强及扶正抗邪之功。","dosage":"人参入汤剂，5～10g；用于急重证，剂量酌增为15～30g。 宜文火另煎兑服。 研末吞服，每次1.5～2g。","notes":"","indications":"①气虚欲脱之脉微欲绝、冷汗肢厥，大补元气，为拯危救脱第一要药，单用大量浓煎（独参汤）；②脾气虚之食少乏力、便溏，常配白术、茯苓（四君子汤）；③肺气虚之短气喘促、自汗，常配蛤蚧、核桃肉；④热病气津两伤之口渴脉虚，常配石膏、知母；⑤心神不宁之心悸健忘，常配当归、酸枣仁。","combinations":"人参配附子：益气回阳救逆（参附汤）；人参配白术：健脾益气（四君子汤）；人参配麦冬、五味子：益气养阴生脉（生脉散）。","differentiation":"人参vs党参：均补脾肺气。人参补气力最强，大补元气、复脉固脱，为救脱要药；党参补气力较人参缓和，价格低廉，可代人参用于一般气虚证。"},{"name":"党参","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补气药","page":745,"properties":"甘，平。归脾、肺经。","functions":"补中益气、健脾益肺、养血生津","functions_full":"党参益气又养血，脾肺气虚津伤口\n１补中益气——脾胃虚弱，食少便溏（四君子汤）；中气不足之体倦乏力\n２健脾益肺——肺气亏虚之咳嗽气促\n３养血生津——气血两虚之面色萎黄、头晕心悸；气津两伤之口渴、消渴","dosage":"煎服，10-30g。","notes":"反藜芦（十八反）。气滞、肝火盛者忌用","indications":"①脾胃气虚之食少便溏、四肢倦怠，常配白术、茯苓（四君子汤）；②肺气不足之咳喘气短、声低语怯，常配黄芪、五味子；③气血两虚之面色萎黄、头晕心悸，常配当归、熟地黄；④气津两伤之口渴。","combinations":"党参配白术：健脾益气；党参配黄芪：补气升阳；党参配当归：益气生血。","differentiation":"党参vs人参：见人参鉴别。党参为临床常用的人参替代品。"},{"name":"黄芪","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补气药","page":749,"properties":"甘，微温。归脾、肺经。","functions":"补气升阳、益卫固表、利水消肿、托疮生肌","functions_full":"黄芪补气且升阳，固表利水亦托疮 \n１、补气升阳——用于脾胃气虚及中气下陷诸证。 \n 2. 益卫固表——用于肺气虚及表虚自汗，气虚外感诸证。\n     3. 利水消肿——用于气虚水湿失运的浮肿，小便不利。\n4. 托疮生肌——用于气血不足，疮疡内陷的脓成不溃或溃久不敛。\n此外，还能补气以生血；补气以摄血；补气以行滞；补气生津以止\n渴等","dosage":"煎服，10～15g，大剂量30～60g。 益气补中宜炙用；其他方面多生用。","notes":"凡表实邪盛，内有积滞，阴虚阳亢，疮疡阳证实证等，均不 宜用。","indications":"①脾气虚之食少便溏、中气下陷之脱肛、子宫下垂，补气升阳，常配升麻、柴胡（补中益气汤）；②肺气虚之气短自汗、易感外邪，常配白术、防风（玉屏风散）；③气虚水肿之小便不利，常配防己、白术（防己黄芪汤）；④疮疡内陷之脓成不溃或久溃不敛，托毒生肌，常配当归、川芎；⑤气虚血滞之半身不遂、痹痛，常配当归、地龙（补阳还五汤）；⑥气虚津亏之消渴，常配天花粉、生地黄。","combinations":"黄芪配当归：益气生血（当归补血汤）；黄芪配白术、防风：益气固表（玉屏风散）；黄芪配防己：益气利水消肿。","differentiation":"黄芪vs人参：均补气。黄芪偏升阳固表、利水消肿、托毒生肌，善走肌表；人参偏大补元气、生津安神，善入五脏。黄芪治表虚，人参救内脱。"},{"name":"白术","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补气药","page":755,"properties":"苦、甘，温。归脾、胃经。","functions":"补气健脾、燥湿利水、止汗、安胎","functions_full":"白术补气专健脾，止汗安胎祛湿水  \n1. 补气健脾——脾胃气虚。\n  2. 燥湿利水——脾虚水停，而为痰饮，水肿，小便不利。\n  3. 止汗——用于脾虚气弱，肌表不固而汗多。\n  4. 安胎——用于脾虚气弱，胎动不安。常配砂仁同用。","dosage":"煎服，10～15g。 燥湿利水宜生用，补气健脾宜炒用，健脾止泻宜炒焦用。","notes":"","indications":"①脾气虚之食少便溏、体倦乏力，为健脾益气之要药，常配人参、茯苓（四君子汤）；②脾虚水湿内停之水肿、痰饮，常配茯苓、桂枝（苓桂术甘汤）；③表虚自汗，常配黄芪、防风（玉屏风散）；④脾虚胎动不安，安胎之要药，常配砂仁、黄芩。","combinations":"白术配茯苓：健脾利湿；白术配黄芪：益气固表；白术配黄芩：清热安胎。","differentiation":"白术vs苍术：见苍术鉴别。白术以补脾为主，兼安胎固表；苍术以燥湿为主，兼祛风湿。"},{"name":"山药","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补气药","page":759,"properties":"甘，平。归脾、肺、肾经。","functions":"益气养阴、补脾肺肾，固精止带","functions_full":"山药补气又养阴，固精能治喘带遗 \n   1、益气养阴\n        脾胃虚弱证。\n        阴虚内热之消渴证（配黄芪、生地黄、天花粉等）\n 2、补脾肺肾，固精止带——用于肺肾虚弱证。\n久咳久喘（配人参、麦冬、五味子等） \n遗精、尿频（配熟地黄、山茱萸、菟丝子、金樱子等）\n   带下清稀（配熟地黄、山茱萸、五味子等）","dosage":"煎服，10～30g，大量60～250g。 研末吞服，每次6～10g。 补阴生津宜生用；健脾止泻宜炒用。","notes":"","indications":"①脾气虚之食少便溏、带下，平补脾胃，常配白术、茯苓（参苓白术散）；②肺气虚之咳喘，常配党参、麦冬；③肾气虚之遗精遗尿、消渴，常配熟地黄、山茱萸（六味地黄丸）；④气阴两虚之消渴。","combinations":"山药配白术：健脾益气止泻；山药配熟地黄：补肾固精。","differentiation":"山药vs白术：均健脾。山药平补肺脾肾三脏之气阴；白术专入脾胃，补气燥湿力强。"},{"name":"甘草","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补气药","page":763,"properties":"甘，平。归心、肺、脾、胃经。","functions":"益气补中、祛痰止咳、缓急止痛、调和药性、清热解毒","functions_full":"甘草补气热毒清，止咳缓急调药性 \n1、益气补中\n         心气不足的心动悸，脉结代\n         脾气虚弱的倦怠乏力，食少便溏\n 2、祛痰止咳——痰多咳嗽。\n 3、缓急止痛——脘腹及四肢挛急作痛。\n 4、调和药性——药性峻猛的方剂中。\n5、清热解毒——用于热毒疮疡，咽喉肿痛及药物、食物中毒等。","dosage":"煎服，3～10g。 清热解毒宜生用；补中缓急宜炙用。","notes":"湿盛胀满、浮肿者不宜用。 十八反 久服较大剂量的生甘草，可引起浮肿等。","indications":"①脾胃气虚之食少乏力，常配人参、白术（四君子汤）；②咳嗽气喘，化痰止咳，寒热虚实用之不同；③脘腹及四肢挛急疼痛，缓急止痛，常配白芍（芍药甘草汤）；④热毒疮疡、咽喉肿痛，清热解毒；⑤调和药性，缓解药物毒性。","combinations":"甘草配白芍：缓急止痛（芍药甘草汤）；甘草配桔梗：清利咽喉（桔梗汤）；甘草配麻黄：宣肺止咳平喘。","differentiation":"甘草vs大枣：均补脾益气、调和药性。甘草兼清热解毒、缓急止痛；大枣兼养血安神。甘草留湿，湿盛者忌。"},{"name":"鹿茸","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补阳药","page":771,"properties":"甘、咸，温。归肾、肝经。","functions":"壮肾阳，益精血，强筋骨、调冲任、托疮毒","functions_full":"鹿茸壮阳益血精，调冲托疮强骨筋 \n1. 壮肾阳，益精血，强筋骨——阳痿早泄，宫寒不孕，筋骨萎软。\n             为温肾壮阳，补督脉，益精血，强筋骨的要药。\n  2.调冲任——冲任虚寒，带脉不固的崩漏不止，带下过多。\n3.托疮毒——用治疮疡久溃不敛，脓出清稀，或阴疽内陷不起。","dosage":"研细末，1日3次分服，1～3g。如入丸散，随方配制。","notes":"服用本品宜从小量开始，。 凡阴虚阳亢，血分有热，胃火盛或肺有痰热， 以及外感热病者，均应忌服。","indications":"①肾阳不足之畏寒肢冷、阳痿早泄、宫冷不孕，补肾壮阳力强，常配人参、附子；②精血亏虚之筋骨痿软、小儿五迟五软，常配熟地黄、山茱萸；③冲任不固之崩漏不止，常配阿胶、当归。","combinations":"鹿茸配人参：益气壮阳；鹿茸配熟地黄：补肾填精。","differentiation":"鹿茸vs附子：均温补。鹿茸甘咸温，血肉有情之品，偏补肾填精壮阳；附子辛热燥烈，偏回阳救逆。"},{"name":"菟丝子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阳药","page":775,"properties":"辛、甘，平。归肝、肾、脾经。","functions":"补肾固精、养肝明目、止泻、安胎","functions_full":"菟丝子补肾固精，养肝明目止泻灵\n１补肾固精——肾虚腰痛、阳痿遗精、尿频（五子衍宗丸）；带下、尿有余沥\n２养肝明目——肝肾不足之目暗不明（驻景丸）\n３止泻——脾肾两虚之便溏泄泻\n４安胎——肝肾不足之胎动不安","dosage":"煎服，6-12g。","notes":"阴虚火旺、大便燥结者不宜用","indications":"①肾虚腰痛、阳痿遗精、尿频，常配枸杞子、五味子（五子衍宗丸）；②肝肾不足之目暗不明，常配枸杞子、熟地黄；③脾肾两虚之泄泻，常配白术、补骨脂；④胎动不安，补肾安胎。","combinations":"菟丝子配枸杞子：补肾益精明目；菟丝子配杜仲：补肾强腰安胎。","differentiation":"菟丝子vs沙苑子：均补肾固精。菟丝子平补阴阳，兼安胎、明目；沙苑子偏固精缩尿。"},{"name":"补骨脂","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阳药","page":779,"properties":"辛、苦，温。归脾、肾经。","functions":"补肾壮阳、温脾止泻、纳气平喘","functions_full":"补骨脂温肾壮阳，温脾止泻平喘良\n１补肾壮阳——肾阳不足之阳痿、腰膝冷痛（青娥丸）；遗精滑精、尿频\n２温脾止泻——脾肾阳虚之五更泄泻（四神丸）\n３纳气平喘——肾不纳气之虚寒喘咳","dosage":"煎服，6-10g。","notes":"阴虚火旺及大便秘结者忌用","indications":"①肾阳不足之阳痿、腰膝冷痛，常配菟丝子、杜仲；②脾肾阳虚之久泻、五更泄，为治脾肾阳虚泄泻之要药，常配肉豆蔻（四神丸）；③肾不纳气之虚喘，常配核桃仁。","combinations":"补骨脂配肉豆蔻：温补脾肾、涩肠止泻（四神丸）；补骨脂配核桃仁：补肾纳气平喘。","differentiation":"补骨脂vs益智仁：均暖肾固精缩尿、温脾止泻。补骨脂偏补肾壮阳；益智仁偏温脾摄唾。"},{"name":"巴戟天","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阳药","page":783,"properties":"辛、甘，微温。归肝、肾经。","functions":"补肾助阳、祛风除湿、强筋骨","functions_full":"巴戟天温肾壮阳，祛风除湿强骨筋\n１补肾助阳——肾阳不足之阳痿、遗精、宫冷不孕；肾虚腰痛\n２祛风除湿——风湿痹痛、筋骨痿软\n３强筋骨——肝肾不足之腰膝酸软","dosage":"煎服，3-10g。","notes":"阴虚火旺者不宜用","indications":"①肾阳不足之阳痿、宫冷，常配肉苁蓉、淫羊藿；②肾虚腰痛、筋骨痿软，常配杜仲、牛膝。","combinations":"巴戟天配杜仲：补肾强筋骨；巴戟天配肉苁蓉：补肾壮阳。","differentiation":"巴戟天vs淫羊藿：均补肾壮阳、祛风湿强筋骨。巴戟天性较温和，补肾力强；淫羊藿燥烈，壮阳力优。"},{"name":"续断","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阳药","page":786,"properties":"苦、辛，微温。归肝、肾经。","functions":"补肝肾、强筋骨、续折伤、安胎止血","functions_full":"续断补肝强筋骨，续折安胎止血宜\n１补肝肾——肝肾不足之腰膝酸软、遗精\n２强筋骨——筋骨痿软无力\n３续折伤——跌打损伤、骨折，为伤科要药\n４安胎止血——胎动不安、胎漏下血（寿胎丸）","dosage":"煎服，10-15g。","notes":"风湿热痹者忌用","indications":"①肝肾不足之腰膝酸痛、足软无力，常配杜仲、牛膝；②冲任不固之胎动不安、崩漏，补肝肾而安胎，常配桑寄生、阿胶；③跌打损伤、骨折，接骨续筋，常配骨碎补、没药。","combinations":"续断配桑寄生：补肝肾安胎；续断配杜仲：强腰膝、固冲任；续断配骨碎补：续筋接骨。","differentiation":"续断vs杜仲：均补肝肾强筋骨、安胎。续断兼续筋骨止血，治跌打骨折；杜仲偏温补。"},{"name":"杜仲","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阳药","page":789,"properties":"甘，温。归肝、肾经。","functions":"补肝肾、强筋骨、安胎","functions_full":"杜仲温补肝肾强，腰膝酸痛胎动安\n１补肝肾——肝肾不足之腰膝酸痛、足膝痿软\n２强筋骨——为治肾虚腰痛之要药（右归丸）\n３安胎——肝肾亏虚之胎动不安、胎漏下血。此外，还有降血压作用","dosage":"煎服，6-10g。盐水炒用。","notes":"阴虚火旺者忌用","indications":"①肝肾不足之腰膝酸痛、下肢痿软，为治腰痛之要药，常配续断、牛膝；②肝肾亏虚之胎动不安、胎漏下血，补肝肾安胎，常配续断、桑寄生；③高血压病之头目眩晕（肾虚型）。","combinations":"杜仲配续断：补肝肾强筋骨安胎；杜仲配牛膝：强腰膝。","differentiation":"杜仲vs续断：见续断鉴别。杜仲为树皮，温补力专。"},{"name":"当归","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补血药","page":797,"properties":"甘、辛，温。归肝、心、脾经。","functions":"补血、调经、止痛、活血、润肠","functions_full":"补血活血全当归，调经止痛润肠秘 \n  1.补血——心肝血虚。为补血要药。\n 2.调经——血虚或血虚而兼有瘀滞的月经不调，痛经，经闭等症。\n 3.止痛——跌打损伤，风湿痹阻的疼痛证。\n 4.活血——痈疽疮疡。\n5.润肠\n           血虚肠燥便秘。（配火麻仁、肉苁蓉等）\n    久咳气喘。（配人参、粟壳、甘草等）","dosage":"煎服，5～15g。一般生用，为加强活血则酒炒用。 补血用当归身，活血用当归尾，和血（补血活血）用全当归。","notes":"","indications":"①血虚证之面色萎黄、头晕心悸，为补血之圣药，常配熟地黄、白芍（四物汤）；②月经不调、痛经、经闭，为妇科调经之要药，无论血虚血瘀均可，常配川芎、白芍；③跌打损伤、痹痛麻木，活血止痛，常配乳香、没药；④痈疽疮疡，活血消肿止痛；⑤肠燥便秘，润肠通便。","combinations":"当归配熟地黄、白芍：补血调经（四物汤）；当归配黄芪：益气生血（当归补血汤）；当归配川芎：活血调经止痛。","differentiation":"当归vs熟地黄：均补血调经。当归行走而不守，补血兼活血止痛；熟地黄静守而不走，纯补精血。"},{"name":"熟地黄","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补血药","page":801,"properties":"甘，微温。归肝、肾经。","functions":"补血、滋阴、益精填髓","functions_full":"熟地补血滋阴精，血虚潮热精亏证 \n1.补血\n                  血虚萎黄\n                  眩晕，心悸失眠\n                  月经不调，崩漏\n    2.滋阴——肾阴不足的潮热骨蒸、盗汗、遗精、消渴等。    \n    3.益精填髓——肝肾精血亏虚的腰膝酸软，眩晕耳鸣，须发早白等。","dosage":"煎服，10～30g。","notes":"","indications":"①血虚证之面色萎黄、心悸失眠、月经不调，为补血之要药，常配当归、白芍（四物汤）；②肝肾阴虚之腰膝酸软、骨蒸潮热、盗汗遗精，为滋肾填精之要药，常配山茱萸、山药（六味地黄丸）；③精血亏虚之须发早白、小儿发育迟缓。","combinations":"熟地黄配当归：补血调经（四物汤）；熟地黄配山茱萸：滋肾填精（六味地黄丸）。","differentiation":"熟地黄vs生地黄：见生地黄鉴别。熟地黄滋腻，有碍脾胃，脾虚痰湿盛者忌用。"},{"name":"白芍","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补血药","page":805,"properties":"苦、酸、甘，微寒。归肝、脾经。","functions":"养血调经、平肝止痛、敛阴止汗","functions_full":"白芍补血善柔肝，调经止痛敛虚汗\n1.养血调经——血虚或阴虚有热的月经不调，崩漏等证。\n2.平肝止痛——肝阴不足，肝气不舒或肝阳偏亢的头痛、眩晕、胁肋\n疼痛、脘腹四肢拘挛作痛等证。\n    3.敛阴止汗——阴虚盗汗及营卫不和的表虚自汗证。","dosage":"煎服，10～15g；大量15～30g。 平肝、敛阴多生用；养血调经多炒用或酒炒用。","notes":"","indications":"①血虚之月经不调、崩漏，常配当归、熟地黄（四物汤）；②肝血不足、肝阳上亢之头痛眩晕，常配石决明、生地黄；③肝气不舒之胸胁脘腹疼痛、四肢拘挛疼痛，柔肝止痛，常配甘草（芍药甘草汤）；④自汗盗汗，收涩止汗。","combinations":"白芍配当归：养血调经；白芍配甘草：缓急止痛（芍药甘草汤）；白芍配柴胡：疏肝柔肝。","differentiation":"白芍vs赤芍：见赤芍鉴别。白芍补肝血、柔肝止痛，敛阴止汗；赤芍泻肝火、凉血散瘀。"},{"name":"阿胶","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补血药","page":809,"properties":"甘，平。归肺、肝、肾经。","functions":"补血、止血、滋阴润燥","functions_full":"阿胶补血止血好，滋阴润燥阴伤疗 \n1.补血——用于血虚萎黄，眩晕，心悸等（配熟地黄、当归、黄芪等）\n    2.止血——用于多种出血证。止血作用良好。\n               尤适于出血而兼见阴虚、血虚证者，\n 3.滋阴润燥——用于阴虚证及燥证。","dosage":"入汤剂，5～15g，烊化兑服； 止血常用阿胶珠，可以同煎。","notes":"","indications":"①血虚证之面目虚浮、心悸失眠、眩晕，为补血佳品，常配熟地黄、当归；②虚劳咳血、吐血、衄血、便血、崩漏，为止血要药，常配生地黄、艾叶（胶艾汤）；③阴虚燥咳或肺痨咳嗽，常配马兜铃、牛蒡子。","combinations":"阿胶配艾叶：补血止血安胎（胶艾汤）；阿胶配黄连：滋阴降火安神（黄连阿胶汤）。","differentiation":"阿胶vs熟地黄：均补血。阿胶为血肉有情之品，兼止血、滋阴润燥；熟地黄滋肾填精。"},{"name":"何首乌","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补血药","page":813,"properties":"制首乌甘、涩，微温；归肝、肾经。 生首乌甘、苦，平；归心、肝、大肠经。","functions":"制首乌补益精血，固肾乌须、生首乌截疟解毒，润肠通便","functions_full":"制首乌补精固肾，生首乌截疟润肠 \n      制首乌补益精血，固肾乌须——血虚；肝肾精血亏虚\n    生首乌截疟解毒，润肠通便——体虚久疟，肠燥便秘及痈疽、瘰\n疬等证。","dosage":"煎服，10～30g。","notes":"","indications":"①精血亏虚之须发早白、腰膝酸软、头晕眼花，制用补肝肾、益精血，常配熟地黄、枸杞子（七宝美髯丹）；②体虚久疟，常配人参、当归；③肠燥便秘、瘰疬、疮疡，生用润肠通便、解毒消痈；④高脂血症。","combinations":"何首乌配熟地黄、枸杞子：补肝肾、益精血、乌须发（七宝美髯丹）；何首乌配当归：补血润肠。","differentiation":"何首乌vs熟地黄：均补精血。何首乌制用补而不滞，兼乌须发；熟地滋腻。首乌生用通便解毒。"},{"name":"麦冬","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"补虚药","subCategory":"补阴药","page":821,"properties":"甘、微苦，微寒。归心、肺、胃经。","functions":"．养阴润肺、益胃生津、清心除烦","functions_full":"麦冬养阴润肺胃，清心除烦虚实为 \n1．养阴润肺——肺阴不足，而有燥热的干咳痰粘、劳热咳嗽等。\n2. 益胃生津——胃阴虚或热伤胃阴，口渴咽干，大便燥结等。\n  3. 清心除烦——心阴虚及温病热邪扰及心营，心烦不眠，舌绛而干\n等。","dosage":"煎服，10～15g。 麦冬与天冬的功效比较","notes":"","indications":"①胃阴虚之口干咽燥、消渴、便秘，为养胃阴之要药，常配沙参、玉竹（益胃汤）；②肺阴虚之燥咳痰少，常配川贝母、沙参；③心阴虚之心烦不眠、心悸健忘，常配生地黄、酸枣仁（天王补心丹）。","combinations":"麦冬配沙参：养阴润肺止咳；麦冬配生地黄：养阴清热增液（增液汤）；麦冬配酸枣仁：滋阴养心安神。","differentiation":"麦冬vs天冬：均养阴润肺。麦冬偏养胃阴、清心除烦；天冬偏滋肾阴、润肺燥。"},{"name":"石斛","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阴药","page":825,"properties":"甘，微寒。归胃、肾经。","functions":"益胃生津、滋阴清热","functions_full":"石斛养胃又生津，热病口渴虚热清\n１益胃生津——胃阴不足之口干烦渴、食少干呕（配麦冬、沙参等）；热病伤津之低热烦渴\n２滋阴清热——阴虚发热、骨蒸劳热；肾阴亏虚之目暗不明（石斛夜光丸）","dosage":"煎服，6-12g。鲜品15-30g。","notes":"湿热未化燥及脾胃虚寒者忌用","indications":"①胃阴虚之口干烦渴、食少干呕，养胃生津，常配麦冬、生地黄；②阴虚发热之病后虚热，常配知母、青蒿；③肝肾阴虚之目暗不明，常配枸杞子、菊花。","combinations":"石斛配麦冬：养阴生津；石斛配枸杞子：补肾明目。","differentiation":"石斛vs玉竹：均养阴生津。石斛偏养胃肾之阴，兼明目；玉竹偏养肺胃之阴。"},{"name":"玉竹","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阴药","page":829,"properties":"甘，微寒。归肺、胃经。","functions":"养阴润燥、生津止渴","functions_full":"玉竹养阴又润燥，肺胃阴虚燥热疗\n１养阴润燥——肺阴不足之燥热咳嗽、咽干痰黏；阴虚外感（加减葳蕤汤）\n２生津止渴——胃阴不足之口干口渴、消渴（配沙参、麦冬等）","dosage":"煎服，6-12g。","notes":"痰湿气滞者忌用","indications":"①肺胃阴虚之燥咳、口干咽燥，常配沙参、麦冬；②阴虚外感之身热微恶寒、口渴，养阴而不恋邪，常配白薇、薄荷（加减葳蕤汤）。","combinations":"玉竹配沙参：养阴润肺止咳；玉竹配白薇：养阴清热。","differentiation":"玉竹vs石斛：见石斛鉴别。玉竹养阴而不恋邪，宜于阴虚外感。"},{"name":"枸杞子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阴药","page":833,"properties":"甘，平。归肝、肾经","functions":"补肝肾，明目。 肾虚遗精(配熟地黄、沙苑子、菟丝子等) 肝肾阴虚，视力模糊(杞菊地黄丸) 消渴(配生地、麦冬、天花粉等)","functions_full":"补肝肾，明目。\n    肾虚遗精(配熟地黄、沙苑子、菟丝子等)\n    肝肾阴虚，视力模糊(杞菊地黄丸)\n    消渴(配生地、麦冬、天花粉等)","dosage":"煎服，10～15g 枸杞与地骨皮的功效比较","notes":"","indications":"①肝肾阴虚之目暗不明、视物昏花，为明目之要药，常配菊花、地黄（杞菊地黄丸）；②精血不足之腰膝酸软、须发早白，常配熟地黄、山药；③虚劳咳嗽、消渴，常配麦冬、知母。","combinations":"枸杞子配菊花：滋肾养肝明目（杞菊地黄丸）；枸杞子配熟地黄：补精血。","differentiation":"枸杞子vs菟丝子：均补肝肾、明目。枸杞子偏滋阴养血；菟丝子偏温补肾阳。"},{"name":"龟甲","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阴药","page":837,"properties":"甘、咸，寒。归肝、肾、心经","functions":"滋阴潜阳、益肾健骨、固经止血，养血补心","functions_full":"龟板滋阴制阳亢，健骨止血养心良 \n   1.滋阴潜阳\n               阴虚内热\n               阴虚阳亢\n               阴虚风动 \n2.益肾健骨——肾虚骨痿，小儿囟门不合等证\n   3.固经止血，养血补心——崩漏、月经过多（固经丸）","dosage":"入汤剂，15～30g；宜先煎。 鳖甲 鳖甲滋阴制阳亢，软坚散结癥积康 龟版与鳖甲的功效比较","notes":"凡属外感实邪未解或泻痢、咳嗽初起时不宜早用，以免留 邪。","indications":"①阴虚阳亢之头晕目眩，常配鳖甲、生地黄；②阴虚发热之骨蒸潮热，常配知母、黄柏；③肾虚骨痿之腰膝痿软、小儿囟门不合，常配鹿角、熟地黄；④阴虚血热之崩漏经多，常配地黄、白芍；⑤心虚惊悸失眠，常配龙骨、远志。","combinations":"龟甲配鳖甲：滋阴潜阳熄风；龟甲配熟地黄：滋阴补肾、强筋壮骨；龟甲配鹿角：阴阳双补。","differentiation":"龟甲vs鳖甲：见鳖甲鉴别。龟甲偏滋阴补肾强筋骨，鳖甲偏滋阴清热软坚。"},{"name":"鳖甲","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"补虚药","subCategory":"补阴药","page":841,"properties":"咸，寒。归肝、肾经。","functions":"滋阴潜阳、软坚散结、退虚热","functions_full":"鳖甲滋阴制阳亢，软坚散结癥积康\n１滋阴潜阳——阴虚阳亢之头晕目眩；阴虚风动之手足蠕动\n２退虚热——阴虚发热、骨蒸劳热（青蒿鳖甲汤）\n３软坚散结——癥瘕积聚、肝脾肿大（鳖甲煎丸）","dosage":"煎服，15-30g，先煎。滋阴潜阳生用，软坚散结醋炙。","notes":"脾胃虚寒、食少便溏及孕妇忌用","indications":"①阴虚发热之骨蒸潮热、夜热早凉，为滋阴清热之要药，常配青蒿、知母（青蒿鳖甲汤）；②阴虚阳亢之头痛眩晕，常配牡蛎、生地黄；③癥瘕积聚、久疟疟母，软坚散结，常配丹参、莪术。","combinations":"鳖甲配青蒿：滋阴透热（青蒿鳖甲汤）；鳖甲配丹参：活血散结消癥。","differentiation":"鳖甲vs龟甲：均滋阴潜阳。鳖甲偏滋阴清热、软坚散结；龟甲偏滋阴补肾、强筋壮骨。"},{"name":"乌梅","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"收涩药","subCategory":"涩肠止泻药","page":849,"properties":"酸，平。入肝、脾、肺、大肠经。","functions":"敛肺、涩肠、生津、安蛔","functions_full":"乌梅涩肠又敛肺，生津止痛又安蛔\n \n     1.敛肺——久咳不止。（罂粟壳、半夏、杏仁等）\n     2.涩肠——久泻久痢（肉豆蔻、诃子、苍朮、茯苓等）\n     3.生津——虚热口渴（天花粉、葛根、麦冬、人参、黄芪）。\n     4.安蛔——蛔厥腹痛（黄连、黄柏、干姜、细辛、花椒、附子等）\n  本品外用，又可用于牙关紧闭，以乌梅肉擦之； 用于外疡弩肉，以\n乌梅炭研末外敷。","dosage":"","notes":"","indications":"①肺虚久咳，敛肺止咳，常配罂粟壳、半夏；②久泻久痢，涩肠止泻，常配诃子、肉豆蔻；③蛔厥腹痛，安蛔止痛，常配黄连、蜀椒（乌梅丸）；④虚热消渴，常配天花粉、葛根；⑤崩漏便血。","combinations":"乌梅配黄连：安蛔止痛（乌梅丸）；乌梅配诃子：涩肠止泻；乌梅配五味子：敛肺止咳、生津止渴。","differentiation":"乌梅vs五味子：均敛肺止咳、涩肠止泻。乌梅兼安蛔；五味子兼补肾固精。"},{"name":"五味子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"收涩药","subCategory":"涩肠止泻药","page":853,"properties":"酸，温。入肺、肾经。","functions":"敛肺滋肾、生津敛汗、涩精止泻","functions_full":"五味敛肺补肾心，虚喘久泻遗滑精 \n        1.敛肺滋肾——用于久嗽虚喘。 （配党参、麦冬、熟地、山萸肉）\n       2.生津敛汗 \n                    津少口渴（配麦冬、生地、天花粉等）\n                   体虚多汗（配党参、麦冬、浮小麦、牡蛎等）\n        3.涩精止泻\n                    精滑不固，小便频数（桑螵蛸、菟丝子）\n                    久泻不止（补骨脂、肉豆蔻）","dosage":"","notes":"","indications":"①久咳虚喘，为敛肺止咳之要药，常配罂粟壳、人参；②自汗盗汗，常配黄芪、牡蛎；③久泻不止（五味子散）；④遗精滑精、遗尿，补肾涩精，常配桑螵蛸、金樱子；⑤津伤口渴、消渴，常配麦冬、天花粉；⑥心悸不寐，宁心安神，常配酸枣仁、远志。","combinations":"五味子配酸枣仁：养心安神；五味子配麦冬：益气养阴生脉（生脉散）；五味子配罂粟壳：敛肺止咳。","differentiation":"五味子vs乌梅：见乌梅鉴别。五味子兼补肾固精、宁心安神，为补涩兼施之品。"},{"name":"山茱萸","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"收涩药","subCategory":"固精缩尿止带药","page":859,"properties":"酸、涩，微温。入肝、肾经。","functions":"补益肝肾、涩精、敛汗、固经止血","functions_full":"山茱萸补益肾肝，止崩漏固精敛汗 \n 1.补益肝肾\n        肝肾不足，头晕目眩，耳鸣，腰酸等症。（熟地、山药）\n                               \n2.涩精\n       遗精，遗尿，小便频数（熟地、菟丝子、沙苑蒺藜、补骨脂）\n3、敛汗\n        虚汗不止（龙骨、牡蛎）    \n4、固经止血\n      妇女体虚、月经过多等（熟地、当归、白芍）","dosage":"","notes":"","indications":"①肝肾亏虚之腰膝酸软、头晕耳鸣、阳痿遗精，为平补肝肾之要药，常配熟地黄、山药（六味地黄丸）；②大汗虚脱、脉微欲绝，敛汗固脱，常配人参、附子；③月经过多、崩漏不止，固经止血，常配地黄、白芍。","combinations":"山茱萸配熟地黄：滋肾填精（六味地黄丸）；山茱萸配人参：益气固脱救逆；山茱萸配白芍：养血固冲。","differentiation":"山茱萸vs熟地黄：均补肝肾。山茱萸温涩，补中有收敛之性，兼敛汗固脱；熟地黄甘温滋腻，纯补而无收涩。"},{"name":"胡荽","category":"解表药","level":"3","page":"","properties":"辛，温。归肺、胃经。","functions":"发表透疹，开胃消食。","functions_full":"胡荽辛温发散，芳香走窜，能发表散寒、透发麻疹，为麻疹初期透发不畅之常用药。又能入脾胃，行气开胃消食，用于食欲不振、食积不化。外用煎汤熏洗可助麻疹透发。","dosage":"3~6g，煎服。外用适量。","notes":"热毒壅盛而疹出不透者忌服。气虚多汗者不宜久服。","indications":"主治麻疹初起、透发不畅；风寒表证轻证；食积不化、食欲不振。","combinations":"配升麻、葛根增强透疹之力；配山楂、神曲消食开胃。","differentiation":"胡荽透疹力较强而发表力较弱，与荆芥、防风之解表散寒力强有所不同；其消食开胃作用类似莱菔子，但药力和缓。"},{"name":"西河柳","category":"解表药","level":"3","page":"","properties":"辛、甘，平。归肺、胃、心经。","functions":"发表透疹，祛风除湿。","functions_full":"西河柳辛散甘缓，性平不偏，善发表透疹，为透发麻疹之常用药，麻疹初起或疹出不畅均可应用。又能祛风除湿，用于风湿痹痛。外用煎汤洗浴可助透疹止痒。","dosage":"3~6g，煎服。外用适量，煎汤洗浴。","notes":"麻疹已透者不宜使用。用量过大可致心烦呕吐。","indications":"主治麻疹初起、透发不畅；风疹瘙痒；风湿痹痛。","combinations":"配胡荽、升麻增强透疹之力；配荆芥、蝉蜕祛风止痒。","differentiation":"西河柳与胡荽均为透疹专药，但西河柳性平兼祛风湿，胡荽偏温兼开胃消食；西河柳外用洗浴效果更佳。"},{"name":"浮萍","category":"解表药","level":"3","page":"","properties":"辛，寒。归肺、膀胱经。","functions":"发汗解表，透疹止痒，利水消肿。","functions_full":"浮萍轻浮升散，辛寒清热，能发汗解表、疏散风热，用于风热表证。又能透疹止痒，用于麻疹不透及风疹瘙痒。尚可上开肺气而通调水道、下输膀胱而利水消肿，用于水肿小便不利。","dosage":"3~9g，煎服。外用适量，煎汤浸洗。","notes":"体虚多汗者慎用。","indications":"主治风热表证发热无汗；麻疹不透、风疹瘙痒；水肿小便不利兼表证者。","combinations":"配薄荷、蝉蜕疏散风热透疹；配泽泻、茯苓利水消肿。","differentiation":"浮萍与麻黄均能发汗利水，但麻黄辛温、浮萍辛寒，一治风寒、一治风热；浮萍利水不如麻黄峻烈而兼透疹之功。"},{"name":"木贼","category":"解表药","level":"3","page":"","properties":"甘、苦，平。归肺、肝经。","functions":"疏散风热，明目退翳。","functions_full":"木贼甘苦平和，轻扬升散，能疏散风热，用于风热目赤、翳膜遮睛。其明目退翳之功较为突出，为眼科常用药。兼能疏风散热，用于风热表证之目赤肿痛。","dosage":"3~9g，煎服。","notes":"目疾非风热所致者慎用。久服可能伤肝。","indications":"主治风热目赤肿痛、翳膜遮睛；风热表证而兼目赤者。","combinations":"配菊花、决明子增强明目退翳之力；配谷精草、密蒙花共治目疾。","differentiation":"木贼与谷精草均能疏散风热、明目退翳，但木贼偏于退翳，谷精草偏于疏散；木贼为草本，体轻升散，谷精草走肝经而上达头目。"},{"name":"谷精草","category":"解表药","level":"3","page":"","properties":"辛、甘，平。归肝、肺经。","functions":"疏散风热，明目退翳。","functions_full":"谷精草轻浮升散，辛甘平和，善疏散头面风热，明目退翳，为眼科常用药。用于风热上扰之目赤肿痛、羞明多泪、目生翳膜。又能疏散风热，用于风热头痛、齿痛。","dosage":"5~10g，煎服。","notes":"阴虚血亏目疾者慎用。","indications":"主治风热目赤肿痛、羞明多泪、翳膜遮睛；风热头痛、齿痛、喉痹。","combinations":"配菊花、决明子清肝明目；配荆芥、防风疏散风热。","differentiation":"谷精草与木贼均为眼科常用疏散风热药，谷精草偏于疏散风热，木贼偏于退翳明目；谷精草走肺肝二经，木贼主入肺肝。"},{"name":"寒水石","category":"清热药","level":"3","page":"","properties":"辛、咸，大寒。归心、胃、肾经。","functions":"清热泻火，利窍消肿。","functions_full":"寒水石大寒清热，辛咸走散，能清热泻火，用于温热病气分热盛、壮热烦渴。又能利窍消肿，用于水肿、小便不利。外用可清热敛疮，用于烧烫伤、湿疹。","dosage":"9~30g，煎服。外用适量，研末撒或调敷。","notes":"脾胃虚寒者忌服。","indications":"主治温热病气分热盛之壮热烦渴；水肿、小便不利；外用治烧烫伤、湿疹。","combinations":"配石膏增强清热泻火之力；配滑石利水通淋。","differentiation":"寒水石与石膏均为大寒清热泻火药，但寒水石兼能利窍消肿，石膏则清热力更强且为气分热盛主药；寒水石偏入肾经，石膏主入肺胃。"},{"name":"鸭跖草","category":"清热药","level":"3","page":"","properties":"甘、淡，寒。归肺、胃、小肠经。","functions":"清热泻火，解毒利水。","functions_full":"鸭跖草甘淡渗利，寒能清热，善清热泻火解毒，用于风热感冒、咽喉肿痛、温病发热。又能利水消肿，用于水肿、热淋涩痛。外用鲜品捣敷可解蛇虫咬伤肿毒。","dosage":"15~30g（鲜品60~90g），煎服。外用适量，鲜品捣敷。","notes":"脾胃虚寒者慎用。","indications":"主治风热感冒、咽喉肿痛；温病发热；热淋涩痛、水肿；毒蛇咬伤。","combinations":"配金银花、连翘清热解毒；配车前草、滑石利水通淋。","differentiation":"鸭跖草与淡竹叶均能清热利尿，鸭跖草清热解毒力较强且可外用治蛇伤，淡竹叶以清心除烦见长。"},{"name":"密蒙花","category":"清热药","level":"3","page":"","properties":"甘，微寒。归肝经。","functions":"清热泻火，养肝明目退翳。","functions_full":"密蒙花甘寒清润，专入肝经，既能清热泻火，又能养肝明目，为眼科专药。用于肝火上炎之目赤肿痛、羞明多泪、目生翳膜，以及肝虚有热之目暗干涩、视物昏花。","dosage":"3~9g，煎服。","notes":"本品性微寒，脾胃虚寒者慎用。","indications":"主治肝火上炎之目赤肿痛、羞明多泪、翳膜遮睛；肝虚有热之目暗干涩、视物昏花。","combinations":"配菊花、决明子清肝明目；配枸杞子、菟丝子养肝明目。","differentiation":"密蒙花与谷精草均为眼科明目退翳药，密蒙花兼能养肝，宜于肝虚有热之目疾；谷精草偏于疏散风热，宜于风热上扰之目疾。"},{"name":"青葙子","category":"清热药","level":"3","page":"","properties":"苦，微寒。归肝经。","functions":"清热泻火，明目退翳。","functions_full":"青葙子苦寒清降，专入肝经，善清肝泻火、明目退翳，为清肝明目之良药。用于肝火上炎之目赤肿痛、翳膜遮睛、视物昏暗。又能清肝降压，用于肝火上亢之高血压病。","dosage":"9~15g，煎服。","notes":"本品有扩散瞳孔作用，青光眼患者忌用。肝肾阴虚目疾者慎用。","indications":"主治肝火上炎之目赤肿痛、翳膜遮睛；肝火上亢之头痛眩晕、高血压病。","combinations":"配决明子、菊花清肝明目；配夏枯草、钩藤清肝降压。","differentiation":"青葙子与决明子均能清肝明目，青葙子以退翳为长且有扩瞳作用，决明子兼能润肠通便；青葙子苦寒泻火力较强。"},{"name":"秦皮","category":"清热药","level":"2","page":"","properties":"苦、涩，寒。归肝、胆、大肠经。","functions":"清热燥湿，收涩止痢，止带，明目。","functions_full":"秦皮苦寒清热燥湿，涩能收敛，善清大肠湿热而止痢止带，为治湿热痢疾、湿热带下之良药。又能清肝泻火而明目退翳，用于肝火上炎之目赤肿痛、翳膜遮睛。","dosage":"6~12g，煎服。外用适量，煎水洗眼。","notes":"脾胃虚寒者慎用。","indications":"主治湿热痢疾、泄泻；湿热带下；肝火上炎之目赤肿痛、翳膜遮睛。","combinations":"配白头翁、黄连清热燥湿止痢（白头翁汤）；配黄柏清热燥湿止带。","differentiation":"秦皮与白头翁均能清热止痢，但白头翁凉血解毒力强宜于热毒血痢，秦皮收涩兼明目；秦皮与黄连均能清热燥湿，秦皮兼涩止带，黄连泻火力更强。"},{"name":"白鲜皮","category":"清热药","level":"2","page":"","properties":"苦，寒。归脾、胃、膀胱经。","functions":"清热燥湿，祛风解毒。","functions_full":"白鲜皮苦寒清热燥湿，又能祛风止痒解毒，为皮肤病常用药。善清脾胃湿热而祛风止痒，用于湿热疮毒、湿疹疥癣、皮肤瘙痒、风疹。又能清热燥湿退黄，用于湿热黄疸。","dosage":"5~10g，煎服。外用适量，煎汤洗或研粉敷。","notes":"虚寒证者忌服。","indications":"主治湿热疮毒、湿疹、风疹、疥癣瘙痒；湿热黄疸；风湿热痹。","combinations":"配苦参、地肤子清热燥湿止痒；配茵陈、栀子清热利湿退黄。","differentiation":"白鲜皮与苦参均为皮肤科清热燥湿止痒要药，但苦参兼能杀虫利尿，白鲜皮兼能祛风通痹；白鲜皮以祛风止痒见长，苦参以清热燥湿杀虫为胜。"},{"name":"穿心莲","category":"清热药","level":"2","page":"","properties":"苦，寒。归心、肺、大肠、膀胱经。","functions":"清热解毒，燥湿消肿。","functions_full":"穿心莲苦寒降泄，清热解毒力强，兼能燥湿消肿。用于外感风热、温病初起之发热、咽喉肿痛；肺热咳嗽、肺痈吐脓；湿热泻痢、热淋涩痛；痈肿疮毒、蛇虫咬伤。为清热解毒常用药。","dosage":"6~9g，煎服。外用适量，研末调敷。","notes":"本品苦寒易伤胃，脾胃虚寒者不宜久服。","indications":"主治外感风热、咽喉肿痛；肺热咳嗽、肺痈；湿热泻痢、热淋；痈肿疮毒。","combinations":"配金银花、连翘清热解毒利咽；配鱼腥草清热解毒消痈。","differentiation":"穿心莲与蒲公英均为清热解毒要药，穿心莲兼燥湿止痢宜于湿热泻痢，蒲公英兼消痈散结宜于乳痈。"},{"name":"青黛","category":"清热药","level":"3","page":"","properties":"咸，寒。归肝、肺经。","functions":"清热解毒，凉血消斑，泻肝定惊。","functions_full":"青黛咸寒清热，善清热解毒、凉血消斑，用于温毒发斑、血热吐衄。又能清肝泻火而定惊，用于肝热惊痫、热极生风之抽搐。外用于痄腮、喉痹、疮肿。","dosage":"1~3g，宜入丸散用。外用适量，干撒或调敷。","notes":"胃寒者慎用。不入汤剂，因不溶于水。","indications":"主治温毒发斑、血热吐衄；肝热惊痫、抽搐；痄腮肿痛、喉痹；外用治湿疹、口疮。","combinations":"配板蓝根、大青叶清热解毒消斑；配天麻、钩藤清热定惊。","differentiation":"青黛与大青叶、板蓝根同出一源，青黛为加工提炼品，清热凉血解毒力更强且能定惊；大青叶偏于凉血消斑，板蓝根偏于利咽散结。"},{"name":"重楼","category":"清热药","level":"3","page":"","properties":"苦，微寒，有小毒。归肝经。","functions":"清热解毒，消肿止痛，凉肝定惊。","functions_full":"重楼苦寒清热解毒，善消肿止痛，为治疮痈肿毒、毒蛇咬伤之要药。又能凉肝定惊，用于小儿惊风抽搐、热病神昏。尚可用于跌打损伤、外伤出血。","dosage":"3~9g，煎服。外用适量，研末调敷。","notes":"有小毒，用量不宜过大。孕妇忌服。体虚无热者慎用。","indications":"主治痈肿疮毒、毒蛇咬伤；咽喉肿痛；热病神昏、小儿惊风抽搐；跌打损伤。","combinations":"配金银花、连翘清热解毒消痈；配牛黄、冰片清热定惊止痛（如云南白药）。","differentiation":"重楼与拳参均能清热解毒消肿，重楼兼凉肝定惊而以解毒消肿为长，拳参兼凉血止痢利湿。"},{"name":"拳参","category":"清热药","level":"3","page":"","properties":"苦、涩，微寒。归肺、肝、大肠经。","functions":"清热解毒，消肿散结，凉血止痢。","functions_full":"拳参苦寒清热解毒，涩能收敛，善消肿散结，用于痈肿瘰疬、咽喉肿痛。又能凉血止痢，用于热毒血痢、湿热痢疾。兼能凉血止血，用于血热吐衄、崩漏。","dosage":"4.5~9g，煎服。外用适量，研末调敷。","notes":"无实火热毒者不宜使用。","indications":"主治痈肿疮毒、瘰疬；咽喉肿痛；热毒血痢；血热出血。","combinations":"配金银花、连翘清热解毒散结；配黄连、白头翁清热止痢。","differentiation":"拳参与重楼均为清热解毒散结之品，拳参兼凉血止痢收涩，重楼兼凉肝定惊消肿止痛力更强。"},{"name":"漏芦","category":"清热药","level":"3","page":"","properties":"苦，寒。归胃经。","functions":"清热解毒，消痈散结，通经下乳。","functions_full":"漏芦苦寒清热解毒，善消痈散结，为治乳痈之良药。又能通经下乳，用于产后乳汁不下、乳络壅滞。尚可舒筋通脉，用于湿痹拘挛。","dosage":"5~9g，煎服。","notes":"孕妇慎用。气虚疮疡脓清者不宜。","indications":"主治乳痈肿痛；瘰疬疮毒；产后乳汁不下；湿痹拘挛。","combinations":"配蒲公英、瓜蒌消痈散结通乳；配王不留行、穿山甲通经下乳。","differentiation":"漏芦与蒲公英均为乳痈要药，漏芦兼能通经下乳舒筋，蒲公英兼治肠痈肺痈；漏芦通乳作用类似王不留行，但清热消痈力更强。"},{"name":"金荞麦","category":"清热药","level":"3","page":"","properties":"微辛、涩，凉。归肺经。","functions":"清热解毒，排脓祛瘀。","functions_full":"金荞麦辛凉清热解毒，善排脓祛瘀，为治肺痈吐脓之要药。用于肺痈咳吐脓痰腥臭、肺热咳嗽。又能清热利咽，用于咽喉肿痛。兼能健胃消食，用于食积腹胀。","dosage":"15~45g，煎服。","notes":"脾胃虚寒者慎用。","indications":"主治肺痈吐脓、肺热咳嗽；咽喉肿痛；食积腹胀。","combinations":"配鱼腥草、桔梗清热排脓消痈；配射干、山豆根利咽消肿。","differentiation":"金荞麦与鱼腥草均为治肺痈要药，金荞麦排脓祛瘀力强，鱼腥草清肺化痰力胜。"},{"name":"大血藤","category":"清热药","level":"3","page":"","properties":"苦，平。归大肠、肝经。","functions":"清热解毒，活血止痛。","functions_full":"大血藤苦平解毒，善活血止痛，为治肠痈之要药。用于肠痈腹痛、热毒疮疡。又能活血通经、祛风除湿，用于经闭痛经、跌打损伤、风湿痹痛。","dosage":"9~15g，煎服。","notes":"孕妇慎用。","indications":"主治肠痈腹痛（阑尾炎）；热毒疮疡；经闭痛经、跌打损伤；风湿痹痛。","combinations":"配败酱草、大黄清热消痈通腑（治肠痈）；配当归、川芎活血调经。","differentiation":"大血藤与败酱草均为肠痈要药，大血藤活血止痛力胜，败酱草清热排脓力强。"},{"name":"败酱草","category":"清热药","level":"3","page":"","properties":"辛、苦，微寒。归胃、大肠、肝经。","functions":"清热解毒，消痈排脓，祛瘀止痛。","functions_full":"败酱草辛苦微寒，善清热解毒消痈排脓，为治肠痈之要药。用于肠痈腹痛、肺痈吐脓、痈肿疮毒。又能祛瘀止痛，用于产后瘀滞腹痛、痛经。","dosage":"6~15g，煎服。外用适量，鲜品捣敷。","notes":"脾胃虚弱者慎用。","indications":"主治肠痈（阑尾炎）腹痛；肺痈吐脓；痈肿疮毒；产后瘀滞腹痛、痛经。","combinations":"配大血藤、薏苡仁治肠痈（薏苡附子败酱散）；配鱼腥草治肺痈。","differentiation":"败酱草与大血藤均为肠痈要药常相须为用，败酱草排脓力胜，大血藤活血力强。"},{"name":"马勃","category":"清热药","level":"3","page":"","properties":"辛，平。归肺经。","functions":"清肺利咽，解毒止血。","functions_full":"马勃辛平质轻，善清肺利咽解毒，为治咽喉肿痛之常用药。用于风热及肺火咽喉肿痛、咳嗽失音。又能收敛止血，用于血热吐衄、外伤出血。","dosage":"2~6g，煎服。外用适量，敷压止血。","notes":"风寒咳嗽失音者不宜。","indications":"主治风热及肺火咽喉肿痛、咳嗽失音；血热吐衄、外伤出血。","combinations":"配牛蒡子、玄参清热利咽；配青黛、冰片吹喉利咽。","differentiation":"马勃与射干均能清热利咽，马勃兼能收敛止血质轻上浮，射干兼能消痰散结。"},{"name":"青果","category":"清热药","level":"3","page":"","properties":"甘、酸，平。归肺、胃经。","functions":"清热利咽，生津解毒。","functions_full":"青果甘酸平润，善清热利咽、生津止渴，为咽喉肿痛、口干的常用药。用于风热上攻或肺热之咽喉肿痛、声音嘶哑。又能解毒，用于食鱼蟹中毒、酒毒。","dosage":"4.5~9g，煎服。鲜品可含服或捣汁饮。","notes":"脾胃虚寒者不宜多服。","indications":"主治咽喉肿痛、声音嘶哑；烦热口渴；食鱼蟹中毒。","combinations":"配胖大海、木蝴蝶清热利咽开音；配玄参、麦冬养阴利咽。","differentiation":"青果与胖大海均为利咽开音药，青果兼生津解毒，胖大海兼润肠通便。"},{"name":"木蝴蝶","category":"清热药","level":"3","page":"","properties":"苦、甘，凉。归肺、肝、胃经。","functions":"清肺利咽，疏肝和胃。","functions_full":"木蝴蝶苦凉清热，甘能润养，善清肺利咽开音，用于肺热咳嗽、咽喉肿痛、声音嘶哑。又能疏肝理气和胃，用于肝胃气痛。外用可敛疮生肌。","dosage":"1.5~3g，煎服。","notes":"风寒咳嗽不宜。","indications":"主治肺热咳嗽、咽喉肿痛、声音嘶哑；肝胃气痛；外用敛疮。","combinations":"配胖大海、蝉蜕利咽开音；配陈皮、佛手疏肝和胃。","differentiation":"木蝴蝶与胖大海均为利咽开音要药，木蝴蝶兼疏肝和胃，胖大海兼润肠通便；木蝴蝶质薄如纸而轻清上浮。"},{"name":"马齿苋","category":"清热药","level":"2","page":"","properties":"酸，寒。归肝、大肠经。","functions":"清热解毒，凉血止痢，通淋。","functions_full":"马齿苋酸寒滑利，善清热解毒、凉血止痢，为治热毒血痢之良药。用于湿热痢疾、热毒血痢、里急后重。又能凉血消肿、清热通淋，用于痈肿疮毒、热淋涩痛、崩漏便血。","dosage":"9~15g（鲜品30~60g），煎服。外用适量，鲜品捣敷。","notes":"脾胃虚寒者及孕妇慎用。","indications":"主治湿热痢疾、热毒血痢；热毒疮疡；崩漏、便血；热淋涩痛。","combinations":"配黄连、黄芩清热燥湿止痢；配蒲公英清热解毒消痈。","differentiation":"马齿苋与白头翁均能清热止痢，马齿苋酸寒兼凉血通淋，白头翁苦寒凉血解毒力更强；马齿苋为药食两用之品。"},{"name":"鸦胆子","category":"清热药","level":"3","page":"","properties":"苦，寒，有小毒。归大肠、肝经。","functions":"清热解毒，截疟止痢，腐蚀赘疣。","functions_full":"鸦胆子苦寒有毒，善清热解毒、止痢截疟。用于热毒血痢、休息痢；疟疾。外用能腐蚀赘疣，用于鸡眼、寻常疣等。","dosage":"0.5~2g，以龙眼肉包裹或装入胶囊吞服。外用适量，捣烂敷。","notes":"本品有毒，对胃肠道有较强刺激性，不宜入煎剂，不宜多服久服。孕妇及小儿慎用。","indications":"主治热毒血痢、休息痢（阿米巴痢疾）；疟疾；外用治鸡眼、寻常疣。","combinations":"单用或配白头翁增强治痢之效。","differentiation":"鸦胆子为治阿米巴痢疾的特效药，但毒性较大使用需谨慎；与白头翁相比毒性更大但截疟力强。"},{"name":"地锦草","category":"清热药","level":"3","page":"","properties":"辛，平。归肝、大肠经。","functions":"清热解毒，凉血止血，利湿退黄。","functions_full":"地锦草辛平散瘀，既能清热解毒，又能凉血止血，用于热毒泻痢、血热出血。又能利湿退黄，用于湿热黄疸。外用可解毒消肿，用于痈肿疮毒、毒蛇咬伤。","dosage":"9~20g（鲜品30~60g），煎服。外用适量，鲜品捣敷。","notes":"脾胃虚寒者慎用。","indications":"主治热毒泻痢、便血；血热吐衄、崩漏、外伤出血；湿热黄疸；痈肿疮毒。","combinations":"配马齿苋清热止痢；配茵陈利湿退黄。","differentiation":"地锦草与马齿苋均能清热解毒止痢，地锦草兼能利湿退黄和止血，马齿苋酸收而凉血止痢力较专。"},{"name":"半边莲","category":"清热药","level":"3","page":"","properties":"辛，平。归心、小肠、肺经。","functions":"清热解毒，利水消肿。","functions_full":"半边莲辛平泄散，善清热解毒利水消肿，用于痈肿疮毒、毒蛇咬伤、蜂蝎螫伤。又能利水消肿，用于大腹水肿、面目浮肿。近年用于湿热黄疸、肝硬化腹水。","dosage":"9~15g（鲜品30~60g），煎服。外用适量，鲜品捣敷。","notes":"虚证水肿忌用。","indications":"主治毒蛇咬伤、痈肿疮毒；大腹水肿、面目浮肿；湿热黄疸。","combinations":"配重楼、紫花地丁解毒疗疮；配金钱草利水消肿。","differentiation":"半边莲与半枝莲名称相近，但半边莲偏于解蛇毒、利水消肿，半枝莲偏于化瘀消癥、抗癌。"},{"name":"白花蛇舌草","category":"清热药","level":"2","page":"","properties":"微苦、甘，寒。归胃、大肠、小肠经。","functions":"清热解毒，利湿通淋。","functions_full":"白花蛇舌草甘寒清热解毒，善利湿通淋，用于痈肿疮毒、咽喉肿痛、毒蛇咬伤。又能清热利湿，用于热淋涩痛、小便不利。近年广泛用于消化道、呼吸道等肿瘤的辅助治疗，以及肝炎、盆腔炎等。","dosage":"15~60g，煎服。外用适量，鲜品捣敷。","notes":"孕妇慎用。","indications":"主治痈肿疮毒、咽喉肿痛、毒蛇咬伤；热淋涩痛；多种肿瘤（辅助治疗）；肝炎。","combinations":"配半枝莲、半边莲增强解毒抗癌之力；配车前草清热利湿通淋。","differentiation":"白花蛇舌草与半枝莲均为抗癌常用药，白花蛇舌草以清热解毒利湿为主，半枝莲以化瘀消癥止血为主。"},{"name":"山慈菇","category":"清热药","level":"3","page":"","properties":"甘、微辛，凉。归肝、脾经。","functions":"清热解毒，消痈散结。","functions_full":"山慈菇甘凉清热解毒，善消痈散结，为治痈疽疮毒、瘰疬痰核之良药。用于痈肿疔毒、瘰疬结核。又能化痰散结，用于癥瘕痞块。近年用于食管癌、胃癌、肝癌等肿瘤。","dosage":"3~9g，煎服。外用适量，研末调敷。","notes":"体虚无实火者慎用。","indications":"主治痈疽疔毒、瘰疬痰核；癥瘕痞块；多种恶性肿瘤。","combinations":"配重楼、蒲公英清热解毒消痈；配牡蛎、海藻化痰软坚散结。","differentiation":"山慈菇与重楼均能清热解毒消痈，山慈菇兼化痰散结宜于瘰疬痰核，重楼兼凉肝定惊宜于惊风抽搐。"},{"name":"熊胆粉","category":"清热药","level":"3","page":"","properties":"苦，寒。归肝、胆、心经。","functions":"清热解毒，息风止痉，清肝明目。","functions_full":"熊胆粉苦寒清热力强，善清热解毒，用于热毒疮疡、咽喉肿痛。又能息风止痉，用于热极生风之惊痫抽搐。尚能清肝明目退翳，用于肝热目赤肿痛、翳膜遮睛。","dosage":"0.25~0.5g，入丸散服。外用适量，研末调敷。","notes":"脾胃虚寒者忌用。孕妇慎用。","indications":"主治热毒疮疡、咽喉肿痛；热极生风之惊痫抽搐；肝热目赤肿痛、翳障。","combinations":"配牛黄、冰片清热解毒定惊；配决明子、菊花清肝明目。","differentiation":"熊胆粉与牛黄均为名贵清热定惊药，熊胆偏清肝明目，牛黄偏清心开窍。"},{"name":"千里光","category":"清热药","level":"3","page":"","properties":"苦，寒。归肺、肝经。","functions":"清热解毒，明目退翳，杀虫止痒。","functions_full":"千里光苦寒清热解毒，善明目退翳，用于目赤肿痛、翳膜遮睛。又能清热燥湿、杀虫止痒，用于湿热泻痢、湿疹疥癣、阴道滴虫。外用解毒消肿，用于疮疡肿毒。","dosage":"9~15g，煎服。外用适量，煎水洗或捣敷。","notes":"久服可能引起肝损害，不宜长期大量使用。","indications":"主治风热目赤肿痛、翳障；肠痈、湿热泻痢；湿疹、疥癣；疮疡肿毒。","combinations":"配夏枯草、菊花清肝明目；配白鲜皮、苦参杀虫止痒。","differentiation":"千里光与密蒙花均能明目，千里光苦寒清热解毒力强兼杀虫止痒，密蒙花甘寒兼养肝润目。"},{"name":"白蔹","category":"清热药","level":"3","page":"","properties":"苦、辛，微寒。归心、胃经。","functions":"清热解毒，消痈散结，敛疮生肌。","functions_full":"白蔹苦辛微寒，善清热解毒消痈散结，为疮疡要药，疮疡初起或溃后均可使用。外用能敛疮生肌，用于疮疡溃后不敛、烧烫伤。又能清热凉血，用于血热证。","dosage":"4.5~9g，煎服。外用适量，研末撒或调敷。","notes":"脾胃虚寒者慎用。不宜与乌头类药材同用（十八反）。","indications":"主治痈疽发背、疮疡肿毒；疮疡溃后不敛、烧烫伤；瘰疬。","combinations":"配金银花、连翘清热解毒消痈；配地榆、龙骨外用敛疮生肌。","differentiation":"白蔹与白及均能敛疮生肌，但白蔹偏于清热解毒消痈宜于疮疡初起，白及偏于收敛止血生肌宜于溃疡出血。"},{"name":"四季青","category":"清热药","level":"3","page":"","properties":"苦、涩，寒。归肺、心经。","functions":"清热解毒，凉血敛疮。","functions_full":"四季青苦涩寒凉，善清热解毒凉血，用于咽喉肿痛、热毒疮疡。又能收敛止血敛疮，用于烧烫伤、外伤出血。外用可治湿疹、下肢溃疡。","dosage":"15~30g，煎服。外用适量，研末调敷或捣汁涂。","notes":"脾胃虚寒者慎用。","indications":"主治咽喉肿痛、热毒疮疡；烧烫伤、外伤出血；湿疹、下肢溃疡。","combinations":"配黄连、黄柏清热解毒敛疮；配地榆、大黄外用治烧烫伤。","differentiation":"四季青与地锦草均能清热解毒收敛止血，四季青以凉血敛疮治烧烫伤为长，地锦草以凉血止痢为长。"},{"name":"绿豆","category":"清热药","level":"3","page":"","properties":"甘，寒。归心、胃经。","functions":"清热解毒，消暑利水。","functions_full":"绿豆甘寒清润，善清热解毒，为药食两用之品。用于暑热烦渴、小便短赤；热毒疮疡、丹毒。又能解食物中毒及药物中毒（如附子、巴豆毒）。夏季解暑多用绿豆汤。","dosage":"15~30g，煎服。外用适量，研末调敷。","notes":"脾胃虚寒者不宜多食。","indications":"主治暑热烦渴；痈肿疮毒；药物或食物中毒；用于预防中暑。","combinations":"配甘草增强解毒之力；配赤小豆、薏苡仁消暑利水。","differentiation":"绿豆与赤小豆均能利水解毒，绿豆以清热解毒消暑为主，赤小豆以利水消肿排脓为主；绿豆解热毒力强，赤小豆利水湿力强。"},{"name":"紫草","category":"清热药","level":"2","page":"","properties":"甘、咸，寒。归心、肝经。","functions":"凉血活血，解毒透疹。","functions_full":"紫草甘寒清润，咸能入血，善凉血活血、解毒透疹，为血热毒盛之斑疹不透、麻疹紫暗的要药。用于热毒炽盛之斑疹紫暗或麻疹不透。又能解毒敛疮，外用治烧烫伤、湿疹、疮疡。","dosage":"5~9g，煎服。外用适量，熬膏或用植物油浸泡涂擦。","notes":"脾虚便溏者忌服。","indications":"主治血热毒盛之斑疹紫暗、麻疹不透；疮疡、湿疹、烧烫伤；外用预防尿布皮炎。","combinations":"配赤芍、蝉蜕凉血透疹；配当归、白芷熬膏外用生肌润肤。","differentiation":"紫草与赤芍均能凉血活血，紫草兼解毒透疹为斑疹要药，赤芍兼散瘀止痛。"},{"name":"水牛角","category":"清热药","level":"2","page":"","properties":"苦，寒。归心、肝经。","functions":"清热凉血，解毒定惊。","functions_full":"水牛角苦寒清热凉血，功似犀角而力较弱，为犀角的替代品。能清热凉血、泻火解毒定惊，用于温病热入营血之高热神昏谵语、斑疹吐衄、惊风抽搐。","dosage":"15~30g，宜先煎3小时以上。","notes":"脾胃虚寒者慎用。","indications":"主治温病热入营血之高热神昏、斑疹吐衄；血热发斑；惊风抽搐。","combinations":"配生地黄、玄参凉血养阴（犀角地黄汤加减）；配牛黄、羚羊角清热定惊。","differentiation":"水牛角为犀角替代品，清热凉血解毒之功相似而力减弱，用量宜大；与生地黄相比偏于解毒定惊，生地黄偏于养阴生津。"},{"name":"白薇","category":"清热药","level":"2","page":"","properties":"苦、咸，寒。归胃、肝、肾经。","functions":"清热凉血，利尿通淋，解毒疗疮。","functions_full":"白薇苦咸寒，清热凉血而不伤阴，为退虚热之良药。用于阴虚发热、产后虚热、温病后期余热未尽之夜热早凉。又能利尿通淋，用于热淋、血淋。尚能解毒疗疮，用于疮疡肿毒。","dosage":"4.5~9g，煎服。外用适量，研末调敷。","notes":"脾胃虚寒者慎用。","indications":"主治阴虚发热、产后虚热、温病后期夜热早凉；热淋、血淋；疮疡肿毒。","combinations":"配地骨皮、青蒿退虚热；配车前草、滑石利尿通淋。","differentiation":"白薇与青蒿均能退虚热，白薇兼利尿通淋解毒疗疮，青蒿兼解暑截疟；白薇退虚热而不伤阴的特点较为突出。"},{"name":"银柴胡","category":"清热药","level":"2","page":"","properties":"甘，微寒。归肝、胃经。","functions":"清虚热，除疳热。","functions_full":"银柴胡甘寒清润，善清虚热、除疳热，为退虚热之常用药。用于阴虚发热、骨蒸劳热、盗汗。又能除小儿疳热，用于小儿疳积发热、腹大消瘦。","dosage":"3~9g，煎服。","notes":"外感风寒、血虚无热者忌用。","indications":"主治阴虚发热、骨蒸劳热、盗汗；小儿疳积发热、消瘦。","combinations":"配鳖甲、地骨皮清虚热除骨蒸（清骨散加减）；配鸡内金、胡黄连治小儿疳热。","differentiation":"银柴胡与柴胡名称相近但功效迥异：银柴胡为清虚热药宜于阴虚发热，柴胡为解表药宜于邪在少阳；银柴胡甘寒退热而不升散，柴胡苦辛升散而和解退热。"},{"name":"胡黄连","category":"清热药","level":"3","page":"","properties":"苦，寒。归肝、胃、大肠经。","functions":"清虚热，除疳热，清湿热。","functions_full":"胡黄连苦寒清降，善清虚热、除疳热，用于阴虚发热、骨蒸潮热、盗汗。又能清热燥湿止痢，用于湿热泻痢、痔疮肿痛。尚可除小儿疳热，用于小儿疳积。","dosage":"1.5~9g，煎服。","notes":"脾胃虚寒者慎用。","indications":"主治阴虚发热、骨蒸劳热；湿热泻痢、痔疮肿痛；小儿疳积。","combinations":"配银柴胡、鳖甲退虚热；配黄连、白头翁清热燥湿止痢。","differentiation":"胡黄连与黄连名称相近，胡黄连以清虚热除疳热为主，黄连以清热燥湿泻火解毒为主；胡黄连兼能退虚热，黄连无此功。"},{"name":"番泻叶","category":"泻下药","level":"3","page":"","properties":"甘、苦，寒。归大肠经。","functions":"泻热行滞，通便利水。","functions_full":"番泻叶苦寒沉降，善泻热通便，为刺激性泻药。用于热结便秘、习惯性便秘及腹部胀满。又能行滞利水，用于腹水膨胀。小剂量可起缓泻作用，大剂量则峻下。","dosage":"2~6g，煎服宜后下，或开水泡服。","notes":"孕妇、哺乳期及月经过多者忌用。体虚者慎用。不宜长期使用。","indications":"主治热结便秘、习惯性便秘、积滞腹胀；腹水膨胀。","combinations":"配大黄、枳实增强泻下之力；泡水单用即可起效。","differentiation":"番泻叶与大黄均为攻下药，番泻叶作用较温和而宜于习惯性便秘，大黄泻热通便兼活血解毒功效更全面。"},{"name":"芦荟","category":"泻下药","level":"3","page":"","properties":"苦，寒。归肝、胃、大肠经。","functions":"泻下通便，清肝泻火，杀虫疗疳。","functions_full":"芦荟苦寒降泄，善泻下通便，用于热结便秘。又能清肝泻火，用于肝经实火之烦躁易怒、惊痫抽搐。外用能杀虫疗疳止痒，用于小儿疳积、虫积腹痛、癣疮。","dosage":"0.6~1.5g，入丸散服，不入汤剂。外用适量，研末调敷。","notes":"孕妇忌用。脾胃虚寒者慎用。","indications":"主治热结便秘；肝经实火之烦躁易怒；小儿疳积、虫积；外用治癣疮。","combinations":"配大黄、青黛清肝泻火通便；配使君子、槟榔杀虫消疳。","differentiation":"芦荟与番泻叶均为刺激性泻下药，芦荟兼清肝杀虫之功，番泻叶泻下力较直接。"},{"name":"郁李仁","category":"泻下药","level":"2","page":"","properties":"辛、苦、甘，平。归脾、大肠、小肠经。","functions":"润肠通便，利水消肿。","functions_full":"郁李仁质润多脂，辛能散、苦能降、甘能润，善润肠通便，用于肠燥便秘。又能下气利水消肿，用于水肿胀满、脚气浮肿、小便不利。","dosage":"6~10g，煎服。","notes":"孕妇慎用。","indications":"主治肠燥便秘；水肿胀满、小便不利。","combinations":"配火麻仁、柏子仁润肠通便（五仁丸）；配茯苓、白术利水消肿。","differentiation":"郁李仁与火麻仁均能润肠通便，郁李仁兼能利水消肿，火麻仁兼能滋养补虚；郁李仁通便力偏强而润养之力逊于火麻仁。"},{"name":"松子仁","category":"泻下药","level":"3","page":"","properties":"甘，温。归肺、肝、大肠经。","functions":"润肠通便，润肺止咳。","functions_full":"松子仁甘温质润，富含油脂，善润肠通便，用于津枯肠燥便秘。又能润肺止咳，用于肺燥咳嗽。为药食两用之滋补润燥佳品。","dosage":"5~10g，煎服或入丸散。","notes":"脾虚便溏及痰湿壅盛者不宜。","indications":"主治津枯肠燥便秘；肺燥干咳。","combinations":"配火麻仁、郁李仁润肠通便；配杏仁、麦冬润肺止咳。","differentiation":"松子仁与火麻仁均为富含油脂的润下药，松子仁兼润肺止咳而偏滋补，火麻仁兼滋养补虚而偏平和。"},{"name":"芫花","category":"泻下药","level":"3","page":"","properties":"辛、苦，温，有毒。归肺、脾、肾经。","functions":"泻水逐饮，祛痰止咳，杀虫疗疮。","functions_full":"芫花辛温有毒，泻水逐饮力峻烈，善泻胸胁水饮，为治悬饮要药。用于水肿胀满、胸腹积水、痰饮喘咳。又能祛痰止咳，用于寒痰咳嗽。外用杀虫疗疮，用于头疮、顽癣。","dosage":"1.5~3g，煎服。醋炒减毒。外用适量，研末调敷。","notes":"有毒，体虚者及孕妇忌用。不宜与甘草同用（十八反）。","indications":"主治水肿胀满、胸腹积水（胸水、腹水）；痰饮积聚、喘咳；外用治头疮顽癣。","combinations":"配甘遂、大戟泻水逐饮（十枣汤）；配大枣护胃缓毒。","differentiation":"芫花与甘遂、京大戟均为峻下逐水药，芫花善泻胸胁水饮（治悬饮），甘遂偏泻腹水，京大戟偏泻脏腑水湿。"},{"name":"商陆","category":"泻下药","level":"3","page":"","properties":"苦，寒，有毒。归肺、脾、肾、大肠经。","functions":"逐水消肿，通利二便，解毒散结。","functions_full":"商陆苦寒有毒，善逐水消肿、通利二便，为峻下逐水药。用于水肿胀满、二便不通之实证。外用能解毒散结，用于痈肿疮毒。","dosage":"3~9g，煎服。醋制减毒。外用适量，鲜品捣敷。","notes":"有毒，孕妇忌用。脾虚水肿者忌用。","indications":"主治水肿胀满实证、二便不通；外用治痈肿疮毒。","combinations":"配茯苓、泽泻利水消肿但药力较峻烈宜慎用；单用煎汤熏洗治痈肿。","differentiation":"商陆与牵牛子均为峻下逐水药兼通二便，商陆偏于逐水消肿解毒散结，牵牛子偏于泻下利水杀虫。"},{"name":"牵牛子","category":"泻下药","level":"3","page":"","properties":"苦，寒，有毒。归肺、肾、大肠经。","functions":"泻水通便，消痰涤饮，杀虫攻积。","functions_full":"牵牛子苦寒有毒，善泻下逐水、通利二便，用于水肿胀满、二便不通。又能消痰涤饮，用于痰饮喘咳。尚能杀虫攻积，用于虫积腹痛。","dosage":"3~6g，煎服。入丸散1.5~3g。炒用药性较缓。","notes":"有毒，孕妇及体虚者忌用。不宜与巴豆同用。","indications":"主治水肿胀满、二便不通；痰饮喘咳；虫积腹痛；食积便秘。","combinations":"配大黄、槟榔攻积导滞；配葶苈子、杏仁泻肺逐饮。","differentiation":"牵牛子与商陆均为峻下逐水兼通二便药，牵牛子兼杀虫消积之功，商陆兼解毒散结之功。"},{"name":"巴豆霜","category":"泻下药","level":"3","page":"","properties":"辛，热，有大毒。归胃、大肠经。","functions":"峻下冷积，逐水消肿，祛痰利咽。","functions_full":"巴豆霜为巴豆去油制霜后之品，毒性减弱，辛热峻烈，善峻下冷积、开通肠道闭塞，用于寒积便秘、腹满胀痛。又能逐水消肿，用于腹水膨胀。尚可祛痰利咽，用于喉痹痰阻。","dosage":"0.1~0.3g，入丸散服。外用适量，研末调敷。","notes":"有大毒，孕妇及体弱者忌用。不宜与牵牛子同用。严格控制剂量。","indications":"主治寒积便秘急症；腹水膨胀；喉痹痰涎壅塞。外用治恶疮疥癣。","combinations":"配大黄、干姜温下寒积（三物备急丸）；外用配雄黄解毒蚀疮。","differentiation":"巴豆霜与大黄均为泻下药，但巴豆霜性热泻寒积，大黄性寒泻热积；巴豆霜毒性大须严格控制，大黄较安全多用。"},{"name":"千金子","category":"泻下药","level":"3","page":"","properties":"辛，温，有毒。归肝、肾、大肠经。","functions":"泻下逐水，破血消癥。","functions_full":"千金子辛温有毒，善泻下逐水、破血消癥，为峻下逐水猛药。用于水肿胀满、二便不通。又能破血通经消癥，用于癥瘕积聚、血瘀经闭。外用治顽癣、疣赘。","dosage":"1~2g，去壳去油用霜，入丸散服。外用适量，捣敷。","notes":"有毒，孕妇及体虚者忌用。严格控制用量。","indications":"主治水肿胀满、二便不通实证；癥瘕积聚、血瘀经闭；外用治顽癣疣赘。","combinations":"配大黄、牵牛子攻逐水湿；配桃仁、红花破血消癥。","differentiation":"千金子与巴豆霜均为辛热峻下逐水药，千金子兼破血消癥之功，巴豆霜兼祛痰利咽之功。"},{"name":"徐长卿","category":"祛风湿药","level":"2","page":"","properties":"辛，温。归肝、胃经。","functions":"祛风除湿，止痛止痒。","functions_full":"徐长卿辛温行散，善祛风除湿止痛，用于风湿痹痛、腰痛、跌打损伤疼痛。又能祛风止痒，用于风疹、湿疹、皮肤瘙痒。尚可解蛇毒，用于毒蛇咬伤。止痛效果较为突出。","dosage":"3~12g，煎服。外用适量，煎水洗。","notes":"不宜久煎（含挥发油）。","indications":"主治风湿痹痛、腰痛、跌打伤痛；风疹瘙痒、湿疹；毒蛇咬伤；胃痛、牙痛。","combinations":"配威灵仙、独活祛风除湿止痛；配白鲜皮、地肤子祛风止痒。","differentiation":"徐长卿与威灵仙均能祛风湿止痛，徐长卿止痛范围更广兼止痒，威灵仙通行十二经络之力更强。"},{"name":"蕲蛇","category":"祛风湿药","level":"2","page":"","properties":"甘、咸，温，有毒。归肝经。","functions":"祛风通络，定惊止痉。","functions_full":"蕲蛇甘温善窜，为动物性祛风药，祛风通络力强，透骨搜风，善治风湿顽痹、中风半身不遂、口眼歪斜。又能定惊止痉，用于小儿惊风、破伤风。尚可祛风止痒，用于麻风、顽癣。","dosage":"3~9g，煎服。研末吞服一次1~1.5g。","notes":"阴虚血燥者慎用。","indications":"主治风湿顽痹、肢体麻木拘挛；中风半身不遂、口眼歪斜；小儿惊风、破伤风；麻风、顽癣瘙痒。","combinations":"配全蝎、蜈蚣增强祛风通络止痉之力；配防风、独活祛风除湿。","differentiation":"蕲蛇与乌梢蛇均能祛风通络定惊，蕲蛇药力较强而有毒，乌梢蛇药力较缓而无毒。"},{"name":"乌梢蛇","category":"祛风湿药","level":"2","page":"","properties":"甘，平。归肝经。","functions":"祛风通络，定惊止痉。","functions_full":"乌梢蛇甘平无毒，善祛风通络，用于风湿顽痹、肢体麻木、筋脉拘挛。又能定惊止痉，用于小儿惊风、破伤风。尚可祛风止痒，用于麻风、疥癣、皮肤瘙痒。","dosage":"9~12g，煎服。研末吞服一次2~3g。","notes":"血虚生风者慎用。","indications":"主治风湿顽痹、麻木拘挛；中风半身不遂；小儿惊风、破伤风；皮肤瘙痒、疥癣。","combinations":"配蕲蛇、全蝎祛风通络止痉；配防风、白鲜皮祛风止痒。","differentiation":"乌梢蛇与蕲蛇功效相似，乌梢蛇性平无毒而药力较蕲蛇缓和，为临床更常用之品。"},{"name":"蚕沙","category":"祛风湿药","level":"3","page":"","properties":"甘、辛，温。归肝、脾、胃经。","functions":"祛风除湿，和胃化浊。","functions_full":"蚕沙辛甘温散，善祛风除湿，用于风湿痹痛、肢体不遂。又能和胃化浊，用于湿浊内阻之吐泻转筋、腹痛。外用可祛风止痒，用于风疹湿疹瘙痒。","dosage":"5~15g，煎服。布包入煎。外用适量，煎汤洗浴。","notes":"脾胃虚弱便溏者慎用。","indications":"主治风湿痹痛、肢体不遂；湿浊内阻之吐泻转筋；风疹湿疹瘙痒。","combinations":"配木瓜、薏苡仁祛湿除痹止泻；配秦艽、防风祛风除湿。","differentiation":"蚕沙与木瓜均为风湿痹痛兼治吐泻转筋之品，蚕沙以和胃化浊为主，木瓜以舒筋活络化湿为主。"},{"name":"伸筋草","category":"祛风湿药","level":"3","page":"","properties":"微苦、辛，温。归肝经。","functions":"祛风除湿，舒筋活络。","functions_full":"伸筋草苦辛温通，善祛风除湿、舒筋活络，为治筋脉拘挛之常用药。用于风湿痹痛、关节屈伸不利、筋脉拘挛。又能活血消肿，用于跌打损伤。","dosage":"3~12g，煎服。外用适量，煎汤洗。","notes":"孕妇慎用。","indications":"主治风湿痹痛、关节屈伸不利、筋脉拘挛；跌打损伤肿痛。","combinations":"配透骨草、威灵仙祛风除湿舒筋；配牛膝、当归活血舒筋。","differentiation":"伸筋草与透骨草均为舒筋活络药，伸筋草偏于祛风除湿，透骨草偏于活血止痛。"},{"name":"油松节","category":"祛风湿药","level":"3","page":"","properties":"苦、辛，温。归肝、肾经。","functions":"祛风除湿，通络止痛。","functions_full":"油松节苦燥辛散温通，善祛风除湿止痛，用于风湿痹痛、关节疼痛。又能活血通络，用于跌打损伤疼痛。外用可治牙痛。","dosage":"9~15g，煎服。外用适量，浸酒涂擦。","notes":"阴虚血燥者慎用。","indications":"主治风湿痹痛、关节疼痛；跌打损伤肿痛；外用治牙痛。","combinations":"配独活、威灵仙祛风除湿；配乳香、没药活血止痛。","differentiation":"油松节与海风藤均为祛风湿通络止痛药，油松节以松节为主善治关节痛，海风藤以藤类入药善治筋脉拘挛。"},{"name":"海风藤","category":"祛风湿药","level":"3","page":"","properties":"辛、苦，微温。归肝经。","functions":"祛风湿，通经络，止痹痛。","functions_full":"海风藤辛苦温通，善祛风湿、通经络止痹痛，为藤类祛风湿药。用于风湿痹痛、筋脉拘挛、关节屈伸不利。又能活络止痛，用于跌打损伤疼痛。","dosage":"6~12g，煎服。","notes":"阴虚火旺者慎用。","indications":"主治风湿痹痛、筋脉拘挛、关节不利；跌打损伤。","combinations":"配威灵仙、秦艽祛风湿通经络；配络石藤、鸡血藤增强通络之力。","differentiation":"海风藤与络石藤均为藤类祛风湿药，海风藤性微温宜治风寒湿痹，络石藤性微寒宜治风湿热痹。"},{"name":"青风藤","category":"祛风湿药","level":"3","page":"","properties":"苦、辛，平。归肝、脾经。","functions":"祛风湿，通经络，利小便。","functions_full":"青风藤苦辛平和，善祛风湿、通经络止痛，为藤类祛风湿良药。用于风湿痹痛、关节肿胀、麻木拘挛。又能利小便，用于水肿、小便不利。有较好的镇痛抗炎作用。","dosage":"6~12g，煎服。","notes":"脾胃虚寒者慎用。","indications":"主治风湿痹痛、关节肿胀；水肿小便不利。","combinations":"配防己、秦艽祛风湿通络；配茯苓、泽泻利水消肿。","differentiation":"青风藤与海风藤均为藤类祛风湿药，青风藤性平兼利小便且现代研究有抗炎镇痛作用，海风藤性微温偏祛寒湿。"},{"name":"丁公藤","category":"祛风湿药","level":"3","page":"","properties":"辛，温，有小毒。归肝、脾、胃经。","functions":"祛风除湿，消肿止痛。","functions_full":"丁公藤辛温走窜，善祛风除湿、消肿止痛，为风湿痹痛之常用草药。用于风湿痹痛、关节肿痛、半身不遂、手足麻木。外用可消肿止痛。","dosage":"3~6g，煎服。亦可浸酒内服。外用适量，浸酒涂擦。","notes":"本品有发汗作用，体虚多汗者慎用。孕妇忌服。","indications":"主治风湿痹痛、关节肿痛；半身不遂、手足麻木；跌打肿痛。","combinations":"配威灵仙、独活祛风除湿止痛；配桂枝、麻黄发散风寒湿邪。","differentiation":"丁公藤与威灵仙均能祛风除湿止痛，丁公藤性辛温有小毒偏于消肿，威灵仙通行十二经善治各种痹痛。"},{"name":"昆明山海棠","category":"祛风湿药","level":"3","page":"","properties":"苦、辛，温，有大毒。归肝、肾经。","functions":"祛风除湿，活血通络，续筋接骨。","functions_full":"昆明山海棠辛苦温有毒，善祛风除湿通络，为风湿顽痹之猛药。用于风湿痹痛、类风湿关节炎。又能活血续筋，用于跌打损伤、骨折筋伤。现代研究有免疫抑制作用，用于自身免疫性疾病。","dosage":"6~15g，煎服。宜先煎。外用适量。","notes":"有大毒，不可过量。孕妇禁服。儿童及育龄妇女慎用。肝肾功能不全者忌用。","indications":"主治风湿顽痹、类风湿关节炎；跌打损伤、骨折；自身免疫性疾病。","combinations":"配雷公藤增强免疫抑制作用（需严格掌握剂量）；配独活、川乌祛风除湿止痛。","differentiation":"昆明山海棠与雷公藤同属卫矛科，均有大毒且具免疫抑制作用，昆明山海棠毒性较雷公藤稍轻。"},{"name":"路路通","category":"祛风湿药","level":"3","page":"","properties":"苦，平。归肝、肾经。","functions":"祛风活络，利水通经。","functions_full":"路路通苦平，善祛风活络，用于风湿痹痛、肢体麻木。又能通经下乳、利水消肿，用于经闭、乳汁不下、水肿。兼能祛风止痒，用于风疹瘙痒。","dosage":"5~9g，煎服。外用适量。","notes":"孕妇慎用。","indications":"主治风湿痹痛、肢体麻木；经闭、乳汁不下；水肿胀满；风疹瘙痒。","combinations":"配穿山甲、王不留行通经下乳；配茯苓皮、猪苓利水消肿。","differentiation":"路路通与穿山甲均能通经下乳，路路通兼祛风活络利水，穿山甲消癥力更强但为保护动物。"},{"name":"穿山龙","category":"祛风湿药","level":"3","page":"","properties":"苦，微寒。归肝、肺经。","functions":"祛风除湿，活血通络，清肺化痰。","functions_full":"穿山龙苦寒，善祛风除湿活血通络，用于风湿痹痛、关节屈伸不利。又能清肺化痰，用于热痰咳嗽。现代研究有抗炎、平喘、抗风湿作用。","dosage":"9~15g，煎服。外用适量。","notes":"脾胃虚寒者慎用。","indications":"主治风湿痹痛、关节肿痛；热痰咳喘；跌打损伤。","combinations":"配威灵仙、秦艽祛风湿通络；配黄芩、瓜蒌清肺化痰。","differentiation":"穿山龙与防己均能祛风湿兼清热，穿山龙兼活血化痰，防己兼利水消肿。"},{"name":"桑枝","category":"祛风湿药","level":"3","page":"","properties":"微苦，平。归肝经。","functions":"祛风湿，利关节。","functions_full":"桑枝微苦平和，善祛风湿、利关节，以上肢痹痛为优。用于风湿痹痛、四肢拘挛、关节屈伸不利，尤宜于上肢肩臂酸痛。药性平和，寒热均可配伍应用。","dosage":"9~15g，煎服。","notes":"药性平和，无明显禁忌。","indications":"主治风湿痹痛、四肢拘挛，尤善治上肢肩臂疼痛。","combinations":"配桂枝治上肢痹痛；配防己、威灵仙祛风除湿通络。","differentiation":"桑枝与桂枝均能通利关节治上肢痹痛，桑枝性平宜于热痹，桂枝性温宜于寒痹。"},{"name":"豨莶草","category":"祛风湿药","level":"3","page":"","properties":"辛、苦，寒。归肝、肾经。","functions":"祛风湿，利关节，清热解毒。","functions_full":"豨莶草辛苦寒，善祛风湿、利关节，用于风湿痹痛、肢体麻木、关节不利。生用或酒蒸后性转温可强筋骨。又能清热解毒，用于疮疡肿毒、湿疹瘙痒。","dosage":"9~12g，煎服。外用适量，鲜品捣敷。","notes":"制用偏温补肝肾，生用偏寒清热解毒。","indications":"主治风湿痹痛、肢体麻木；疮疡肿毒、湿疹瘙痒。","combinations":"配臭梧桐增强祛风湿之力（豨桐丸）；配海桐皮、络石藤祛风湿通络。","differentiation":"豨莶草生用与制用功效有别：生用苦寒清热解毒祛风湿，制用性温补肝肾强筋骨。"},{"name":"臭梧桐","category":"祛风湿药","level":"3","page":"","properties":"辛、苦、甘，凉。归肝经。","functions":"祛风湿，通经络，降血压。","functions_full":"臭梧桐辛苦凉散，善祛风湿通经络，用于风湿痹痛、肢体麻木、半身不遂。又能平肝降压，用于高血压病之头痛眩晕。","dosage":"5~15g，煎服。不宜久煎。外用适量。","notes":"脾胃虚弱者慎用。","indications":"主治风湿痹痛、肢体麻木；高血压病头痛眩晕。","combinations":"配豨莶草祛风湿通经络（豨桐丸）；配钩藤、菊花平肝降压。","differentiation":"臭梧桐与豨莶草常相须为用，臭梧桐兼降压之功，豨莶草兼清热解毒之功。"},{"name":"海桐皮","category":"祛风湿药","level":"3","page":"","properties":"苦、辛，平。归肝经。","functions":"祛风湿，通络止痛，杀虫止痒。","functions_full":"海桐皮苦辛平散，善祛风湿通络止痛，用于风湿痹痛、四肢拘挛、腰膝疼痛。又能杀虫止痒，用于疥癣、湿疹瘙痒。外用可治牙痛。","dosage":"5~15g，煎服。外用适量，煎汤洗或研末敷。","notes":"血虚者慎用。","indications":"主治风湿痹痛、四肢拘挛；疥癣、湿疹瘙痒；牙痛（外用）。","combinations":"配独活、威灵仙祛风湿止痛；配白鲜皮、地肤子杀虫止痒。","differentiation":"海桐皮与海风藤均能祛风湿通络，海桐皮兼杀虫止痒为皮肤科常用，海风藤通络止痛为主。"},{"name":"络石藤","category":"祛风湿药","level":"3","page":"","properties":"苦，微寒。归心、肝、肾经。","functions":"祛风通络，凉血消肿。","functions_full":"络石藤苦寒清热，善祛风通络，为藤类祛风湿药。用于风湿热痹、筋脉拘挛、关节不利。又能凉血消肿，用于喉痹、痈肿疮毒。","dosage":"6~12g，煎服。外用适量，鲜品捣敷。","notes":"阳虚畏寒者慎用。","indications":"主治风湿热痹、筋脉拘挛；喉痹肿痛；痈肿疮毒。","combinations":"配秦艽、防己祛风湿清热通络；配射干、桔梗利咽消肿。","differentiation":"络石藤与海风藤均为藤类祛风湿通络药，络石藤性微寒宜于热痹兼凉血消肿，海风藤性微温宜于风寒湿痹。"},{"name":"雷公藤","category":"祛风湿药","level":"2","page":"","properties":"苦、辛，寒，有大毒。归肝、肾经。","functions":"祛风除湿，活血通络，消肿止痛，杀虫解毒。","functions_full":"雷公藤有大毒而药力峻猛，善祛风除湿、活血通络、消肿止痛，为风湿顽痹之要药。用于类风湿关节炎、风湿痹痛。现代研究有显著免疫抑制作用，亦用于肾病综合征、系统性红斑狼疮等自身免疫病。外用杀虫解毒。","dosage":"1~5g，煎服，宜久煎（1小时以上）。外用适量。","notes":"有大毒，严格控制剂量。孕妇禁服。育龄妇女及儿童慎用。定期检查血象及肝肾功能。","indications":"主治类风湿关节炎、风湿顽痹；肾病综合征；系统性红斑狼疮等免疫病。外用治皮肤瘙痒。","combinations":"配威灵仙、独活祛风除湿（需审慎配伍）；现代多单用或制成制剂。","differentiation":"雷公藤与昆明山海棠为近缘植物，均有免疫抑制作用，雷公藤毒性更大但疗效亦更显著。"},{"name":"老鹳草","category":"祛风湿药","level":"3","page":"","properties":"辛、苦，平。归肝、肾、脾经。","functions":"祛风湿，通经络，止泻痢。","functions_full":"老鹳草辛苦平散，善祛风湿通经络，用于风湿痹痛、肢体麻木、关节不利。又能清热利湿止泻，用于湿热泻痢。","dosage":"9~15g，煎服。","notes":"脾胃虚寒者慎用。","indications":"主治风湿痹痛、肢体麻木；湿热泻痢。","combinations":"配秦艽、独活祛风湿；配黄连、马齿苋清热止痢。","differentiation":"老鹳草与伸筋草均能祛风湿舒筋，老鹳草兼清热止泻，伸筋草偏于舒筋活络。"},{"name":"丝瓜络","category":"祛风湿药","level":"3","page":"","properties":"甘，平。归肺、胃、肝经。","functions":"祛风通络，活血消肿。","functions_full":"丝瓜络甘平，善祛风通络，用于风湿痹痛、筋脉拘挛。又能活血消肿通乳，用于乳汁不通、乳痈肿痛。兼能化痰，用于胸胁疼痛、咳嗽痰多。","dosage":"4.5~9g，煎服。外用适量，烧炭研末调敷。","notes":"无明显禁忌。","indications":"主治风湿痹痛、筋脉拘挛；乳汁不通、乳痈；胸胁疼痛。","combinations":"配路路通、王不留行活血通乳；配瓜蒌、枳壳理气化痰。","differentiation":"丝瓜络与路路通均能通乳，丝瓜络兼祛风通络化痰，路路通兼利水消肿。"},{"name":"狗脊","category":"祛风湿药","level":"3","page":"","properties":"苦、甘，温。归肝、肾经。","functions":"补肝肾，强腰膝，祛风湿。","functions_full":"狗脊苦甘温，既能祛风湿，又能补肝肾强腰膝，为强壮性祛风湿药。用于肾虚腰痛脊强、足膝无力、小便不禁。兼能温补固摄，用于妇女白带过多。","dosage":"6~12g，煎服。","notes":"肾虚有热、小便不利者慎用。","indications":"主治肾虚腰痛脊强、足膝酸软；风湿痹痛兼肝肾不足者；白带过多。","combinations":"配杜仲、续断补肝肾强腰膝；配独活、桑寄生祛风湿补肝肾。","differentiation":"狗脊与杜仲均能补肝肾强腰膝，狗脊兼祛风湿宜于风湿兼肾虚者，杜仲温补之力较强宜于肾虚为主者。"},{"name":"千年健","category":"祛风湿药","level":"3","page":"","properties":"苦、辛，温。归肝、肾经。","functions":"祛风湿，壮筋骨。","functions_full":"千年健苦辛温散，既能祛风湿，又能壮筋骨，为祛风湿强壮药。用于风湿痹痛、腰膝冷痛、下肢拘挛麻木。多用于老年人风湿痹痛兼筋骨无力者。","dosage":"4.5~9g，煎服。亦可浸酒服。","notes":"阴虚内热者慎用。","indications":"主治风寒湿痹、腰膝冷痛、下肢拘挛麻木。","combinations":"配钻地风、牛膝祛风湿强筋骨；配杜仲、续断补肝肾强腰膝。","differentiation":"千年健与狗脊均为祛风湿兼强壮筋骨药，千年健以祛风湿为主兼壮筋骨，狗脊以补肝肾为主兼祛风湿。"},{"name":"雪莲花","category":"祛风湿药","level":"3","page":"","properties":"甘、微苦，温。归肝、肾经。","functions":"祛风湿，补肝肾，调经止血。","functions_full":"雪莲花甘苦温，产于高寒山区，善祛风湿、补肝肾，用于风湿痹痛、肾虚阳痿、腰膝酸软。又能温经散寒调经止血，用于宫寒痛经、月经不调、崩漏。","dosage":"6~12g，煎服。亦可浸酒。","notes":"孕妇忌服。","indications":"主治风寒湿痹；肾虚阳痿、腰膝酸软；宫寒痛经、月经不调。","combinations":"配鹿茸、巴戟天温肾壮阳；配独活、威灵仙祛风湿。","differentiation":"雪莲花为藏药特色品种，兼具祛风湿与温肾壮阳调经之功，与一般祛风湿药有显著不同。"},{"name":"佩兰","category":"化湿药","level":"2","page":"","properties":"辛，平。归脾、胃、肺经。","functions":"芳香化湿，醒脾开胃，发表解暑。","functions_full":"佩兰辛平芳香，善化湿醒脾，为化湿要药。用于湿浊中阻之脘腹痞闷、恶心呕吐、口中甜腻。又能发表解暑，用于外感暑湿或湿温初起之恶寒发热、头胀胸闷。","dosage":"3~9g，煎服。鲜品加倍。","notes":"阴虚血燥者慎用。","indications":"主治湿浊中阻之脘痞呕恶、口甘多涎；暑湿、湿温初起。","combinations":"配藿香增强芳香化湿解暑之力；配厚朴、苍术燥湿运脾。","differentiation":"佩兰与藿香均为芳香化湿解暑要药，佩兰偏于化脾胃湿浊除口甘，藿香偏于和中止呕。"},{"name":"草豆蔻","category":"化湿药","level":"3","page":"","properties":"辛，温。归脾、胃经。","functions":"燥湿行气，温中止呕。","functions_full":"草豆蔻辛温芳香，善燥湿行气温中，用于寒湿中阻之脘腹胀满冷痛、不思饮食。又能温中止呕，用于寒湿呕吐。","dosage":"3~6g，煎服。入散剂宜后下。","notes":"阴虚血少者忌用。","indications":"主治寒湿中阻之脘腹胀满冷痛、食少；寒湿呕吐。","combinations":"配砂仁、厚朴燥湿行气和中；配高良姜、陈皮温中散寒止呕。","differentiation":"草豆蔻与豆蔻均为温中化湿药，草豆蔻温中燥湿力较强，豆蔻行气力较胜而偏上中焦。"},{"name":"草果","category":"化湿药","level":"3","page":"","properties":"辛，温。归脾、胃经。","functions":"燥湿温中，除痰截疟。","functions_full":"草果辛温燥烈，善燥湿温中，用于寒湿中阻之脘腹冷痛、食积不化。又能除痰截疟，为治疟疾之常用药，用于疟疾之寒热往来。","dosage":"3~6g，煎服。去壳取仁捣碎用。","notes":"阴虚血燥者忌用。","indications":"主治寒湿中阻之脘腹冷痛、食积不化；疟疾。","combinations":"配常山、槟榔截疟（达原饮加减）；配苍术、厚朴燥湿运脾。","differentiation":"草果与草豆蔻均为温燥之化湿药，草果温燥力更强兼截疟之功，草豆蔻行气和中力更胜。"},{"name":"冬瓜皮","category":"利水渗湿药","level":"3","page":"","properties":"甘，凉。归脾、小肠经。","functions":"利水消肿，清热解暑。","functions_full":"冬瓜皮甘凉渗利，善利水消肿，用于水肿胀满、小便不利。又能清热解暑，用于暑热烦渴、小便短赤。为利水消肿之轻剂，药力缓和。","dosage":"9~30g，煎服。","notes":"营养不良性水肿不宜单用。","indications":"主治水肿胀满、小便不利；暑热烦渴、小便短赤。","combinations":"配茯苓皮、猪苓利水消肿（五皮饮加减）；配西瓜翠衣清热解暑。","differentiation":"冬瓜皮与茯苓皮均为利水消肿之皮类药，冬瓜皮兼清暑热，茯苓皮以健脾利湿为长。"},{"name":"玉米须","category":"利水渗湿药","level":"3","page":"","properties":"甘，平。归膀胱、肝、胆经。","functions":"利水消肿，利湿退黄。","functions_full":"玉米须甘平渗利，善利水消肿，用于水肿、小便不利。又能利湿退黄，用于湿热黄疸。尚可降血压、降血糖，用于高血压、糖尿病之辅助治疗。","dosage":"15~30g（鲜品加倍），煎服。","notes":"药性平和，无明显禁忌。","indications":"主治水肿、小便不利；湿热黄疸；高血压、糖尿病（辅助治疗）。","combinations":"配车前草、冬瓜皮利水消肿；配茵陈、金钱草利湿退黄。","differentiation":"玉米须与冬瓜皮均能利水且药性平和，玉米须兼退黄降压降糖之功，冬瓜皮兼清暑热。"},{"name":"葫芦","category":"利水渗湿药","level":"3","page":"","properties":"甘，平。归肺、小肠经。","functions":"利水消肿。","functions_full":"葫芦甘平滑利，善利水消肿，用于水肿胀满、小便不利。药力较强，为治水肿之常用利水药。兼能清热利湿，用于热淋。","dosage":"15~30g，煎服。","notes":"脾虚者宜配补脾药同用。","indications":"主治水肿胀满、腹水、小便不利；热淋。","combinations":"配猪苓、泽泻利水消肿；配车前子、木通利水通淋。","differentiation":"葫芦与冬瓜皮均能利水消肿，葫芦利水力较强宜于水肿重证，冬瓜皮药力较缓兼解暑。"},{"name":"香加皮","category":"利水渗湿药","level":"3","page":"","properties":"辛、苦，温，有毒。归肝、肾、心经。","functions":"利水消肿，祛风湿，强筋骨。","functions_full":"香加皮辛苦温有毒，善利水消肿，用于水肿、小便不利。又能祛风湿、强筋骨，用于风湿痹痛。含有强心苷类成分，有强心利尿作用，但毒性较大需严格控制。","dosage":"3~6g，煎服。不宜过量或久服。","notes":"有毒，严格控制用量。心脏病患者慎用。不宜与地高辛等强心苷类药物同用。","indications":"主治水肿小便不利；风湿痹痛。","combinations":"配茯苓、猪苓利水消肿（需控制剂量）；配五加皮、桑寄生祛风湿。","differentiation":"香加皮与五加皮名称相近，但香加皮有毒含强心苷利水力较强，五加皮无毒以祛风湿补肝肾为主。"},{"name":"枳椇子","category":"利水渗湿药","level":"3","page":"","properties":"甘、酸，平。归脾经。","functions":"利水消肿，解酒毒。","functions_full":"枳椇子甘酸平和，善利水消肿，用于水肿、小便不利。尤善解酒毒，为解酒之专药，用于酒醉不醒、烦渴、呕吐。","dosage":"10~15g，煎服。","notes":"无明显禁忌。","indications":"主治水肿小便不利；酒醉不醒、烦渴。","combinations":"配葛花、白茅根解酒毒止烦渴；配茯苓、猪苓利水消肿。","differentiation":"枳椇子与其他利水药不同之处在于兼有独特的解酒醒脾之功。"},{"name":"木通","category":"利水渗湿药","level":"2","page":"","properties":"苦，寒。归心、小肠、膀胱经。","functions":"利尿通淋，清心除烦，通经下乳。","functions_full":"木通苦寒降泄，善利尿通淋，为治热淋涩痛之常用药。用于膀胱湿热之小便短赤、淋沥涩痛。又能清心除烦，用于心火上炎之口舌生疮、心烦尿赤。尚可通经下乳，用于经闭乳少。","dosage":"3~6g，煎服。","notes":"肾功能不全者慎用。孕妇忌用。不宜过量久服（含马兜铃酸类用木通不宜用关木通）。","indications":"主治热淋涩痛、小便短赤；心火上炎之口舌生疮；经闭乳少。","combinations":"配车前子、滑石清热利尿通淋；配生地黄、竹叶清心利尿（导赤散加减）。","differentiation":"木通与通草均能通淋下乳，木通苦寒清心火利尿力强，通草甘淡清热利湿力缓；临床宜用川木通或白木通。"},{"name":"通草","category":"利水渗湿药","level":"3","page":"","properties":"甘、淡，微寒。归肺、胃经。","functions":"清热利尿，通气下乳。","functions_full":"通草甘淡微寒，善清热利尿，用于湿热淋证、小便不利。又能通气下乳，用于产后乳汁不通或乳少。药力缓和，清热而不伤阴。","dosage":"3~5g，煎服。","notes":"孕妇慎用。","indications":"主治湿热淋证、小便不利；产后乳汁不通或乳少。","combinations":"配滑石、竹叶利尿通淋；配穿山甲、王不留行通气下乳。","differentiation":"通草与木通均能清热利尿通乳，通草药力缓和甘淡渗利不伤阴，木通苦寒降泄力强。"},{"name":"瞿麦","category":"利水渗湿药","level":"3","page":"","properties":"苦，寒。归心、小肠经。","functions":"利尿通淋，破血通经。","functions_full":"瞿麦苦寒沉降，善利尿通淋，为治淋证之常用药。用于热淋、血淋、石淋之小便涩痛。又能破血通经，用于血热瘀滞之经闭、月经不调。","dosage":"9~15g，煎服。","notes":"孕妇忌用。","indications":"主治热淋、血淋、石淋；血瘀经闭。","combinations":"配萹蓄、车前子清热利尿通淋（八正散）；配丹参、益母草活血通经。","differentiation":"瞿麦与萹蓄均为利尿通淋常用药常相须为用，瞿麦兼破血通经，萹蓄兼杀虫止痒。"},{"name":"萹蓄","category":"利水渗湿药","level":"3","page":"","properties":"苦，微寒。归膀胱经。","functions":"利尿通淋，杀虫止痒。","functions_full":"萹蓄苦寒清热，善利尿通淋，用于热淋、血淋之小便涩痛。又能杀虫止痒，用于蛔虫病、蛲虫病及湿疹、阴痒。外用煎汤洗浴。","dosage":"9~15g，煎服。外用适量，煎汤洗。","notes":"脾虚者慎用。","indications":"主治热淋、血淋；蛔虫、蛲虫病；湿疹阴痒（外用）。","combinations":"配瞿麦、车前子利尿通淋（八正散）；配使君子、槟榔杀虫。","differentiation":"萹蓄与瞿麦常相须为用，萹蓄偏于杀虫止痒，瞿麦偏于破血通经。"},{"name":"地肤子","category":"利水渗湿药","level":"3","page":"","properties":"辛、苦，寒。归肾、膀胱经。","functions":"清热利湿，祛风止痒。","functions_full":"地肤子辛苦寒，善清热利湿、通利小便，用于热淋涩痛。又能祛风止痒，为皮肤科常用药，用于风疹、湿疹、皮肤瘙痒。","dosage":"9~15g，煎服。外用适量，煎汤洗浴。","notes":"内无湿热者不宜。","indications":"主治热淋涩痛；风疹、湿疹、皮肤瘙痒。","combinations":"配苦参、白鲜皮清热燥湿止痒；配车前草、滑石利尿通淋。","differentiation":"地肤子与白鲜皮均为皮肤科清热燥湿止痒药，地肤子兼利尿通淋，白鲜皮兼清热燥湿力强。"},{"name":"海金沙","category":"利水渗湿药","level":"3","page":"","properties":"甘、咸，寒。归膀胱、小肠经。","functions":"清热利湿，通淋止痛。","functions_full":"海金沙甘寒清利，善清热利湿、通淋止痛，为治诸淋涩痛之要药。用于热淋、石淋、血淋、膏淋之小便涩痛。尤善治石淋。","dosage":"6~15g，煎服。布包入煎。","notes":"阴虚者慎用。","indications":"主治各种淋证之小便涩痛，尤善治石淋。","combinations":"配金钱草、鸡内金治石淋；配车前草、滑石清热通淋。","differentiation":"海金沙与金钱草均为治石淋要药，海金沙通淋止痛力优，金钱草利湿退黄力胜。"},{"name":"石韦","category":"利水渗湿药","level":"3","page":"","properties":"甘、苦，微寒。归肺、膀胱经。","functions":"利尿通淋，清热止血。","functions_full":"石韦甘苦微寒，善利尿通淋，为治淋证常用药。用于热淋、血淋、石淋之小便涩痛。又能清热止血，用于血热之崩漏、吐血、衄血。兼能清肺止咳，用于肺热咳嗽。","dosage":"6~12g，煎服。","notes":"无湿热者慎用。","indications":"主治热淋、血淋、石淋；血热出血；肺热咳喘。","combinations":"配车前子、滑石利尿通淋；配白茅根、蒲黄凉血止血。","differentiation":"石韦与海金沙均能利尿通淋，石韦兼清热止血宜于血淋，海金沙通淋止痛力强宜于石淋。"},{"name":"冬葵子","category":"利水渗湿药","level":"3","page":"","properties":"甘、涩，凉。归大肠、小肠、膀胱经。","functions":"利尿通淋，下乳润肠。","functions_full":"冬葵子甘润滑利，善利尿通淋，用于热淋、石淋、水肿。又能下乳润肠，用于产后乳汁不通、乳房胀痛及肠燥便秘。","dosage":"3~9g，煎服。","notes":"孕妇慎用。脾虚便溏者不宜。","indications":"主治淋证涩痛、水肿；乳汁不通、乳痈初起；肠燥便秘。","combinations":"配车前子、滑石利尿通淋；配穿山甲、通草下乳。","differentiation":"冬葵子与通草均能通淋下乳，冬葵子兼润肠通便，通草兼清热利湿。"},{"name":"灯心草","category":"利水渗湿药","level":"3","page":"","properties":"甘、淡，微寒。归心、肺、小肠经。","functions":"利尿通淋，清心除烦。","functions_full":"灯心草甘淡微寒，善利尿通淋，用于淋证小便不利。又能清心除烦，用于心烦失眠、小儿夜啼。外用可吹喉治喉痹。","dosage":"1~3g，煎服。外用适量，烧炭研末吹喉。","notes":"虚寒者慎用。","indications":"主治热淋小便不利；心烦失眠、小儿夜啼；外用治喉痹。","combinations":"配竹叶、栀子清心利尿除烦；配车前子利水通淋。","differentiation":"灯心草与竹叶均能清心利尿除烦，灯心草以利尿为主，竹叶以清热除烦为主。"},{"name":"萆薢","category":"利水渗湿药","level":"2","page":"","properties":"苦，平。归肾、胃经。","functions":"利湿去浊，祛风除痹。","functions_full":"萆薢苦平，善利湿去浊，为治膏淋、白浊之要药。用于小便浑浊、白如米泔之膏淋及湿热带下。又能祛风除湿，用于风湿痹痛、腰膝疼痛。","dosage":"9~15g，煎服。","notes":"肾虚阴亏者慎用。","indications":"主治膏淋、白浊；湿热带下；风湿痹痛。","combinations":"配石菖蒲、益智仁利湿分清化浊（萆薢分清饮）；配独活、威灵仙祛风除湿。","differentiation":"萆薢与车前子均能利湿，萆薢以分清化浊治膏淋为主，车前子以清热通淋治热淋为主。"},{"name":"地耳草","category":"利水渗湿药","level":"3","page":"","properties":"甘、苦，凉。归肝、胆经。","functions":"利湿退黄，清热解毒，活血消肿。","functions_full":"地耳草甘苦凉泄，善利湿退黄，用于湿热黄疸。又能清热解毒，用于痈肿疮毒。兼能活血消肿，用于跌打损伤。","dosage":"15~30g（鲜品加倍），煎服。外用适量，鲜品捣敷。","notes":"孕妇慎用。","indications":"主治湿热黄疸；痈肿疮毒；跌打损伤肿痛。","combinations":"配茵陈、金钱草利湿退黄；配蒲公英、紫花地丁清热解毒。","differentiation":"地耳草与垂盆草均能利湿退黄，地耳草兼活血消肿，垂盆草兼清热解毒降酶。"},{"name":"垂盆草","category":"利水渗湿药","level":"3","page":"","properties":"甘、淡，凉。归肝、胆、小肠经。","functions":"利湿退黄，清热解毒。","functions_full":"垂盆草甘淡凉，善利湿退黄，为治湿热黄疸之常用草药。用于湿热黄疸、小便黄赤。又能清热解毒，用于痈肿疮毒、毒蛇咬伤。现代研究有降低转氨酶作用，用于肝炎。","dosage":"15~30g（鲜品250g），煎服。外用适量，鲜品捣敷。","notes":"脾胃虚寒者慎用。","indications":"主治湿热黄疸（急性肝炎）；痈肿疮毒、毒蛇咬伤。","combinations":"配茵陈、板蓝根利湿退黄降酶；配蒲公英、紫花地丁解毒消痈。","differentiation":"垂盆草与金钱草均能利湿退黄，垂盆草以降低转氨酶为特长，金钱草以排石通淋为特长。"},{"name":"鸡骨草","category":"利水渗湿药","level":"3","page":"","properties":"甘、微苦，凉。归肝、胃经。","functions":"利湿退黄，清热解毒，疏肝止痛。","functions_full":"鸡骨草甘凉清解，善利湿退黄，用于湿热黄疸。又能清热解毒、疏肝止痛，用于胁肋不舒、胃脘胀痛。现代常用于急慢性肝炎、肝硬化腹水。","dosage":"15~30g，煎服。","notes":"种子有毒，使用前须摘除豆荚。","indications":"主治湿热黄疸（肝炎）；胁肋疼痛、肝郁气滞；肝硬化腹水（辅助）。","combinations":"配茵陈、田基黄利湿退黄；配柴胡、白芍疏肝柔肝。","differentiation":"鸡骨草与田基黄均为华南常用治肝炎草药，鸡骨草兼疏肝止痛，田基黄兼活血消肿。"},{"name":"珍珠草","category":"利水渗湿药","level":"3","page":"","properties":"甘、苦，凉。归肝、肺经。","functions":"利湿退黄，清热解毒，明目消积。","functions_full":"珍珠草甘苦凉，善利湿退黄，用于湿热黄疸、泻痢。又能清热解毒明目，用于目赤肿痛、目翳。兼能消积，用于小儿疳积。","dosage":"15~30g（鲜品加倍），煎服。外用适量。","notes":"脾胃虚寒者慎用。","indications":"主治湿热黄疸、痢疾；目赤肿痛、翳障；小儿疳积。","combinations":"配夏枯草、菊花清热解毒明目；配鸡内金、使君子消疳积。","differentiation":"珍珠草与青葙子均能清热明目，珍珠草兼利湿退黄消疳积，青葙子苦寒清肝泻火力强。"},{"name":"高良姜","category":"温里药","level":"2","page":"","properties":"辛，热。归脾、胃经。","functions":"温胃散寒，消食止痛。","functions_full":"高良姜辛热纯阳，善温胃散寒止痛，为治胃寒脘腹冷痛之要药。用于寒凝气滞之胃痛、呕吐、呃逆。又能消食，用于食积不化之胃寒腹痛。","dosage":"3~6g，煎服。研末服每次1~1.5g。","notes":"阴虚有热者忌用。","indications":"主治胃寒脘腹冷痛、呕吐清水、呃逆。","combinations":"配干姜增强温中散寒之力；配香附温中行气止痛（良附丸）。","differentiation":"高良姜与干姜均能温中散寒，高良姜偏于温胃散寒止痛治胃寒痛，干姜偏于温脾散寒止泻治脾寒泻。"},{"name":"花椒","category":"温里药","level":"3","page":"","properties":"辛，温。归脾、胃、肾经。","functions":"温中止痛，杀虫止痒。","functions_full":"花椒辛温香燥，善温中止痛，用于脾胃虚寒之脘腹冷痛、呕吐泄泻。又能杀虫，用于蛔虫腹痛、吐蛔。外用燥湿止痒，用于湿疹瘙痒。","dosage":"3~6g，煎服。外用适量，煎汤熏洗。","notes":"阴虚火旺者忌用。孕妇慎用。","indications":"主治中寒腹痛、呕吐泄泻；蛔虫腹痛；外用治湿疹阴痒。","combinations":"配干姜、人参温中补虚止痛（大建中汤）；配乌梅、黄连安蛔止痛。","differentiation":"花椒与吴茱萸均能温中止痛，花椒兼杀虫止痒为药食两用之品，吴茱萸兼降逆止呕散寒。"},{"name":"胡椒","category":"温里药","level":"3","page":"","properties":"辛，热。归胃、大肠经。","functions":"温中散寒，下气消痰。","functions_full":"胡椒辛热纯阳，善温中散寒止痛，用于胃寒脘腹冷痛、呕吐泄泻。又能下气消痰，用于痰气郁滞之癫痫。为常用调味品亦可药用。","dosage":"0.6~1.5g，研末吞服。外用适量。","notes":"阴虚有热者忌用。","indications":"主治胃寒呕吐、腹痛泄泻；食欲不振。","combinations":"配高良姜、荜茇温中散寒止痛；配半夏、天南星消痰。","differentiation":"胡椒与花椒均为温中散寒之调味佳品，胡椒性热温中力强，花椒兼杀虫之功。"},{"name":"荜茇","category":"温里药","level":"3","page":"","properties":"辛，热。归胃、大肠经。","functions":"温中散寒，下气止痛。","functions_full":"荜茇辛热，善温中散寒止痛，用于胃寒脘腹冷痛、呕吐泄泻。又能下气止痛，用于寒凝气滞之胸痹心痛、头痛。外用可治牙痛。","dosage":"1.5~3g，煎服。外用适量，研末塞龋齿孔中。","notes":"阴虚火旺者忌用。","indications":"主治胃寒呕吐、脘腹冷痛；寒凝胸痹心痛；牙痛（外用）。","combinations":"配高良姜、胡椒温中止痛；配细辛、白芷散寒治头痛。","differentiation":"荜茇与荜澄茄均为温中散寒止痛药，荜茇温中力偏胜，荜澄茄兼行气。"},{"name":"荜澄茄","category":"温里药","level":"3","page":"","properties":"辛，温。归脾、胃、肾、膀胱经。","functions":"温中散寒，行气止痛。","functions_full":"荜澄茄辛温，善温中散寒行气止痛，用于胃寒脘腹冷痛、呕吐呃逆。又能散寒行气，用于寒疝腹痛、小便不利。","dosage":"1.5~3g，煎服。","notes":"阴虚火旺者忌用。","indications":"主治胃寒腹痛、呕吐呃逆；寒疝腹痛；小便不利。","combinations":"配吴茱萸、小茴香温中行气止痛；配乌药、木香散寒行气。","differentiation":"荜澄茄与荜茇名称相近功效类似，荜澄茄行气力稍胜，荜茇温中力稍强。"},{"name":"沉香","category":"理气药","level":"2","page":"","properties":"辛、苦，微温。归脾、胃、肾经。","functions":"行气止痛，温中止呕，纳气平喘。","functions_full":"沉香辛香温通，质量沉降，善行气止痛，用于寒凝气滞之胸腹胀痛。又能温中止呕，用于胃寒呕吐、呃逆。尚能温肾纳气平喘，用于肾不纳气之虚喘。为理气降逆之佳品。","dosage":"1~5g，煎服，宜后下。研末吞服0.5~1g。","notes":"阴虚火旺者慎用。","indications":"主治寒凝气滞之胸腹胀痛；胃寒呕吐呃逆；肾虚气逆喘息。","combinations":"配乌药、木香行气止痛；配附子、肉桂温肾纳气。","differentiation":"沉香与木香均为行气止痛药，沉香质量沉降兼温肾纳气，木香偏于行胃肠气滞。"},{"name":"檀香","category":"理气药","level":"3","page":"","properties":"辛，温。归脾、胃、心、肺经。","functions":"行气温中，开胃止痛。","functions_full":"檀香辛温芳香，善行气温中止痛，用于寒凝气滞之胸腹冷痛、胃寒呕吐。又能开胃进食，用于食欲不振。为理气止痛之良药。","dosage":"2~5g，煎服，宜后下。","notes":"阴虚火旺者慎用。","indications":"主治寒凝气滞之胸腹冷痛；胃寒呕吐、食欲不振。","combinations":"配砂仁、丁香温中行气止痛；配丹参、砂仁活血行气（丹参饮加减）。","differentiation":"檀香与沉香均为名贵理气药，檀香以行气温中为主，沉香以降气纳肾为主。"},{"name":"荔枝核","category":"理气药","level":"3","page":"","properties":"甘、微苦，温。归肝、肾经。","functions":"行气散结，祛寒止痛。","functions_full":"荔枝核甘温，善行气散结、祛寒止痛，为治疝气疼痛之常用药。用于寒疝腹痛、睾丸肿痛。又能理气止痛，用于胃脘疼痛、痛经及产后腹痛。","dosage":"4.5~9g，煎服。","notes":"无寒湿气滞者慎用。","indications":"主治寒疝腹痛、睾丸肿痛；胃脘痛、痛经、产后腹痛。","combinations":"配橘核、小茴香行气散寒治疝（疝气汤）；配香附、延胡索理气止痛。","differentiation":"荔枝核与橘核均为治疝气专药，荔枝核以散寒止痛为主，橘核以理气散结为主。"},{"name":"佛手","category":"理气药","level":"2","page":"","properties":"辛、苦，温。归肝、脾、胃、肺经。","functions":"疏肝理气，和胃止痛，燥湿化痰。","functions_full":"佛手辛苦温，芳香醒脾，善疏肝理气、和胃止痛，用于肝胃气滞之胸胁胀痛、胃脘痞满。又能燥湿化痰，用于咳嗽痰多。药性平和，肝胃不和之常用药。","dosage":"3~9g，煎服。","notes":"阴虚燥咳者慎用。","indications":"主治肝胃气滞之胸胁胀痛、胃脘痞满；咳嗽痰多。","combinations":"配香附、陈皮疏肝和胃理气；配半夏、茯苓燥湿化痰。","differentiation":"佛手与香橼功效相似常相互替代，佛手偏于理气和胃止痛，香橼偏于化痰。"},{"name":"香橼","category":"理气药","level":"3","page":"","properties":"辛、微苦、酸，温。归肝、脾、胃、肺经。","functions":"疏肝理气，宽中化痰。","functions_full":"香橼辛苦酸温，善疏肝理气宽中，用于肝气郁滞之胸胁胀痛、胃脘痞闷。又能化痰，用于痰饮咳嗽、胸膈不利。","dosage":"3~9g，煎服。","notes":"阴虚血燥者慎用。","indications":"主治肝气郁滞之胸胁胀痛、胃脘痞闷；痰饮咳嗽。","combinations":"配陈皮、佛手理气宽中；配半夏、茯苓化痰止咳。","differentiation":"香橼与佛手功效极相似常可互代，香橼化痰力偏胜，佛手理气和胃力偏胜。"},{"name":"玫瑰花","category":"理气药","level":"3","page":"","properties":"甘、微苦，温。归肝、脾经。","functions":"行气解郁，和血止痛。","functions_full":"玫瑰花甘温芳香，善行气解郁，用于肝胃气痛、胸胁胀闷。又能和血散瘀，用于月经不调、经前乳房胀痛及跌打损伤。为妇科调经理气之佳品。","dosage":"3~6g，煎服。","notes":"阴虚火旺者慎用。","indications":"主治肝胃气痛、胸胁胀闷；月经不调、经前乳房胀痛；跌打损伤瘀痛。","combinations":"配香附、佛手疏肝理气解郁；配当归、丹参和血调经。","differentiation":"玫瑰花与月季花均为花类理气活血药，玫瑰花偏于理气解郁，月季花偏于活血调经。"},{"name":"梅花","category":"理气药","level":"3","page":"","properties":"微酸、涩，平。归肝、胃、肺经。","functions":"疏肝解郁，理气和胃，化痰散结。","functions_full":"梅花微酸平，善疏肝解郁、理气和胃，用于肝气郁滞之胸胁胀痛、胃脘不适。又能化痰散结，用于梅核气（咽部异物感）、瘰疬痰核。","dosage":"3~5g，煎服。","notes":"无明显禁忌。","indications":"主治肝气郁滞之胸胁胀痛；梅核气；瘰疬痰核。","combinations":"配佛手、香橼疏肝理气；配半夏、厚朴化痰散结（半夏厚朴汤加减）。","differentiation":"梅花与玫瑰花均为花类理气药，梅花兼化痰散结治梅核气，玫瑰花兼和血调经。"},{"name":"娑罗子","category":"理气药","level":"3","page":"","properties":"甘，温。归肝、胃经。","functions":"疏肝理气，和胃止痛。","functions_full":"娑罗子甘温，善疏肝理气和胃止痛，用于肝胃气滞之胸胁胀痛、胃脘疼痛、经前乳房胀痛。为理气止痛之辅助药。","dosage":"3~9g，煎服。","notes":"阴虚火旺者慎用。","indications":"主治肝胃气滞之胸胁胀痛、胃痛、经前乳胀。","combinations":"配佛手、香附疏肝理气止痛；配延胡索增强止痛之效。","differentiation":"娑罗子与佛手均能疏肝和胃止痛，娑罗子以止痛为主，佛手以理气化滞为主。"},{"name":"薤白","category":"理气药","level":"2","page":"","properties":"辛、苦，温。归心、肺、胃、大肠经。","functions":"通阳散结，行气导滞。","functions_full":"薤白辛苦温，善通阳散结、行气导滞，为治胸痹之要药。用于寒痰湿浊凝滞胸中之胸闷胸痛、心痛彻背。又能行气导滞，用于胃寒气滞之脘腹痞满、泻痢后重。","dosage":"5~9g，煎服。","notes":"气虚者慎用。","indications":"主治胸痹心痛（冠心病心绞痛）；脘腹痞满、泻痢后重。","combinations":"配瓜蒌、半夏通阳散结祛痰（瓜蒌薤白半夏汤）；配木香、枳实行气导滞。","differentiation":"薤白与瓜蒌均为治胸痹药常相须为用，薤白辛温通阳散结为主，瓜蒌甘寒宽胸化痰为主。"},{"name":"甘松","category":"理气药","level":"3","page":"","properties":"辛、甘，温。归脾、胃经。","functions":"行气止痛，开郁醒脾。","functions_full":"甘松辛甘温，善行气止痛、开郁醒脾，用于寒凝气滞之脘腹胀痛、不思饮食。又能开郁醒脾，用于思虑伤脾之胸闷脘痞、食欲不振。为芳香醒脾之品。","dosage":"3~6g，煎服。外用适量，泡汤含漱或熏洗。","notes":"气虚血热者慎用。","indications":"主治寒凝气滞之脘腹胀痛、食欲不振；忧郁伤脾之胸闷不舒。","combinations":"配木香、砂仁行气止痛醒脾；配柴胡、香附疏肝理气。","differentiation":"甘松与木香均能行气止痛，甘松开郁醒脾力优宜于脾郁气滞，木香行胃肠气滞力强宜于食积气滞。"},{"name":"九香虫","category":"理气药","level":"3","page":"","properties":"咸，温。归肝、脾、肾经。","functions":"理气止痛，温肾助阳。","functions_full":"九香虫咸温，善理气止痛，用于肝胃气滞之胸胁胀痛、胃脘疼痛。又能温肾助阳，用于肾阳不足之阳痿、腰膝酸软。为虫类理气温阳之品。","dosage":"3~9g，煎服。","notes":"阴虚内热者忌用。","indications":"主治肝胃气滞之胸胁胀痛、胃痛；肾虚阳痿、腰膝酸痛。","combinations":"配香附、延胡索理气止痛；配淫羊藿、巴戟天温肾助阳。","differentiation":"九香虫与其他理气药不同之处在于兼具温肾助阳之功，为理气药中温补之品。"},{"name":"刀豆","category":"理气药","level":"3","page":"","properties":"甘，温。归胃、肾经。","functions":"温中下气，益肾补元。","functions_full":"刀豆甘温，善温中下气止呃，用于虚寒呃逆、呕吐。又能益肾补元，用于肾虚腰痛。为药食两用之品。","dosage":"6~9g，煎服。","notes":"胃热呃逆者不宜。","indications":"主治虚寒呃逆、呕吐；肾虚腰痛。","combinations":"配丁香、柿蒂温中止呃；配杜仲、续断益肾强腰。","differentiation":"刀豆与柿蒂均为止呃逆药，刀豆偏温中兼益肾，柿蒂性平专为止呃。"},{"name":"柿蒂","category":"理气药","level":"3","page":"","properties":"苦、涩，平。归胃经。","functions":"降气止呃。","functions_full":"柿蒂苦涩平，为降气止呃之专药。用于各种原因之呃逆，无论寒热虚实均可配伍使用。","dosage":"4.5~9g，煎服。","notes":"无明显禁忌。","indications":"主治各种呃逆。","combinations":"配丁香、生姜温中止呃（丁香柿蒂汤）；配竹茹、芦根清热止呃。","differentiation":"柿蒂与刀豆均能止呃逆，柿蒂性平为止呃专药适用范围广，刀豆偏于温中止呃兼益肾。"},{"name":"六神曲","category":"消食药","level":"3","page":"","properties":"甘、辛，温。归脾、胃经。","functions":"消食和胃。","functions_full":"六神曲甘辛温，善消食和胃，为多种发酵药制成，消食面广。用于饮食积滞之脘腹胀满、食少纳呆。尤善消米面食积。兼能解表，用于感冒食滞。","dosage":"6~15g，煎服。","notes":"胃火盛者不宜。","indications":"主治饮食积滞之脘腹胀满、食少；尤善治米面食积；感冒夹食滞。","combinations":"配山楂、麦芽消食导滞（焦三仙）；配紫苏叶、藿香解表和胃。","differentiation":"六神曲与麦芽均为消食药，六神曲消食面广善消米面食积，麦芽善消淀粉类食积兼回乳。"},{"name":"稻芽","category":"消食药","level":"3","page":"","properties":"甘，温。归脾、胃经。","functions":"消食和中，健脾开胃。","functions_full":"稻芽甘温，善消食和中健脾开胃，作用缓和。用于食积不化、脘腹胀满、食欲不振。尤善消米薯芋类食积。炒用偏消食，生用偏和中。","dosage":"9~15g，煎服。","notes":"无明显禁忌。","indications":"主治米面薯芋类食积不化；脾胃虚弱之食欲不振。","combinations":"配麦芽、山楂增强消食之力；配白术、党参健脾开胃。","differentiation":"稻芽与麦芽功效相似，稻芽作用更缓和宜于轻证及脾虚者，麦芽消食力稍强兼回乳。"},{"name":"南瓜子","category":"驱虫药","level":"3","page":"","properties":"甘，平。归胃、大肠经。","functions":"杀虫。","functions_full":"南瓜子甘平无毒，善杀虫，为驱绦虫之良药。用于绦虫病、蛔虫病、血吸虫病。对绦虫有麻痹作用，且无毒性，为安全驱虫药。","dosage":"30~60g（鲜品加倍），研末冷开水调服。","notes":"一般无明显不良反应。","indications":"主治绦虫病；亦可驱蛔虫、血吸虫。","combinations":"配槟榔增强驱绦虫之效（槟榔南瓜子合剂）；单用即可取效。","differentiation":"南瓜子与槟榔均为驱绦虫要药，南瓜子甘平无毒宜于儿童及体弱者，槟榔兼行气导滞但驱虫需较大剂量。"},{"name":"鹤草芽","category":"驱虫药","level":"3","page":"","properties":"苦、涩，凉。归肝、小肠、大肠经。","functions":"杀虫。","functions_full":"鹤草芽苦涩凉，善杀虫，为驱绦虫之特效药。用于绦虫病。所含鹤草酚对绦虫头节有强杀灭作用。","dosage":"30~45g，研末吞服，不入煎剂。","notes":"服药后偶有恶心呕吐。不入煎剂。","indications":"主治绦虫病。","combinations":"单用即可取效；也可配南瓜子、槟榔增强。","differentiation":"鹤草芽为现代发现的驱绦虫特效药，杀虫作用强于南瓜子和槟榔。"},{"name":"雷丸","category":"驱虫药","level":"3","page":"","properties":"微苦，寒。归胃、大肠经。","functions":"杀虫消积。","functions_full":"雷丸苦寒，善杀虫消积，对绦虫、蛔虫、钩虫均有杀灭作用。用于绦虫病、蛔虫病、钩虫病。所含雷丸素为蛋白水解酶，加热失效，宜生用。","dosage":"15~21g，研末吞服，不入煎剂。","notes":"不宜入煎剂（有效成分60℃即破坏）。脾胃虚寒者慎用。","indications":"主治绦虫病、蛔虫病、钩虫病。","combinations":"配槟榔、木香杀虫消积；单用研末服即可。","differentiation":"雷丸与鹤草芽均为须生用不入煎剂的驱虫药，雷丸杀虫范围更广。"},{"name":"鹤虱","category":"驱虫药","level":"3","page":"","properties":"苦、辛，平，有小毒。归脾、胃经。","functions":"杀虫消积。","functions_full":"鹤虱辛苦平有小毒，善杀虫消积，用于蛔虫病、蛲虫病、绦虫病之虫积腹痛。以驱蛔虫、蛲虫为主。","dosage":"3~9g，煎服。","notes":"有小毒，不宜过量。","indications":"主治蛔虫、蛲虫病之虫积腹痛。","combinations":"配使君子、槟榔增强驱蛔之力；配苦楝皮、芜荑杀虫消积。","differentiation":"鹤虱与使君子均为驱蛔药，鹤虱有小毒兼驱蛲虫绦虫，使君子甘温无毒宜于小儿。"},{"name":"榧子","category":"驱虫药","level":"3","page":"","properties":"甘，平。归肺、胃、大肠经。","functions":"杀虫消积，润肺止咳。","functions_full":"榧子甘平，善杀虫消积，用于蛔虫病、绦虫病、钩虫病。药性平和，驱虫而不伤正。又能润肺止咳，用于肺燥咳嗽。","dosage":"9~15g，煎服。炒熟嚼食每次10~20粒。","notes":"便溏者不宜。","indications":"主治蛔虫、绦虫、钩虫病；肺燥咳嗽。","combinations":"配使君子、槟榔驱虫；配川贝母、瓜蒌润肺止咳。","differentiation":"榧子与南瓜子均为甘平无毒驱虫药，榧子驱虫范围广兼润肺止咳，南瓜子驱绦虫力专。"},{"name":"芜荑","category":"驱虫药","level":"3","page":"","properties":"辛、苦，温。归脾、胃经。","functions":"杀虫消积。","functions_full":"芜荑辛苦温，善杀虫消积，用于蛔虫、绦虫、蛲虫病之虫积腹痛。外用可治疥癣。","dosage":"3~9g，煎服。外用适量，研末调敷。","notes":"脾胃虚弱者慎用。","indications":"主治蛔虫、绦虫、蛲虫病；外用治疥癣。","combinations":"配使君子、槟榔驱虫消积；配苦楝皮、鹤虱杀虫。","differentiation":"芜荑与榧子均为传统驱虫药，芜荑辛散杀虫力较强有异味，榧子甘平兼润肺止咳口味好。"},{"name":"苎麻根","category":"止血药","level":"3","page":"","properties":"甘，寒。归心、肝经。","functions":"凉血止血，清热安胎，利尿解毒。","functions_full":"苎麻根甘寒，善凉血止血，用于血热妄行之各种出血。又能清热安胎，为安胎要药，用于胎热不安、胎漏下血。兼能利尿解毒，用于热淋、痈肿疮毒。","dosage":"10~30g，煎服。外用适量，鲜品捣敷。","notes":"脾胃虚寒者慎用。","indications":"主治血热之咯血、衄血、崩漏；胎热不安、胎漏下血；热淋涩痛；痈肿疮毒。","combinations":"配黄芩、阿胶安胎止血；配生地、侧柏叶凉血止血。","differentiation":"苎麻根与黄芩均为清热安胎药，苎麻根凉血止血利尿，黄芩清热燥湿泻火。"},{"name":"羊蹄","category":"止血药","level":"3","page":"","properties":"苦、涩，寒。归心、肝、大肠经。","functions":"凉血止血，杀虫疗癣。","functions_full":"羊蹄苦涩寒，善凉血止血，用于血热妄行之吐血、衄血、便血、崩漏。又能杀虫疗癣，外用治疥癣、疮疡。兼能泻下通便，用于热结便秘。","dosage":"10~15g，煎服。外用适量，鲜品捣敷或煎水洗。","notes":"脾胃虚寒者忌服。","indications":"主治血热出血；疥癣、疮疡（外用）；热结便秘。","combinations":"配侧柏叶、地榆凉血止血；配苦参、白鲜皮杀虫止痒。","differentiation":"羊蹄与地榆均能凉血止血，羊蹄兼杀虫疗癣通便，地榆兼解毒敛疮。"},{"name":"茜草","category":"止血药","level":"2","page":"","properties":"苦，寒。归肝经。","functions":"凉血止血，活血祛瘀。","functions_full":"茜草苦寒，既能凉血止血，又能活血祛瘀，止血而不留瘀，为妇科调经止血要药。用于血热夹瘀之崩漏、月经过多、衄血、咯血等出血证。又能活血通经，用于血瘀经闭、跌打损伤、风湿痹痛。","dosage":"6~9g，煎服。止血炒炭用，活血生用。","notes":"脾胃虚寒者慎用。","indications":"主治血热夹瘀之各种出血（崩漏、衄血）；血瘀经闭、跌打损伤。","combinations":"配蒲黄、三七化瘀止血；配桃仁、红花活血通经。","differentiation":"茜草与蒲黄均为化瘀止血药，茜草凉血止血兼活血通经，蒲黄收敛止血兼化瘀利尿。"},{"name":"花蕊石","category":"止血药","level":"3","page":"","properties":"酸、涩，平。归肝经。","functions":"化瘀止血。","functions_full":"花蕊石酸涩平，善化瘀止血，止血而不留瘀，为化瘀止血之良药。用于吐血、衄血、咯血等出血兼有瘀滞者。外用可收敛止血生肌。","dosage":"4.5~9g，煎服。研末吞服1~1.5g。外用适量，研末撒。","notes":"无瘀滞者慎用。孕妇忌用。","indications":"主治瘀血内阻之吐血、衄血、咯血；外伤出血（外用）。","combinations":"配三七、白及化瘀止血；配血余炭增强止血之力。","differentiation":"花蕊石与三七均为化瘀止血药，花蕊石以收敛化瘀止血为主，三七止血兼活血定痛力强。"},{"name":"紫珠叶","category":"止血药","level":"3","page":"","properties":"苦、涩，凉。归肝、肺、胃经。","functions":"收敛止血，清热解毒。","functions_full":"紫珠叶苦涩凉，善收敛止血，兼能清热解毒。用于各种内外出血证，如肺胃出血、外伤出血。又能解毒疗疮，用于烧烫伤、疮疡肿毒。","dosage":"10~15g，煎服。研末吞服1.5~3g。外用适量，研末撒或鲜品捣敷。","notes":"虚寒出血者慎用。","indications":"主治各种出血证（咯血、衄血、吐血、外伤出血）；烧烫伤、疮疡。","combinations":"配白及、仙鹤草增强止血之力；配地榆外用治烧烫伤。","differentiation":"紫珠叶与白及均为收敛止血药，紫珠叶兼清热解毒宜于血热出血，白及兼消肿生肌宜于肺胃出血。"},{"name":"棕榈炭","category":"止血药","level":"3","page":"","properties":"苦、涩，平。归肝、肺、大肠经。","functions":"收敛止血。","functions_full":"棕榈炭苦涩平，为收涩止血之专药。用于各种出血而无瘀滞者，如咯血、衄血、便血、崩漏。炭炒后收敛止血力增强。","dosage":"3~9g，煎服。研末吞服1~1.5g。","notes":"出血兼有瘀滞者不宜单独使用。","indications":"主治咯血、衄血、便血、崩漏等出血无瘀滞者。","combinations":"配血余炭、藕节炭增强收敛止血；配侧柏叶、仙鹤草止血。","differentiation":"棕榈炭与血余炭均为炭类止血药，棕榈炭为单纯收敛止血，血余炭兼能化瘀利尿。"},{"name":"血余炭","category":"止血药","level":"3","page":"","properties":"苦，平。归肝、胃经。","functions":"收敛止血，化瘀利尿。","functions_full":"血余炭为人发煅炭而成，善收敛止血而兼化瘀，止血而不留瘀。用于各种出血证。又能利尿，用于小便不利。为止血不留瘀之良药。","dosage":"5~10g，煎服。研末吞服1.5~3g。","notes":"胃弱者慎用。","indications":"主治各种出血证；小便不利。","combinations":"配棕榈炭、藕节炭增强止血；配滑石、车前子化瘀利尿。","differentiation":"血余炭与棕榈炭均为煅炭止血药，血余炭化瘀兼利尿，棕榈炭纯收敛止血。"},{"name":"藕节","category":"止血药","level":"3","page":"","properties":"甘、涩，平。归肝、肺、胃经。","functions":"收敛止血。","functions_full":"藕节甘涩平，善收敛止血兼能化瘀，止血而不留瘀。用于各种出血证，尤宜于吐血、咯血、衄血。生用化瘀止血，炭用收敛止血。","dosage":"9~15g，煎服。","notes":"无明显禁忌。","indications":"主治吐血、咯血、衄血等出血证。","combinations":"配白及、侧柏叶凉血止血；配三七、蒲黄化瘀止血。","differentiation":"藕节与白及均为收敛止血药，藕节兼能化瘀止血不留瘀，白及兼消肿生肌宜于肺胃。"},{"name":"炮姜","category":"止血药","level":"3","page":"","properties":"苦、涩，温。归脾、肝经。","functions":"温经止血，温中止痛。","functions_full":"炮姜为干姜砂烫炮制而成，苦温涩敛，善温经止血，用于虚寒性吐血、便血、崩漏。又能温中止痛止泻，用于脾胃虚寒之腹痛泄泻。","dosage":"3~6g，煎服。","notes":"血热出血者忌用。","indications":"主治虚寒性吐血、便血、崩漏；脾胃虚寒之腹痛泄泻。","combinations":"配艾叶、灶心土温经止血；配干姜、白术温中止痛。","differentiation":"炮姜与艾叶均为温经止血药，炮姜偏温脾经止血，艾叶偏温胞宫止血安胎。"},{"name":"灶心土","category":"止血药","level":"3","page":"","properties":"辛，温。归脾、胃经。","functions":"温中止血，止呕止泻。","functions_full":"灶心土为久经柴草熏烧的灶底中心黄土，辛温，善温中止血，为治虚寒性出血之要药。用于虚寒性吐血、衄血、便血、崩漏。又能温中止呕止泻，用于脾胃虚寒之呕吐泄泻及妊娠恶阻。","dosage":"15~30g，煎服。布包先煎，或煎汤代水。","notes":"热盛出血者忌用。","indications":"主治虚寒性吐血、便血、崩漏；脾胃虚寒之呕吐、泄泻、妊娠恶阻。","combinations":"配炮姜、艾叶温经止血；配半夏、生姜温中止呕。","differentiation":"灶心土与炮姜均为温中止血药，灶心土以温中止呕止血为主，炮姜以温经止痛止血为主。"},{"name":"姜黄","category":"活血化瘀药","level":"2","page":"","properties":"辛、苦，温。归肝、脾经。","functions":"破血行气，通经止痛。","functions_full":"姜黄辛苦温，善破血行气、通经止痛，为血中气药。用于气滞血瘀之胸胁刺痛、经闭痛经、癥瘕积聚。又能通经止痛，用于风湿痹痛，尤善治肩臂疼痛。","dosage":"3~9g，煎服。外用适量。","notes":"孕妇忌用。血虚无气滞者慎用。","indications":"主治血瘀气滞之胸胁疼痛、经闭痛经；风湿肩臂疼痛。","combinations":"配郁金、延胡索活血行气止痛；配桂枝、羌活祛风除湿治肩臂痛。","differentiation":"姜黄与郁金同出一源但药用部位不同：姜黄为根茎偏于活血行气，郁金为块根偏于行气解郁凉血。"},{"name":"五灵脂","category":"活血化瘀药","level":"3","page":"","properties":"苦、咸、甘，温。归肝经。","functions":"活血止痛，化瘀止血。","functions_full":"五灵脂苦温，善活血止痛，为血瘀诸痛之要药。用于瘀血阻滞之胸腹刺痛、痛经、产后腹痛。又能化瘀止血，用于瘀血内阻之出血。","dosage":"3~9g，煎服。布包入煎。","notes":"孕妇慎用。不宜与人参同用（十九畏）。","indications":"主治瘀血阻滞之胸腹刺痛、痛经、产后腹痛；瘀血出血。","combinations":"配蒲黄活血止痛化瘀（失笑散）；配延胡索、没药活血止痛。","differentiation":"五灵脂与蒲黄常相须为用（失笑散），五灵脂偏于活血止痛，蒲黄偏于化瘀止血利尿。"},{"name":"降香","category":"活血化瘀药","level":"3","page":"","properties":"辛，温。归肝、脾
