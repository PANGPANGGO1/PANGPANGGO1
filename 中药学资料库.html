<script type="application/json" id="herbsDataEl">
[{"name":"麻黄","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":69,"properties":"辛，微苦，温．归肺，膀胱经。","functions":"发汗解表、宣肺平喘、利水消肿、温经止痛","functions_full":"麻黄峻汗表实寒，风水痹痛与咳喘 \n１发汗解表——风寒实证，常与桂枝相须为用\n                                            风寒喘咳（三拗汤）\n ２宣肺平喘——喘咳实证   寒饮喘咳（小青龙汤）\n                                        肺热喘咳（麻杏石甘汤）\n３利水消肿——水肿兼有表证（越婢加术汤）\n４温经止痛——风湿痹痛，阴疽及痰核等","dosage":"煎服，3-10g","notes":"表虚自汗慎用 阴虚盗汗慎用 虚喘慎用","indications":"①风寒表实证之恶寒发热、无汗而喘、头身疼痛，常配桂枝；②咳嗽气喘，尤宜于风寒束肺之喘咳实证；③风水水肿，身面浮肿，小便不利，常配石膏、生姜、甘草；④风寒湿痹、阴疽痰核。","combinations":"麻黄配桂枝：一温散卫分之寒，一透达营分之风，峻发其汗，治风寒表实证；麻黄配杏仁：一宣一降，宣降肺气，止咳平喘；麻黄配石膏：一散一清，清泄肺热，治肺热喘咳；麻黄配附子：助阳解表，治阳虚外感。","differentiation":"麻黄vs桂枝：均发散风寒，治风寒表证。麻黄发汗力强，主散卫分之风寒，兼宣肺平喘、利水消肿；桂枝发汗力弱，主透达营分之邪，兼温通经脉、助阳化气。麻黄治表实证，桂枝治表虚证。"},{"name":"桂枝","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":74,"properties":"辛，甘，温。归心，肺，膀胱经","functions":"发汗解表、温经止痛、助阳化气","functions_full":"桂枝温卫善解肌，温经通脉化水气 \n                                                   表实无汗（麻黄汤）\n1.     发汗解表——风寒表证\n                                                   表虚有汗（桂枝汤）\n                                                                风寒湿痹（桂枝附子汤）\n 2.     温经止痛——寒凝血滞诸痛证   胃寒腹痛（小建中汤）\n                                                                血寒经闭，痛经（温经汤）\n                                                                胸痹心痛（枳实薤白桂枝汤）\n                                                 痰饮证（苓桂术甘汤）\n 3.     助阳化气——阳虚症   蓄水证（五苓散）\n                                                 心悸，脉结代（炙甘草汤）","dosage":"煎服，3-10g","notes":"外感热病，阴虚火旺，血热妄行忌用 本品辛温助热，易伤阴动血 孕妇及月经过多者慎用 麻黄与桂枝的功效比较","indications":"①风寒表虚证之恶风发热、汗出恶风、脉浮缓，常配芍药（桂枝汤）；②风寒表实证之无汗表实，常配麻黄；③胸痹心痛，胸阳不振之胸闷气短，常配瓜蒌、薤白；④脘腹冷痛，中焦虚寒；⑤血寒经闭、痛经，常配当归、川芎；⑥风寒湿痹之肩臂关节疼痛，常配附子。","combinations":"桂枝配芍药：调和营卫，一散一收，治表虚自汗；桂枝配麻黄：辛温发汗，治风寒表实证；桂枝配附子：温经通络，治寒湿痹痛；桂枝配茯苓：温阳利水，治痰饮水肿；桂枝配甘草：辛甘化阳，温通心阳。","differentiation":"桂枝vs麻黄：见麻黄鉴别。桂枝长于温通经脉、助阳化气，善治胸痹、痛经、癥瘕；麻黄宣肺平喘、利水消肿为优。桂枝可用治阳虚证，麻黄偏散邪。"},{"name":"紫苏叶","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":78,"properties":"辛，温。归肺、脾经。","functions":"解表散寒、行气和胃、安胎、解鱼蟹毒","functions_full":"紫苏解表兼行气，止呕安胎鱼蟹毒\n１解表散寒——外感风寒表证而兼气滞，胸脘满闷、恶心呕逆者尤宜（香苏散、杏苏散）\n２行气和胃——脾胃气滞，胸闷呕吐。偏寒者配藿香、半夏；偏热者配黄连、竹茹\n３安胎——妊娠恶阻，胎动不安（配砂仁、陈皮）\n４解鱼蟹毒——鱼蟹中毒所致腹痛吐泻","dosage":"煎服，5-10g。不宜久煎。","notes":"温病及气弱表虚者忌用","indications":"①风寒表证兼气滞胸闷呕恶者尤宜；②脾胃气滞之胸脘胀满、恶心呕吐，常配陈皮、半夏；③妊娠恶阻，胎动不安，常配砂仁、陈皮；④鱼蟹中毒之腹痛吐泻。","combinations":"紫苏叶配陈皮：理气健脾，治外感兼气滞胸闷；紫苏叶配砂仁：安胎止呕，治妊娠恶阻；紫苏叶配半夏：化痰止呕，治痰湿呕逆。","differentiation":"紫苏叶vs薄荷：均发汗解表。紫苏性温，散风寒，兼理气安胎；薄荷性凉，散风热，兼利咽透疹疏肝。紫苏偏治风寒兼气滞，薄荷偏治风热及肝郁。"},{"name":"生姜","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":81,"properties":"辛、微温。归肺、脾、胃经","functions":"解表散寒、温中止呕、温肺止咳、解毒","functions_full":"生姜解表止呕吐，温肺止咳并解毒     \n１解表散寒——外感风寒（本品发汗力弱）\n２温中止呕——“呕家圣药”，增强止呕药作用\n胃寒呕吐（小半夏汤）\n各种呕吐胃热呕吐（配黄连、竹茹等）\n妊娠呕吐（配其他止呕药）\n３温肺止咳——风寒咳嗽、痰白清稀\n４解毒——半夏、天南星等药毒和鱼蟹毒","dosage":"煎服，3-10g 生姜汁与生姜皮的功效比较","notes":"","indications":"①风寒表证轻证，可单味煎汤加红糖；②寒邪犯胃之胃寒呕吐，尤宜于寒呕，常配半夏；③寒饮伏肺之咳嗽痰多，常配半夏、细辛；④鱼蟹中毒之腹痛吐泻；⑤解半夏、天南星毒。","combinations":"生姜配半夏：温胃降逆止呕，治寒饮呕逆；生姜配大枣：调和营卫、和中益胃；生姜配紫苏：发散风寒、解鱼蟹毒。","differentiation":"生姜vs干姜：均温中。生姜偏于走表发散、温胃止呕，善治风寒表证及胃寒呕吐；干姜偏于温里守中、回阳通脉，善治里寒证。生姜鲜用，干姜干制。"},{"name":"香薷","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":84,"properties":"辛、微温。归肺、脾、胃经","functions":"发汗解表，和中化湿、利水消肿","functions_full":"香薷辛温散暑寒，化湿和中利水强 \n１发汗解表，和中化湿——阴暑证（香薷饮）夏月麻黄\n夏月外感风寒，内伤暑湿，证见恶寒发热，头痛无汗，呕吐腹泻等\n２利水消肿——水肿、小便不利（薷术丸）","dosage":"煎服，3-10g。冷服 利水消肿脓煎","notes":"表虚有汗忌用 阳暑证忌用 紫苏、生姜与香薷的功效比较 麻黄与香薷的功效比较","indications":"①阴暑证之恶寒发热、无汗、头痛身重，常配厚朴、扁豆（香薷散）；②水肿小便不利，脚气浮肿，单用或配白术。","combinations":"香薷配厚朴：解表化湿，治夏月外寒内湿；香薷配扁豆：解暑化湿，治暑湿吐泻；香薷配白术：利水消肿，治水肿。","differentiation":"香薷vs麻黄：均有发汗解表、利水消肿作用。香薷偏于化湿和中，主治夏月感寒之阴暑证；麻黄偏于宣肺平喘，主治风寒表实证。香薷有'夏月麻黄'之称。"},{"name":"荆芥","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":87,"properties":"辛、微温。归肺、肝经","functions":"解表、透疹      麻疹不透（透疹汤）、消疮、止血","functions_full":"荆芥辛散肌表邪，感冒痒疹及出血 \n1 解表——外感表证（性平和） 风寒者（荆防败毒散）\n                                                         风热者（银翘散）\n2 透疹      麻疹不透（透疹汤）\n                  风疹瘙痒（消风散）\n3 消疮——疮疡初起兼有表证    偏风寒（败毒散）\n                                                       偏风热（银翘败毒散）\n4 止血——吐血、纽血、便血、痔血、崩漏下血","dosage":"煎服，3-10g 不宜久煎","notes":"","indications":"①外感表证，风寒风热均可，常配防风、羌活（风寒）或金银花、连翘（风热）；②风疹瘙痒、麻疹不透，常配蝉蜕、薄荷；③疮疡初起有表证者，常配金银花、连翘；④崩漏下血，炒炭用。","combinations":"荆芥配防风：疏散风寒，治外感表证；荆芥配蝉蜕：疏散风热、透疹止痒；荆芥配金银花：清热解毒、疏散表邪；荆芥炭配槐花：凉血止血。","differentiation":"荆芥vs防风：均发散风寒湿邪。荆芥发汗力较防风为强，且性平和，风寒风热皆可；防风长于祛风胜湿止痛，为'风药之润剂'。荆芥炒炭能止血，防风无止血之功。"},{"name":"防风","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":91,"properties":"辛、甘、微温。归膀胱、肝、脾经","functions":"祛风解表、胜湿止痛、止痉、止泻、止血","functions_full":"防风辛散表里风，胜湿疗痹止风痉 \n    １祛风解表——本品微温而不燥、甘缓而不峻，为风药中润剂\n风寒（荆防败毒散）\n外感表证风热（配薄荷、蝉蜕、连翘等）\n风湿（羌活胜湿汤）\n     ２胜湿止痛——风湿痹痛（蠲痹汤）\n     ３止痉——破伤风（玉真散）\n     ４止泻——肝郁乘脾，腹痛泄泻（痛泻要方）\n     ５止血——肠风下血（槐花散）","dosage":"煎服，3-10g","notes":"阴虚火旺慎用 血虚发痉慎用 荆芥与防风的功效比较","indications":"①外感表证，风寒、风热、风湿均可，长于祛风，常配荆芥；②风疹瘙痒，常配蝉蜕、薄荷；③风湿痹痛，肢节疼痛，常配羌活、独活；④破伤风之角弓反张、牙关紧闭，常配天南星、白附子。","combinations":"防风配荆芥：解表祛风，治一切风邪为患；防风配黄芪：益气固表止汗，治表虚自汗；防风配天麻：平肝息风，治头目眩晕；防风配羌活：祛风胜湿，治风湿痹痛。","differentiation":"防风vs荆芥：见荆芥鉴别。防风长于胜湿止痛，善治风湿痹痛、破伤风；荆芥长于透疹消疮。防风有'祛风圣药'之称。"},{"name":"羌活","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":95,"properties":"辛、苦、温。归膀胱、肾经","functions":"祛风散寒、胜湿止痛","functions_full":"羌活祛风寒湿奇，外感头疼上肢痹 \n        1 祛风散寒——外感风寒，头痛身疼（九味羌活汤）\n        2 胜湿止痛——风湿痹痛，以项背、肢节等上半身疼痛最为适宜（蠲痹汤）","dosage":"煎服，3-10g","notes":"血虚痹痛慎用 阴虚头痛慎用 脾胃虚弱慎用","indications":"①风寒夹湿之表证，恶寒发热、头项强痛、肢体酸重，常配独活、川芎；②风寒湿痹之肩背上肢疼痛，以其善行太阳膀胱经，痹痛在上在表者尤宜。","combinations":"羌活配独活：一走上，一走腰膝以下，合治一身风寒湿痹；羌活配防风：疏散风寒湿邪；羌活配川芎：祛风止痛、活血行气，治头痛。","differentiation":"羌活vs独活：均祛风湿、止痛、解表。羌活辛温燥烈，气雄而散，善治上半身风寒湿痹及太阳经头痛；独活性较缓和，善治下半身风寒湿痹及少阴经头痛。"},{"name":"白芷","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风寒药","page":98,"properties":"辛、温。归肺、胃经。","functions":"解表散寒、祛风止痛齿痛、消肿排脓、燥湿止带、止痒、解毒","functions_full":"白芷通窍止额痛，燥湿止带消痈脓 \n         １解表散寒—— 外感风寒，头痛鼻塞\n         阳明头痛（川芎茶调散）\n      风冷者（配细辛）\n          ２祛风止痛齿痛\n      风火者（配黄连、石膏）\n         鼻渊，为治鼻渊头痛要药（苍耳子散）\n          ３消肿排脓——外科常用药，未溃者消散，已溃者排脓\n                          疮痈肿毒（仙方活命饮）\n                  寒湿带下（配鹿角霜、炮姜）\n   ４燥湿止带\n                          湿热带下（配黄柏、车前子）\n   ５止痒—— 皮肤瘙痒\n  ６解毒—— 毒蛇咬伤","dosage":"","notes":"","indications":"①外感风寒之前额头痛、鼻塞流涕，常配羌活、细辛；②阳明经头痛、眉棱骨痛、牙痛，常配石膏；③鼻渊之鼻塞不通、浊涕不止，常配苍耳子、辛夷；④疮疡肿痛，初起可消肿，脓成可排脓；⑤寒湿带下，常配白术、海螵蛸。","combinations":"白芷配苍耳子、辛夷：通鼻窍，治鼻渊；白芷配石膏：清泄阳明经热，治前额头痛、牙痛；白芷配川芎：祛风止痛，治头痛；白芷配白术：燥湿止带。","differentiation":"白芷vs辛夷：均通鼻窍治鼻渊。白芷偏于祛风燥湿排脓，兼能治头痛、牙痛、带下；辛夷偏于散风寒通鼻窍。白芷芳香燥烈，辛夷芳香升散。"},{"name":"细辛","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":102,"properties":"辛，温。有小毒。归肺，肾，心经。","functions":"发散风寒、祛风止痛     风冷，胃火牙痛（单用）、温肺化饮、宣通鼻窍","functions_full":"细辛散寒鼻窍通，诸般寒痛肺饮通 \n外感风寒表证（九味羌活汤）\n1 发散风寒\n                        阳虚外感（麻黄附子细辛汤）\n                        风寒头痛（川芎茶调散）\n2 祛风止痛     风冷，胃火牙痛（单用）\n                        风湿痹痛（独活寄生汤）\n3  温肺化饮—— 寒饮喘咳（小青龙汤）\n4  宣通鼻窍—— 鼻渊","dosage":"煎服，1-3g；外用适量","notes":"阴虚阳亢头痛忌用；肺燥伤阴干咳忌用；反藜芦","indications":"①外感风寒之头痛身痛、鼻塞，常配羌活、防风；②阳虚外感之恶寒发热、脉反沉，常配麻黄、附子；③寒饮伏肺之咳嗽气喘、痰多清稀，常配干姜、五味子；④风寒湿痹之关节疼痛；⑤鼻渊之头痛鼻塞；⑥牙痛，口疮，可单味研末外敷。","combinations":"细辛配麻黄、附子：助阳解表，治阳虚外感；细辛配干姜、五味子：一散一收，温肺化饮止咳；细辛配川芎：祛风散寒止痛，治头痛。","differentiation":"细辛vs白芷：均散寒止痛、通鼻窍。细辛辛温走窜力强，善治少阴头痛，兼温肺化饮；白芷善治阳明头痛，兼排脓止带。细辛用量注意不过钱（3g）。"},{"name":"藁本","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":105,"properties":"辛、温。归膀胱、肝经","functions":"祛风散寒、胜湿止痛","functions_full":"1 祛风散寒——风寒表证，头痛身疼，尤宜于巅顶头\n痛\n2 胜湿止痛——风寒湿痹","dosage":"煎服，3-10g","notes":"血虚头痛者忌服 羌活、白芷与藁本的功效比较 不同点","indications":"①外感风寒之巅顶头痛，连及齿颊，善入厥阴肝经；②风寒湿痹之肢体关节疼痛。③外感风寒夹湿之头痛项强、肢体酸痛。","combinations":"藁本配白芷：散寒止痛，善治偏正头痛；藁本配羌活：祛风散寒除湿，治风寒湿痹及头痛。","differentiation":"藁本vs羌活：均治太阳经头痛。藁本善治巅顶头痛，兼入厥阴肝经；羌活善治后头痛、项强。"},{"name":"苍耳子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":108,"properties":"辛、苦、温。有小毒。归肺经","functions":"祛风通窍、除湿止痛、止痒","functions_full":"鼻渊头痛\n１祛风通窍\n风寒及头风头痛\n２除湿止痛——风湿痹痛\n３止痒——风疹瘙痒、疥癣","dosage":"煎服，3-10g 入丸散","notes":"血虚头痛忌用 有毒不可过量服用 附 苍耳子 祛风除湿力强 祛风湿通鼻窍 苍耳草 解毒止痒力优 苍耳虫 解毒消肿——痈肿、疔毒、痔疮 辛 夷 类 别 植物 原植物 木兰科植物望春花、玉兰、武当玉兰 药 材 花蕾","indications":"用前述。","combinations":"同前述。","differentiation":"同前述。"},{"name":"辛夷","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风寒药","page":111,"properties":"辛、温。归肺经","functions":"偏风寒（配细辛、白芷等）\n鼻渊\n偏风热（配菊花、连翘等）","functions_full":"散风寒，通鼻窍\n偏风寒（配细辛、白芷等）\n鼻渊\n偏风热（配菊花、连翘等）","dosage":"煎服，3-10g 包煎 外用适量 功效比较 苍耳子 并能祛风湿，止痛 温通鼻窍 辛 夷 为治鼻渊专药 葱 白 类 别 植物 原植物 百合科","notes":"","indications":"①鼻渊之鼻塞流涕、不闻香臭，为治鼻渊之要药，常配苍耳子、白芷；②外感风寒之头痛鼻塞。","combinations":"辛夷配苍耳子：增强通鼻窍之功；辛夷配白芷：散风寒、通鼻窍；辛夷配细辛：温肺散寒通窍。","differentiation":"辛夷vs苍耳子：见苍耳子鉴别。辛夷质轻气香，专入肺经，偏散风寒；苍耳子偏散风湿。"},{"name":"葱白","level":3,"levelName":"三级（了解）","levelColor":"#3b82f6","category":"解表药","subCategory":"发散风寒药","page":114,"properties":"辛、温。归肺、胃经","functions":"发汗解表、散寒通阳、消痈散结","functions_full":"１发汗解表——外感风寒轻证\n２散寒通阳——阴寒腹痛、下痢肢冷\n３消痈散结——乳汁郁滞、疮痈疔毒","dosage":"煎服，3-10g 外用适量 第二节 发散风热药 薄 荷 类 别 植物 原植物 唇形科植物薄荷 药 材 茎叶","notes":"","indications":"①风寒感冒轻证之恶寒发热、头痛鼻塞，单用或配淡豆豉；②阴盛格阳之下利清谷、脉微、面赤，散寒通阳，常配附子、干姜（白通汤）；③痈肿疮毒。","combinations":"葱白配淡豆豉：散寒解表，治风寒感冒轻证；葱白配附子、干姜：散寒通阳（白通汤）。","differentiation":"葱白vs生姜：均发散风寒。葱白发汗力弱，偏散寒通阳；生姜发汗力较强，偏温中止呕。"},{"name":"薄荷","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":119,"properties":"辛，凉。归肺、肝经。","functions":"疏散风热、清利头目、利咽透疹、疏肝解郁","functions_full":"薄荷轻宣散风热，清利头目利咽疹\n１疏散风热——外感风热，温病初起，头痛发热（银翘散）\n２清利头目——风热上攻之头痛目赤、咽喉肿痛\n３利咽透疹——麻疹初起，透发不畅（配蝉蜕、牛蒡子）\n４疏肝解郁——肝气郁滞，胸胁胀痛（逍遥散）","dosage":"煎服，3-6g，后下。","notes":"体虚多汗及阴虚发热者忌用。不宜久煎","indications":"①风热表证及温病初起之发热头痛、微恶风寒、咽痛口渴，常配金银花、连翘（银翘散）；②风热上攻之头痛目赤、咽喉肿痛，常配桔梗、荆芥；③麻疹不透、风疹瘙痒，常配蝉蜕、牛蒡子；④肝气郁滞之胸胁胀痛、月经不调，常配柴胡、白芍（逍遥散）。","combinations":"薄荷配金银花、连翘：疏散风热，治风热表证；薄荷配柴胡：疏肝解郁，治肝郁气滞；薄荷配蝉蜕：疏散风热、透疹止痒；薄荷配桔梗：清利咽喉。","differentiation":"薄荷vs牛蒡子：均疏散风热、利咽透疹。薄荷辛散力强，偏于发散风热、疏肝解郁；牛蒡子苦寒沉降，偏于清泄热毒、宣肺祛痰。"},{"name":"牛蒡子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":122,"properties":"辛、苦、寒。归肺、胃经","functions":"疏散风热， 利咽、透疹、解毒散肿","functions_full":"牛蒡透疹散风热，解毒利咽疗痄腮  \n \n１疏散风热， 利咽——外感风热，咽喉肿痛（银翘散）\n            \n２透疹——麻疹初起，透发不畅（透疹汤）\n３解毒散肿——热毒疮肿、痄腮喉痹（普济消毒饮）","dosage":"煎服，3-10g","notes":"气虚便溏者慎用","indications":"①风热表证及温病初起之发热咽痛，常配金银花、连翘；②麻疹不透、风疹瘙痒，常配薄荷、蝉蜕；③痈肿疮毒、痄腮喉痹，常配黄芩、黄连；④肺热咳嗽痰多，常配桑叶、杏仁。","combinations":"牛蒡子配薄荷：疏散风热、利咽透疹；牛蒡子配金银花：清热解毒散结；牛蒡子配杏仁：宣肺止咳化痰。","differentiation":"牛蒡子vs薄荷：见薄荷鉴别。牛蒡子性寒滑利，能滑肠通便，脾虚便溏慎用；薄荷性凉芳香，兼疏肝。"},{"name":"蝉蜕","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":125,"properties":"甘、寒。归肺、肝经","functions":"透疹止痒风热外束，麻疹不透（配薄荷、牛蒡子等）、明目退翳","functions_full":"蝉蜕轻透止痒奇，息风止痉又退翳\n    \n１疏散风热外感风热（配薄荷连翘等）\n                咽痛音哑（配胖大海、桔梗等）\n２透疹止痒风热外束，麻疹不透（配薄荷、牛蒡子等）\n                风疹湿疹，皮肤瘙痒（消风散）\n３明目退翳——目赤肿痛，翳膜遮睛（蝉花散）\n４息风止痉 破伤风（五虎追风散）\n 小儿惊风（配钩藤，僵蚕等）","dosage":"煎服，3-10g-30g 薄荷、牛蒡子、与蝉蜕的功效比较","notes":"","indications":"①风热表证及温病初起之咽痛声嘶，常配薄荷、牛蒡子；②麻疹不透、风疹瘙痒，常配荆芥穗、防风；③风热目赤翳障，常配菊花；④小儿惊痫夜啼、破伤风，常配钩藤、全蝎。","combinations":"蝉蜕配薄荷：疏散风热、透疹止痒；蝉蜕配菊花：疏散风热、清肝明目；蝉蜕配钩藤：息风止痉。","differentiation":"蝉蜕vs薄荷：均疏散风热、透疹止痒。蝉蜕长于息风止痉、明目退翳；薄荷长于疏肝解郁、清利头目。"},{"name":"桑叶","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":128,"properties":"苦、甘、寒。归肺、肝经","functions":"疏散风热、清肺润燥、平肝明目","functions_full":"桑叶清肺兼平肝，风热燥咳目昏眩 \n１疏散风热——外感风热，头痛咳嗽（桑菊饮）\n２清肺润燥——肺热燥咳（桑杏汤）\n３平肝明目——肝火或风热所致目赤涩痛、多泪等","dosage":"煎服，5-10g 或入丸散","notes":"","indications":"①风热表证及温病初起之发热头痛、咽痛咳嗽，常配菊花（桑菊饮）；②肺热燥咳，干咳无痰或痰少而黏，常配杏仁、贝母；③肝阳上亢之头痛眩晕，常配菊花、石决明；④肝热目赤涩痛、羞明流泪，常配菊花、决明子。","combinations":"桑叶配菊花：疏散风热、清肝平肝，治风热表证及肝阳眩晕；桑叶配杏仁：宣肺止咳，治燥热咳嗽；桑叶配黑芝麻：滋补肝肾、明目。","differentiation":"桑叶vs菊花：均疏散风热、清肝平肝。桑叶清肺润燥力强，治肺燥咳嗽；菊花清肝明目力优，兼清热解毒。桑菊饮中二味同用。"},{"name":"菊花","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":131,"properties":"辛、甘、苦，微寒。归肺、肝经。","functions":"疏散风热、平肝明目、清热解毒","functions_full":"菊花疏风善平肝，明目清热疗疮痈\n１疏散风热——外感风热，温病初起，发热头痛（桑菊饮）\n２平肝明目——肝阳上亢之头晕目眩（杞菊地黄丸）；肝火上炎之目赤肿痛（配石决明、夏枯草）\n３清热解毒——热毒疮痈（野菊花效更佳，五味消毒饮）","dosage":"煎服，5-10g。疏散风热多用黄菊花，平肝明目多用白菊花。","notes":"桑叶与菊花的功效比较：桑叶清肺润燥力强，菊花平肝明目力优","indications":"①风热表证及温病初起，常配桑叶；②肝阳上亢之头痛眩晕、面红目赤，常配石决明、白芍；③肝火上炎之目赤肿痛，常配夏枯草、决明子；④肝肾阴虚之视物昏花、目暗不明，常配枸杞子、地黄（杞菊地黄丸）；⑤热毒疮疡，清热解毒，尤用野菊花。","combinations":"菊花配桑叶：疏风清热、清肝明目；菊花配枸杞子：滋补肝肾、明目，治肝肾阴虚目昏；菊花配石决明：平肝潜阳；菊花配金银花：清热解毒。","differentiation":"菊花vs桑叶：见桑叶鉴别。黄菊花偏疏散风热，白菊花偏清肝明目，野菊花偏清热解毒。"},{"name":"蔓荆子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风热药","page":134,"properties":"辛、苦、微寒。归膀胱、肝、胃经","functions":"疏散风热、止痛","functions_full":"１疏散风热——风热表证（配薄荷、菊花等）\n２止痛——疼痛证\n头痛或偏头痛，头风痛，风湿痹痛，牙痛及胃脘痛等","dosage":"煎服，5-10g 柴 胡 类 别 植物 原植物 伞形科植物柴胡、狭叶柴胡 药 材 根或全草","notes":"","indications":"①风热上攻之头痛、偏头痛，常配菊花、川芎；②风热目赤肿痛、羞明流泪，常配菊花、蝉蜕；③风湿痹痛。","combinations":"蔓荆子配菊花：疏散风热、清利头目；蔓荆子配川芎：祛风止痛，治偏正头痛。","differentiation":"蔓荆子vs菊花：均疏散风热、清利头目。蔓荆子偏于散风止痛，善治太阳头痛；菊花偏于清肝明目。"},{"name":"柴胡","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":137,"properties":"苦、辛、微寒。归肝、胆经","functions":"和解退热、疏肝解郁、升阳举陷","functions_full":"柴胡解热又疏肝，升举阳气解少阳 \n                             少阳证寒热往来（小柴胡汤）\n１和解退热\n                  外感发热（柴葛解肌汤）\n２疏肝解郁——肝郁气滞、胸胁疼痛、月经不调、痛经（逍遥散）\n３升阳举陷——气虚下陷、久泻脱肛、胃下垂（补中益气汤）","dosage":"煎服，3-10g","notes":"肝阳上亢忌用 升阳发表 肝风内动忌用 阴虚火旺忌用 气机上逆忌用","indications":"①少阳证之寒热往来、胸胁苦满、口苦咽干、默默不欲饮食，常配黄芩（小柴胡汤）；②肝气郁滞之胸胁胀痛、月经不调，常配白芍、当归（逍遥散）；③中气下陷之脱肛、子宫下垂、久泻，常配升麻、黄芪（补中益气汤）；④外感发热。","combinations":"柴胡配黄芩：和解少阳，治寒热往来；柴胡配白芍：疏肝柔肝，治肝郁胁痛；柴胡配升麻：升举阳气，治气虚下陷；柴胡配香附：疏肝理气，治肝郁气滞。","differentiation":"柴胡vs升麻：均散表、升阳。柴胡散半表半里之少阳邪，善疏肝解郁；升麻散阳明肌表之邪，善透疹解毒。柴胡升阳偏于升清，升麻升阳善举陷。"},{"name":"升麻","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"解表药","subCategory":"发散风热药","page":142,"properties":"辛、甘、微寒。归肺、脾、胃、大肠经","functions":"发表透疹、清热解毒、升举阳气","functions_full":"升麻透疹解热毒，脾胃之气并可举  \n１发表透疹——风热头痛，麻疹不透（升麻葛根汤）\n２清热解毒——多种热毒证\n阳明胃热之头痛，牙龈肿痛，口舌生疮（清胃散）\n风热上壅，咽喉肿痛（牛蒡子汤）\n热毒疮肿（配金银花、连翘等）\n３升举阳气——气虚下陷，久泻脱肛，子宫脱垂（补中益气汤）","dosage":"煎服，3-10g","notes":"阴虚火旺忌用、喘满气逆忌用、麻疹已透忌用","indications":"①外感风热之头痛、发热，常配葛根；②中气下陷之脱肛、子宫下垂、久泻，常配柴胡、黄芪；③热毒斑疹、口舌生疮，清热解毒，常配黄连；④阳明经头痛、牙痛。","combinations":"升麻配柴胡：升举阳气，治中气下陷；升麻配葛根：解肌透疹，治麻疹不透；升麻配黄连：清热解毒，治胃火牙痛口疮。","differentiation":"升麻vs柴胡：见柴胡鉴别。升麻清热解毒力强，善治热毒口疮、斑疹；柴胡疏肝解郁力优。"},{"name":"葛根","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"解表药","subCategory":"发散风热药","page":146,"properties":"辛、甘、凉。归脾、胃经","functions":"解肌退热、生津止渴、升阳止泻、透疹","functions_full":"葛根解肌治项强，透疹生津升清阳 \n                                                                    风热（柴葛解肌汤）\n１解肌退热—— 表证发热，项背强痛\n                                                                    风寒（葛根汤）\n２生津止渴—— 热病口渴及消渴证（玉泉丸）\n                         湿热泻痢（葛根芩连汤）\n３升阳止泻\n                         脾虚泄泻（白术七味散）\n       ４透疹——麻疹初起，透发不畅（升麻葛根汤）","dosage":"煎服，10-15g 附药 葛花 解酒醒脾——饮酒过度，头昏头痛，烦渴，呕吐，胸膈饱胀等证 柴胡、升麻与葛根的功效比较 不同点","notes":"","indications":"①外感表证发热头痛、项背强痛，无论风寒风热均可，尤善解项背强几几，常配柴胡（柴葛解肌汤）；②热病烦渴、消渴，升阳生津，常配天花粉、麦冬；③麻疹不透；④脾虚久泻，煨用升阳止泻；⑤高血压病之头痛项强。","combinations":"葛根配柴胡：解肌退热，治外感发热项强；葛根配桂枝：解肌通脉，治项背强痛；葛根配黄芩、黄连：清热止利，治湿热泻痢。","differentiation":"葛根vs柴胡：均解表退热。葛根辛甘凉，解阳明之肌热，兼生津止渴、升阳止泻；柴胡苦辛凉，解少阳之半表半里，兼疏肝解郁、升举阳气。"},{"name":"淡豆豉","level":3,"levelName":"三级（了解）","levelColor":"#3b82f6","category":"解表药","subCategory":"发散风热药","page":151,"properties":"辛、甘、微苦、凉。归肺、胃","functions":"解表、除烦","functions_full":"风寒（葱豉汤）\n  １ 解表——外感头痛\n                         风热（银翘散）\n  ２ 除烦——热病胸中烦闷，虚烦不眠","dosage":"煎服，10-15g","notes":"","indications":"①外感表证，风寒、风热均可，随配伍而异，常配葱白（风寒）、栀子（风热）；②热病后胸中烦闷、虚烦不眠，常配栀子（栀子豉汤）。","combinations":"淡豆豉配栀子：清热除烦，治热病虚烦不眠；淡豆豉配葱白：散寒解表，治风寒感冒。","differentiation":"淡豆豉vs豆黄卷：均大豆制品。淡豆豉宣散解表、清热除烦；豆黄卷清热利湿、发散暑湿。"},{"name":"石膏","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热泻火药","page":159,"properties":"辛、甘，大寒。归肺、胃经。","functions":"清热泻火、除烦止渴、收敛生肌","functions_full":"石膏清解气分热，除烦止渴泻胃火\n１清热泻火——气分实热证，为清泻肺胃气分实热之要药。气分热盛，壮热烦渴（白虎汤）；肺热咳喘（麻杏石甘汤）；胃火上炎之头痛齿痛（清胃散）\n２除烦止渴——热病烦渴\n３收敛生肌——煅用外用，疮疡不敛、湿疹、水火烫伤","dosage":"煎服，15-60g，打碎先煎。清热泻火生用，收敛生肌煅用。","notes":"脾胃虚寒及阴虚内热忌用","indications":"①气分实热证之壮热烦渴、汗出脉洪大，常配知母（白虎汤）；②邪热壅肺之咳喘、发热、痰黄稠，常配麻黄、杏仁（麻杏石甘汤）；③胃火亢盛之头痛牙痛、牙龈肿痛、口舌生疮，常配黄连；④煅用治疮疡溃后不敛、水火烫伤、湿疹。","combinations":"石膏配知母：清热泻火滋阴，治气分实热；石膏配麻黄：清泄肺热、宣肺平喘；石膏配细辛：清胃泻火止痛，治胃火牙痛；石膏配熟地黄：滋阴清热，治虚火上炎。","differentiation":"石膏vs知母：均清热泻火。石膏辛甘大寒，重在清解实热，煅用能收湿敛疮；知母苦甘寒，兼滋阴润燥，善治阴虚燥热。石膏入肺胃，知母入肺肾胃。"},{"name":"知母","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热泻火药","page":163,"properties":"苦、甘、寒。归肺、胃、肾经","functions":"气分实热、清热泻火、滋阴润燥、阴虚燥咳","functions_full":"知母清胃又润肺，滋阴降火虚热退 \n气分实热——常与石膏相须为用（白虎汤）\n１清热泻火\n肺热咳嗽\n２滋阴润燥——阴虚证\n           阴虚燥咳——常与贝母同用（二母散）\n           骨蒸潮热（知柏地黄丸）\n           阴虚消渴（二冬汤）\n           肠燥便秘（配生首乌、当归等）","dosage":"煎服，6-12g","notes":"脾虚便溏不宜用 石膏与知母的功效比较","indications":"①气分实热之壮热烦渴，常配石膏；②肺热燥咳、阴虚燥咳，常配贝母；③阴虚火旺之骨蒸潮热、盗汗，常配黄柏、地黄（知柏地黄丸）；④内热消渴，常配天花粉。","combinations":"知母配石膏：清热泻火；知母配贝母：清肺润燥化痰；知母配黄柏：滋阴降火，治阴虚火旺；知母配天花粉：清热生津止渴。","differentiation":"知母vs石膏：见石膏鉴别。知母上清肺热，下滋肾阴，中泻胃火；石膏专清肺胃实热。"},{"name":"芦根","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":167,"properties":"甘、寒。归肺、胃经","functions":"清热生津      肺热咳嗽（配黄芩、栝楼等）、除烦止呕、清热利尿","functions_full":"芦根甘寒入肺胃，肺热烦渴尿赤退 \n                热病伤津，心烦口渴（配天花粉、麦冬等）\n１清热生津      肺热咳嗽（配黄芩、栝楼等）\n                风热咳嗽（桑菊饮）\n                肺痈吐脓（苇茎汤）\n２除烦止呕——胃热呕吐，呃逆（配竹茹、生姜汁等）\n３清热利尿——淋证（配车前子、白茅根等）","dosage":"煎服，15-30-60g 天花粉 类 别 植物 原植物 葫芦科植物栝楼、双边栝楼 药 材 根","notes":"","indications":"①热病烦渴、消渴；②肺热咳嗽、肺痈之咳吐脓痰，常配薏苡仁、冬瓜仁（苇茎汤）；③胃热呕吐、呃逆，常配竹茹；④热淋涩痛、小便短赤，常配白茅根、车前子。","combinations":"芦根配薏苡仁：清热排脓，治肺痈；芦根配竹茹：清热止呕，治胃热呕逆。","differentiation":"芦根vs天花粉：均清热生津。芦根清热力强，兼排脓、止呕、利尿；天花粉生津力优，兼消肿排脓、终止妊娠之能。"},{"name":"天花粉","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":170,"properties":"甘、微苦、微寒。归肺、胃经","functions":"清热生津      消渴多饮（配葛根、山药）、消肿排脓、杀胚抑癌","functions_full":"账    天花粉甘微苦寒，生津排脓抑癌尝 \n                热病口渴（配芦根、麦冬）\n１清热生津      消渴多饮（配葛根、山药）\n                燥热伤肺（配天冬、麦冬）\n２消肿排脓——痈肿疮疡（仙方活命饮）\n３杀胚抑癌——中期妊娠引产，宫外孕，恶性葡萄胎，绒毛膜上皮\n癌","dosage":"煎服，10-15g","notes":"孕妇忌服；反乌头 竹 叶 为禾本科植物淡竹的干燥茎叶 芦根、天花粉与竹叶的功效比较","indications":"①热病烦渴、消渴，常配知母、麦冬；②肺热燥咳，常配沙参、麦冬；③疮疡肿毒，消肿排脓，常配金银花、白芷；④中期引产、堕胎，孕妇禁用。","combinations":"天花粉配知母：清热生津止渴；天花粉配金银花：清热解毒消痈。","differentiation":"天花粉vs芦根：见芦根鉴别。天花粉即瓜蒌根，偏生津润燥，兼引产；芦根偏清热利尿排脓。"},{"name":"竹叶","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":173,"properties":"甘、淡，寒。归心、胃、小肠经。","functions":"清热除烦、利尿","functions_full":"竹叶清心又除烦，利尿通淋导热下\n１清热除烦——热病烦渴；心火上炎之口舌生疮（导赤散）\n２利尿——心热移于小肠之小便短赤涩痛","dosage":"煎服，6-15g。鲜品15-30g。","notes":"阴虚火旺、骨蒸潮热者忌用","indications":"①热病烦渴、口舌生疮，常配石膏、麦冬；②心火上炎之口舌糜烂、小便淋涩赤痛，常配生地黄、木通（导赤散）。","combinations":"竹叶配麦冬：清心除烦、养阴生津；竹叶配木通：清心导赤、利尿通淋。","differentiation":"竹叶vs淡竹叶：功效相近。竹叶为禾本科淡竹之叶，偏于清心除烦；淡竹叶为另一植物，利尿通淋之力较强。"},{"name":"淡竹叶","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":176,"properties":"甘、淡，寒。归心、胃、小肠经。","functions":"清热除烦、利尿通淋","functions_full":"淡竹叶清热利尿，除烦清热淋证疗\n１清热除烦——热病烦渴（配石膏、麦冬等）\n２利尿通淋——热淋涩痛、小便短赤（导赤散）","dosage":"煎服，6-10g。","notes":"脾胃虚寒者慎用","indications":"①热病烦渴，常配石膏；②心火上炎之口舌生疮，常配生地黄、木通；③热淋涩痛，长于利尿通淋。","combinations":"淡竹叶配灯心草：清心利尿通淋；淡竹叶配芦根：清热利尿。","differentiation":"淡竹叶vs竹叶：见竹叶鉴别。二者常可互用，淡竹叶利尿通淋力更佳。"},{"name":"栀子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热泻火药","page":179,"properties":"苦、寒。归心、肝、肺、胃、三焦经","functions":"泻火除烦、清热利湿、凉血止血、消肿止痛","functions_full":"栀子苦寒除烦躁，凉血通淋疸衄妙 \n                    热病心烦，燥扰不宁（栀子豉汤）\n１泻火除烦\n                        热毒炽盛，神昏谵语（黄连解毒汤）\n２清热利湿——为治湿热黄疸、淋证的常用药\n湿热黄疸（茵陈蒿汤）\n湿热淋证（八正散）\n３凉血止血——血热妄行之吐血、衄血、尿血等\n４消肿止痛——热毒疮疡，跌打损伤","dosage":"煎服，3-10g 外用适量","notes":"","indications":"①热病心烦不眠之虚烦懊憹，常配淡豆豉（栀子豉汤）；②湿热黄疸之一身面目俱黄、小便黄赤，常配茵陈、大黄（茵陈蒿汤）；③血热妄行之吐血衄血尿血，常配黄芩、黄连；④目赤肿痛、疮疡。外用治扭挫伤肿痛。","combinations":"栀子配淡豆豉：清热除烦，治热病后虚烦不眠；栀子配茵陈：清热利湿退黄；栀子配黄芩、黄连：清热泻火、凉血止血。","differentiation":"栀子vs黄连：均清热泻火。栀子偏于清泻三焦之火而除烦，兼利湿退黄凉血；黄连偏于清心胃之火而燥湿止痢。"},{"name":"夏枯草","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":183,"properties":"苦、辛、寒。归肝、胆经","functions":"清肝火、散郁结、降血压","functions_full":"夏枯草清肝散结，消瘿瘰乌珠疼解 \n  １清肝火——肝火目赤肿痛，头痛眩晕（配菊花、决明子等）\n２散郁结——痰火郁结之瘰疠瘿瘤等\n３降血压——高血压病","dosage":"煎服，10-15g","notes":"","indications":"①肝火上炎之目赤肿痛、头痛眩晕，常配菊花、决明子；②瘰疬瘿瘤、乳痈肿痛，为治瘰疬要药，常配玄参、牡蛎；③高血压病之头痛眩晕。","combinations":"夏枯草配菊花：清肝明目；夏枯草配玄参、牡蛎：消肿散结，治瘰疬；夏枯草配黄芩：清肝泻火降压。","differentiation":"夏枯草vs决明子：均清肝明目。夏枯草偏清肝散结，治瘰疬；决明子偏润肠通便，兼滋养肝肾。"},{"name":"决明子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热泻火药","page":186,"properties":"甘、苦、咸、微寒。归肝、肾、大肠经","functions":"清肝明目、润肠通便","functions_full":"１清肝明目 \n                 肝经实火（配夏枯草、栀子等）\n     目赤目暗  风热上攻（配桑叶、菊花等）\n   肝肾阴虚（配沙苑子、枸杞子等）\n２润肠通便——肠燥便秘","dosage":"煎服，10-15g","notes":"气虚便溏者不宜用","indications":"①肝热目赤肿痛、羞明流泪，常配菊花、夏枯草；②肝肾阴虚之目暗不明，常配枸杞子、菟丝子；③肠燥便秘，润肠通便。","combinations":"决明子配菊花：清肝明目；决明子配枸杞子：滋肾养肝明目；决明子配夏枯草：清肝降压。","differentiation":"决明子vs夏枯草：见夏枯草鉴别。"},{"name":"黄芩","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热燥湿药","page":191,"properties":"苦、寒。归肺、胃、胆、大肠经","functions":"清热燥湿           湿温发热，胸脘痞闷（黄芩滑石汤、泻火解毒、止血、安胎","functions_full":"黄芩清肺除湿热，解毒凉血又安胎 \n１清热燥湿           湿温发热，胸脘痞闷（黄芩滑石汤）\n                               湿热中阻，痞满呕吐（半夏泻心汤）\n       多种湿热证    湿热泻痢（葛根芩连汤）\n                               湿热黄疸（配茵陈、栀子等）\n                               湿热淋证（配生地、木通等）\n２泻火解毒——善清肺火及上焦实热\n              肺热壅遏，咳嗽痰稠（清金丸）\n              热毒炽盛，神昏谵语（黄连解毒汤）\n              热毒疮肿，咽喉肿痛（配银花、连翘等）\n３止血——血热出血（配生地、白茅根等）\n４安胎——胎热不安（配白术、当归等）","dosage":"煎服，3-10g","notes":"","indications":"①湿温暑湿之发热胸闷、舌苔黄腻，善清上焦湿热，常配滑石、白蔻仁；②肺热咳嗽痰黄，常配桑白皮、知母；③少阳证之寒热往来，常配柴胡（小柴胡汤）；④痈肿疮毒；⑤血热妄行之吐血衄血，常配大黄、黄连；⑥胎热不安，安胎之要药。","combinations":"黄芩配柴胡：和解少阳，治寒热往来；黄芩配白术：清热安胎；黄芩配黄连：清热燥湿，治湿热诸证。","differentiation":"黄芩、黄连、黄柏：均清热燥湿泻火解毒。黄芩善清上焦肺火及少阳热，兼安胎；黄连善清中焦心胃之火；黄柏善清下焦肾与膀胱之火。"},{"name":"黄连","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热燥湿药","page":195,"properties":"苦、寒。归肺、胃、胆、大肠经","functions":"请热燥湿、泻火解毒","functions_full":"黄连燥湿清心火，胃火痢疾疮毒瘥 \n  １请热燥湿——多种湿热证（胃肠湿热之吐泻尤宜）\n湿热泻痢（香连丸、葛根芩连汤）\n胃热呕吐（黄连橘皮竹茹半夏汤）\n肝胃不和，呕吐吞酸（左金丸）\n２ 泻火解毒\n 心火亢盛，烦躁不眠（朱砂安神丸）\n 热毒炽盛，神昏谵语（黄连解毒汤）\n①实火证   胃火中消证（配天花粉、芦根等）\n 肝火目赤、肿痛多泪（配栀子、菊花等）\n 血热妄行，吐血衄血（泻心汤）\n            ②痈疽疔毒，皮肤湿疮，耳脓（配黄芩、栀子等）","dosage":"煎服，2-10g；研末，1-1.5g/次；外用适量","notes":"","indications":"①湿热中阻之脘痞呕恶、泄泻痢疾，善清中焦湿热，常配半夏、黄芩；②心火亢盛之心烦不寐、口舌生疮，常配黄芩、栀子；③胃火炽盛之牙痛、消谷善饥，常配石膏；④热毒疮疡、痈肿疔毒。","combinations":"黄连配半夏：清热燥湿、降逆止呕，治湿热痞满；黄连配木香：清热燥湿、行气止痛，治湿热痢疾；黄连配吴茱萸：辛开苦降，治肝火犯胃；黄连配肉桂：交通心肾，治心肾不交失眠。","differentiation":"黄连vs黄芩vs黄柏：见黄芩鉴别。黄连苦寒最甚，燥湿力最强。"},{"name":"黄柏","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热燥湿药","page":201,"properties":"苦、寒。归肾、膀胱、大肠经","functions":"请热燥湿、泻火解毒、清退虚热","functions_full":"黄柏入肾主下焦，燥湿泻火虚热疗 \n１请热燥湿——多用于湿热证（下焦湿热尤宜）\n    湿热下注，带下黄稠（易黄汤）\n湿热下注，足膝红肿疼痛（三妙丸）\n湿热淋证（配木通、滑石等）\n湿热泻痢（配白头翁、黄连等）\n湿热黄疸（栀子柏皮汤）\n湿疹湿疮，阴痒阴肿（配苦参、白鲜皮等）\n２泻火解毒——热毒疮疡（黄连解毒汤）\n３清退虚热——阴虚发热，盗汗遗精（知柏地黄丸）","dosage":"煎服，5-10g 外用适量 黄芩、黄连与黄柏的功效比较","notes":"","indications":"①湿热下注之带下黄臭、阴肿阴痒，常配车前子、芡实；②湿热泄泻、痢疾，常配白头翁、黄连；③湿热黄疸，常配栀子、茵陈；④湿热淋证，常配车前子；⑤阴虚火旺之骨蒸潮热、盗汗遗精，常配知母、地黄。","combinations":"黄柏配知母：滋阴降火，治阴虚火旺；黄柏配栀子、茵陈：清热利湿退黄；黄柏配苍术：清热燥湿，治湿热下注。","differentiation":"黄柏vs黄芩vs黄连：见黄芩鉴别。黄柏走下焦，善清肾与膀胱之火，退虚热。"},{"name":"龙胆","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热燥湿药","page":207,"properties":"苦，寒。归肝、胆经。","functions":"清热燥湿、泻肝胆火","functions_full":"龙胆苦寒泻肝胆，下焦湿热目赤安\n１清热燥湿——下焦湿热。湿热黄疸（配茵陈、栀子）；带下黄稠、阴肿阴痒（龙胆泻肝汤）；湿疹瘙痒\n２泻肝胆火——肝火上炎之头痛目赤、胁痛口苦、耳鸣耳聋（龙胆泻肝汤）；肝经热盛之惊风抽搐","dosage":"煎服，3-6g。","notes":"脾胃虚寒者忌用。不宜过量或久服","indications":"①肝火上炎之头痛目赤、耳聋耳鸣，常配黄芩、栀子；②肝胆湿热之黄疸、阴肿阴痒、带下黄稠，常配茵陈、栀子；③肝经热盛生风之惊痫抽搐。","combinations":"龙胆配柴胡、黄芩：清泻肝胆实火；龙胆配茵陈、栀子：清热利湿退黄；龙胆配钩藤：清肝息风。","differentiation":"龙胆vs栀子：均清热利湿。龙胆专入肝胆，长于泻肝胆实火、清下焦湿热；栀子入三焦，偏除烦凉血。"},{"name":"苦参","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热燥湿药","page":211,"properties":"苦、寒。归心、肝、胃、大肠、膀胱经","functions":"清热燥湿、杀虫止痒、利尿","functions_full":"湿热泻痢（配木香等）\n １清热燥湿 \n  湿热蕴蒸，黄疸尿赤（配茵陈、栀子等）\n２杀虫止痒——带下阴痒、湿疹疥癣（配黄柏、蛇床子等）\n３利尿——湿热蕴结，小便不利","dosage":"煎服，3-10g 外用适量","notes":"反藜芦 龙胆草与苦参的功效比较","indications":"①湿热下注之泻痢、黄疸，常配黄连、黄芩；②湿热淋证，带下，常配黄柏、车前子；③湿热蕴结之皮肤瘙痒、疥癣、麻风，内服外用均可。","combinations":"苦参配蛇床子：清热燥湿止痒，外洗治皮肤瘙痒；苦参配黄柏：清热燥湿，治湿热下注。","differentiation":"苦参vs龙胆：均清热燥湿。苦参兼能杀虫利尿；龙胆专入肝胆。"},{"name":"金银花","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热解毒药","page":217,"properties":"甘、寒。归肺、心、胃经","functions":"热毒疮痈、温病       邪入气分（配石膏、知母等）","functions_full":"银花解毒散风热，痈肿毒痢内外清 \n             １热毒疮痈——为治一切痈肿疔疮阳证要药  \n                       疮痈初起（外用或仙方活命饮）\n                            疔疮肿毒，坚硬根深（五味消毒饮）\n                         肠痈腹痛（清肠汤）\n                         肺痈咳吐脓血（配鱼腥草、芦根等）\n清热解毒                邪在卫分（银翘散）\n               ２温病       邪入气分（配石膏、知母等）\n                                  邪入营血（清营汤）\n               ３热毒泄痢（配黄芩、黄连等）","dosage":"煎服，10-15g 外用适量 金银花与忍冬藤的功效比较","notes":"","indications":"①风热表证及温病初起，常配连翘、牛蒡子（银翘散）；②热入气分之壮热烦渴，常配石膏、知母；③热入营血之身热夜甚、斑疹隐隐，常配生地黄、玄参（清营汤）；④热毒疮疡痈肿，为治一切痈肿疔毒之要药，常配蒲公英、紫花地丁；⑤热毒血痢。","combinations":"金银花配连翘：清热解毒、疏散风热，治温病及疮疡；金银花配蒲公英：清热解毒散结；金银花配黄芩、黄连：清热止痢。","differentiation":"金银花vs连翘：均清热解毒、疏散风热，常相须为用。金银花疏散风热力强，善治血热毒痢；连翘消肿散结力优，善治瘰疬瘿瘤。"},{"name":"连翘","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热解毒药","page":222,"properties":"苦、微寒。归肺、心、胆经","functions":"清热解毒、消痈散结   疮痈、清心利尿","functions_full":"连翘解毒散肿结，清心透散疮家圣  \n１清热解毒——本品长于清心火，散上焦风热\n  邪在卫分（银翘散）\n温病    热入营血（清营汤）\n  热入心包（清宫汤）\n２消痈散结   疮痈——疮家圣药（常与金银花相须为用）\n             痰核（配夏枯草、浙贝、玄参等）\n３清心利尿——热淋涩痛（配竹叶、木通等）","dosage":"煎服，6-15g 金银花与连翘的功效比较","notes":"","indications":"①风热表证及温病初起，常配金银花；②疮疡肿毒、瘰疬痰核，为'疮家圣药'，常配贝母、玄参；③热入心包之高热神昏，清心泻火，常配犀角（水牛角代）、莲子心。","combinations":"连翘配金银花：清热解毒散结；连翘配浙贝母：消肿散结，治瘰疬；连翘配玄参：散结消肿。","differentiation":"连翘vs金银花：见金银花鉴别。连翘长于消肿散结，兼清心利尿，果壳中空有'通利'之效。"},{"name":"蒲公英","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热解毒药","page":227,"properties":"苦、甘、寒。归肝、胃经","functions":"利湿通淋、清肝明目","functions_full":"公英解毒消痈肿，乳痈肿痛胃菌胜 \n热毒疮疡痈肿疔毒（五味消毒饮）\n１清热解毒乳痈肿痛（配全栝楼、天花粉等）\n肠痈腹痛（配大黄、牡丹皮等）\n肺痈吐脓（配鱼腥草、冬瓜仁等）\n湿热淋证（配白茅根）\n２利湿通淋\n黄疸（配茵陈、栀子等）\n３清肝明目——肝火上炎，目赤肿痛","dosage":"煎服，10-30g 外用适量","notes":"","indications":"①乳痈肿痛，为治乳痈之要药，常配瓜蒌、牛蒡子；②痈肿疮毒，常配金银花、紫花地丁（五味消毒饮）；③肠痈腹痛，常配大黄、牡丹皮；④肺痈之咳吐脓痰；⑤肝热目赤，湿热黄疸，热淋。","combinations":"蒲公英配紫花地丁、金银花：清热解毒疗疮；蒲公英配茵陈：清热利湿退黄；蒲公英配车前草：利尿通淋。","differentiation":"蒲公英vs紫花地丁：均清热解毒。蒲公英善治乳痈，兼利湿通淋；紫花地丁善治疔疮肿毒，凉血消肿力强。"},{"name":"紫花地丁","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":230,"properties":"苦、辛，寒。归心、肝经。","functions":"清热解毒、凉血消肿","functions_full":"紫花地丁解毒强，疔疮肿毒及乳痈\n１清热解毒——热毒疮疡，尤善治疔疮肿毒（五味消毒饮）；乳痈（配蒲公英）；肠痈\n２凉血消肿——一切痈疽发背，红肿热痛","dosage":"煎服，15-30g。外用适量。","notes":"体质虚寒者忌用","indications":"①疔疮肿毒、痈疽发背、丹毒，为治疔疮之要药，常配蒲公英、金银花（五味消毒饮）；②毒蛇咬伤，单味鲜品捣敷。","combinations":"紫花地丁配蒲公英：清热解毒，治疮疡肿毒；紫花地丁配金银花：增强清热解毒之力。","differentiation":"紫花地丁vs蒲公英：见蒲公英鉴别。"},{"name":"野菊花","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":233,"properties":"苦、辛，微寒。归肺、肝经。","functions":"清热解毒、泻火平肝","functions_full":"野菊花清热解毒好，痈肿疔毒咽喉痛\n１清热解毒——热毒疮疡、咽喉肿痛、目赤肿痛（配蒲公英、紫花地丁等）\n２泻火平肝——肝火上炎之目赤肿痛（配决明子、夏枯草等）","dosage":"煎服，10-15g。","notes":"脾胃虚寒者慎用。野菊花清热解毒力强于菊花","indications":"①疔疮痈肿、丹毒，常配蒲公英、紫花地丁；②咽喉肿痛，常配金银花、牛蒡子；③风火赤眼，常配夏枯草、决明子；④高血压之头痛眩晕。","combinations":"野菊花配蒲公英：清热解毒消痈；野菊花配夏枯草：清肝明目降压。","differentiation":"野菊花vs菊花：均疏散风热、清肝明目。野菊花苦寒清热解毒力强，善治痈肿疔毒；菊花辛散疏散风热力强。"},{"name":"大青叶","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":236,"properties":"苦，大寒。归心、胃经。","functions":"清热解毒、凉血消斑","functions_full":"大青叶清热解毒强，温病发斑及丹毒\n１清热解毒——外感风热或温病初起，发热头痛（配金银花、连翘等）；咽喉肿痛、口舌生疮；丹毒、痄腮（普济消毒饮）\n２凉血消斑——温病热入营血，高热神昏，发斑发疹（犀角大青汤）","dosage":"煎服，10-15g。","notes":"脾胃虚寒者忌用","indications":"①温热病邪入营血之高热神昏、发斑发疹，常配水牛角、玄参；②痄腮、丹毒、口疮，常配金银花、连翘；③外感风热及温病初起，常配金银花、薄荷。","combinations":"大青叶配板蓝根：清热解毒凉血，治温病发斑、痄腮；大青叶配金银花：疏散风热解毒。","differentiation":"大青叶vs板蓝根：同出一源，大青叶为菘蓝之叶，板蓝根为根。大青叶凉血消斑力强；板蓝根利咽消肿力优。"},{"name":"板蓝根","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":239,"properties":"苦，寒。归心、胃经。","functions":"清热解毒、凉血利咽","functions_full":"板蓝根擅利咽喉，温病发斑及痄腮\n１清热解毒——外感风热或温病初起；大头瘟、痄腮、丹毒\n２凉血利咽——咽喉肿痛，为治咽喉肿痛之要药（普济消毒饮）；温毒发斑","dosage":"煎服，10-15g。","notes":"体虚而无实火热毒者忌服","indications":"①外感风热及温病初起之发热头痛咽痛，常配金银花、连翘；②大头瘟、痄腮、咽喉肿痛，常配大青叶、牛蒡子。","combinations":"板蓝根配大青叶：清热解毒凉血；板蓝根配玄参：利咽消肿散结。","differentiation":"板蓝根vs大青叶：见大青叶鉴别。"},{"name":"贯众","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":242,"properties":"苦，微寒。有小毒。归肝、脾经。","functions":"清热解毒、凉血止血、杀虫","functions_full":"贯众解毒杀诸虫，凉血止血治崩中\n１清热解毒——风热感冒、温毒发斑、痄腮、疮疡肿毒\n２凉血止血——血热妄行之吐血、衄血、便血、崩漏\n３杀虫——驱杀绦虫、蛲虫、钩虫等多种肠道寄生虫","dosage":"煎服，5-10g。","notes":"有小毒，用量不宜过大。脾胃虚寒及孕妇慎用","indications":"①风热感冒、温病初起，常配金银花、连翘；②温毒发斑、痄腮，常配大青叶、板蓝根；③绦虫、蛔虫、蛲虫等肠道寄生虫病，驱虫要药；④血热妄行之吐血衄血便血。","combinations":"贯众配板蓝根：清热解毒，治痄腮；贯众配使君子：驱杀肠道寄生虫。","differentiation":"贯众vs使君子：均驱虫。贯众兼清热解毒凉血；使君子专驱蛔虫，健脾消积。"},{"name":"鱼腥草","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":245,"properties":"辛、微寒。归肺经","functions":"清热解毒、消痈排脓、利尿通淋","functions_full":"鱼腥草解毒排脓，利尿通淋治肺痈 \n１清热解毒——热毒疮疡（配野菊花、金银花等）\n  肺痈吐脓（配桔梗、芦根等）\n２消痈排脓\n  肺热咳嗽（配黄芩、桑白皮等）\n３利尿通淋——湿热淋证（配车前子、白茅根等）","dosage":"煎服，15-30g 外用适量 红 藤 类 别 植物 原植物 木通科植物大血藤 药 材 藤茎","notes":"","indications":"①肺痈之咳吐脓痰腥臭，善清肺热、排脓消痈，为治肺痈之要药，常配桔梗、黄芩；②肺热咳嗽痰黄，常配桑白皮、知母；③热毒疮疡、疔毒，可内服外敷；④湿热淋证、湿热泻痢。","combinations":"鱼腥草配桔梗：清热排脓，治肺痈；鱼腥草配车前草：利尿通淋，治湿热淋证。","differentiation":"鱼腥草vs蒲公英：均清热解毒消痈。鱼腥草善治肺痈，兼利尿通淋；蒲公英善治乳痈，兼利湿退黄。"},{"name":"射干","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":248,"properties":"苦、寒。归肺经","functions":"清热解毒利咽、祛痰止咳","functions_full":"射干解毒善祛痰，咽喉肿痛痰壅喘 \n１清热解毒利咽——痰热咽喉肿痛（单用或配黄芩、桔梗等）\n  ２祛痰止咳              \n                         肺热咳喘（射干马兜铃汤）\n    痰盛咳喘，寒热均可\n                         寒痰气喘（射干麻黄汤）","dosage":"煎服，6-10g","notes":"孕妇慎用","indications":"①热毒或痰热所致之咽喉肿痛，为治喉痹咽痛之要药，常配山豆根、玄参；②痰热壅肺之咳嗽气喘、喉中痰鸣，常配桑白皮、麻黄。","combinations":"射干配山豆根：清热解毒利咽；射干配麻黄：宣肺化痰、止咳平喘。","differentiation":"射干vs山豆根：见山豆根鉴别。射干兼消痰散结，山豆根大苦大寒有小毒。"},{"name":"山豆根","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":251,"properties":"苦，寒。有毒。归肺、胃经。","functions":"清热解毒、利咽消肿","functions_full":"山豆根苦寒有毒，咽喉肿痛属实热\n１清热解毒——热毒蕴结之咽喉肿痛，为治咽喉肿痛要药；肺热咳嗽\n２利咽消肿——牙龈肿痛、口舌生疮","dosage":"煎服，3-6g。","notes":"有毒，用量不宜过大。脾胃虚寒者慎用","indications":"①肺胃火毒上攻之咽喉肿痛，为治喉痹之要药，常配射干、玄参；②牙龈肿痛、口舌生疮，肺热咳嗽；③湿热黄疸；④多种癌症辅助治疗。","combinations":"山豆根配射干：清热利咽解毒，治咽喉肿痛；山豆根配玄参：清热利咽消肿。","differentiation":"山豆根vs射干：均利咽。山豆根大苦大寒，清热解毒力极强，有小毒；射干兼消痰散结。"},{"name":"白头翁","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":254,"properties":"苦、寒。归大肠经","functions":"清热解毒，止痢、杀虫止痒","functions_full":"白头翁解毒凉血，热毒血痢归大肠 \n１清热解毒，止痢——热毒泻痢，为治痢要药（白头翁汤）\n２杀虫止痒——阴痒（配秦皮）","dosage":"煎服，6-15g； 保留灌肠，30-50g 外用适量","notes":"虚寒泻痢慎用","indications":"①热毒血痢，里急后重，为治热毒血痢之要药，常配黄连、黄柏、秦皮（白头翁汤）；②疮疡肿毒、瘰疬。","combinations":"白头翁配黄连、秦皮：清热解毒、凉血止痢；白头翁配地榆：凉血止痢。","differentiation":"白头翁vs马齿苋：均清热解毒止痢。白头翁专入血分，凉血解毒力强；马齿苋兼凉血止血、利尿通淋。"},{"name":"土茯苓","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热解毒药","page":257,"properties":"甘、淡、平。归肺、胃经","functions":"清热解毒、除湿、利关节","functions_full":"１清热解毒——热毒疮疡（配金银花、野菊花）\n２除湿\n湿热淋证（配木通、车前子）\n湿热证湿热带下，湿疹（配黄柏、苦参）\n湿热痹证（配秦艽、防己等）\n３利关节——梅毒或因梅毒服汞剂而致肢体拘挛者","dosage":"煎服，15-30g","notes":"","indications":"①梅毒及梅毒引起之肢体拘挛、筋骨疼痛，为治梅毒之要药，常配金银花、甘草；②湿热下注之淋浊带下、小便涩痛；③疮疡肿毒、湿疹瘙痒。","combinations":"土茯苓配金银花：清热解毒，治梅毒疮毒；土茯苓配萆薢：利湿分清化浊。","differentiation":"土茯苓vs萆薢：见萆薢鉴别。土茯苓解毒力强，善治梅毒。"},{"name":"生地黄","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热凉血药","page":263,"properties":"甘、苦，寒。归心、肝、肾经。","functions":"清热凉血、养阴生津","functions_full":"地黄凉血又养阴，热入营血及阴虚\n１清热凉血——热入营血之身热夜甚、口干舌绛（清营汤）；血热妄行之吐衄尿血崩漏（犀角地黄汤）\n２养阴生津——热病伤阴之烦渴、肠燥便秘（增液汤）；阴虚内热之骨蒸劳热；消渴证（配天花粉、麦冬等）","dosage":"煎服，10-15g。鲜品加倍。","notes":"脾虚湿滞、腹满便溏者忌用","indications":"①热入营血之身热夜甚、斑疹隐现、烦躁不眠，常配水牛角、玄参（清营汤）；②血热妄行之吐血衄血，常配生荷叶、生艾叶；③阴虚内热之骨蒸潮热、消渴，常配知母、麦冬；④热病伤阴之肠燥便秘，常配玄参、麦冬（增液汤）。","combinations":"生地黄配玄参：清热凉血、养阴生津；生地黄配知母：滋阴降火；生地黄配当归：滋阴养血活血。","differentiation":"生地黄vs熟地黄：均为地黄，加工不同。生地黄甘寒，清热凉血、养阴生津，治热病及血热证；熟地黄甘温，补血调经、填精益髓，治血虚及肾虚证。"},{"name":"玄参","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热凉血药","page":267,"properties":"苦、甘、咸、寒。归肺、胃、肾经","functions":"凉血、养阴、散结","functions_full":"玄参凉血且滋阴，解毒散结功效真 \n 热入营分，身热夜甚（清营汤）\n  １凉血\n 热陷心包，神昏谵语（清宫汤）\n  ２养阴—— 肠燥便秘（增液汤）\n 外感咽痛（配牛蒡子、桔梗等）\n  ３解毒   虚火咽痛（玄参柑橘汤）\n 脱疽（四妙勇安汤）\n  ４散结——瘰疬痰核（消瘰丸）","dosage":"煎服，10-15g","notes":"反藜芦 生地与玄参的功效比较","indications":"①热入营血之身热发斑、烦躁不寐，常配生地黄、水牛角（清营汤）；②阴虚火旺之咽喉肿痛，常配麦冬、桔梗；③瘰疬痰核，常配浙贝母、牡蛎（消瘰丸）；④疮疡肿毒；⑤热病伤阴之肠燥便秘，常配生地黄、麦冬（增液汤）。","combinations":"玄参配生地黄：清热凉血、养阴增液；玄参配浙贝母、牡蛎：消肿散结，治瘰疬；玄参配桔梗：利咽消肿。","differentiation":"玄参vs生地黄：均清热凉血。玄参咸寒，兼软坚散结，治瘰疬；生地黄甘寒，偏养阴生津，治消渴。"},{"name":"牡丹皮","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清热凉血药","page":272,"properties":"苦、辛、微寒。归心、肝、肾经","functions":"活血散瘀","functions_full":"丹皮凉血散瘀血，内外痈肿骨蒸热 \n 热入血分、吐衄发斑（清热地黄汤）\n１清热凉血 阴虚发热（青蒿鳖甲汤）\n 疮痈及肠痈\n２活血散瘀——血瘀经闭、痛经徵瘕","dosage":"煎服，6-12g","notes":"","indications":"①热入血分之斑疹吐衄，常配犀角（水牛角代）、生地黄；②血瘀经闭、痛经、癥瘕，常配桃仁、赤芍（桂枝茯苓丸）；③肠痈初起之腹痛，常配大黄、桃仁、冬瓜仁（大黄牡丹汤）；④阴虚发热之无汗骨蒸，常配知母、鳖甲。","combinations":"牡丹皮配栀子：清热凉血、活血；牡丹皮配桃仁：活血化瘀，治经闭癥瘕；牡丹皮配知母：清热凉血、滋阴退蒸。","differentiation":"牡丹皮vs赤芍：均清热凉血、活血散瘀。牡丹皮偏清透阴分伏火，善治无汗骨蒸；赤芍偏泻肝火，散瘀止痛力强。"},{"name":"赤芍","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清热凉血药","page":276,"properties":"苦、微寒。归肝经","functions":"清热凉血疮痈红肿热痛（配金银花、连翘等）、散瘀止痛","functions_full":"赤芍凉血兼清肝，瘀滞肿痛经闭尝 \n热入血分，斑疹吐衄及血热吐衄（清热地黄汤）\n１清热凉血疮痈红肿热痛（配金银花、连翘等）\n肝火目赤肿痛（配石决明、夏枯草等）\n２散瘀止痛——血瘀经闭，痛经及跌打损伤","dosage":"煎服，6-15-30-60g","notes":"反藜芦 丹皮与赤芍的功效比较","indications":"①热入营血之斑疹吐衄，常配牡丹皮、生地黄；②血瘀经闭、痛经、癥瘕，常配桃仁、红花；③跌打损伤、疮疡肿痛；④肝火上炎之目赤肿痛，常配菊花、夏枯草。","combinations":"赤芍配牡丹皮：清热凉血、活血散瘀；赤芍配桃仁：活血化瘀；赤芍配柴胡：清肝解郁。","differentiation":"赤芍vs白芍：均芍药之根。赤芍偏清热凉血、散瘀止痛，治血热瘀滞；白芍偏养血调经、柔肝止痛，治血虚肝旺。赤芍泻实，白芍补虚。"},{"name":"青蒿","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"清热药","subCategory":"清虚热药","page":281,"properties":"苦、辛、寒。归肝、胆经","functions":"清虚热、退骨蒸、解暑、截疟","functions_full":"青蒿透散阴分热，除蒸解暑截疟邪 \n１清虚热——温邪伤阴，夜热早凉（青蒿鳖甲汤）\n２退骨蒸——阴虚发热，劳热骨蒸（清骨散）\n３解暑——外感暑热，发热头痛（配金银花、连翘等）\n４截疟——疟疾寒热（配黄芩、滑石等）","dosage":"煎服，3-10g 不宜久煎","notes":"","indications":"①温病后期之夜热早凉、热退无汗，为清虚热之要药，常配鳖甲、知母（青蒿鳖甲汤）；②阴虚发热之骨蒸潮热，常配地骨皮、银柴胡；③暑热外感之发热口渴，常配滑石、甘草；④疟疾寒热，常配黄芩。","combinations":"青蒿配鳖甲：滋阴透热，治温病后期阴虚发热；青蒿配黄芩：清热解毒截疟；青蒿配滑石：清暑退热。","differentiation":"青蒿vs白薇：均清虚热。青蒿兼解暑截疟，透热达表；白薇兼利尿通淋、解毒疗疮。"},{"name":"地骨皮","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"清热药","subCategory":"清虚热药","page":285,"properties":"甘、淡、寒。归肺、肝、肾经","functions":"退骨蒸、清肺热、凉血止血、养阴生津","functions_full":"地骨皮凉血退蒸，清肺热止血妄行 \n１退骨蒸——阴虚潮热，骨蒸盗汗（地骨皮汤）\n２清肺热——肺热喘咳（泻白散）\n３凉血止血——血热妄行的吐血衄血等（配白茅根、侧柏叶等\n４养阴生津——消渴内热（配生地、天花粉等）","dosage":"煎服，6-15g 青蒿与地骨皮的功效比较","notes":"","indications":"①阴虚发热之骨蒸潮热盗汗，常配知母、鳖甲；②肺热咳嗽，常配桑白皮；③血热妄行之吐血衄血；④消渴，常配生地黄、天花粉。","combinations":"地骨皮配桑白皮：清泻肺热，治肺热咳嗽；地骨皮配知母：清虚热，治阴虚发热。","differentiation":"地骨皮vs牡丹皮：均清热凉血、退虚热。地骨皮退虚热兼泻肺热，治有汗骨蒸；牡丹皮退虚热兼活血散瘀，治无汗骨蒸。"},{"name":"大黄","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"泻下药","subCategory":"攻下药","page":291,"properties":"苦、寒。归脾、胃、大肠、肝、心经","functions":"泻下攻积、泻火解毒","functions_full":"大黄荡涤积与瘀，火毒湿热一并驱 \n１泻下攻积——胃肠积滞，大便秘结。为治积滞便秘要药\n热结便秘（大承气汤）\n里实热结而气血虚者（黄龙汤）\n热结伤阴（增液承气汤）\n冷积便秘（温脾汤）\n泻痢初起，泻而不畅（配黄连、黄柏等）\n２泻火解毒\n 迫血上溢之吐血衄血咯血\n①火热亢盛\n火热上炎所致的咽痛、目赤、口疮、牙龈肿痛\n② 热毒疮疡，烧烫伤\n 肠痈（大黄牡丹汤）","dosage":"煎服,5-10g 后下 开水泡服","notes":"孕妇、月经期、哺乳期应慎用或忌用","indications":"①热结便秘之腹胀腹痛，为治积滞便秘之要药，常配芒硝、枳实、厚朴（大承气汤）；②湿热泻痢之里急后重，通因通用，常配黄连、芍药；③血热妄行之吐血衄血，常配黄芩、黄连；④热毒疮疡、烧烫伤，内服外用均可；⑤瘀血经闭、产后瘀阻；⑥湿热黄疸，常配茵陈、栀子（茵陈蒿汤）。","combinations":"大黄配芒硝：攻下热结，治阳明腑实；大黄配茵陈、栀子：清热利湿退黄；大黄配桃仁：活血逐瘀；大黄配附子：温阳通下，治寒积便秘。","differentiation":"大黄vs芒硝：均泻下攻积，治热结便秘。大黄泻下力强，兼清热凉血解毒、活血化瘀；芒硝软坚润燥，兼清热消肿。大黄入气分又入血分，芒硝专润肠道。"},{"name":"芒硝","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"泻下药","subCategory":"攻下药","page":297,"properties":"咸、苦、寒。归胃、大肠经","functions":"泻下、清热、软坚、回乳","functions_full":"芒硝软化便燥结，咽痛口疮及痈结 \n１泻下——热结便秘。常与大黄相须为用\n２清热——咽痛、口疮、目赤（多外用或配冰硼散）\n３软坚——疮疡、乳痈\n４回乳——外敷","dosage":"内服，10-15g 冲服 外用适量","notes":"孕妇及哺乳期妇女忌用或慎用 大黄与芒硝的功效比较","indications":"①实热积滞之便秘、腹胀满，常配大黄；②咽痛口疮，外用吹喉、漱口；③肠痈初起，常配大黄、牡丹皮；④目赤肿痛。","combinations":"芒硝配大黄：攻下实热，治阳明腑实证；芒硝配冰片、硼砂：清热解毒、消肿止痛（冰硼散）。","differentiation":"芒硝vs大黄：见大黄鉴别。芒硝咸苦寒，软坚散结润燥力强。"},{"name":"火麻仁","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"泻下药","subCategory":"润下药","page":303,"properties":"甘，平。归脾、胃、大肠经。","functions":"润肠通便、滋养补虚","functions_full":"火麻仁润肠通便，体虚津枯便秘灵\n１润肠通便——肠燥便秘（麻子仁丸）；产后、病后或老人体虚津枯之便秘\n２滋养补虚——虚劳、消渴","dosage":"煎服，10-15g，打碎入煎。","notes":"脾虚便溏者慎用","indications":"①肠燥便秘，为润肠通便之要药，尤宜于老人、产妇、体虚者之津血不足便秘，常配当归、杏仁；②热病后或习惯性便秘，常配大黄、枳实。","combinations":"火麻仁配当归、杏仁：养血润肠通便，治血虚肠燥便秘。","differentiation":"火麻仁vs郁李仁：均润肠通便。火麻仁兼滋养补虚，宜于虚人便秘；郁李仁兼行气利水消肿，宜于气滞便秘。"},{"name":"甘遂","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"泻下药","subCategory":"峻下逐水药","page":307,"properties":"苦，寒。有毒。归肺、肾、大肠经。","functions":"泻水逐饮、消肿散结","functions_full":"甘遂峻下逐水饮，胸腹积水及水肿\n１泻水逐饮——水肿胀满、胸腹积水、二便不利（十枣汤）；风痰癫痫\n２消肿散结——湿热肿毒，外用研末调敷","dosage":"研末服，0.5-1g/次。入丸散。内服宜醋制。","notes":"体虚及孕妇忌用。反甘草（十八反）","indications":"①水肿胀满、胸腹积水、二便不利，长于泻水逐饮，常配大戟、芫花（十枣汤）；②风痰癫痫，常配朱砂；③痈肿疮毒。","combinations":"甘遂配京大戟、芫花：峻下逐水，治胸腹积水；甘遂配牵牛子：增强逐水之力。","differentiation":"甘遂vs京大戟：均峻下逐水。甘遂泻水湿力最强；京大戟消肿散结力强。均有毒，注意炮制和剂量。"},{"name":"京大戟","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"泻下药","subCategory":"峻下逐水药","page":311,"properties":"苦，寒。有毒。归肺、脾、肾经。","functions":"泻水逐饮、消肿散结","functions_full":"京大戟逐水消肿，胸腹积水及瘰疬\n１泻水逐饮——水肿胀满、胸腹积水实证（十枣汤、控涎丹）\n２消肿散结——热毒痈肿疮毒、瘰疬痰核，内服外用均可","dosage":"煎服，1.5-3g。入丸散，1g/次。内服宜醋制。","notes":"体虚及孕妇忌用。反甘草（十八反）","indications":"①水肿胀满、胸腹积水，常配甘遂、芫花；②痈肿疮毒、瘰疬痰核，内服外用均可。","combinations":"京大戟配甘遂：峻下逐水，治胸腹积水；京大戟配山慈姑：解毒散结，治痈肿。","differentiation":"京大戟vs甘遂：见甘遂鉴别。均峻下逐水，有毒。"},{"name":"独活","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"祛风湿药","subCategory":"祛风寒湿药","page":321,"properties":"辛、苦、微温。归肝、膀胱经","functions":"祛风湿、解表","functions_full":"独活风寒湿皆祛，伏风头痛下肢痹 \n１祛风湿——风寒湿痹，尤以下半身为宜（独活酒、独活寄生汤）\n２解表——外感风寒挟湿之表证（荆防败毒散）","dosage":"煎服，5-10g 羌活与独活的功效比较","notes":"","indications":"①风寒湿痹之腰膝、下肢关节疼痛，善行少阴肾经，治痹痛在下在里者，常配桑寄生、杜仲；②风寒夹湿表证之头痛头重、肢体重痛，常配羌活、川芎；③少阴头痛，常配细辛。","combinations":"独活配羌活：祛风除湿，通治一身痹痛；独活配桑寄生：祛风湿、补肝肾，治肝肾不足之痹痛（独活寄生汤）。","differentiation":"独活vs羌活：见羌活鉴别。独活性较缓和，善治下半身痹痛，兼入少阴肾经。"},{"name":"威灵仙","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风寒湿药","page":325,"properties":"辛、咸、温。归膀胱经","functions":"祛风湿、治骨鲠","functions_full":"灵仙咸温通经络，诸般痹痛骨哽消 \n风湿痹痛\n１祛风湿\n风湿腰痛\n２治骨鲠——诸骨鲠咽（水煎威灵仙，骨鲠化成绵）","dosage":"煎服，5-15g 治骨鲠可用30-50g","notes":"","indications":"①风寒湿痹之四肢拘挛、麻木不仁、关节不利，通行十二经络而止痛，常配羌活、独活；②鱼骨鲠喉，单味煎汤加醋慢咽；③跌打损伤。","combinations":"威灵仙配羌活：祛风湿、通经络止痛；威灵仙配桑寄生：祛风湿、补肝肾强筋骨。","differentiation":"威灵仙vs秦艽：均祛风湿通经络。威灵仙辛咸温，祛风除湿力强，走窜力大；秦艽辛苦微寒，偏清虚热，为风药之润剂。"},{"name":"川乌","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风寒湿药","page":328,"properties":"辛、苦。有大毒。归心、脾、肝、肾经","functions":"祛风湿、散寒通络止痛  阴寒内盛的心腹冷痛（乌头赤石脂丸）、麻醉外用","functions_full":"川乌大毒祛风湿，散寒通络止痛强\n１祛风湿——寒湿头痛，身痛，厉节疼痛（乌头汤）\n     寒疝腹痛，手足厥冷（大乌头煎）\n２散寒通络止痛  阴寒内盛的心腹冷痛（乌头赤石脂丸）\n     中风手足不仁，筋脉挛痛（小活络丹）\n     外伤瘀痛（配三七、乳香、没药等）\n３麻醉外用","dosage":"煎服，3-9g 先煎；散剂或酒剂，1-2g；外用适量","notes":"孕妇忌用；十八反：“贝蒌半蔹及攻乌”；不宜久服；生品只外用","indications":"①风寒湿痹之关节剧痛、不可屈伸，散寒止痛之力甚强，常配麻醉、乌头汤；②寒疝腹痛；③心腹冷痛。④局部麻醉止痛。","combinations":"川乌配麻黄、芍药：温经散寒止痛，治寒湿历节（乌头汤）；川乌配草乌：增强麻醉止痛之力（外用）。","differentiation":"川乌vs草乌：均祛风除湿、散寒止痛，均有大毒。川乌为栽培品，毒性相对较小；草乌为野生，毒性更大。生品多外用，内服必须制用。"},{"name":"木瓜","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风寒湿药","page":331,"properties":"酸，温。归肝、脾经","functions":"疏筋活络、化湿和胃","functions_full":"木瓜除湿舒筋络，湿阻吐泻拘挛瘥 \n风湿痹痛，筋脉拘挛（木瓜煎）\n１疏筋活络\n脚气肿痛（配防己、白术等）\n２化湿和胃——吐泻转筋（蚕矢汤）","dosage":"煎服，10-15g","notes":"胃酸过多者不宜用","indications":"①湿浊中阻之吐泻转筋、脚气肿痛，为治湿痹拘挛之要药，常配吴茱萸、槟榔；②风湿痹痛之筋脉拘挛、关节不利；③消化不良。","combinations":"木瓜配吴茱萸、槟榔：化湿舒筋、行气止痛（鸡鸣散）；木瓜配五加皮：祛风湿、舒筋络。","differentiation":"木瓜vs五加皮：均祛风湿。木瓜偏舒筋活络，善治转筋拘挛；五加皮偏补肝肾强筋骨。"},{"name":"秦艽","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"祛风湿药","subCategory":"祛风湿热药","page":337,"properties":"苦、辛、微寒。归胃、肝、胆经","functions":"祛风湿、退虚热、清湿热","functions_full":"秦艽善除风湿热，黄疸骨蒸势能折 \n１祛风湿——风湿痹痛，筋脉拘挛及手足不遂，寒热均可\n偏寒（配羌活，独活）\n偏热（配防己，忍冬藤）\n２退虚热——骨蒸潮热\n３清湿热——湿热黄疸","dosage":"煎服，5-15-30g","notes":"","indications":"①风湿痹痛、筋脉拘挛，无论新久寒热均可，为'风药之润剂'，常配防风、独活；②中风手足不遂，常配川芎、当归；③阴虚发热之骨蒸潮热，常配知母、青蒿；④湿热黄疸，常配茵陈。","combinations":"秦艽配防风：祛风除湿舒筋；秦艽配青蒿：退虚热，治骨蒸潮热；秦艽配茵陈：清热利湿退黄。","differentiation":"秦艽vs威灵仙：见威灵仙鉴别。秦艽微寒，兼清虚热退黄。"},{"name":"防己","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风湿热药","page":341,"properties":"苦、辛，寒。归膀胱、肺经。","functions":"祛风湿、止痛、利水消肿","functions_full":"防己祛风又除湿，利水消肿痹痛止\n１祛风湿——风湿痹痛，以湿热痹痛为宜（宣痹汤）\n２止痛——各种疼痛证\n３利水消肿——水肿、小便不利（防己黄芪汤）；脚气浮肿","dosage":"煎服，5-10g。","notes":"苦寒较甚，脾胃虚寒及阴虚者忌用","indications":"①风湿痹痛之关节红肿热痛，偏湿热痹痛尤宜，常配薏苡仁、秦艽；②水肿腹水、小便不利，清利下焦湿热而利水消肿，常配黄芪、白术（防己黄芪汤）。","combinations":"防己配黄芪：益气利水，治风水浮肿；防己配薏苡仁：清热利湿除痹。","differentiation":"防己vs木防己：汉防己（粉防己）利水消肿力强；木防己（广防己）祛风止痛力强。使用时注意鉴别。"},{"name":"五加皮","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风湿强筋骨药","page":347,"properties":"辛、苦、温。归肝、肾经","functions":"祛风湿、补肝肾，强筋骨、利尿","functions_full":"五加祛湿强腰膝，行迟水肿与痿痹\n１祛风湿——风湿痹痛，四肢痹痛（五加皮散）\n肝肾不足 腰膝软弱（配怀牛膝、杜仲等）\n２补肝肾，强筋骨\n小儿行迟（配龟板、牛膝等）\n３利尿——水肿、小便不利（五皮饮）","dosage":"煎服，5-10g 附： 香加皮（北五加皮） 萝摩科植物红柳的根皮 五加皮与香加皮功效比较","notes":"","indications":"①风湿痹痛、筋骨痿软，兼补肝肾、强筋骨，常配牛膝、桑寄生；②小儿行迟（发育迟缓），常配龟甲、鹿角；③水肿小便不利，常配茯苓皮、大腹皮。","combinations":"五加皮配牛膝：祛风湿、补肝肾、强筋骨；五加皮配茯苓皮：利水消肿。","differentiation":"五加皮vs桑寄生：均祛风湿、补肝肾。五加皮兼利水消肿；桑寄生兼安胎。"},{"name":"桑寄生","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"祛风湿药","subCategory":"祛风湿强筋骨药","page":350,"properties":"苦、甘、平。归肝、肾经","functions":"祛风湿、补肝肾，强筋骨、安胎","functions_full":"寄生疗痹益肾肝，痹痛正虚胎不安 \n１祛风湿——风湿痹痛（独活寄生汤）\n２补肝肾，强筋骨——腰膝酸痛\n３安胎——胎漏下血，胎动不安（寿胎丸）","dosage":"煎服，10-15g 桑寄生与五加皮的功效比较","notes":"1、本品性温偏燥，易伤阴耗气，阴虚血燥及气虚者慎用。 2、本品多为辛香发散之品，多含挥发油，入汤剂不宜久煎，防止有效 成分挥发而降低药效。","indications":"①风湿痹痛、腰膝酸软，长于补肝肾、强筋骨，常配独活、杜仲（独活寄生汤）；②胎动不安、胎漏下血，补肝肾而安胎，常配阿胶、续断；③高血压病之头晕目眩。","combinations":"桑寄生配独活：祛风湿、补肝肾，治久痹；桑寄生配杜仲、续断：强筋骨、安胎。","differentiation":"桑寄生vs五加皮：见五加皮鉴别。桑寄生以安胎为长。"},{"name":"苍术","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"芳香化湿药","subCategory":"","page":357,"properties":"辛、苦、温。归脾、胃经","functions":"燥湿健脾、祛风湿   湿热痿痹、解表、明目","functions_full":"苍术燥湿兼健脾，湿痹泄泻风寒宜 \n１燥湿健脾——湿阻中焦\n风湿痹证 湿胜者尤宜\n湿热痹痛\n２祛风湿   湿热痿痹\n湿浊带下\n湿疮，湿疹\n３解表——外感风寒挟湿之表证\n４明目——夜盲证及目昏干涩","dosage":"煎服，5-10g","notes":"","indications":"①湿阻中焦之脘腹胀满、恶心呕吐、食少便溏，为燥湿健脾之要药，常配厚朴、陈皮（平胃散）；②风寒湿痹之肢节酸痛、足膝痿软，常配黄柏（二妙散）；③外感风寒夹湿之恶寒发热、头身重痛。④夜盲症、目暗不明。","combinations":"苍术配厚朴：燥湿运脾、行气除满；苍术配黄柏：清热燥湿，治湿热下注痿痹（二妙散）；苍术配白术：一燥湿一健脾，相得益彰。","differentiation":"苍术vs白术：均健脾燥湿。苍术苦温燥烈，长于燥湿运脾，兼祛风湿；白术甘苦温，长于补脾益气，兼安胎、固表。苍术偏治湿盛，白术偏治脾虚。"},{"name":"厚朴","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"芳香化湿药","subCategory":"","page":361,"properties":"辛、苦、温。归脾、胃、肺、大肠经","functions":"燥湿行气、消胀、平喘","functions_full":"厚朴降气除湿痰，气滞胀满喘咳痊 \n１燥湿行气——湿阻中焦、气滞不畅所致的脘闷腹胀腹痛或呕逆（平胃散）\n２消胀——肠胃积滞、脘腹胀满、大便秘结（厚朴三物汤）\n３平喘 \n外感风寒而发（桂枝厚朴杏子汤）\n①喘咳 \n痰湿壅肺，胸闷者（配苏子、半夏、杏仁）\n②梅核气（半夏厚朴汤）","dosage":"煎服，3-10g","notes":"","indications":"①湿阻中焦之脘痞腹胀，为行气消胀之要药，常配苍术、陈皮（平胃散）；②食积气滞之腹胀便秘，常配大黄、枳实（大承气汤）；③痰饮喘咳、胸闷气逆，常配杏仁、半夏。","combinations":"厚朴配苍术：燥湿行气除满；厚朴配大黄、枳实：行气通腑泄热；厚朴配杏仁：降气化痰平喘。","differentiation":"厚朴vs枳实：均行气导滞。厚朴偏于温中燥湿除满，善治湿阻中焦腹胀；枳实偏于破气消积化痰，善治食积痞满。"},{"name":"广藿香","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"芳香化湿药","subCategory":"","page":366,"properties":"辛、微温。归脾、胃、肺经","functions":"化湿、解暑","functions_full":"藿香化湿又解表，霍乱吐泻暑湿消 \n１化湿——湿阻中焦\n暑湿，暑月外感风寒，内伤生冷（藿香正气散）\n２解暑\n湿温初起（甘露消毒丹）\n湿浊中阻（常与半夏配伍）\n偏于湿热（配黄连、竹茹）\n３止呕偏于寒湿（配丁香、白豆蔻）\n妊娠呕吐（配砂仁、苏梗）\n脾胃虚弱（配党参、白术）","dosage":"煎服，5-10g 鲜品加倍 佩 兰 类 别 植物 原植物 菊科植物佩兰 药 材 地上部分","notes":"","indications":"①湿阻中焦之脘痞呕恶、食少作呕，为芳化湿浊之要药，常配苍术、厚朴；②暑湿表证之发热烦渴、恶心呕吐，常配紫苏、半夏（藿香正气散）；③湿温初起，常配黄芩、滑石。","combinations":"藿香配紫苏：解表化湿和中，治暑湿外感；藿香配半夏：燥湿止呕；藿香配佩兰：芳香化浊、解暑。","differentiation":"藿香vs佩兰：均芳香化湿解暑。藿香偏于化湿和中止呕；佩兰偏于化内湿、辟秽浊。夏季常用对药。"},{"name":"砂仁","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"芳香化湿药","subCategory":"","page":370,"properties":"辛、温。归脾、胃经","functions":"化湿、行气、温中止泻、安胎","functions_full":"砂仁化湿行滞气，中寒吐泄胎动宜 \n湿阻中焦\n１化湿\n寒湿气滞\n气滞食积（香砂枳术丸）\n２行气\n脾胃气滞（香砂六君子丸）\n３温中止泻——脾胃虚寒，腹痛吐泻\n４安胎——气滞、妊娠恶阻，胎动不安","dosage":"煎服，5-10g 后下 砂仁、白豆蔻、草豆蔻与草果的功效比较","notes":"","indications":"①湿阻中焦及脾胃气滞之脘腹胀满、食积不消；②脾胃虚寒之吐泻；③妊娠恶阻之恶心呕吐、胎动不安，为'安胎要药'，常配白术、苏梗。","combinations":"砂仁配白术：健脾化湿安胎；砂仁配木香：行气和中；砂仁配厚朴：行气化湿除满。","differentiation":"砂仁vs豆蔻：均芳香化湿、行气温中。砂仁偏入中下焦，长于安胎；豆蔻偏入中上焦，长于止呕。"},{"name":"豆蔻","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"芳香化湿药","subCategory":"","page":374,"properties":"辛，温。归肺、脾、胃经。","functions":"化湿行气、温中止呕、开胃消食","functions_full":"豆蔻化湿又行气，温中止呕开胃宜\n１化湿行气——湿阻中焦、脾胃气滞之脘腹胀痛（三仁汤）\n２温中止呕——胃寒呕吐\n３开胃消食——食积不化","dosage":"煎服，3-6g，后下。","notes":"阴虚血燥者忌用","indications":"①湿阻中焦之脘腹胀满，为芳香化湿之良药，常配砂仁、厚朴；②胃寒呕吐，善止呕，常配半夏、生姜；③湿温初起之胸闷不畅，常配黄芩、滑石。","combinations":"豆蔻配砂仁：芳香化湿、行气温中；豆蔻配半夏：燥湿降逆止呕。","differentiation":"豆蔻vs砂仁：见砂仁鉴别。豆蔻即白豆蔻，偏止呕。"},{"name":"茯苓","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"利水渗湿药","subCategory":"利水消肿药","page":381,"properties":"甘、淡、平。归心、脾、肾经","functions":"利水渗湿、健脾、安神","functions_full":"茯苓健脾利小便，痰饮水肿神不安 \n    １利水渗湿\n水湿停滞（五苓散）\n多种水肿水热互结（猪苓汤）\n阳虚水肿（真武汤）\n２健脾\n脾虚食少（四君子汤）\n脾虚各证脾虚饮停（苓桂术甘汤）\n脾虚湿泻（参苓白术散）\n３安神——心悸、失眠（归脾汤）","dosage":"煎服，10-15g 茯苓皮、白茯苓、赤茯苓与茯神的功效比较","notes":"","indications":"①各种水肿，为利水渗湿之要药，性平和，寒热虚实皆可，常配猪苓、泽泻（五苓散）；②脾虚之食少便溏、体倦乏力，常配人参、白术（四君子汤）；③心脾两虚之心悸失眠，常配远志、酸枣仁。","combinations":"茯苓配白术：健脾利湿；茯苓配猪苓、泽泻：增强利水之力；茯苓配酸枣仁：宁心安神。","differentiation":"茯苓vs猪苓：均利水渗湿。茯苓健脾宁心，利水而不伤正；猪苓利水渗湿力强但无补益之功，纯利无补。"},{"name":"薏苡仁","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"利水渗湿药","subCategory":"利水消肿药","page":385,"properties":"甘、淡、微寒。归脾、胃、肺经","functions":"健脾利水渗湿、清热排脓","functions_full":"薏苡渗湿兼健脾，清热排脓疗挛急 \n热淋（单用煎服）\n１健脾利水渗湿\n脾虚水肿、小便不利（配茯苓、白术、黄芪）\n风湿身痛发热（麻杏苡甘汤）\n２除痹风湿久痹（单用煮粥）\n湿热郁蒸（宣痹汤）\n肺痈（苇茎汤）\n３清热排脓\n肠痈（附子薏苡败酱散）","dosage":"煎服，10-30g 茯苓与薏苡仁的功效比较","notes":"","indications":"①脾虚水肿、小便不利，常配茯苓、白术；②脾虚泄泻，常配山药、莲子肉；③湿温病邪在气分，常配杏仁、白蔻仁（三仁汤）；④风湿痹痛之筋脉挛急，常配麻黄、杏仁（麻杏薏甘汤）；⑤肺痈、肠痈，常配鱼腥草、桃仁。","combinations":"薏苡仁配杏仁：宣肺利湿，治湿温；薏苡仁配麻黄：祛风除湿，治风湿痹痛；薏苡仁配鱼腥草：清肺排脓，治肺痈。","differentiation":"薏苡仁vs茯苓：均健脾利湿。薏苡仁性凉清热，兼排脓除痹；茯苓性平，兼宁心安神。"},{"name":"泽泻","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"利水渗湿药","subCategory":"利水消肿药","page":389,"properties":"甘、淡、寒。归肾、膀胱经","functions":"利水渗湿、泄热","functions_full":"泽泻渗利清下焦，水肿痰饮眩晕消 \n１利水渗湿\n小便不利，水肿（配茯苓、猪苓等）\n水湿证\n泄泻及痰饮所致的眩晕（泽泻汤）\n肾阴不足，虚火亢盛之遗精，滑精，眩晕等证（六味地黄丸）\n２泄热\n下焦湿热白带、小便短赤（配车前子、土茯苓等）","dosage":"煎服，5-10g","notes":"","indications":"①水肿胀满、小便不利，长于利水而不伤阴，常配茯苓、猪苓（五苓散）；②湿浊内停之泄泻，常配白术、茯苓；③痰饮眩晕，利水渗湿以清泄肾浊，常配白术（泽泻汤）；④湿热下注之热淋涩痛。","combinations":"泽泻配白术：健脾利湿，治痰饮眩晕（泽泻汤）；泽泻配茯苓：增强利水渗湿之力。","differentiation":"泽泻vs猪苓：均利水渗湿。泽泻偏入肾经，兼清肾浊泄热；猪苓专入膀胱，纯利水湿。"},{"name":"猪苓","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"利水渗湿药","subCategory":"利水消肿药","page":393,"properties":"甘、淡、平。归肾、膀胱经","functions":"利水渗湿","functions_full":"脾虚水肿（四苓散）\n利水渗湿——水湿证 水湿泄泻（胃苓汤）\n                       水热互结小便不利（猪苓汤）","dosage":"煎服，5-10g 茯苓与猪苓的功效比较","notes":"","indications":"①各种水肿、小便不利，利水渗湿力强，常配茯苓、泽泻（五苓散）；②湿热带下、淋浊，常配黄柏、车前子。","combinations":"猪苓配茯苓：增强利水渗湿之力；猪苓配泽泻：利水渗湿泄热。","differentiation":"猪苓vs茯苓：见茯苓鉴别。猪苓纯利无补，专利水湿。"},{"name":"车前子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"利水渗湿药","subCategory":"利尿通淋药","page":397,"properties":"甘、寒。归肾、肝、肺经","functions":"利尿通淋、渗湿止泻、清肝明目、清肺化痰","functions_full":"车前通淋止湿泄，化痰明目能清热 \n１利尿通淋——热淋（八正散）\n２渗湿止泻——暑湿泄泻（单用或配茯苓、白术等）\n３清肝明目\n肝热目赤肿痛（配菊花、龙胆草）\n目疾\n肝肾阴虚眼目昏花（配熟地、菟丝子等）\n高血压\n４清肺化痰——肺热咳嗽（配瓜蒌、贝母等）","dosage":"煎服，10-15g 车前草与车前子的攻效比较","notes":"","indications":"①湿热淋证之小便淋沥涩痛，为利尿通淋之要药，常配木通、滑石（八正散）；②水肿胀满，常配茯苓、猪苓；③湿盛泄泻，取其'利小便以实大便'之功；④肝热目赤肿痛或肝肾阴虚之目暗不明，常配菊花、枸杞子。","combinations":"车前子配木通、滑石：利尿通淋；车前子配白术：健脾利湿止泻；车前子配枸杞子：养肝明目。","differentiation":"车前子vs滑石：均利尿通淋。车前子兼明目、止泻；滑石兼清暑、外用收湿敛疮。"},{"name":"滑石","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"利水渗湿药","subCategory":"利尿通淋药","page":401,"properties":"甘、淡、寒。归胃、膀胱经","functions":"利尿通淋、清解暑热、收湿敛疮","functions_full":"１利尿通淋——淋证\n热淋（八正散）\n石淋（二金排石汤）\n２清解暑热——为治暑湿之常用药\n暑热烦渴（六一散）\n湿温、胸闷、气机不畅（三仁汤）\n３收湿敛疮——湿疮、湿疹","dosage":"煎服,10-15g 外用适量","notes":"","indications":"①湿热淋证、石淋，常配木通、车前子（八正散）；②暑湿证之发热烦渴、小便不利，常配甘草（六一散）；③湿温病之身热不退；④外用治湿疹、湿疮、痱子。","combinations":"滑石配甘草：清暑利湿（六一散）；滑石配车前子：利尿通淋；滑石配黄芩：清热燥湿。","differentiation":"滑石vs车前子：见车前子鉴别。"},{"name":"茵陈","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"利水渗湿药","subCategory":"利湿退黄药","page":407,"properties":"苦、微寒。归脾、胃、肝胆经","functions":"清湿热、退黄疸","functions_full":"茵陈清利善退黄，湿温湿疹及湿疮\n \n１清湿热——湿疹、湿疮（配黄柏、苦参等）\n２退黄疸——黄疸（为治黄疸要药）\n湿热黄疸（茵陈蒿汤）\n湿重于热（茵陈五苓散）\n寒湿黄疸（茵陈四逆汤）","dosage":"煎服，10-30g 外用适量","notes":"","indications":"①湿热黄疸之身目发黄、小便短赤，为治黄疸之要药，常配栀子、大黄（茵陈蒿汤）；②湿温、暑湿之发热身困；③湿疮瘙痒。","combinations":"茵陈配栀子、大黄：清热利湿退黄（茵陈蒿汤）；茵陈配干姜、附子：温化寒湿退黄（茵陈四逆汤）。","differentiation":"茵陈vs金钱草：均利湿退黄。茵陈专入肝胆，为治黄疸要药；金钱草兼利尿通淋、解毒消肿。"},{"name":"金钱草","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"利水渗湿药","subCategory":"利湿退黄药","page":411,"properties":"甘、淡、微寒。归肝、胆、肾、膀胱经","functions":"除湿退黄、利尿通淋、解毒消肿","functions_full":"金钱善除湿热黄，结石疮毒效亦良 \n１除湿退黄——湿热黄疸（配茵陈蒿、栀子等）\n２利尿通淋——热淋、石淋（配海金沙、鸡内金等）\n（排石三金：海金沙、鸡内金、金钱草）\n３解毒消肿——恶疮肿毒，毒蛇咬伤","dosage":"煎服，30-60g 鲜品加倍 外用适量 虎杖 类 别 植物 原植物 蓼科植物虎杖 药 材 根茎和根","notes":"","indications":"①湿热黄疸，常配茵陈、栀子；②石淋、热淋，为治石淋之要药，常配海金沙、鸡内金；③痈肿疔毒、毒蛇咬伤。","combinations":"金钱草配海金沙：利尿通淋，治石淋；金钱草配茵陈：清热利湿退黄。","differentiation":"金钱草vs茵陈：见茵陈鉴别。金钱草善治石淋，为排石化石要药。"},{"name":"虎杖","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"利水渗湿药","subCategory":"利湿退黄药","page":414,"properties":"苦、寒。归肝胆、肺经","functions":"利胆退黄、清热解毒、活血祛瘀、祛痰止咳","functions_full":"虎杖清热又利胆，解毒活血又祛痰 \n１利胆退黄——湿热黄疸，淋浊带下（配茵陈、栀子等）\n２清热解毒——烧烫伤、痈肿疮毒，毒蛇咬伤\n３活血祛瘀——血瘀经闭，跌打损伤\n４祛痰止咳——肺热咳嗽（配贝母、枇杷叶等）","dosage":"煎服，10-30g 外用适量","notes":"孕妇忌服 温里药 一、含义 凡以温里祛寒，治疗里寒证为主要作用的药物，称为温里 药。 功效： 温里祛寒 适应证：里寒证 二、性味特点： 辛味，性温热、主入心、脾、肾、肝经 三、衍申作用及适应证： 温里散寒——中寒证（寒邪直中脾胃）、 肺寒痰饮、肝经寒证 温里助阳——阳虚证（脾阳虚衰、心阳不足、肾阳亏虚） 回阳救逆——亡阳证 四、选择用药及配伍 1、外寒直中，应配辛温解表药 2、寒凝气滞血瘀者，配理","indications":"①湿热黄疸，常配茵陈；②经闭、癥瘕、跌打损伤，活血散瘀止痛，常配桃仁、红花；③肺热咳嗽，常配黄芩；④烧烫伤，外用；⑤热结便秘。","combinations":"虎杖配茵陈：清热利湿退黄；虎杖配桃仁：活血通经；虎杖配黄芩：清肺化痰。","differentiation":"虎杖vs大黄：均有清热利湿、活血、泻下之功。虎杖偏于活血通络；大黄偏于攻积导滞。"},{"name":"附子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"温里药","subCategory":"","page":421,"properties":"辛、甘、热。有毒。归心、肾、脾经","functions":"回阳救逆、补火助阳    脾肾阳虚，小便不利，肢体浮肿（真武汤）、散寒止痛","functions_full":"附子回阳善救逆，诸般阳虚及寒痹 \n亡阳证 四肢厥冷，脉微欲绝\n１回阳救逆\n气脱亡阳证\n阳虚症 肾阳虚所致的腰膝酸痛、畏寒肢冷、阳痿、尿频（右归丸）\n脾阳虚，脘腹冷痛，大便溏泻（附子理中汤）\n２补火助阳    脾肾阳虚，小便不利，肢体浮肿（真武汤）\n心阳衰弱，心悸气短，胸痹心痛（配人参、桂枝）\n阳虚外感，恶寒发热，无汗，脉沉（麻黄附子细辛汤）\n３散寒止痛——寒痹证（甘草附子汤）","dosage":"煎服，3-15g 先煎30-60分钟","notes":"①本品性燥烈，阴虚内热及孕妇忌用 ②十八反 ③有毒，内服须炮制 附子与乌头的功效比较","indications":"①亡阳虚脱之四肢厥冷、冷汗自出、脉微欲绝，回阳救逆第一要药，常配干姜、甘草（四逆汤）；②阳虚证之畏寒肢冷、腰膝冷痛、阳痿宫冷，常配肉桂、熟地黄；③寒痹之关节剧痛，常配桂枝、白术。","combinations":"附子配干姜：增强回阳救逆之力（四逆汤）；附子配肉桂：补火助阳，治命门火衰；附子配白术：温阳祛寒湿，治寒湿痹痛。","differentiation":"附子vs肉桂：均补火助阳。附子性走不守，通行十二经，回阳救逆力强；肉桂性守不走，偏入下焦，引火归元。附子有毒，肉桂无毒。"},{"name":"干姜","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"温里药","subCategory":"","page":426,"properties":"辛、甘、热。归脾、肾、心、肝经","functions":"温中、回阳、温肺化饮","functions_full":"干姜回阳温肺脾，中寒肺饮亡阳宜 \n１温中——脾胃虚寒，脘腹冷痛，呕吐泄泻等\n２回阳——亡阳证（常与附子相须为用，四逆汤）\n３温肺化饮——寒饮咳喘，痰多清稀（小青龙汤）","dosage":"煎服，3-10g","notes":"","indications":"①脾胃寒证之脘腹冷痛、呕吐泄泻，为温中散寒之要药，常配人参、白术（理中丸）；②亡阳证，常配附子（四逆汤）；③寒饮伏肺之咳喘痰多清稀，常配细辛、五味子。","combinations":"干姜配附子：回阳救逆（四逆汤）；干姜配人参、白术：温中健脾（理中丸）；干姜配细辛、五味子：温肺化饮。","differentiation":"干姜vs生姜：见生姜鉴别。干姜为姜之干燥品，温中回阳力强；生姜为鲜品，发散解表力优。"},{"name":"肉桂","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"温里药","subCategory":"","page":430,"properties":"辛、甘、热。归脾、肾、心、肝经","functions":"补火助阳、散寒止痛","functions_full":"肉桂温肾治沉寒，通经止痛火归元 \n１补火助阳——肾阳不足\n命门火衰，畏寒肢冷（桂附理中丸）\n肾精不足，男子阳痿、精冷，女子宫寒不孕（右归丸）\n水肿，小便不利（济生肾气丸）\n下元虚冷，虚阳上浮（配山萸肉、五味子）\n中焦虚寒所致的脘腹冷痛，呕吐，泄泻（单用或配丁香等）\n２散寒止痛\n阳虚寒盛，食少便溏，完谷不化（桂苓汤）","dosage":"煎服，2-5g 后下 研末冲服，1-2/次","notes":"血热妄行及孕妇忌用 畏赤石脂","indications":"①肾阳不足之畏寒肢冷、腰膝冷痛、阳痿宫冷，常配附子、熟地黄（金匮肾气丸）；②脾胃虚寒之脘腹冷痛、食少便溏，常配干姜、白术；③寒凝血脉之痛经、经闭，常配当归、川芎；④寒疝腹痛；⑤阴疽漫肿不溃，常配麻黄、白芥子；⑥虚阳上浮之面赤、咽痛，引火归元。","combinations":"肉桂配附子：温补肾阳（桂附地黄丸）；肉桂配当归、川芎：温经活血；肉桂配黄连：交通心肾，治心肾不交。","differentiation":"肉桂vs附子：见附子鉴别。肉桂为肉桂树之皮，引火归元为其独有功效。"},{"name":"吴茱萸","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"温里药","subCategory":"","page":435,"properties":"辛、苦、热。有小毒。归肝、脾、胃经","functions":"散寒止痛、温中止呕、助阳止泻","functions_full":"吴萸温肝降胃气，头痛寒疝呕泄宜 \n１散寒止痛——寒凝诸痛证\n寒疝腹痛（导气汤）\n厥阴头痛（吴茱萸汤）\n寒湿脚气肿痛（鸡鸣散）\n胃寒呕吐（配生姜、半夏）\n２温中止呕\n肝火犯胃，呕吐泛酸（左金丸）\n３助阳止泻——虚寒泄泻（四神丸）","dosage":"煎服，1.5-6g； 外用适量","notes":"不宜多用、久服","indications":"①肝寒犯胃之巅顶头痛、干呕吐涎沫（吴茱萸汤）；②寒疝腹痛，常配小茴香、川楝子；③寒湿脚气肿痛；④冲任虚寒之痛经，常配当归、川芎；⑤脾胃虚寒之呕吐泄泻。","combinations":"吴茱萸配生姜、人参：暖肝散寒、降逆止呕（吴茱萸汤）；吴茱萸配黄连：辛开苦降、清肝和胃（左金丸）。","differentiation":"吴茱萸vs小茴香：均散寒止痛。吴茱萸辛热燥烈，降逆止呕力强，治肝寒犯胃；小茴香温性较和缓，长于理气和胃。"},{"name":"小茴香","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"温里药","subCategory":"","page":439,"properties":"辛，温。归肝、肾、脾、胃经。","functions":"散寒止痛、理气和胃","functions_full":"小茴香善散寒疝，脘腹胀痛及痛经\n１散寒止痛——寒疝腹痛（配乌药、青皮等）；睾丸偏坠胀痛；痛经、少腹冷痛\n２理气和胃——胃寒气滞之脘腹胀痛（配干姜、木香等）","dosage":"煎服，3-6g。","notes":"阴虚火旺者忌用","indications":"①寒疝腹痛、睾丸偏坠胀痛，常配吴茱萸、川楝子；②胃寒气滞之脘腹胀痛、呕吐食少，常配干姜、木香。","combinations":"小茴香配吴茱萸：暖肝散寒止痛；小茴香配干姜：温中散寒行气。","differentiation":"小茴香vs吴茱萸：见吴茱萸鉴别。小茴香偏理气和胃。"},{"name":"丁香","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"温里药","subCategory":"","page":443,"properties":"辛，温。归脾、胃、肾经。","functions":"温中降逆、散寒止痛、温肾助阳","functions_full":"丁香温中降逆气，为治胃寒呃逆剂\n１温中降逆——为治胃寒呕吐、呃逆之要药（丁香柿蒂汤）\n２散寒止痛——脘腹冷痛（配肉桂、干姜等）\n３温肾助阳——肾阳不足之阳痿、宫冷","dosage":"煎服，1-3g。","notes":"热证及阴虚内热者忌用。畏郁金（十九畏）","indications":"①胃寒呕吐、呃逆，为治胃寒呕呃之要药，常配柿蒂、生姜；②脾胃虚寒之脘腹冷痛；③肾阳不足之阳痿、宫冷，常配附子、肉桂。","combinations":"丁香配柿蒂：温中降逆止呃；丁香配半夏：温中降逆止呕。","differentiation":"丁香vs柿蒂：均降逆止呃。丁香偏温中散寒；柿蒂性平和，善降胃气，不限于寒热。"},{"name":"陈皮","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"行气药","subCategory":"","page":451,"properties":"辛、苦、温。归脾、肺经","functions":"理气健脾、燥湿化痰","functions_full":"陈皮燥湿善理气，湿阻气滞痰咳宜 \n１、理气健脾——脾胃气滞\n寒湿阻中，气滞不畅（平胃散）\n脾虚气滞（异功散）\n脾胃气滞较甚，脘腹胀痛较剧（配木香、枳实）\n２、燥湿化痰——本品为治痰要药\n湿痰咳嗽（二陈汤）\n寒痰咳嗽（配干姜、细辛）","dosage":"煎服，3-10克 桔皮、桔核、桔叶与桔络的功效比较","notes":"","indications":"①脾胃气滞之脘腹胀满、食少吐泻，常配木香、砂仁；②湿痰寒痰之咳嗽痰多、胸闷，为治痰之要药，常配半夏、茯苓（二陈汤）；③胸痹、呕吐、呃逆。","combinations":"陈皮配半夏：燥湿化痰、理气降逆（二陈汤）；陈皮配苍术：燥湿健脾；陈皮配枳实：行气除满。","differentiation":"陈皮vs青皮：同出一物，陈皮为成熟果皮，青皮为幼果或未成熟果皮。陈皮理气健脾、燥湿化痰，药力缓和；青皮疏肝破气、消积化滞，药力峻猛。"},{"name":"枳实","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"行气药","subCategory":"","page":455,"properties":"苦、辛、微寒。归脾、胃、大肠经","functions":"破气消积、化痰除痞、引经下气","functions_full":"枳实破气痰积消，胸脘痞胀下陷疗 \n１、破气消积——食积停滞、胃肠热结\n食积不化，脘腹胀满，嗳腐气臭（配山楂、麦芽）\n热结便秘，腹痞胀满（大承气汤）\n湿热泻痢|、里急后重（枳实导滞丸）\n２、化痰除痞——胸痹结胸\n胸阳不振，痰阻胸痹（枳实薤白桂枝汤）\n痰热结胸（小陷胸加枳实汤）\n心下痞满，食欲不振（枳实丸）\n３、引经下气——气虚下陷之子宫脱垂，胃下垂，脱肛等","dosage":"煎服，3-10-30克","notes":"孕妇慎用 枳实与枳壳的功效比较","indications":"①食积证之脘腹痞满、腹胀便秘，常配山楂、麦芽；②湿热泻痢之里急后重，常配大黄、黄连；③气滞胸痹之胸脘痞闷，常配瓜蒌、薤白；④中气下陷证，配伍黄芪、升麻使用。","combinations":"枳实配厚朴：行气消痞除满；枳实配白术：健脾消痞（枳术丸）；枳实配大黄：行气通腑。","differentiation":"枳实vs厚朴：见厚朴鉴别。枳实破气力猛，专入脾胃大肠。"},{"name":"木香","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"行气药","subCategory":"","page":460,"properties":"辛、苦、温。归脾、胃、大肠、胆、三焦经","functions":"脾胃气滞，脘腹胀痛（配枳壳、川楝子等）\n食积气滞（匀气散）\n泻痢腹痛（香连丸、木香槟榔丸）\n脾虚气滞（香砂六君子汤）\n腹痛胁痛，黄疸（配郁金、柴胡）","functions_full":"木香善行脾胃气，脘胀胁痛里急痢 \n行气止痛\n脾胃气滞，脘腹胀痛（配枳壳、川楝子等）\n食积气滞（匀气散）\n泻痢腹痛（香连丸、木香槟榔丸）\n脾虚气滞（香砂六君子汤）\n腹痛胁痛，黄疸（配郁金、柴胡）","dosage":"煎服，3-10克 广木香与川木香的功效比较","notes":"","indications":"①脾胃气滞之脘腹胀痛，常配砂仁；②大肠气滞之泻痢后重，为治痢疾之常用药，常配黄连（香连丸）；③肝胆气滞之胁痛口苦，常配柴胡、郁金。","combinations":"木香配黄连：清热燥湿、行气止痛（香连丸）；木香配砂仁：行气温中止泻；木香配槟榔：行气导滞。","differentiation":"木香vs香附：均行气止痛。木香善行脾胃气滞及大肠气滞，偏走肠胃；香附善疏肝理气调经，偏走肝经。"},{"name":"香附","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"行气药","subCategory":"","page":464,"properties":"辛、微苦、微甘、平。归肝、脾、三焦经","functions":"疏肝理气、调经止痛","functions_full":"香附疏肝调经脉，肝气郁滞女科帅 \n１、疏肝理气\n肝气郁滞 胁肋胀痛（柴胡疏肝散）\n肝气犯胃，脘腹胀痛（配木香，佛手等）\n寒凝气滞，胃脘疼痛（良附丸）\n寒疝腹痛（配小茴香，乌药等）\n２、调经止痛——妇科调经要药\n月经不调，痛经（配柴胡、当归、白芍等）\n乳房胀痛或结块（配柴胡、青皮、瓜蒌皮等）","dosage":"煎服，6-12克","notes":"","indications":"①肝气郁滞之胸胁胀痛、乳房胀痛，常配柴胡、川芎（柴胡疏肝散）；②月经不调、痛经，为'气病之总司，女科之主帅'，常配当归、川芎；③疝气疼痛。","combinations":"香附配柴胡：疏肝解郁；香附配当归：调经止痛；香附配高良姜：温中散寒止痛（良附丸）。","differentiation":"香附vs木香：见木香鉴别。香附为妇科调经要药。"},{"name":"川楝子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"行气药","subCategory":"","page":469,"properties":"苦、寒。有小毒。归肝、胃、小肠、膀胱经","functions":"行气止痛、杀虫疗癣","functions_full":"１、行气止痛\n肝气郁滞诸痛属热者（金铃子散）\n肝胃不和之胁肋作痛（配柴胡、白芍等）\n寒疝腹痛（导气汤）\n２、杀虫疗癣\n虫积腹痛（配槟榔、使君子等）\n头癣（研末油调外敷）","dosage":"煎服，3-10克； 外用适量","notes":"不宜持续及过量服用 乌药 类 别 植物 原植物 樟科植物乌药 药 材 根","indications":"①肝气郁滞或肝火之胸胁脘腹疼痛、疝气疼痛，常配延胡索（金铃子散）；②蛔虫之腹痛，杀虫止痛，常配使君子、槟榔。","combinations":"川楝子配延胡索：行气活血止痛（金铃子散）；川楝子配使君子：杀虫止痛。","differentiation":"川楝子vs香附：均行气止痛。川楝子苦寒清肝火，兼杀虫；香附辛平，偏疏肝调经。"},{"name":"乌药","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"行气药","subCategory":"","page":472,"properties":"辛、温。归肺、脾、肾、膀胱经","functions":"行气止痛、温肾散寒","functions_full":"１、行气止痛——寒凝气滞胸腹诸痛\n胸胁闷痛（配薤白、瓜蒌皮）\n寒疝腹痛（天台乌药散）\n经行腹痛（乌药汤）\n２、温肾散寒——尿频、遗尿（缩泉丸）","dosage":"煎服3-10克 木香、香附与乌药的功效比较","notes":"","indications":"①寒凝气滞之脘腹胀痛，常配木香、砂仁；②寒疝腹痛，常配小茴香、青皮；③肾阳虚之小便频数、遗尿，温肾散寒缩尿，常配益智仁、山药（缩泉丸）。","combinations":"乌药配益智仁：温肾缩尿（缩泉丸）；乌药配木香：行气散寒止痛。","differentiation":"乌药vs木香：均行气止痛。乌药偏温肾散寒缩尿；木香偏行肠胃气滞。"},{"name":"青皮","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"行气药","subCategory":"","page":475,"properties":"苦、辛、温。归肝、胆、胃经","functions":"疏肝破气、消积化滞","functions_full":"１、疏肝破气——肝气郁滞\n胸胁胀痛（配柴胡、香附等）\n乳房胀痛或结块（配瓜蒌、桔叶）\n寒疝腹痛（天台乌药散）\n气滞血瘀之胁下痞块（配三棱、莪术）\n２、消积化滞——食积气滞（青皮丸）","dosage":"煎服，3-10克 枳 实 （附：枳壳） 类 别 植物 原植物 芸香科植物酸橙、甜橙 药 材 幼果","notes":"","indications":"①肝气郁滞之胸胁胀痛、乳房胀痛、疝气疼痛，常配柴胡、香附；②食积气滞之脘腹胀痛，常配山楂、麦芽；③气滞血瘀之癥瘕积聚。","combinations":"青皮配柴胡：疏肝理气；青皮配山楂：消食积、行气滞。","differentiation":"青皮vs陈皮：见陈皮鉴别。青皮即未成熟橘皮，破气力强。"},{"name":"大腹皮","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"行气药","subCategory":"","page":478,"properties":"辛，微温。归脾、胃、大肠、小肠经。","functions":"行气导滞、利水消肿","functions_full":"大腹皮行气宽中，利水消肿二便通\n１行气导滞——食积气滞之脘腹胀满、嗳腐吞酸；湿阻气滞之脘腹痞闷\n２利水消肿——水肿胀满、小便不利（五皮饮）；脚气浮肿","dosage":"煎服，5-10g。","notes":"气虚体弱者慎用","indications":"①食积气滞之脘腹痞满、大便秘结，常配山楂、麦芽；②水肿胀满、脚气肿满，利水消肿，常配茯苓皮、生姜皮（五皮饮）。","combinations":"大腹皮配茯苓皮：利水消肿；大腹皮配山楂：消食行气。","differentiation":"大腹皮vs槟榔：同出一物。大腹皮为槟榔果皮，偏行气利水；槟榔为种子，偏杀虫、行气导滞。"},{"name":"山楂","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"消食药","subCategory":"","page":485,"properties":"酸、甘、微温。归脾、胃、肝经","functions":"消食化积、活血散瘀、行气止痛","functions_full":"山楂善消肉食积，胸腹痛泻兼化瘀 \n １消食化积——肉食积滞。本品为消化油腻肉食积滞之要药\n产后瘀阻腹痛\n ２活血散瘀\n瘀滞胸胁疼痛\n泻痢腹痛\n ３行气止痛\n疝气、睾丸肿痛","dosage":"煎服，10-15-30克","notes":"","indications":"①食积不化之脘腹胀满、嗳腐吞酸，尤善消肉食油腻之积，常配神曲、麦芽（焦三仙）；②产后瘀阻腹痛、恶露不尽，亦治血瘀痛经、经闭，常配当归、川芎；③泻痢腹痛、疝气疼痛。④高脂血症、冠心病。","combinations":"山楂配神曲、麦芽：消食化积（焦三仙）；山楂配当归：活血化瘀调经；山楂配决明子：降脂减肥。","differentiation":"山楂vs神曲：均消食积。山楂偏消肉食油腻之积，兼活血化瘀；神曲偏消谷面酒食之积，兼健脾。"},{"name":"麦芽","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"消食药","subCategory":"","page":489,"properties":"甘、平。归脾、胃、肝经","functions":"消食健胃、回乳消胀、疏肝解郁","functions_full":"麦芽消化米面积，回乳消胀解肝郁 \n１、消食健胃——米面薯芋食滞\n２、回乳消胀——断乳或乳汁郁积乳房胀痛\n３、疏肝解郁——肝气郁滞或肝胃不和之证","dosage":"煎服10-15克，30-120克","notes":"哺乳期不宜使用 麦 芽（附：稻芽） 麦芽与谷芽的功效比较","indications":"①米面薯芋食积不化之脘腹胀满，善消淀粉类食积，常配山楂、神曲；②脾虚食少，常配白术、党参；③断乳、乳房胀痛，回乳之功，大剂量（60g以上）单用。④肝郁气滞之胁痛脘痞。","combinations":"麦芽配山楂、神曲：消食化积；麦芽配柴胡：疏肝理气、消食健胃。","differentiation":"麦芽vs谷芽：均消食健胃。麦芽偏消米面薯芋之积，兼回乳、疏肝；谷芽消食之力较麦芽缓和，偏健脾开胃。"},{"name":"莱菔子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"消食药","subCategory":"","page":492,"properties":"辛、甘、平。归脾、胃、肺经","functions":"消食除胀、降气化痰","functions_full":"莱菔消食兼理气，食积胀满痰喘宜 \n１、消食除胀——食积气滞主药\n食积气滞脘腹胀满\n食积气滞，泻痢后重\n２、降气化痰——咳喘痰多之实证","dosage":"煎服6-10克","notes":"辛散耗气，气虚及无食积、痰滞者慎用 不与人参同用 莱菔子","indications":"①食积气滞之脘腹胀痛、嗳腐吞酸，消食除胀，常配山楂、神曲；②痰壅气逆之咳喘痰多，降气化痰，常配白芥子、苏子（三子养亲汤）。","combinations":"莱菔子配山楂：消食化积；莱菔子配白芥子、苏子：降气化痰平喘（三子养亲汤）。","differentiation":"莱菔子vs山楂：均消食。莱菔子偏消谷面积滞、降气化痰；山楂偏消肉积、活血。"},{"name":"鸡内金","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"消食药","subCategory":"","page":495,"properties":"甘、平。归脾、胃、小肠、膀胱经","functions":"消食健胃、固精止遗、化石通淋","functions_full":"内金消积化结石，各种食积及滑遗 \n１、消食健胃——食积、疳积\n２、固精止遗——遗尿、遗精\n３、化石通淋——砂石淋及胆结石","dosage":"煎服，3-10克 研末服，1.5-3克/次","notes":"","indications":"①各种食积不化之脘腹胀满，为健胃消食之要药，消食力最强，常配山楂、麦芽；②小儿疳积，常配白术、山药；③石淋之砂石结聚，有化坚消石之功，常配金钱草、海金沙；④遗精遗尿。","combinations":"鸡内金配金钱草：化石通淋；鸡内金配白术：健脾消积；鸡内金配海金沙：通淋排石。","differentiation":"鸡内金vs山楂：均消食积。鸡内金健胃消食力最强，兼化坚消石；山楂消肉积兼活血。"},{"name":"使君子","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"驱虫药","subCategory":"","page":501,"properties":"甘、温。归脾、胃经","functions":"杀虫、消积","functions_full":"使君子驱虫消积，治蛔虫疳积可取 \n１、杀虫——蛔虫、虫（单用或使君子散）\n２、消积——小儿疳积（肥儿丸）","dosage":"炒香嚼服6-9克，煎服10-15克 小儿1-1.5粒/日/岁，空腹 1次/日，连用3日","notes":"大量服用能引起呃逆、眩晕、呕吐腹泻等反应 服药时忌饮热茶 苦楝皮 类 别 植物 原植物 楝科植物楝树、川楝树 药 材 根皮或树皮","indications":"①蛔虫病之腹痛、小儿虫积腹痛，为驱蛔要药，兼能健脾消积，尤宜于小儿，常配槟榔、苦楝皮；②小儿疳积之面黄肌瘦、腹胀便溏。","combinations":"使君子配槟榔：驱杀蛔虫、绦虫；使君子配苦楝皮：增强驱蛔之力。","differentiation":"使君子vs苦楝皮：均驱蛔虫。使君子味甘，健脾消积，尤宜小儿；苦楝皮苦寒有毒，驱虫力强。"},{"name":"苦楝皮","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"驱虫药","subCategory":"","page":505,"properties":"苦，寒。有毒。归肝、脾、胃经。","functions":"杀虫、疗癣","functions_full":"苦楝皮杀虫效优，驱杀蛔虫及疥癣\n１杀虫——蛔虫、蛲虫、钩虫等多种肠道寄生虫病，驱杀蛔虫为优\n２疗癣——头癣、疥疮，外用研末调敷","dosage":"煎服，3-6g。外用适量。","notes":"有毒，不宜过量或持续服用。体虚及脾胃虚寒者忌用","indications":"①蛔虫病之腹痛、蛲虫病、钩虫病，驱杀肠道寄生虫，常配使君子、槟榔；②疥癣湿疮，外用杀虫止痒。","combinations":"苦楝皮配使君子：驱杀蛔虫；苦楝皮配槟榔：驱杀多种肠道寄生虫。","differentiation":"苦楝皮vs使君子：见使君子鉴别。苦楝皮驱虫力强但有毒性，不宜过量久服。"},{"name":"槟榔","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"驱虫药","subCategory":"","page":508,"properties":"辛、苦、温。归胃、大肠经","functions":"杀虫消积、行气利水、截疟","functions_full":"槟榔驱虫善治绦，消积行气利水好 \n１、杀虫消积\n杀多种肠道寄生虫（绦虫、蛔虫、虫、钩虫、姜片虫），以驱杀绦虫为佳\n水肿（疏凿饮子）\n２、行气利水\n寒湿脚气肿痛（鸡鸣散）\n３、截疟——疟疾（截疟七宝饮）","dosage":"煎服，6-15克，单用60-120克","notes":"脾虚便溏忌用 气虚下陷忌用 槟榔与大腹皮的功效比较","indications":"①多种肠道寄生虫病，尤善驱杀绦虫、姜片虫，常配南瓜子；②食积气滞之腹胀便秘、泻痢后重，常配木香、大黄；③水肿、脚气肿满，行气利水，常配木通、泽泻；④疟疾。","combinations":"槟榔配南瓜子：驱杀绦虫；槟榔配木香：行气导滞，治痢疾后重；槟榔配大腹皮：行气利水。","differentiation":"槟榔vs使君子：均驱虫。槟榔驱虫谱广，尤善驱绦虫；使君子专驱蛔虫。槟榔兼行气利水。"},{"name":"小蓟","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":515,"properties":"甘、苦，凉。归心、肝经。","functions":"凉血止血、散瘀消痈、利尿","functions_full":"小蓟凉血又消痈，尿血血淋及疮肿\n１凉血止血——血热妄行之各种出血（十灰散），尤善治尿血、血淋（小蓟饮子）\n２散瘀消痈——热毒疮痈\n３利尿——湿热淋证","dosage":"煎服，10-15g。鲜品30-60g。","notes":"脾胃虚寒者忌用","indications":"①血热妄行之吐血、衄血、崩漏、尿血，以上部出血尤宜，常配生地黄、侧柏叶（十灰散）；②热毒疮疡。③高血压。","combinations":"小蓟配生地黄：凉血止血；小蓟配白茅根：凉血止血、清热利尿。","differentiation":"小蓟vs大蓟：均为凉血止血药。小蓟偏于止血，兼利尿；大蓟偏于散瘀消肿解毒，兼降压。"},{"name":"大蓟","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":518,"properties":"苦、甘、凉。归心、肝经","functions":"凉血止血、散瘀消痈","functions_full":"大蓟善治热出血，散瘀解毒消痈结\n \n１、凉血止血——血热出血之吐血、咯血、崩漏、尿血\n２、散瘀消痈——热毒痈肿","dosage":"煎服 10-15-30克 外用适量 小蓟 类 别 植物 原植物 菊科植物刺儿菜 药 材 全草 大蓟与小蓟的功效比较","notes":"","indications":"①血热妄行之吐血、衄血、咳血、崩漏、尿血，常配栀子、侧柏叶（十灰散）；②痈肿疮毒，内服外敷均可。","combinations":"大蓟配栀子：凉血止血；大蓟配蒲公英：清热解毒消痈。","differentiation":"大蓟vs小蓟：见小蓟鉴别。大蓟散瘀消痈力强。"},{"name":"地榆","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":521,"properties":"苦、酸、微寒。归肝、胃、大肠经","functions":"凉血止血、解毒敛疮、水火烫伤","functions_full":"地榆收敛性寒凉，下焦出血及烫伤 \n１、凉血止血——血热出血。凉血收敛止血良药\n尤宜于下焦血热所致的便血、痔血、血痢、崩漏等\n２、解毒敛疮\n水火烫伤——为治烫伤要药\n湿疹、皮肤溃烂","dosage":"煎服10-15克 外用适量","notes":"大面积烧伤者不宜用（含鞣质，大量吸收后易致中毒性肝炎）","indications":"①血热妄行之下焦出血如痔血、便血、崩漏，为治便血、痔血之要药，常配槐花；②水火烫伤，为治烫伤之要药，研末麻油调敷（单用地榆散）；③湿疹、疮疡。","combinations":"地榆配槐花：凉血止血，治便血痔血；地榆配黄连：清热解毒止血。","differentiation":"地榆vs槐花：均凉血止血，善治便血痔血。地榆兼解毒敛疮，治烫伤；槐花偏清肝明目，治目赤头痛。"},{"name":"槐花","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":524,"properties":"苦、微寒。归肝、大肠经","functions":"凉血止血、清肝泻火","functions_full":"槐花苦寒凉血好，便血能止清肝妙 \n１、凉血止血——血热出血，尤以痔血、便血为佳。\n常与地榆同用\n２、清肝泻火——肝火上炎之头痛目赤","dosage":"煎服10-15克 槐花与槐角的功效比较","notes":"","indications":"①血热妄行之便血、痔血、血痢、崩漏，善清大肠湿热，常配地榆、黄芩；②肝火上炎之目赤头痛，常配菊花、夏枯草。","combinations":"槐花配地榆：凉血止血，治肠风便血；槐花配菊花：清肝明目。","differentiation":"槐花vs地榆：见地榆鉴别。槐花偏清肝泻火。"},{"name":"白茅根","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":527,"properties":"甘、寒。归肺、胃、膀胱经","functions":"凉血止血、清热利尿、清泻肺胃","functions_full":"茅根甘寒凉血热，肺胃膀胱热均泻 \n１、凉血止血——血热出血之咳血、衄血、吐血、尿血\n２、清热利尿——热淋、水肿\n３、清泻肺胃——肺热咳嗽胃热呕吐，热病烦渴及湿热黄疸","dosage":"生用30-60克 煎服15-30克","notes":"","indications":"①血热妄行之吐血、衄血、咯血、尿血，以上部出血为多，常配小蓟、生地黄；②热病烦渴、消渴，清热生津；③湿热淋证之小便淋涩、水肿，清热利尿。④肺热咳嗽。","combinations":"白茅根配小蓟：凉血止血、清热利尿；白茅根配芦根：清热生津利尿。","differentiation":"白茅根vs芦根：均清热生津利尿。白茅根凉血止血力强；芦根清热排脓止呕力优。"},{"name":"侧柏叶","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"凉血止血药","page":530,"properties":"苦、涩，寒。归肺、肝、脾经。","functions":"凉血止血、化痰止咳、生发乌发","functions_full":"侧柏叶凉血止血，咳嗽痰多及脱发\n１凉血止血——血热妄行之各种出血（四生丸），尤善治吐血、咯血\n２化痰止咳——肺热咳嗽，痰稠难咯\n３生发乌发——脱发、须发早白，外用涂擦","dosage":"煎服，6-12g。止血多炒炭用。","notes":"虚寒性出血不宜用","indications":"①血热妄行之吐血、衄血、咳血、崩漏、尿血，常配生地黄、小蓟；②肺热咳嗽痰黄，常配桑白皮、黄芩；③烫伤、脱发，外用。","combinations":"侧柏叶配生地黄：凉血止血；侧柏叶配桑白皮：清肺化痰止咳。","differentiation":"侧柏叶vs小蓟：均凉血止血。侧柏叶兼化痰止咳；小蓟兼利尿。"},{"name":"三七","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"止血药","subCategory":"化瘀止血药","page":535,"properties":"甘、微苦、温。归肝、胃经","functions":"化瘀止血、活血定痛","functions_full":"三七化瘀善止血，内外出血痛伤跌 \n１、化瘀止血——用于体内外多种出血，尤以有瘀者为宜\n本品止血不留瘀，化瘀不伤正，为止血良药\n２、活血定痛——跌打损伤，瘀滞疼痛\n本品为伤科要药","dosage":"研末服1-1.5克 煎服3-10克 外用适量","notes":"","indications":"①各种出血证之吐血、衄血、咳血、便血、崩漏、外伤出血，止血而不留瘀，为止血之要药，单味研末吞服或外敷均有良效；②跌打损伤之瘀血肿痛，为伤科要药；③冠心病心绞痛、缺血性脑血管病。","combinations":"三七配白及：止血化瘀、消肿定痛；三七配丹参：活血化瘀通脉。","differentiation":"三七vs蒲黄：均止血活血。三七止血力强且散瘀定痛，为伤科要药；蒲黄偏于利尿通淋。"},{"name":"蒲黄","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"化瘀止血药","page":538,"properties":"甘、平。归肝、心经","functions":"化瘀止血、活血止痛、利尿通淋","functions_full":"蒲黄化瘀止血好，瘀滞诸经见血妙\n  １、化瘀止血——各种出血，以属实夹瘀为宜\n２、活血止痛——瘀滞诸痛，本品既活血又止血\n３、利尿通淋——血淋","dosage":"煎服3-10克，包煎 外用适量","notes":"孕妇忌用 茜草与蒲黄功效比较","indications":"①各种出血证，尤善治瘀血出血，止血兼活血化瘀，止血不留瘀，常配五灵脂（失笑散）；②瘀血所致之心腹疼痛、痛经、产后瘀痛；③血淋涩痛，利尿通淋。","combinations":"蒲黄配五灵脂：活血化瘀止痛（失笑散）；蒲黄配滑石：利尿通淋止血。","differentiation":"蒲黄vs三七：见三七鉴别。蒲黄利尿通淋，善治血淋。"},{"name":"白及","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"收敛止血药","page":543,"properties":"甘、苦、涩、微寒。归肺、胃、肝经","functions":"收敛止血、消肿生肌","functions_full":"白及止血靠敛涩，咳吐呕血及皲裂 \n１、收敛止血——体内外多种出血。本品止血作用强，多用于肺胃出血\n肺络伤之咯血，吐血单用（独圣散）\n肺阴不足，干咳咯血（白及枇杷丸）\n胃出血之吐血，便血（乌及散）\n外伤出血（研末单用）\n２、消肿生肌\n疮痈肿痛初起（内消散）\n久溃不敛（研末单用）\n手足皲裂（研末麻油调涂）","dosage":"煎服，3-10克；散剂，2-5克/次","notes":"反乌头 仙鹤草 类 别 植物 原植物 蔷薇科植物龙牙草 药 材 全草","indications":"①肺胃出血之咳血、吐血，为收敛止血之要药，尤善治肺胃出血，常配三七、藕节；②疮疡久溃不敛、手足皲裂，外用消肿生肌。","combinations":"白及配三七：止血化瘀，为治肺胃出血之佳配；白及配乌贼骨：制酸止血，治胃出血。","differentiation":"白及vs仙鹤草：均收敛止血。白及偏入肺胃，兼消肿生肌；仙鹤草兼补虚止痢杀虫。"},{"name":"仙鹤草","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"收敛止血药","page":546,"properties":"苦、涩、平。归肺、肝、脾经","functions":"收敛止血、止痢、杀虫、补虚强壮","functions_full":"１、收敛止血——各种出血，无论寒热均可使用\n血热出血（配侧柏叶、栀子）\n虚寒性出血（配炮姜、黄芪）\n２、止痢——泻痢（单用或配其他止痢药物）\n３、杀虫——滴虫性阴道炎\n４、补虚强壮——劳伤体倦","dosage":"煎服10-15-30克 仙鹤草与鹤草芽的功效比较","notes":"","indications":"①各种出血证，无论寒热虚实均可，收敛止血力强，常配血余炭、白及；②久泻久痢，补虚止痢，常配诃子、白术；③脱力劳伤，神疲乏力，单味煎服即效（名'脱力草'）；④疟疾、痈肿疮毒、滴虫性阴道炎。","combinations":"仙鹤草配白及：收敛止血；仙鹤草配诃子：涩肠止泻；仙鹤草配大枣：补虚强壮（脱力草汤）。","differentiation":"仙鹤草vs白及：均收敛止血。仙鹤草兼补虚止痢杀虫；白及偏入肺胃，消肿生肌。"},{"name":"艾叶","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"止血药","subCategory":"温经止血药","page":551,"properties":"苦、辛、温。归肝、脾、肾经","functions":"温经止血、虚寒性出血（胶艾汤）、散寒止痛、收湿止痒、安胎","functions_full":"艾叶温肾暖胞宫，虚寒崩漏与胎动 \n１、温经止血\n虚寒性出血（胶艾汤）——为治虚性出血之要药\n血热出血（四生丸）\n２、散寒止痛——下焦虚寒证\n腹中冷痛，月经不调，痛经，宫冷不孕（艾附暖宫丸）\n胎漏下血，胎动不安\n３、收湿止痒——湿疹瘙痒\n４、安胎——虚寒性胎动不安","dosage":"煎服3-10克 外用适量 生姜、干姜与炮姜的功效比较","notes":"","indications":"①虚寒性崩漏下血、月经过多，为温经止血之要药，常配阿胶、地黄（胶艾汤）；②下焦虚寒之少腹冷痛、痛经、宫寒不孕，常配吴茱萸、当归；③寒性咳喘，温肺止咳；④外用治湿疹、皮肤瘙痒。","combinations":"艾叶配阿胶：温经止血、补血调经（胶艾汤）；艾叶配吴茱萸：温经散寒止痛。","differentiation":"艾叶vs炮姜：均温经止血。艾叶兼温经散寒、调经安胎，外用熏洗；炮姜偏于温中止痛止泻。"},{"name":"川芎","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血止痛药","page":557,"properties":"辛、温。归肝、胆、心包经","functions":"活血行气、外、妇、伤","functions_full":"川芎活血又行气，血瘀气滞头痛痹\n１活血行气——血瘀气滞诸痛     为“血中气药”\n肝郁气滞，胁肋疼痛（柴胡疏肝散）\n内\n心脉瘀阻，胸痹心痛（血府逐瘀汤）\n外——疮疡脓成，体虚不溃（透脓散）\n妇——经闭、痛经、产后恶露不行\n                                 （少腹逐瘀汤、温经汤等）\n伤——跌扑损伤（人参紫金丹）","dosage":"煎服，3-10克","notes":"阴虚阳亢、多汗及月经过多者慎用","indications":"①血瘀气滞之各种痛证，为'血中气药'，上行头目，下行血海，善治头痛，常配白芷、细辛；②月经不调、痛经、经闭，活血调经，常配当归、白芍（四物汤）；③风湿痹痛，常配独活、羌活。","combinations":"川芎配当归：活血养血调经（四物汤）；川芎配白芷：祛风止痛，治头痛；川芎配柴胡：行气活血。","differentiation":"川芎vs丹参：均活血化瘀。川芎为'血中气药'，活血兼行气，善治头痛；丹参活血兼凉血安神，善治心脉瘀阻。"},{"name":"延胡索","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血止痛药","page":561,"properties":"辛、苦，温。归心、肝、脾经。","functions":"活血行气、止痛","functions_full":"延胡索善止痛证，血瘀气滞诸痛灵\n１活血——血瘀诸证\n２行气止痛——血瘀气滞所致之各种疼痛，为止痛良药。胸痹心痛（配丹参、川芎）；胃痛（金铃子散）；痛经、产后瘀痛；跌打损伤肿痛","dosage":"煎服，3-10g。研末服，1.5-3g/次。醋制增效。","notes":"孕妇忌用","indications":"①气滞血瘀之各种疼痛，止痛之力甚强，可广泛用于一身上下诸痛，常配川楝子（金铃子散）；②胸痹心痛、脘腹疼痛、痛经、产后瘀痛、跌打损伤。","combinations":"延胡索配川楝子：行气活血止痛（金铃子散）；延胡索配丹参：活血化瘀止痛。","differentiation":"延胡索vs川芎：均活血止痛。延胡索纯止痛，行血中气滞；川芎活血兼行气，善上行头面。"},{"name":"郁金","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"活血止痛药","page":565,"properties":"辛、苦、寒。归肝、心、肺经","functions":"活血行气、清心解郁、利胆退黄、凉血止血","functions_full":"郁金活血止痛痹，凉血利胆清心宜 \n１活血行气——血瘀气滞诸痛\n胸胁闷痛或损伤（颠倒木金散）\n胁下痞块（配鳖甲煎丸）\n妇女经行气滞腹痛、乳胀（宣郁通经汤）\n２清心解郁——热病神昏、癫痫痰闭\n湿温病，湿浊蒙闭心窍（菖蒲郁金汤）\n痰火蒙心之癫、痫、狂（白金丸）\n    ３利胆退黄——肝胆湿热\n湿热黄疸（配茵陈蒿汤）\n湿热结石（排石有三金：鸡内金、金钱草、海金砂）\n４凉血止血——血热出血（吐血、衄血、尿血、血淋等）","dosage":"：煎服，3-10克；研末服，2-5克 川芎、延胡索与郁金的功效比较","notes":"","indications":"①气滞血瘀之胸胁脘腹疼痛，常配柴胡、香附；②热病神昏、癫痫痰闭，清心解郁，常配石菖蒲；③湿热黄疸，常配茵陈、栀子；④血热妄行之吐血衄血。","combinations":"郁金配柴胡：疏肝解郁、活血止痛；郁金配石菖蒲：豁痰开窍清心；郁金配茵陈：清热利湿退黄。","differentiation":"郁金vs姜黄：同出姜黄属。郁金偏行气解郁、凉血利胆；姜黄偏活血通络、行气止痛。"},{"name":"乳香","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"活血止痛药","page":569,"properties":"辛、苦，温。归心、肝、脾经。","functions":"活血行气止痛、消肿生肌","functions_full":"乳香活血又生肌，跌打疮疡及痛痹\n１活血行气止痛——血瘀气滞之胸痹心痛、胃痛、痛经、产后瘀痛；风湿痹痛、跌打损伤\n２消肿生肌——疮疡肿痛，初起者消散，已溃者生肌。常与没药相须为用","dosage":"煎服，3-10g。宜炒去油用。","notes":"孕妇及无瘀滞者忌用。胃弱者慎用","indications":"①跌打损伤之瘀血肿痛、骨折筋伤，活血止痛消肿生肌，为伤科要药，常配没药；②疮疡痈肿之红肿热痛或溃后不收口；③血瘀气滞之脘腹疼痛、痛经。","combinations":"乳香配没药：活血止痛、消肿生肌，二者相须为用；乳香配血竭：活血散瘀止痛。","differentiation":"乳香vs没药：均活血止痛、消肿生肌。乳香偏于行气，长于舒筋活血伸筋；没药偏于散血化瘀。二者常相须为用。"},{"name":"没药","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"活血止痛药","page":572,"properties":"苦、辛，平。归心、肝、脾经。","functions":"活血止痛、消肿生肌","functions_full":"没药散血又定痛，跌打疮疡瘀滞用\n１活血止痛——血瘀气滞之胸痹心痛、脘腹疼痛、痛经、产后瘀痛；跌打损伤、风湿痹痛\n２消肿生肌——疮疡肿痛或溃后久不收口。常与乳香相须为用（活络效灵丹）","dosage":"煎服，3-10g。宜炒去油用。","notes":"孕妇及无瘀滞者忌用","indications":"①跌打损伤之瘀血肿痛，常配乳香；②疮疡肿毒；③瘀血阻滞之脘腹疼痛、痛经、经闭。","combinations":"没药配乳香：活血止痛消肿；没药配红花：活血化瘀。","differentiation":"没药vs乳香：见乳香鉴别。没药散瘀力强。"},{"name":"丹参","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血调经药","page":577,"properties":"苦、微寒。归心、肝经","functions":"活血、调经、凉血消痈、清心除烦","functions_full":"丹参活血善调经，凉血消痈心神宁 \n１活血——活血祛瘀之要药。广泛用于各种瘀血病证\n心腹刺痛（丹参饮）\n症瘕积聚、风湿痹痛\n２调经——妇科瘀滞诸证。本品病善调经水，为妇科要药。既能活血又能养血\n月经不调（调经丸）\n血瘀经闭（红花桃仁煎）\n３凉血消痈——疮疡肿毒\n４清心除烦\n热入营分（清营汤）\n杂病心悸失眠（天王补心丹）","dosage":"煎服，5-15克","notes":"反藜芦（十八反） 丹参与玄参的功效比较","indications":"①血瘀之心胸痹痛，常配川芎、赤芍；②月经不调、经闭、痛经、产后瘀阻，为'妇科要药'，常配当归、川芎；③心悸失眠，清心安神，常配酸枣仁、远志；④疮疡肿毒；⑤癥瘕积聚。俗云'一味丹参散，功同四物汤'。","combinations":"丹参配川芎：活血化瘀止痛；丹参配酸枣仁：养心安神；丹参配金银花：清热解毒活血。","differentiation":"丹参vs川芎：见川芎鉴别。丹参性微寒，凉血安神，善治心脑血管病。"},{"name":"红花","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血调经药","page":581,"properties":"辛、温。归心、肝经。","functions":"妇、内、伤","functions_full":"红花活血调经涩，瘀血诸痛斑暗色 \n活血通经，祛瘀止痛\n专入血分，常与桃仁相伍为用\n妇——经闭、痛经、腹中血气刺痛等瘀滞证（桃仁红花煎）\n内——症瘕积聚、胸痹心痛（膈下逐瘀汤）\n伤——跌打损伤（泽兰汤）","dosage":"煎服，3-10克；外用适量","notes":"孕妇忌服；有出血倾向不宜多用 附 西红花——鸢尾科植物番红花的干燥柱头 红花与西红花的功效比较 西 红 花","indications":"①血瘀经闭、痛经、产后瘀阻，活血通经之要药，常配桃仁、当归（桃红四物汤）；②跌打损伤之瘀血肿痛，常配乳香、没药；③热郁血滞之斑疹色暗；④冠心病之心绞痛。","combinations":"红花配桃仁：活血化瘀通经；红花配当归：活血养血调经；红花配川芎：活血化瘀止痛。","differentiation":"红花vs桃仁：均为活血化瘀常用药。红花活血通经力强，善治妇科瘀血证；桃仁润肠通便、止咳平喘，兼治肠痈。"},{"name":"桃仁","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血调经药","page":585,"properties":"苦、甘、平。有小毒。归心、肝、大肠经","functions":"活血祛 瘀、内、外、妇、伤、润汤通便、止咳平喘","functions_full":"桃仁通经破瘀血，润肠消痈兼止咳 \n１活血祛 瘀——多种瘀血证。本品祛瘀力强，常与红花相伍为用\n平性药，寒热虚实均可用\n内——症瘕痞块，肺痈初起有瘀热（苇茎汤）\n外——肠痈初起有瘀热（大黄牡丹汤）\n妇——经闭、痛经、产后腹痛（桃红四物汤，生化汤）\n伤——跌打损伤（复员活血汤）\n２润汤通便——肠燥便秘\n３止咳平喘——咳嗽气喘证","dosage":"煎服，5-10克","notes":"孕妇忌用；有小毒，不可过量 桃仁与红花的功效比较","indications":"①血瘀经闭、痛经、产后瘀阻，常配红花、当归（桃红四物汤）；②肠痈初起，常配大黄、牡丹皮（大黄牡丹汤）；③肺痈，常配苇茎、冬瓜仁；④肠燥便秘，润肠通便；⑤咳嗽气喘。","combinations":"桃仁配红花：活血化瘀通经；桃仁配大黄：活血逐瘀泻下；桃仁配杏仁：止咳平喘、润肠通便。","differentiation":"桃仁vs红花：见红花鉴别。桃仁为种子，富含油脂，长于润肠；红花长于活血。"},{"name":"益母草","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血调经药","page":589,"properties":"苦、辛、微寒。归肝、心经","functions":"活血调经、利水消肿、清热解毒","functions_full":"益母经产为要药，瘀血水肿血脂高 \n１活血调经——妇科瘀滞证。为妇科经产要药\n   月经不调、经闭、痛经\n      产后腹痛、恶露不尽或血瘀崩漏\n２利水消肿——水肿、小便不利\n  ３清热解毒——跌打损伤、疮疡肿毒、皮肤痒疹","dosage":"煎服，10-30克 熬膏，入丸剂 外用适量 附：茺蔚子——益母草的种子 益母草与茺蔚子的功效比较","notes":"","indications":"①血瘀所致之月经不调、痛经、经闭、产后瘀痛，为妇科经产要药，常配当归、川芎；②水肿小便不利，活血利水，常配车前子；③疮疡肿毒、皮肤痒疹。","combinations":"益母草配当归：活血调经；益母草配车前子：活血利水消肿。","differentiation":"益母草vs泽兰：均活血调经、利水消肿。益母草调经利水力强；泽兰兼散瘀消痈。"},{"name":"牛膝","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"活血化瘀药","subCategory":"活血调经药","page":593,"properties":"苦、酸、平。归肝、肾经","functions":"活血通经、利水通淋、引血（火）下行、补肝肾强筋骨","functions_full":"牛膝通经补肝肾，瘀血火热水下行 \n瘀阻滞证经闭、痛经、月经不调、产后妇痛\n１活血通经\n跌打损伤\n２利水通淋——淋证、水肿，小便不利等\n３引血（火）下行——用于上部火热上炎，阴虚火旺，热迫血行之证\n吐血、衄血（拳龙汤）；齿龈肿痛（清胃散）\n肝阳上亢（镇肝熄风汤）；难产\n    ４补肝肾强筋骨\n肝肾亏虚（虎潜丸）\n腰膝疼痛证久痹者（独活寄生汤）\n湿热痿证（三妙丸）","dosage":"煎服5-10克","notes":"孕妇忌用；月经过多者忌用 怀牛膝、川牛膝与土牛膝的功效比较","indications":"①血瘀经闭、痛经、产后瘀痛，常配桃仁、红花；②腰膝酸痛、腿脚无力，补肝肾强筋骨，常配杜仲、续断；③血热妄行之吐血衄血，引血下行，常配代赭石、生地；④上部火热证之头痛眩晕（高血压），引火下行。","combinations":"牛膝配代赭石：镇肝降逆降压；牛膝配杜仲：补肝肾强筋骨；牛膝配桃仁、红花：活血通经。","differentiation":"牛膝vs杜仲：均补肝肾强筋骨。牛膝偏活血引血下行；杜仲偏温补。"},{"name":"鸡血藤","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"活血调经药","page":597,"properties":"苦、甘，温。归肝、肾经。","functions":"活血补血、舒筋活络、调经","functions_full":"鸡血藤活血补血，调经活络疗痹麻\n１活血补血——血瘀或血虚所致的月经不调、痛经、经闭\n２舒筋活络——风湿痹痛、手足麻木、肢体瘫痪；血虚萎黄\n３调经——为妇科调经要药","dosage":"煎服，10-15g，大剂量至30g。","notes":"月经过多者慎用","indications":"①月经不调、痛经、经闭，行血补血，常配当归、川芎；②风湿痹痛之手足麻木、肢体瘫痪，常配独活、威灵仙；③血虚萎黄。","combinations":"鸡血藤配当归：补血活血调经；鸡血藤配独活：祛风湿、养血通络。","differentiation":"鸡血藤vs当归：均补血活血。鸡血藤偏于通络舒筋；当归偏于调经止痛。"},{"name":"土鳖虫","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"活血疗伤药","page":603,"properties":"咸、寒。有小毒。归肝经","functions":"破血逐瘀、续筋接骨","functions_full":"蟅虫破血疗瘀癥，续筋接骨伤科用 \n１破血逐瘀——瘀血阻滞证\n血瘀经闭，产后瘀滞（下瘀血汤）\n干血成劳，经闭腹胀（大黄蟅虫丸）\n癥瘕痞块（鳖甲庶煎丸）\n２续筋接骨——伤科常用药\n骨折瘀痛（接骨紫金丹）\n骨折伤筋后盘骨软弱者（壮筋续骨丸）\n腰部扭伤","dosage":"煎服，3-10克；研末服，1-1.5克；外用适量","notes":"孕妇忌用","indications":"①跌打损伤之骨折筋伤、瘀血肿痛，为接骨疗伤之要药，常配自然铜、骨碎补；②血瘀经闭、产后瘀阻、癥瘕，常配桃仁、大黄（下瘀血汤）。","combinations":"土鳖虫配自然铜：续筋接骨；土鳖虫配大黄、桃仁：逐瘀通经（下瘀血汤）。","differentiation":"土鳖虫vs水蛭：均破血逐瘀。土鳖虫偏接骨疗伤，药力较缓；水蛭偏逐瘀消癥，药力较猛。"},{"name":"莪术","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"破血消癥药","page":607,"properties":"辛、苦、温。归肝、脾经","functions":"破血行气、消积止痛、活血祛瘀","functions_full":"莪术破血又行气，癥瘕积聚与食积 \n１破血行气——血瘀气滞重证，常与三棱相伍\n经闭腹痛（莪术散）\n胁下痞块（鳖甲煎丸）\n心腹瘀痛\n２消积止痛——食积腹痛（莪术丸）\n３活血祛瘀——跌打瘀肿疼痛","dosage":"煎服，6-10克； 外用适量","notes":"孕妇忌用；月经过多者忌用","indications":"①气滞血瘀之癥瘕积聚、经闭痛经，破血行气力强，常配三棱、当归；②食积气滞之脘腹胀痛，常配木香、山楂；③跌打损伤。","combinations":"莪术配三棱：破血行气、消癥化积；莪术配木香：行气止痛。","differentiation":"莪术vs三棱：均破血行气、消积止痛。莪术偏于行气；三棱偏于破血。常相须为用。"},{"name":"三棱","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"破血消癥药","page":610,"properties":"辛、苦，平。归肝、脾经。","functions":"破血行气、消积止痛","functions_full":"三棱破血又消癥，食积腹痛经闭通\n１破血行气——血瘀气滞重证，常与莪术相须为用。经闭腹痛；癥瘕积聚（鳖甲煎丸）\n２消积止痛——食积气滞之脘腹胀痛","dosage":"煎服，3-10g。醋制增效。","notes":"孕妇及月经过多者忌用","indications":"①癥瘕积聚、血瘀经闭，破血力猛，常配莪术、当归；②食积脘腹胀痛，常配莪术、青皮。","combinations":"三棱配莪术：破血行气消积。","differentiation":"三棱vs莪术：见莪术鉴别。"},{"name":"水蛭","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"活血化瘀药","subCategory":"破血消癥药","page":613,"properties":"咸、苦、平。有小毒。归肝经","functions":"破血、逐瘀、通经","functions_full":"破血、逐瘀、通经——本品破血逐瘀，力峻效宏\n症瘕、经闭实证（理中汤）\n虚证（化症回生丹）\n跌打损伤（接骨火龙丹）\n瘀血便秘（夺命丹）","dosage":"入汤剂，1.5-3克 研末服，0.3-0.5克","notes":"孕妇忌用","indications":"①瘀血较甚之经闭、癥瘕积聚，破血逐瘀力强，常配虻虫、桃仁（抵当汤）；②跌打损伤之瘀血肿痛，常配乳香、没药；③缺血性脑血管病。","combinations":"水蛭配虻虫（或土鳖虫）：增强破血逐瘀之力；水蛭配三七：活血化瘀。","differentiation":"水蛭vs土鳖虫：见土鳖虫鉴别。水蛭破血力猛，有小毒。"},{"name":"半夏","level":1,"levelName":"一级（重点掌握）","levelColor":"#ef4444","category":"化痰止咳平喘药","subCategory":"温化寒痰药","page":621,"properties":"： 味辛，性温。有毒。归脾、胃、肺经。","functions":".、燥湿化痰、降逆止呕、消痞散结、消肿止痛","functions_full":"：半夏辛温燥湿痰，消痞散结降呕眩 \n1.\n燥湿化痰——湿痰、寒痰证。为燥湿化痰，温化寒痰之要药。\n      湿痰咳嗽（二陈汤）\n      寒痰咳嗽（小青龙汤）\n2.降逆止呕——为止呕要药（小半夏汤）\n   与不同药配伍可用于多种呕吐。\n3.消痞散结——胸痹,结胸,心下痞,梅核气\n4.消肿止痛——瘰疬瘿瘤,痈疽肿毒和毒蛇咬伤等","dosage":"：煎服，3—10克，多制用。 天南星（附：胆南星） 类 别 植物 原植物 天南星科天南星、 异叶天南星、东北天南星 药 材 块茎","notes":"","indications":"①湿痰寒痰之咳嗽痰多、胸闷不舒，为治湿痰寒痰之要药，常配陈皮、茯苓（二陈汤）；②各种呕吐，为'止呕之要药'，常配生姜、陈皮；③胸痹，常配瓜蒌、薤白；④心下痞、结胸，常配黄连、黄芩；⑤梅核气，常配厚朴、紫苏；⑥瘰疬痰核，消痞散结。","combinations":"半夏配陈皮：燥湿化痰（二陈汤）；半夏配生姜：降逆止呕；半夏配黄连：辛开苦降消痞（半夏泻心汤）。","differentiation":"半夏vs天南星：均燥湿化痰。半夏善治湿痰，且为止呕要药；天南星燥烈走窜，善治风痰、顽痰，兼祛风止痉。"},{"name":"天南星","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"温化寒痰药","page":625,"properties":"：味辛，性温。有毒。归脾、胃、肺经。","functions":"燥湿化痰、祛风解痉、消肿止痛","functions_full":"1.燥湿化痰——湿痰、寒痰证。 为燥湿化痰功似半夏而温燥之性更强\n         顽痰咳喘（导痰汤）\n        寒痰咳嗽（配干姜，细辛）\n2.祛风解痉——风痰眩晕，中风，癫痫及破伤风。为治风痰之要药\n3.消肿止痛——瘰疬瘿瘤,痈疽肿毒和毒蛇咬伤等。","dosage":"：煎服，3—10克，多制用。","notes":"：阴虚燥痰及孕妇忌用。 天南星与胆南星的功效比较","indications":"①风痰所致之眩晕、口眼歪斜、半身不遂、癫痫，为治风痰之要药，常配半夏、白附子；②寒痰咳嗽，常配陈皮、半夏；③痈疽肿痛、毒蛇咬伤，外用。","combinations":"天南星配半夏：燥湿化痰；天南星配全蝎：祛风化痰止痉。","differentiation":"天南星vs半夏：见半夏鉴别。天南星温燥之性大于半夏，善祛经络之风痰。"},{"name":"芥子","level":2,"levelName":"二级（掌握）","levelColor":"#f97316","category":"化痰止咳平喘药","subCategory":"温化寒痰药",
